motor neuron pool, giving greater flexion"],["Extension of the opposite limb","That is the crossed extensor response."],["Relaxation of a muscle when its tension becomes too high","That is the inverse stretch reflex."],["Rapid conduction along myelinated Ib fibres","That describes Golgi tendon organ afferents, not irradiation."]],"x":"A weak noxious stimulus to one foot gives minimal flexion. Stronger stimuli \u003cb>irradiate\u003c/b> to more and more of the limb's \u003cb>motor neuron pool\u003c/b>, giving greater and greater flexion."},{"id":"t41q5","t":"t41","type":"type","q":"Stronger noxious stimuli make the withdrawal response last longer because the motor neurons keep firing repeatedly. What is this repeated firing called?","a":["after-discharge","after discharge","afterdischarge"],"x":"\u003cb>After-discharge\u003c/b> is due to continued activation of motor neurons by impulses arriving by complicated, circuitous polysynaptic paths."},{"id":"t41q6","t":"t41","type":"tf","q":"In the withdrawal reflex figure, the sensory receptor is a muscle spindle in the flexor muscle.","a":false,"fix":"The sensory receptor is the dendrites of a pain-sensitive neuron (stepping on a tack).","x":"In the figure, stepping on a tack stimulates the \u003cb>dendrites of a pain-sensitive neuron\u003c/b>. The sensory neuron then carries the signal to the spinal cord."},{"id":"t41q7","t":"t41","type":"mcq","q":"According to the withdrawal reflex figure, what happens in the integrating centre (spinal cord)?","o":[["The sensory neuron activates interneurons in several spinal cord segments"],["The sensory neuron synapses directly on one motor neuron in a single segment","The figure shows ascending and descending interneurons spreading to several segments."],["The signal must first reach the brain before any motor neuron fires","This is a spinal reflex; the integrating centre is in the spinal cord."],["Golgi tendon organs are activated","GTOs are tendon receptors for the inverse stretch reflex, not part of the spinal centre."]],"x":"The figure shows the sensory neuron activating \u003cb>interneurons in several spinal cord segments\u003c/b> (ascending and descending interneurons), which excite the motor neurons to the flexors."},{"id":"t42q1","t":"t42","type":"mcq","d":1,"q":"Compared with small motor units, large motor units have:","o":[["The highest thresholds"],["The lowest thresholds","Small motor units have the lowest thresholds."],["Small motoneurons","Large motor units have large motoneurons."],["Few muscle fibres each","Large motor units innervate many muscle fibres."]],"x":"Large motor units have large motoneurons, innervate many fibres and have the \u003cb>highest thresholds\u003c/b>, so they are the hardest to activate."},{"id":"t42q2","t":"t42","type":"order","q":"During a voluntary movement, put the motor units in the order they are recruited (the size principle).","o":["Smallest motor units","Fast fatigue-resistant units","Fast fatigue units"],"x":"\u003cb>Size principle\u003c/b>: the smallest units are activated first, then the fast fatigue-resistant units, and finally the fast fatigue units."},{"id":"t42q3","t":"t42","type":"type","q":"What is the term for increasing the number of active motor units to increase muscle force?","a":["recruitment","motor unit recruitment","recruiting"],"x":"\u003cb>Recruitment\u003c/b>: the more motor units recruited, the greater the force of contraction."},{"id":"t42q4","t":"t42","type":"tf","q":"Small motor units generate the largest force.","a":false,"fix":"Small motor units generate the smallest force; large motor units generate the largest.","x":"Small units have small motoneurons and few fibres, so they generate the \u003cb>smallest\u003c/b> force. Large units, with many fibres, generate the \u003cb>largest\u003c/b>."},{"id":"t42q5","t":"t42","type":"mcq","q":"What is a motor unit?","o":[["One motor neuron and all the muscle fibres it innervates"],["One muscle fibre and all the nerve fibres that supply it","A motor unit is defined around one motor neuron, not one fibre."],["An upper motor neuron plus the lower motor neuron it controls","A motor unit is a lower motor neuron and its muscle fibres."],["All the muscle fibres of a whole muscle","A motor unit is only the fibres supplied by one motor neuron."]],"x":"A \u003cb>motor unit\u003c/b> is one motor neuron together with \u003cb>all the muscle fibres it innervates\u003c/b>."},{"id":"t42q6","t":"t42","type":"tf","q":"The motor unit is considered the smallest functional component of the motor system.","a":true,"x":"Your notes call the motor unit the \u003cb>smallest functional component\u003c/b> of the motor system."},{"id":"t42q7","t":"t42","type":"mcq","q":"Which muscles have the smallest innervation ratios?","o":[["Muscles that move the fingers and rotate the eyes"],["Antigravity muscles of the leg","These have large motor units, with more than 1000 fibres per α motor neuron."],["Calf muscles","The figure gives these as an example of a large innervation ratio, for power."],["Muscles that need power but not precise control","The figure gives these a large innervation ratio."]],"x":"Finger and eye muscles have as few as \u003cb>three\u003c/b> fibres per α motor neuron. Small ratios suit \u003cb>rapid, precise movement\u003c/b> with low power; large ratios suit \u003cb>power\u003c/b> without precise control."},{"id":"t42q8","t":"t42","type":"tf","q":"The innervation ratio, the number of muscle fibres in each motor unit, ranges from 3 to 2000.","a":true,"x":"The \u003cb>innervation ratio\u003c/b> ranges from \u003cb>3 to 2000\u003c/b> muscle fibres per motor unit."},{"id":"t42q9","t":"t42","type":"type","q":"What is the collection of α motor neurons that innervates a single muscle, such as the biceps brachii, called?","a":["motor neuron pool","motor pool","motoneuron pool","motor neurone pool"],"x":"All the α motor neurons supplying one muscle form its \u003cb>motor neuron pool\u003c/b>."},{"id":"t42q10","t":"t42","type":"tf","q":"Within the same motor pool, α motor neurons are larger than γ motor neurons.","a":true,"x":"α motor neurons are \u003cb>larger\u003c/b> and supply the extrafusal fibres that generate force for movement and postural balance. γ motor neurons are \u003cb>smaller\u003c/b>."},{"id":"t42q11","t":"t42","type":"tf","q":"Upper motor neurons innervate skeletal muscle fibres directly.","a":false,"fix":"Upper motor neurons never innervate muscles directly; they rely on brainstem motor nuclei and spinal cord neurons.","x":"Only \u003cb>lower motor neurons\u003c/b> (anterior horn cells and cranial nerve motor nuclei) have axons ending on skeletal muscle. \u003cb>UMNs\u003c/b> in the cerebral cortex and brainstem act through them and \u003cb>never innervate muscles directly\u003c/b>."},{"id":"t43q1","t":"t43","type":"mcq","d":1,"q":"Which structure belongs to the highest (strategy/planning) level of motor control?","o":[["Basal ganglia"],["Premotor cortex","Part of the motor cortex, at the middle (tactics) level."],["Supplementary motor area","Part of the motor cortex, at the middle (tactics) level."],["Local circuits of the spinal cord","These are at the lowest (execution) level."]],"x":"The highest level is the \u003cb>association cortex\u003c/b> (prefrontal and posterior parietal) plus the \u003cb>basal ganglia\u003c/b>."},{"id":"t43q2","t":"t43","type":"multi","q":"Which are brainstem motor centres at the lowest (execution) level? (select all)","o":[["Vestibular nuclei",1],["Reticular formation",1],["Red nucleus",1],["Tectum",1],["Prefrontal cortex",0,"Part of the association cortex, at the highest level."],["Cerebellum",0,"This is at the middle (tactics) level."]],"x":"Lowest-level brainstem motor centres: \u003cb>vestibular nuclei, reticular formation, red nucleus and tectum\u003c/b>, working with the spinal cord's local circuits and motor neurons."},{"id":"t43q3","t":"t43","type":"type","q":"Which level of the motor hierarchy selects the best motor plan, such as reaching for a glass versus waving?","a":["highest level","highest","strategy","planning","strategy level","planning level"],"x":"The \u003cb>highest (strategy/planning)\u003c/b> level decides what movement to make and why, and selects the best motor plan."},{"id":"t43q4","t":"t43","type":"tf","q":"Generating motor programs (specific patterns of movement) is a function of the middle (tactics) level.","a":true,"x":"The \u003cb>middle level\u003c/b> translates goals into tactics (sequence, timing, coordination) and generates \u003cb>motor programs\u003c/b>."},{"id":"t43q5","t":"t43","type":"tf","q":"Adjusting force, speed and muscle tone is a function of the highest (planning) level.","a":false,"fix":"This is a function of the lowest (execution) level.","x":"The \u003cb>lowest level\u003c/b> (brainstem centres and spinal cord) directly activates motor neurons, executes programs, integrates reflexes and posture, and adjusts \u003cb>force, speed and muscle tone\u003c/b>."},{"id":"t43q6","t":"t43","type":"tf","q":"Each level of motor control has a distinct role, but the levels interact continuously through feedback loops.","a":true,"x":"The levels cooperate to plan, initiate and execute movement, and they interact continuously through \u003cb>feedback loops\u003c/b>."},{"id":"t43q7","t":"t43","type":"mcq","q":"Which structure adjusts movements for accuracy, smoothness and coordination?","o":[["Cerebellum"],["Basal ganglia","These sit at the highest level, helping to decide what movement to make."],["Posterior parietal cortex","Part of the association cortex at the planning level."],["Red nucleus","A brainstem motor centre at the execution level."]],"x":"At the middle level the \u003cb>cerebellum\u003c/b> adjusts for \u003cb>accuracy, smoothness and coordination\u003c/b>."},{"id":"t43q8","t":"t43","type":"order","q":"Order the three levels of motor control, from the first to the last in producing a movement.","o":["Strategy (planning)","Tactics","Execution"],"x":"\u003cb>Strategy\u003c/b> (what and why) → \u003cb>tactics\u003c/b> (sequence, timing, motor programs) → \u003cb>execution\u003c/b> (activating motor neurons)."},{"id":"t44q1","t":"t44","type":"mcq","d":1,"q":"What is the most common site of an upper motor neuron lesion?","o":[["Internal capsule"],["Motor cortex","Motor cortex damage is a UMN lesion, but your notes name the internal capsule as the most common site."],["Corona radiata","It appears in the figure above the internal capsule, but it is not the site your notes call most common."],["Descending tracts in the spinal cord","Damage here is also a UMN lesion, but it is not the most common site."]],"x":"Your notes say the most common site of a UMNL is the \u003cb>internal capsule\u003c/b>, commonly from \u003cb>vascular\u003c/b> disorders. Here the pyramidal fibres are packed into a small area."},{"id":"t44q2","t":"t44","type":"tf","q":"In an upper motor neuron lesion, paralysis is usually on the same side as the lesion.","a":false,"fix":"Paralysis is usually on the opposite side, because the motor tracts cross.","x":"UMN paralysis is usually \u003cb>contralateral\u003c/b>, due to crossing of the motor tracts. A left internal capsule lesion weakens the right side."},{"id":"t44q3","t":"t44","type":"mcq","q":"Why is the paralysis in an upper motor neuron lesion usually widespread?","o":[["Pyramidal fibres form a compact bundle that occupies a small area"],["Spasticity spreads from one muscle to its neighbours","Spasticity is due to raised gamma efferent discharge, not spread between muscles."],["The lesion is always very large","Even a small lesion can do it, because the fibres are packed so tightly together."],["The muscles waste quickly","There is little or no wasting in UMNL."]],"x":"Because pyramidal fibres run as a \u003cb>compact bundle\u003c/b>, one small lesion (e.g. in the internal capsule) can cut fibres to many muscles at once."},{"id":"t44q4","t":"t44","type":"list","q":"Name the main causes of upper motor neuron lesions listed in your notes.","p":[["Vascular disorders",["vascul","stroke"]],["Trauma",["trauma","injur"]],["Tumour",["tumo","neoplas","cancer"]],["Degenerative diseases",["degenerat"]]],"need":3,"x":"Your notes list UMNL causes as mainly \u003cb>vascular\u003c/b>, \u003cb>trauma\u003c/b>, \u003cb>tumour\u003c/b> and \u003cb>degenerative diseases\u003c/b>. Vascular disorders are the usual cause at the commonest site, the internal capsule."},{"id":"t44q5","t":"t44","type":"mcq","q":"What causes spasticity in an upper motor neuron lesion?","o":[["Less inhibition of gamma efferents by the inhibitory reticular formation, while facilitation continues"],["More inhibition of gamma efferents by the inhibitory reticular formation","This is backwards. IRF output falls, so the balance shifts towards facilitation."],["Direct overactivity of the motor cortex on alpha motor neurons","The cortex is cut off in UMNL. The change works through the reticular formation on gamma efferents."],["Wasting of the affected muscles","There is little or no wasting in UMNL, and wasting does not raise tone."]],"x":"Decreased inhibitory discharge from the \u003cb>IRF\u003c/b> onto the \u003cb>gamma efferents\u003c/b>, while the \u003cb>FRF\u003c/b> keeps facilitating. The balance shifts to facilitation and gamma efferent discharge increases."},{"id":"t44q6","t":"t44","type":"tf","q":"Normally, the inhibitory reticular formation (IRF) discharges spontaneously, without needing input from the cerebral cortex.","a":false,"fix":"The IRF does not discharge spontaneously; it is driven by fibres from the cerebral cortex. It is the FRF that discharges spontaneously.","x":"The \u003cb>FRF\u003c/b> fires spontaneously, possibly in response to afferent input such as the reticular activating system. The \u003cb>IRF\u003c/b> needs cortical drive, so a UMNL that cuts the cortical fibres lowers IRF activity."},{"id":"t44q7","t":"t44","type":"tf","q":"In an upper motor neuron lesion, the vestibulospinal tracts remain intact and add to the facilitation of muscle tone.","a":true,"x":"Your notes add this as a second reason for spasticity: the \u003cb>vestibulospinal tracts\u003c/b> are spared and have a \u003cb>facilitatory\u003c/b> effect on muscle tone."},{"id":"t44q8","t":"t44","type":"mcq","q":"Why are the deep reflexes exaggerated (hyperreflexia) in an upper motor neuron lesion?","o":[["Supraspinal facilitation makes the muscle spindles more active to stretch"],["The pyramidal tract adds extra facilitation to the reflex","The pyramidal tract is damaged in UMNL, so its influence is lost, not added."],["The Golgi tendon organs stop working","Your notes explain hyperreflexia by facilitation of the spindles, not by GTO failure."],["The facilitatory reticular formation becomes less active","Less facilitation would weaken reflexes, not exaggerate them."]],"x":"Hyperreflexia is due to the \u003cb>state of supraspinal facilitation\u003c/b>, which increases the activity of the \u003cb>muscle spindle\u003c/b> to stretch."},{"id":"t44q9","t":"t44","type":"order","q":"Put the steps of clonus in order, starting from a sudden stretch of a spastic muscle.","o":["The muscle is suddenly stretched","Muscle spindles fire and the muscle contracts (stretch reflex)","The maintained pressure raises muscle tension","Golgi tendon organs fire and the muscle relaxes (inverse stretch reflex)","The stretch is still there, so a new stretch reflex occurs"],"x":"Clonus is regular rhythmic contraction and relaxation of a spastic muscle under a \u003cb>sudden sustained stretch\u003c/b>. It is a stretch reflex then inverse stretch reflex (GTO) cycle, kept going by excess spinal facilitation."},{"id":"t44q10","t":"t44","type":"mcq","q":"A patient with an upper motor neuron lesion has absent abdominal and cremasteric reflexes. Why?","o":[["These superficial reflexes normally receive facilitation from the pyramidal tract"],["Their reflex arc is cut at the anterior horn","That would be a lower motor neuron lesion."],["Raised gamma efferent discharge blocks them","Gamma efferent discharge explains spasticity, not the loss of superficial reflexes."],["The abdominal muscles have wasted","There is little or no wasting in UMNL."]],"x":"Superficial reflexes such as the \u003cb>abdominal\u003c/b> and \u003cb>cremasteric\u003c/b> reflexes depend on \u003cb>facilitation from the pyramidal tract\u003c/b>. Once that tract is damaged, they are lost."},{"id":"t44q11","t":"t44","type":"mcq","q":"What does a positive Babinski sign look like when the plantar reflex is tested?","o":[["Dorsiflexion of the big toe and fanning of the other toes"],["Plantar flexion of all the toes","That is the normal plantar reflex shown in the figure."],["Rhythmic jerking of the ankle under sustained stretch","That is ankle clonus."],["Dorsiflexion of the big toe with the other toes curled down","The other toes fan out."]],"x":"On eliciting the plantar reflex in a UMNL: \u003cb>the big toe dorsiflexes (bends upward)\u003c/b> and the \u003cb>smaller toes fan out\u003c/b>. Normally the toes flex."},{"id":"t44q12","t":"t44","type":"tf","q":"The Babinski sign is part of the spinal withdrawal reflex, which the corticospinal tract normally inhibits.","a":true,"x":"In a normal person the corticospinal tract \u003cb>inhibits\u003c/b> this part of the withdrawal reflex. Damage the tract and the Babinski response appears."},{"id":"t44q13","t":"t44","type":"tf","q":"When the abdominal reflex is tested, the normal response is contraction of the abdominal muscles with the umbilicus moving away from the stimulus.","a":false,"fix":"The umbilicus moves towards the stimulus.","x":"From the figure in your notes: stroke the abdomen lightly with a blunt object (key or tongue blade), inward and downward on each side. Normally the abdominal muscles contract and the \u003cb>umbilicus deviates towards the stimulus\u003c/b>."},{"id":"t45q1","t":"t45","type":"multi","d":1,"q":"Damage at which of these sites counts as a lower motor neuron lesion? (select all)","o":[["Anterior (ventral) horn cells of the spinal cord",1],["Motor nuclei of cranial nerves in the brainstem",1],["Axons of the lower motor neurons, e.g. in a peripheral nerve",1],["The motor cortex",0,"Motor cortex damage is an upper motor neuron lesion."],["Descending motor tracts above the anterior horn cells",0,"Damage to descending tracts above the anterior horn is an upper motor neuron lesion."]],"x":"An LMNL involves the lower motor neurons in the \u003cb>spinal ventral horns\u003c/b>, the \u003cb>cranial nerve motor nuclei\u003c/b> in the brainstem, or \u003cb>their axons\u003c/b>. Anything above these (cortex, descending tracts) is a UMNL."},{"id":"t45q2","t":"t45","type":"type","q":"Apart from trauma to peripheral nerves, what is the other main cause of lower motor neuron lesions in your notes?","a":["poliomyelitis","polio","poliomyelitis infection","poliomielitis"],"x":"Your notes: LMN lesions occur mainly due to \u003cb>poliomyelitis\u003c/b> or \u003cb>trauma to peripheral nerves\u003c/b>."},{"id":"t45q3","t":"t45","type":"mcq","q":"Why is muscle tone decreased (hypotonia or flaccidity) in a lower motor neuron lesion?","o":[["The stretch reflex arc is cut"],["The pyramidal tract is damaged","Pyramidal tract damage is a UMN lesion, which gives spasticity."],["The muscle spindles are overactive","Overactive spindles would raise tone and reflexes, as in UMNL."],["The muscles have wasted","Wasting is a separate result of losing the motor supply; the low tone comes from the cut reflex arc."]],"x":"Your notes put LMNL hypotonia down to the \u003cb>cut of the stretch reflex arc\u003c/b>, so the muscle becomes \u003cb>flaccid\u003c/b>. In UMNL, by contrast, supraspinal facilitation raises gamma efferent discharge, giving spasticity."},{"id":"t45q4","t":"t45","type":"tf","q":"In a lower motor neuron lesion, the plantar reflex shows a positive Babinski sign.","a":false,"fix":"The plantar reflex is either normal, or absent if the muscles involved are paralysed.","x":"The comparison table lists pathological reflexes (Babinski +) as \u003cb>present in UMN\u003c/b> lesions and \u003cb>absent in LMN\u003c/b> lesions. In LMNL the plantar reflex is normal or simply absent."},{"id":"t45q5","t":"t45","type":"tf","q":"In a lower motor neuron lesion, superficial reflexes in the affected segment stay normal.","a":false,"fix":"They are lost in the affected segment if they involve contraction of the denervated muscle.","x":"A superficial reflex needs a working muscle to contract. If that muscle is \u003cb>denervated\u003c/b>, the reflex is \u003cb>lost in the affected segment\u003c/b>."},{"id":"t45q6","t":"t45","type":"mcq","q":"Which sign of muscle denervation is described in your notes as muscle potentials detected by electromyography?","o":[["Fibrillations"],["Fasciculations","These are muscle twitches you can see under the skin."],["Clonus","Clonus is a rhythmic response of a spastic muscle, seen at the bedside in UMNL."],["Babinski sign","This is a plantar reflex finding seen at the bedside in UMNL."]],"x":"\u003cb>Fibrillations\u003c/b> are muscle potentials detected by \u003cb>electromyography (EMG)\u003c/b> in denervated muscles. \u003cb>Fasciculations\u003c/b>, by contrast, are muscle twitches visible under the skin."},{"id":"t45q7","t":"t45","type":"mcq","q":"According to the comparison table in your notes, what does weakness in a lower motor neuron lesion affect?","o":[["Individual muscles"],["Muscle groups","That is the pattern of weakness in UMN lesions."],["The whole opposite side of the body","LMN paralysis is on the same side and localized."],["Both lower limbs equally","Paralysis of both lower limbs (paraplegia) follows thoracic cord transection, not a typical LMNL."]],"x":"LMN paralysis is on the same side and \u003cb>localized\u003c/b>; the table says it affects \u003cb>individual muscles\u003c/b>. UMN weakness affects \u003cb>muscle groups\u003c/b>."},{"id":"t45q8","t":"t45","type":"mcq","q":"How does muscle atrophy compare between UMN and LMN lesions?","o":[["Mild (disuse) in UMN lesions; severe (denervation) in LMN lesions"],["Severe in UMN lesions; mild in LMN lesions","This is reversed."],["Absent in both","Atrophy occurs in both, to different degrees."],["Severe in both","UMN lesions cause little or no wasting, because of the hypertonia."]],"x":"In UMNL there is little wasting (only \u003cb>disuse\u003c/b>), helped by the hypertonia. In LMNL there is \u003cb>marked wasting\u003c/b> because the muscle is deprived of its motor supply (\u003cb>denervation\u003c/b>)."},{"id":"t45q9","t":"t45","type":"tf","q":"Fasciculations are present in lower motor neuron lesions but absent in upper motor neuron lesions.","a":true,"x":"Fasciculations are a sign of \u003cb>denervation\u003c/b> of motor units, so they belong to LMN lesions. The table lists them as \u003cb>absent\u003c/b> in UMNL."},{"id":"t45q10","t":"t45","type":"tf","q":"In a lower motor neuron lesion, the deep reflexes are decreased or absent in the affected segment.","a":true,"x":"This is the opposite of the \u003cb>hyperreflexia\u003c/b> of a UMNL. The table lists LMN reflexes as \u003cb>↓ or absent\u003c/b>."},{"id":"t46q1","t":"t46","type":"mcq","q":"What is the most common cause of spinal cord injury?","o":[["Trauma"],["Ischemia","A listed cause of SCI, but not the most common."],["Tumour","A listed cause of SCI, but not the most common."],["Infection","A listed cause of SCI, but not the most common."]],"x":"SCI can be due to trauma, ischemia, infection, tumour or degenerative disease, but \u003cb>trauma\u003c/b> is the most common. The effects depend on the \u003cb>level and extent\u003c/b> of injury."},{"id":"t46q2","t":"t46","type":"type","q":"A complete transection of the spinal cord above C3, as in hanging, causes immediate death. What is the cause of death?","a":["respiratory arrest","respiratory failure","respiratory paralysis","apnoea","apnea","stopped breathing","breathing stops","arrest of breathing"],"x":"Upper cervical lesions (above \u003cb>C3\u003c/b>) lead to immediate death from \u003cb>respiratory arrest\u003c/b>, as in hanging."},{"id":"t46q3","t":"t46","type":"mcq","q":"A diver breaks his neck and has a complete spinal cord transection at C6. What pattern of paralysis do you expect?","o":[["Quadriplegia: paralysis of all four limbs"],["Paraplegia: paralysis of both lower limbs only","Paraplegia spares the arms; a lower cervical lesion affects them too."],["Paralysis of the upper limbs only","A complete transection paralyses everything below it, including the lower limbs."],["Paralysis of one side of the body only","A complete transection affects both sides below the lesion."]],"x":"\u003cb>Lower cervical\u003c/b> lesions cause \u003cb>quadriplegia\u003c/b>. The figure shows C4 and C6 injuries giving quadriplegia, and T6 and L1 injuries giving paraplegia."},{"id":"t46q4","t":"t46","type":"mcq","q":"What is the main cause of spinal shock after a complete transection?","o":[["Sudden withdrawal of tonic facilitatory influence from the brain"],["Increased discharge from the facilitatory reticular formation","Spinal shock is a loss of facilitation, not an increase."],["Destruction of the anterior horn cells below the lesion","The cells below survive; their reflexes come back in the stage of recovery."],["Extra inhibition from the inhibitory reticular formation","Your notes blame the loss of facilitation from the brain, not added inhibition."]],"x":"Spinal shock is mainly due to \u003cb>sudden withdrawal of tonic facilitation from the brain\u003c/b>. The table names the source: continuous tonic discharge onto alpha motor neurons from the \u003cb>reticulospinal, vestibulospinal and corticospinal\u003c/b> tracts."},{"id":"t46q5","t":"t46","type":"mcq","q":"In a human with no complications, spinal shock usually lasts for a minimum of about how long?","o":[["2 weeks"],["1–2 hours","That is how long it lasts in dogs and cats, which have less encephalization of motor function."],["1–2 days","Too short. In humans it lasts at least 2 weeks."],["2 years","Too long. The table gives 2–6 weeks for spinal shock."]],"x":"The duration depends on the \u003cb>degree of encephalization\u003c/b> of motor function: 1–2 h in dogs and cats, but at least \u003cb>2 weeks\u003c/b> in humans without complications (the table gives 2–6 weeks). With complications it is much longer."},{"id":"t46q6","t":"t46","type":"multi","d":1,"q":"Which of these are features of the stage of spinal shock? (select all)","o":[["Flaccid paralysis below the lesion",1],["Loss of all deep and superficial reflexes (areflexia)",1],["Loss of all sensation below the lesion",1],["Urinary retention with overflow",1],["Spasticity",0,"Tone is lost in spinal shock; the paralysis is flaccid."],["Fasciculations",0,"These are a sign of denervation in LMN lesions, not a feature of spinal shock in your notes."]],"x":"Spinal shock: \u003cb>flaccid paralysis\u003c/b>, \u003cb>areflexia\u003c/b>, \u003cb>loss of all sensation\u003c/b> below the lesion, loss of bladder and bowel control (\u003cb>retention with overflow\u003c/b>) and loss of erection."},{"id":"t46q7","t":"t46","type":"tf","q":"In spinal shock, the fall in arterial blood pressure is greatest when the transection is below the second lumbar segment.","a":false,"fix":"Blood pressure drops when the transection is at the first thoracic segment; only a slight drop occurs if the lesion is below L2.","x":"The drop is due to \u003cb>block of sympathetic activity\u003c/b> (the table: vasodilatation from loss of vasomotor tone → hypotension). Your notes give a drop with a transection at \u003cb>T1\u003c/b>, but only a slight drop when the lesion is below \u003cb>L2\u003c/b>."},{"id":"t46q8","t":"t46","type":"tf","q":"Urinary tract infection, malnutrition and decubitus ulcers can make spinal shock last much longer, or even prevent recovery.","a":true,"x":"These \u003cb>complications\u003c/b> lengthen spinal shock or cause failure of recovery. That is why good management of the paraplegic patient is so important."},{"id":"t46q9","t":"t46","type":"type","q":"In the stage of recovery, the spinal sympathetic vasoconstrictor centres below the transection regain activity. In which horn of the spinal cord are they?","a":["lateral horn","lateral","lateral horns","lateral grey horn","lateral gray horn"],"x":"The sympathetic vasoconstrictor centres in the \u003cb>lateral horn\u003c/b> send impulses to the arterioles and veins again, which regain tone. Blood pressure gradually rises."},{"id":"t46q10","t":"t46","type":"tf","q":"In the stage of recovery, micturition and defecation become automatic, as in children, but some urine is left in the bladder because the reflex is weak.","a":true,"x":"Voluntary control is lost, so the bladder and bowel empty \u003cb>automatically\u003c/b> by spinal reflex. The reflex is weak, so there is \u003cb>residual urine\u003c/b>."},{"id":"t46q11","t":"t46","type":"mcq","q":"Months after a complete thoracic cord transection, a painful stimulus to the skin of the leg causes flexor spasm of both legs, contraction of the abdominal wall, sweating and emptying of the bladder. What is this?","o":[["Mass reflex"],["Spinal shock","Spinal shock has no reflexes, so there would be no such response."],["Clonus","Clonus is a rhythmic, stretch-evoked response, not a widespread flexor spasm."],["Babinski sign","The Babinski sign is a plantar reflex finding, not a widespread spasm with autonomic effects."]],"x":"The \u003cb>mass reflex\u003c/b> is a widespread flexor withdrawal reflex of the recovery stage. Impulses may spread to autonomic centres, causing sweating, pallor, swinging blood pressure, micturition and defecation."},{"id":"t46q12","t":"t46","type":"list","q":"Name three mechanisms that may help spinal reflexes recover after a complete transection.","p":[["Denervation hypersensitivity to mediators from the remaining excitatory endings",["hypersensitiv","supersensitiv","denervation sensitiv"]],["Sprouting of collaterals, forming extra excitatory endings",["sprout","collateral"]],["More postsynaptic receptors",["receptor","postsynaptic"]],["Disinhibition: no inhibitory impulses from higher motor centres",["disinhibi","inhibitory impulse","loss of inhibition"]]],"need":3,"x":"Your notes list \u003cb>denervation hypersensitivity\u003c/b>, \u003cb>sprouting of collaterals\u003c/b> and \u003cb>more postsynaptic receptors\u003c/b>. The table adds \u003cb>disinhibition\u003c/b> of motor neurons, as inhibitory impulses from higher centres are gone."},{"id":"t46q13","t":"t46","type":"tf","q":"Once the stage of recovery is reached after a complete transection, voluntary movement below the lesion gradually returns.","a":false,"fix":"Voluntary movements and sensations below the lesion are permanently lost; only reflex activity returns.","x":"The table in your notes is clear: after complete transection, \u003cb>voluntary movements and sensations are permanently lost\u003c/b>. What returns is spinal reflex activity."},{"id":"t47q1","t":"t47","type":"mcq","d":1,"q":"A patient has spastic weakness and loss of vibration sense in the LEFT leg, with loss of pain and temperature in the RIGHT leg. Where is the lesion?","o":[["Left half of the spinal cord (hemisection)"],["Right half of the spinal cord (hemisection)","Weakness and dorsal column loss are on the same side as a hemisection, so the lesion is on the left."],["Complete transection of the spinal cord","That would cause loss of all sensation and movement on both sides below the lesion."],["Left peripheral nerve","Peripheral nerve trauma gives an LMN lesion with flaccid, wasted muscles, not spasticity."]],"x":"This is \u003cb>Brown-Séquard syndrome\u003c/b>. Corticospinal and dorsal column losses are \u003cb>ipsilateral\u003c/b> (left), and spinothalamic loss of pain and temperature is \u003cb>contralateral\u003c/b> (right). So the hemisection is on the \u003cb>left\u003c/b>."},{"id":"t47q2","t":"t47","type":"tf","q":"Brown-Séquard syndrome is a type of complete spinal cord injury.","a":false,"fix":"It is an incomplete injury: hemisection of the cord.","x":"Your notes divide SCI into \u003cb>complete cord transection\u003c/b> and \u003cb>incomplete\u003c/b> injury such as \u003cb>hemisection\u003c/b> (Brown-Séquard syndrome)."},{"id":"t47q3","t":"t47","type":"mcq","q":"In Brown-Séquard syndrome, at what level does the loss of pain and temperature begin?","o":[["One or two segments below the lesion"],["Exactly at the level of the lesion","It begins one or two segments lower."],["One or two segments above the lesion","Your notes say the loss begins below the lesion."],["Only in the sacral segments","It begins one or two segments below the lesion and extends downward."]],"x":"Loss of the \u003cb>spinothalamic tract\u003c/b> causes contralateral loss of pain and temperature beginning \u003cb>one or two segments below\u003c/b> the lesion."},{"id":"t47q4","t":"t47","type":"type","q":"In Brown-Séquard syndrome, damage to which tract causes weakness and spasticity below the lesion?","a":["corticospinal tract","lateral corticospinal tract","corticospinal","lateral corticospinal","pyramidal tract","CST"],"x":"Damage to the \u003cb>(lateral) corticospinal tract\u003c/b> gives weakness and spasticity in muscle groups on the same side: ipsilateral UMN dysfunction below the lesion."},{"id":"t47q5","t":"t47","type":"mcq","q":"In the Brown-Séquard figure in your notes, what does damage to the anterior horn cells produce?","o":[["LMN dysfunction on the same side, at the level of the lesion"],["LMN dysfunction on the opposite side, at the level of the lesion","The damaged anterior horn cells are on the side of the hemisection."],["LMN dysfunction on the same side, in every segment below the lesion","Only the anterior horn cells at the injured level are destroyed."],["UMN dysfunction on the opposite side, below the lesion","Anterior horn cells are lower motor neurons, so their loss gives LMN signs."]],"x":"The figure says the anterior horn cells are affected, giving \u003cb>ipsilateral LMN dysfunction at the level of the lesion\u003c/b>."},{"id":"t47q6","t":"t47","type":"multi","q":"A precise hemisection is rare, but Brown-Séquard syndrome is common. Which causes are listed in your notes? (select all)","o":[["Spinal cord tumour",1],["Trauma",1],["Degenerative disc disease",1],["Ischemia",1],["Trauma to a peripheral nerve",0,"That causes an LMN lesion. Brown-Séquard needs damage to one half of the spinal cord."]],"x":"Your notes list \u003cb>spinal cord tumour, trauma, degenerative disc disease and ischemia\u003c/b>. These are common, so the syndrome is common even though a clean hemisection is rare."},{"id":"t47q7","t":"t47","type":"tf","q":"In the figure of a right-sided hemisection at T12, a narrow band of loss of all sensation is shown on the right side at the level of the lesion.","a":true,"x":"In the figure the black band (loss of all sensation) sits at the lesion level on the \u003cb>right\u003c/b>. The right leg shows paralysis and loss of proprioception and vibration, and the left leg shows loss of pain and temperature."},{"id":"t47q8","t":"t47","type":"mcq","q":"In a hemisection, damage to the fasciculus gracilis and fasciculus cuneatus causes loss of which sensations below the lesion?","o":[["Discriminative touch, vibration and proprioception"],["Pain and temperature","These are lost through damage to the spinothalamic tract."],["All sensations","All sensation below the lesion is lost after complete transection, not hemisection."],["Vibration only","Your notes list discriminative touch, vibration and proprioception."]],"x":"The dorsal columns (\u003cb>fasciculus gracilis and cuneatus\u003c/b>) carry \u003cb>discriminative touch, vibration and proprioception\u003c/b>. In a hemisection these are lost on the same side below the lesion."},{"id":"t48q1","t":"t48","type":"multi","q":"Which of these are neuroglia of the CNS? (select all)","o":[["Astrocytes",1],["Oligodendrocytes",1],["Microglia",1],["Ependymal cells",1],["Schwann cells",0,"Schwann cells are the neuroglia of the PNS."]],"x":"Your notes classify neuroglia by site. \u003cb>CNS\u003c/b>: astrocytes, oligodendrocytes, microglia and ependymal cells. \u003cb>PNS\u003c/b>: Schwann cells."},{"id":"t48q2","t":"t48","type":"tf","q":"Neuroglia make up only about a quarter of the brain mass.","a":false,"fix":"Neuroglia make up about half the brain mass.","x":"Neuroglia, the supporting cells of the nervous system, make up about \u003cb>half the brain mass\u003c/b>."},{"id":"t48q3","t":"t48","type":"list","q":"List the functions of neuroglia given in your notes.","p":[["Structural support",["struct","scaffold"]],["Metabolic support",["metabol","nutri"]],["Immune functions",["immun","defen"]],["Electrical insulation of axons",["insulat","electric"]]],"need":3,"x":"Your notes list \u003cb>structural and metabolic support\u003c/b>, \u003cb>immune functions\u003c/b> and \u003cb>electrical insulation of axons\u003c/b>."},{"id":"t48q4","t":"t48","type":"type","q":"Which specific protein distinguishes astrocytes from neurons?","a":["glial fibrillary acidic protein","GFAP","glial fibrillary acid protein"],"x":"Astrocytes can be distinguished from neurons by \u003cb>glial fibrillary acidic protein (GFAP)\u003c/b>."},{"id":"t48q5","t":"t48","type":"mcq","d":1,"q":"What are the most common glial cells in the CNS?","o":[["Astrocytes"],["Oligodendrocytes","Your notes name astrocytes, not oligodendrocytes, as the most common CNS glia."],["Microglia","These are small cells, not the most common type."],["Ependymal cells","These form a single lining layer, not the most common type."]],"x":"Your notes: in the CNS the most common glial cells are \u003cb>astrocytes\u003c/b>."},{"id":"t48q6","t":"t48","type":"tf","q":"The precursors of astrocytes are radial glial cells, which span the developing cerebral cortex as a scaffold for migrating new nerve cells.","a":true,"x":"In early development \u003cb>radial glial cells\u003c/b> span the cerebral cortex and form \u003cb>scaffolding\u003c/b> for new nerve cells migrating to their destinations. They later give rise to astrocytes."},{"id":"t48q7","t":"t48","type":"mcq","q":"Which statement about the types of astrocyte is correct?","o":[["Fibrous astrocytes: mainly white matter, long unbranched processes"],["Fibrous astrocytes: mainly grey matter, many short branching processes","This describes protoplasmic astrocytes."],["Protoplasmic astrocytes: mainly white matter, long unbranched processes","This describes fibrous astrocytes."],["Protoplasmic astrocytes: mainly white matter, many short branching processes","Protoplasmic astrocytes are mainly in grey matter."]],"x":"\u003cb>Protoplasmic\u003c/b> astrocytes: mainly grey matter, many short branching processes. \u003cb>Fibrous\u003c/b> astrocytes: mainly white matter, long unbranched processes."},{"id":"t48q8","t":"t48","type":"mcq","q":"What do the many radiating processes of astrocytes surround?","o":[["Neurons, capillaries and the ependymal cells lining the ventricles"],["Only the axons of neurons, forming myelin","Astrocytes do not form myelin."],["Only capillaries","They also surround neurons and the ependymal cells."],["Only neurons","They also surround capillaries and the ependymal cells."]],"x":"Astrocytes are large \u003cb>stellate\u003c/b> cells. Their radiating processes surround \u003cb>neurons\u003c/b>, \u003cb>capillaries\u003c/b> and the \u003cb>ependymal cells\u003c/b> lining the ventricles."},{"id":"t49q1","t":"t49","type":"order","q":"Put the layers of the blood–brain barrier in order, from the capillary lumen outward.","o":["Endothelial cells","Basement membrane","Astrocyte endfeet"],"x":"The \u003cb>endothelial cells\u003c/b> are surrounded by a \u003cb>basement membrane\u003c/b>, which is covered by a layer of \u003cb>astrocyte endfeet\u003c/b> (Fig. 3)."},{"id":"t49q2","t":"t49","type":"mcq","d":1,"q":"What is the role of the astrocyte endfeet in the blood–brain barrier?","o":[["They produce factors that induce the barrier features of the endothelial cells"],["They seal the barrier by touching the endothelial cells directly","The endfeet do not touch the endothelial cells; a basement membrane lies between."],["They form the basement membrane around the capillary","The basement membrane is a separate layer that the endfeet cover."],["They engulf debris that crosses the capillary wall","Engulfing debris is the job of microglia, not astrocyte endfeet."]],"x":"The endfeet do not touch the endothelium, but they are important in \u003cb>producing factors that induce specific characteristics\u003c/b> in the endothelial cells, such as their high resistance."},{"id":"t49q3","t":"t49","type":"multi","q":"Which features of the endothelial cells of the blood–brain barrier are described in your notes? (select all)","o":[["High transendothelial resistance, due to long, complex tight junctions",1],["Very few pores crossing the endothelium",1],["Limited transcytosis",1],["Gaps between neighbouring endothelial cells",0,"Neighbouring endothelial cells are sealed by tight junctions."],["Free passage of all blood-borne compounds",0,"Blood-borne compounds are kept out unless they are specifically transported."]],"x":"The BBB stops blood-borne compounds unless they are specifically transported. Its endothelium has \u003cb>high transendothelial resistance\u003c/b> (long, complex \u003cb>tight junctions\u003c/b>), \u003cb>very few pores\u003c/b> and \u003cb>limited transcytosis\u003c/b>."},{"id":"t49q4","t":"t49","type":"type","q":"The blood–brain barrier is formed by the endothelial cells that make up which type of brain capillary?","a":["continuous","continuous capillaries","continuous capillary","continuous type"],"x":"The BBB is formed from the endothelial cells that make up the \u003cb>continuous capillaries\u003c/b> of the brain."},{"id":"t49q5","t":"t49","type":"type","q":"In Fig. 3 of your notes (cells forming the blood–brain barrier), which cell is labelled P?","a":["pericyte","pericytes"],"x":"The Fig. 3 key: E = endothelial cell, A = astrocyte, BM = basement membrane, \u003cb>P = pericyte\u003c/b>. The arrow marks the inter-endothelial tight junctions."},{"id":"t49q6","t":"t49","type":"mcq","q":"Which ion do astrocytes regulate in the extracellular medium around neurons?","o":[["Potassium (K+)"],["Sodium (Na+)","Your notes name K+ as the ion astrocytes regulate around neurons."],["Chloride (Cl-)","Your notes name K+ as the ion astrocytes regulate around neurons."],["Calcium (Ca2+)","Your notes name K+ as the ion astrocytes regulate around neurons."]],"x":"One astrocyte function is \u003cb>regulation of K\u003csup>+\u003c/sup> levels\u003c/b> in the extracellular medium around neurons."},{"id":"t49q7","t":"t49","type":"mcq","q":"Astrocytes store glycogen. In what form is it supplied to neurons when they need it?","o":[["Lactate"],["Glucose","Your notes say it is passed on as lactate."],["Glycogen","Glycogen is the storage form kept inside the astrocyte."],["Amino acids","Your notes say it is passed on as lactate."]],"x":"Astrocytes \u003cb>store glycogen\u003c/b> that can be supplied to neurons, in the form of \u003cb>lactate\u003c/b>, when required."},{"id":"t49q8","t":"t49","type":"tf","q":"Astrocytes control the distribution of neurotransmitters by restricting their diffusion and by taking them up to be metabolized or recycled.","a":true,"x":"Neurotransmitters released by neurons are kept in check by astrocytes: diffusion is \u003cb>restricted\u003c/b>, and transmitters are \u003cb>transported into the astrocyte\u003c/b> to be metabolized or recycled."},{"id":"t49q9","t":"t49","type":"tf","q":"Astrocytes are linked to each other by tight junctions, through which waves of Ca2+ spread.","a":false,"fix":"Astrocytes are linked to each other by gap junctions.","x":"\u003cb>Gap junctions\u003c/b> let small molecules diffuse between astrocytes. When stimulated by neurotransmitters, Ca\u003csup>2+\u003c/sup> changes spread between them as \u003cb>waves\u003c/b>. Gap junctions with neurons may modulate neuron behaviour."},{"id":"t50q1","t":"t50","type":"mcq","d":1,"q":"Which cell is responsible for myelination in the CNS?","o":[["Oligodendrocyte"],["Schwann cell","Schwann cells myelinate axons in the PNS."],["Astrocyte","Astrocytes support neurons and help form the BBB; they do not make myelin."],["Ependymal cell","Ependymal cells are an epithelium lining the ventricles."]],"x":"\u003cb>Oligodendrocytes\u003c/b> are responsible for \u003cb>myelination in the CNS\u003c/b>."},{"id":"t50q2","t":"t50","type":"mcq","q":"Which description fits microglia?","o":[["Small cells with long spiny processes"],["Large cells with few processes","This describes oligodendrocytes."],["Large stellate cells with many radiating processes","This describes astrocytes."],["Flattened cells with a flattened nucleus","This describes Schwann cells."]],"x":"Microglial cells are \u003cb>small\u003c/b> cells of the CNS with long \u003cb>spiny\u003c/b> processes."},{"id":"t50q3","t":"t50","type":"tf","q":"During development, microglia release growth factors and act as macrophages, removing debris produced by programmed cell death.","a":true,"x":"Programmed cell death happens on a \u003cb>large scale\u003c/b> during development. Microglia clear the debris as \u003cb>macrophages\u003c/b> and also release \u003cb>growth factors\u003c/b>."},{"id":"t50q4","t":"t50","type":"tf","q":"In the healthy adult, microglia are normally highly active phagocytes.","a":false,"fix":"In the adult, microglia are normally relatively inactive.","x":"Adult microglia are normally \u003cb>relatively inactive\u003c/b>. They take on the phagocytic role only after injury or insult to the nervous system."},{"id":"t50q5","t":"t50","type":"type","q":"After almost any injury or insult to the nervous system, microglia revert to phagocytic macrophages. What are they then said to be?","a":["reactive","reactive microglia","reactive state"],"x":"Microglia that have reverted to \u003cb>phagocytic macrophages\u003c/b> after injury are said to be \u003cb>reactive\u003c/b>."},{"id":"t50q6","t":"t50","type":"mcq","q":"Which glial cells are simple epithelial cells with numerous microvilli and one or two cilia on their apical surface?","o":[["Ependymal cells"],["Astrocytes","Astrocytes are large stellate cells with radiating processes."],["Oligodendrocytes","Oligodendrocytes are large cells with few processes."],["Schwann cells","Schwann cells are flattened cells with a flattened nucleus."]],"x":"\u003cb>Ependymal cells\u003c/b> are a \u003cb>simple epithelium\u003c/b> with numerous \u003cb>microvilli\u003c/b> and \u003cb>one or two cilia\u003c/b> on the apical surface (Fig. 4)."},{"id":"t50q7","t":"t50","type":"tf","q":"Neighbouring ependymal cells are joined by tight junctions.","a":false,"fix":"Ependymal cells are not connected by tight junctions.","x":"Your notes say ependymal cells are \u003cb>not connected by tight junctions\u003c/b>. Fig. 4 shows \u003cb>gap junctions\u003c/b> between them instead."},{"id":"t50q8","t":"t50","type":"mcq","q":"How does myelination by an oligodendrocyte differ from myelination by a Schwann cell?","o":[["An oligodendrocyte may wrap several axons; a Schwann cell myelinates a single axon"],["An oligodendrocyte myelinates a single axon; a Schwann cell wraps several axons","This is reversed."],["Both myelinate only a single axon","A single oligodendrocyte may wrap several axons with segments of myelin."],["Both may wrap several axons","Each Schwann cell myelinates a single axon."]],"x":"A single \u003cb>oligodendrocyte\u003c/b> may wrap \u003cb>several axons\u003c/b> with segments of myelin (Fig. 1). A \u003cb>Schwann cell\u003c/b> myelinates a \u003cb>single axon\u003c/b>, with its cell body closely apposed to the myelin sheath."},{"id":"t51q1","t":"t51","type":"order","q":"Put the steps of myelination by a Schwann cell in order (Fig. 5).","o":["The Schwann cell envelops the axon","The Schwann cell rotates around the axon several times, wrapping its plasma membrane around it","The Schwann cell cytoplasm is forced out from between the membrane layers"],"x":"The Schwann cell first \u003cb>envelops\u003c/b> the axon, then \u003cb>rotates\u003c/b>, wrapping its plasma membrane in layers. Finally the cytoplasm is \u003cb>squeezed out\u003c/b>, so the tight membrane wrappings form the \u003cb>myelin sheath\u003c/b>."},{"id":"t51q2","t":"t51","type":"type","q":"The Schwann cell cytoplasm squeezed out from between the membranes forms an outer sheath together with the nucleus. What is this sheath called?","a":["neurilemma","neurilemmal sheath","neurilemmal","neurolemma","neurilemma sheath"],"x":"Cytoplasm forced out from between the membranes, together with the nucleus, forms the \u003cb>neurilemmal sheath (neurilemma)\u003c/b> on the outside of the myelin."},{"id":"t51q3","t":"t51","type":"mcq","d":1,"q":"What does each node of Ranvier represent?","o":[["The interface between the myelin sheaths of two different Schwann cells"],["The middle of a single Schwann cell's myelin segment","Each node lies between two different Schwann cells."],["A thickened region where the myelin is doubled","At a node the myelin is interrupted, exposing the axon."],["The point where the axon gives off a dendrite","Your notes describe the node as a gap that exposes the axon between two Schwann cells."]],"x":"\u003cb>Nodes of Ranvier\u003c/b> are interruptions in the myelin at regular intervals that expose the axon. Each marks the \u003cb>interface between the myelin sheaths of two different Schwann cells\u003c/b>."},{"id":"t51q4","t":"t51","type":"tf","q":"The basal lamina covering the outer surface of Schwann cells dips into the nodes of Ranvier.","a":true,"x":"The \u003cb>basal lamina\u003c/b> dips into the nodes, covering the overlapped areas of the myelin sheath lamellae of adjacent Schwann cells."},{"id":"t51q5","t":"t51","type":"tf","q":"Dendrites are usually myelinated.","a":false,"fix":"Dendrites are never myelinated.","x":"Your notes are absolute here: \u003cb>dendrites are never myelinated\u003c/b>. Only axons are, and not all of them."},{"id":"t51q6","t":"t51","type":"multi","q":"Which of these make up the grey matter of the brain and spinal cord? (select all)","o":[["Nerve cell bodies",1],["Unmyelinated axons",1],["Axons that are mostly myelinated",0,"That describes white matter."],["Cell bodies only, with no axons",0,"Grey matter also contains unmyelinated axons."]],"x":"Not all axons are myelinated. \u003cb>Grey matter\u003c/b> = cell bodies + \u003cb>unmyelinated\u003c/b> axons. \u003cb>White matter\u003c/b> = axons, most of which are \u003cb>myelinated\u003c/b>."},{"id":"t51q7","t":"t51","type":"mcq","q":"After injury, how fast does a peripheral axon regrow along the Schwann cells?","o":[["2–5 mm per day"],["2–5 cm per day","Far too fast; your notes give 2–5 mm per day."],["2–5 mm per hour","Far too fast; your notes give 2–5 mm per day."],["2–5 mm per month","Far too slow; your notes give 2–5 mm per day."]],"x":"The axon regrows at between \u003cb>2 and 5 mm per day\u003c/b> along the Schwann cells."},{"id":"t51q8","t":"t51","type":"order","q":"Put the steps of peripheral axon regeneration in order.","o":["The axon tip makes contact with a Schwann cell","Mitosis is stimulated in the Schwann cell","The Schwann cell extends processes towards the axon's growth cone","The axon regrows along the Schwann cells","The Schwann cells remyelinate the new axon"],"x":"For a peripheral nerve to regrow, the \u003cb>axon tip must contact a Schwann cell\u003c/b>. This triggers Schwann cell \u003cb>mitosis\u003c/b> and processes that reach towards the \u003cb>growth cone\u003c/b>. The axon then grows along them and is \u003cb>remyelinated\u003c/b>."},{"id":"t51q9","t":"t51","type":"mcq","q":"Why do damaged neurons in the CNS not seem to regenerate <script>/* ---------- App ---------- */
(function () {
"use strict";

/* ---------- current course ---------- */
let COURSE = null;

const EMPTY = { id: "none", name: "", code: "", lecs: [], topics: [], questions: [], numbers: [], where: [], files: [] };
const hasCourse = () => !!(COURSE && COURSE.id !== "none" && QUESTIONS.length);
const partWord = () => (COURSE && COURSE.partLabel) || "Part";

/* ---------- utilities ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const pct = x => Math.round((x || 0) * 100);
const tcode = t => "T" + String(t.num).padStart(2, "0");
const arr = (x, n) => Array.isArray(x) ? x.slice(0, n || 100) : [];
function stripTags(h) { return String(h || "").replace(/<sup>(.*?)<\/sup>/g, "^$1").replace(/<sub>(.*?)<\/sub>/g, "$1").replace(/<br\s*\/?>/g, "; ").replace(/<[^>]+>/g, ""); }

function norm(s) {

let toastTimer = null;

}

}

function qs(id) { return S.q[id] || { b: 0, n: 0, c: 0, w: 0, h: 0, due: 0 }; }

    .filter(x => x.s.status === "weak" || x.s.status === "shaky")
    .sort((a, b) => (a.s.acc - b.s.acc) || (b.s.pend - a.s.pend))

    case "tf": return (q.a ? "True" : "False") + (q.fix ? " — " + q.fix : "");

/* ---------- course content: validation ---------- */

function cleanCourse(r) {

function contentReport() {
  const out = [], seenC = new Set(), seenG = new Set();
  let totalT = 0, totalQ = 0;
  CATALOG.groups.forEach(g => {
    if (seenG.has(g.id)) out.push({ bad: true, text: "Two groups share the id “" + g.id + "”." }); seenG.add(g.id);

      const p = [];

      const lecNs = arr(c.lecs, 99).map(l => l && l.n), topics = arr(c.topics, 999), questions = arr(c.questions, 9999);
      const dupL = lecNs.filter((n, i) => lecNs.indexOf(n) !== i);
      if (dupL.length) p.push("Lecture numbers used twice: " + [...new Set(dupL)].join(", ") + ".");
      const tids = topics.map(t => t && t.id), dupT = tids.filter((x, i) => tids.indexOf(x) !== i);
      if (dupT.length) p.push("Topic ids used twice: " + [...new Set(dupT)].join(", ") + ".");
      const badLec = topics.filter(t => t && !lecNs.includes(t.lec)).map(t => t.id);
      if (badLec.length) p.push("Topics pointing at a lecture that doesn’t exist: " + badLec.join(", ") + ".");
      const qids = questions.map(q => q && q.id), dupQ = qids.filter((x, i) => qids.indexOf(x) !== i);
      if (dupQ.length) p.push("Question ids used twice: " + [...new Set(dupQ)].slice(0, 20).join(", ") + ".");
      const orphan = questions.filter(q => q && !tids.includes(q.t)).map(q => q.id);
      if (orphan.length) p.push(orphan.length + " questions point at a topic that doesn’t exist: " + orphan.slice(0, 20).join(", ") + ".");
      const rejected = questions.filter(q => !cleanQ(q)).map(q => q && q.id);
      if (rejected.length) p.push(rejected.length + " questions are malformed and are hidden from students: " + rejected.slice(0, 20).join(", ") + ".");
      const withQ = new Set(questions.map(q => q && q.t));
      const empty = topics.filter(t => t && !withQ.has(t.id)).map(t => t.id);
      if (empty.length) p.push("Topics with no questions (hidden from students): " + empty.join(", ") + ".");
      const badRef = arr(c.numbers, 999).concat(arr(c.where, 999)).filter(x => Array.isArray(x) && x[2] && !tids.includes(x[2])).length;
      if (badRef) p.push(badRef + " cram-sheet entries point at a topic that doesn’t exist.");
      const badFiles = arr(c.files, 99).filter(f => f && arr(f.lecs, 20).some(n => !lecNs.includes(n))).map(f => f.name);
      if (badFiles.length) p.push("Lecture files pointing at a missing lecture: " + badFiles.join(", ") + ".");
      totalT += topics.length; totalQ += questions.length;
      out.push({ bad: p.length > 0, course: c, group: g, lecs: lecNs.length, topics: topics.length, questions: questions.length, problems: p });
    });
  });
  return { rows: out, totalT, totalQ, courses: seenC.size, groups: seenG.size };
}

function answerUI(q, cur) {
  const fb = cur.phase === "fb", ask = cur.phase === "ask";
  if (q.type === "mcq" || q.type === "multi") {
    const multi = q.type === "multi";
    return (multi && ask ? '<p class="qhint-type">Select all that apply, then check.</p>' : "") + '<div class="opts">' + cur.order.map((oi, k) => {
      const o = q.o[oi];
      const picked = multi ? cur.sel.includes(oi) : cur.sel === oi;
      let cls = "", mk = "";
      if (fb) {
        if (multi) {
          if (o[1] && picked) { cls = "is-right"; mk = "Correct"; }
          else if (o[1]) { cls = "is-missed"; mk = "Missed"; }
          else if (picked) { cls = "is-wrong"; mk = "Not correct"; }
        } else {
          if (oi === 0) { cls = "is-right"; mk = "Correct"; }
          else if (picked) { cls = "is-wrong"; mk = "Your pick"; }
        }
      } else if (cur.out.includes(oi)) cls = "is-out";
      const dis = !ask || cur.out.includes(oi);
      return '<button class="opt ' + cls + '" data-act="sel" data-i="' + oi + '" data-fk="opt-' + k + '" aria-pressed="' + (picked && !fb ? "true" : "false") + '"' + (dis ? " disabled" : "") + '><span class="key">' + (k + 1) + "</span><span>" + esc(o[0]) + '</span><span class="mk">' + mk + "</span></button>";
    }).join("") + "</div>";
  }
  if (q.type === "tf") {
    const b = (val, k, label) => {
      let cls = "";
      if (fb) { if (q.a === val) cls = "is-right"; else if (cur.sel === val) cls = "is-wrong"; }
      return '<button class="opt ' + cls + '" data-act="sel" data-v="' + (val ? 1 : 0) + '" data-fk="opt-' + k + '" aria-pressed="' + (cur.sel === val && !fb) + '"' + (!ask ? " disabled" : "") + '><span class="key">' + (val ? "T" : "F") + "</span><span>" + label + "</span></button>";
    };
    return '<div class="tf">' + b(true, 0, "True") + b(false, 1, "False") + "</div>";
  }
  if (q.type === "type") {
    const cls = fb ? (cur.g.ok ? " is-right" : " is-wrong") : "";
    return '<input class="txt' + cls + '" id="ans-type" data-qid="' + q.id + '" data-fk="ans-type" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" value="' + esc(cur.text) + '"' + (fb ? " readonly" : "") + ">";
  }
  if (q.type === "order") {
    const placed = cur.placed.map((oi, pos) => '<button class="pill' + (fb ? (oi === pos ? " is-right" : " is-wrong") : "") + '" data-act="unplace" data-pos="' + pos + '"' + (fb ? " disabled" : "") + ">" + esc(q.o[oi]) + "</button>").join("");
    const pool = fb ? "" : '<div class="pool">' + cur.pool.filter(oi => !cur.placed.includes(oi)).map(oi => '<button class="pill" data-act="place" data-i="' + oi + '">' + esc(q.o[oi]) + "</button>").join("") + "</div>";
    return '<div class="order-zone"><div class="placed" aria-label="Your order">' + placed + "</div>" + pool + (!fb && cur.placed.length ? '<div>' + btn("Clear order", "resetOrder", "", true) + "</div>" : "") + "</div>";
  }
  if (q.type === "list") {
    if (cur.phase === "ask") return '<textarea class="txt" id="ans-list" data-qid="' + q.id + '" data-fk="ans-list" placeholder="Write one point per line">' + esc(cur.text) + '</textarea><p class="qhint-type">Write from memory, one point per line. Next you’ll compare it with the notes.</p>';
    const yours = '<div><span class="lbl">Your answer</span><div class="yours">' + esc(cur.text || "(no answer)") + "</div></div>";
    if (cur.phase === "tick") {
      return yours + "<p>Tick each key point your answer actually covers. You need " + q.need + " of " + q.p.length + ".</p>" +
        '<ul class="checklist">' + q.p.map((p, i) => '<li><label><input type="checkbox" data-tick="' + i + '"' + (cur.ticks[i] ? " checked" : "") + "><span>" + esc(p[0]) + (cur.auto[i] ? '<span class="auto">found in your answer</span>' : "") + "</span></label></li>").join("") + "</ul>" +
        (cur.aiNote ? '<div class="hintbox">' + esc(cur.aiNote) + "</div>" : "");
    }
    return yours;
  }
  return "";
}
function actionsUI(q, cur) {
  if (cur.phase === "ask") {
    return '<div class="qactions">' + btn((q.type === "list" ? "Compare with notes" : "Check answer") + ' <span class="k">Enter</span>', "check") +
      (sess.kind === "practice" && !cur.hinted ? btn('Hint <span class="k">H</span>', "hint", "", true) : "") +

  if (cur.phase === "tick") {

}
function feedbackUI(q, cur) {
  const res = cur.res, g = cur.g;
  const ok = res === "correct", help = res === "helped", dunno = g.ans === "(I didn’t know)";
  const cls = ok ? "ok" : help ? "help" : "bad";
  const title = ok ? ["Correct.", "Right.", "Yes, that’s it."][S.tick % 3] : help ? "Correct, with a hint" : dunno ? "Here’s the answer" : "Not quite";
  let body = "";
  if (q.type === "mcq" && !ok && !help) {
    if (cur.sel != null) body += '<p><span class="lbl">You chose</span>' + esc(q.o[cur.sel][0]) + (q.o[cur.sel][1] ? ". " + esc(q.o[cur.sel][1]) : "") + "</p>";
    body += '<p><span class="lbl">Correct answer</span>' + esc(q.o[0][0]) + "</p>";
  }
  if (q.type === "tf") body += '<p><span class="lbl">Answer</span>' + (q.a ? "True" : "False") + (q.fix ? ". " + esc(q.fix) : "") + "</p>";
  if (q.type === "multi" && !ok && !help) {
    const items = [];
    q.o.forEach((o, i) => { const picked = cur.sel.includes(i); if (!o[1] && picked) items.push("<li><b>" + esc(o[0]) + "</b> is not correct" + (o[2] ? ": " + esc(o[2]) : ".") + "</li>"); else if (o[1] && !picked) items.push("<li>You missed <b>" + esc(o[0]) + "</b>.</li>"); });
    body += '<div><span class="lbl">What went wrong</span><ul>' + items.join("") + "</ul></div>";
  }
  if (q.type === "type") {
    if ((ok || help) && g.typo) body += '<p class="small">Accepted. Exact spelling: <b>' + esc(q.a[0]) + "</b></p>";
    if (!ok && !help) body += (dunno ? "" : '<p><span class="lbl">You wrote</span>' + esc(cur.text || "(blank)") + "</p>") + '<p><span class="lbl">Answer</span>' + esc(q.a[0]) + "</p>";
  }
  if (q.type === "order" && !ok && !help) body += '<p><span class="lbl">Correct order</span>' + q.o.map(esc).join(" → ") + "</p>";
  if (q.type === "list") {
    const n = cur.ticks.filter(Boolean).length;
    body += '<div><span class="lbl">You covered ' + n + " of " + q.p.length + " (" + q.need + ' needed)</span><ul>' + q.p.map((p, i) => "<li>" + (cur.ticks[i] ? "✓ " : "✗ <b>Missing:</b> ") + esc(p[0]) + "</li>").join("") + "</ul></div>";
  }
  if (q.x) body += '<p><span class="lbl">Why</span>' + q.x + "</p>";
  const s = qs(q.id);
  let again = "";
  if (sess.kind === "practice") again = ok ? (s.b >= 2 ? "Mastered. It will come back once in a while to check you still know it." : "One more correct answer later and this one is mastered.") : help ? "Answer it again later without the hint to count toward mastery." : "This question will come back in a few questions.";
  else if (sess.kind === "diag") again = ok ? "" : "Practice will bring this back until you get it right twice.";
  const lastInList = sess.list && sess.i >= sess.list.length;
  return '<section class="fb ' + cls + '" id="fb" aria-live="polite"><h2>' + title + '</h2><div class="why">' + body + "</div>" +
    (again ? '<p class="again">' + again + "</p>" : "") +
    '<div class="fbrow">' + btn("Review the lesson", "lesson", ' data-id="' + q.t + '"', true) + btn((lastInList ? "See results" : "Next question") + ' <span class="k">Enter</span>', "next", ' data-fk="next"') + "</div></section>";
}

/* Results */
VIEWS.results = function () {

    sub = weak.length ? "Focus on: " + weak.map(esc).join(", ") + "." : "You got every diagnostic question right. Practice will now work toward full mastery.";
    ctas = btn("Practice weak points", "practiceWeak") + btn("Back to Today", "nav", ' data-v="home"', true);
  } else if (L.kind === "check") {
    const done = L.total === L.planned, passed = done && L.correct / L.planned >= 0.9;
    title = passed ? "Mastery check passed" : done ? "Mastery check: not yet" : "Mastery check stopped early";
    sub = passed ? "You answered at least 90% without help." : "Pass mark is 90%. Retest what you missed, then try again.";
    ctas = (wrong.length ? btn("Retest what I missed", "practiceMistakes") : "") + btn(passed ? "Back to Today" : "Practice weak points", passed ? "nav" : "practiceWeak", passed ? ' data-v="home"' : "", !!wrong.length);
  } else if (L.reason === "done") {
    title = L.scope === "mistakes" ? "Notebook cleared" : "Everything here is mastered";
    sub = L.scope === "mistakes" ? "Every mistake in this set has now been answered right twice." : "You’ve mastered every question in this set. Try another set or the mastery check.";
    ctas = btn("Take the mastery check", "nav", ' data-v="check"') + btn("Practice everything", "practiceAll", "", true);
  } else {
    title = "Round complete";
    sub = (L.newlyMastered > 0 ? L.newlyMastered + " newly mastered this round. " : "") + pendingCount() + " in your mistakes notebook.";
    ctas = (sess ? btn("Keep going", "continueRound") : btn("Practice again", "practiceWeak")) + btn("Stop for now", "stopRound", "", true);
  }
  if (L.tfOnly) ctas = ctas.replace(/data-act="(practiceMistakes|practiceWeak|practiceAll)"/g, 'data-act="$1" data-tf="1"');
  const denom = L.kind === "check" && L.planned ? L.planned : L.total;
  let h = '<section class="stack-lg"><div class="panel stack"><div class="eyebrow">' + ({ diag: "Diagnostic", check: "Mastery check", practice: "Practice" }[L.kind]) + (L.tfOnly ? ", true or false only" : "") + '</div><div class="res-head"><div class="score">' + L.correct + "/" + denom + '</div><div class="stack"><h1 style="font-size:clamp(24px,4vw,32px)">' + title + '</h1><p class="muted">' + sub + "</p></div></div>" +
    (helped ? '<p class="small muted">' + helped + " correct with a hint (not counted).</p>" : "") + '<div class="row">' + ctas + "</div></div>";
  const tids = Object.keys(L.byTopic).filter(t => TMAP[t]);
  if (tids.length > 1) {
    h += '<div class="panel"><div class="sec-h"><h2>By topic</h2></div><div class="tbars">' + TOPICS.filter(t => L.byTopic[t.id]).map(t => {
      const [c, n] = L.byTopic[t.id], r = c / n, k = r === 1 ? "strong" : r > 0 ? "shaky" : "weak";
      return '<div class="tbar"><span class="tl">' + esc(t.name) + '</span><div class="bar ' + k + '"><span style="width:' + Math.max(4, r * 100) + '%"></span></div><span class="tv">' + c + "/" + n + "</span></div>";
    }).join("") + "</div></div>";
  }
  if (wrong.length) {
    h += '<div class="stack"><div class="sec-h"><h2>What you missed</h2><span class="muted small">Tap to see why</span></div><div class="missed">' + wrong.map(r => {
      const q = QMAP[r.id];
      return '<details class="mi"><summary><span class="qs">' + esc(q.q) + '</span><span class="chip">' + esc(TMAP[q.t].name) + '</span></summary><div class="mb"><div><span class="lbl">Your answer</span><span class="ans-wrong">' + esc(r.ans || "(no answer)") + '</span></div><div><span class="lbl">Correct answer</span><span class="ans-right">' + esc(correctText(q)) + "</span></div>" + (q.x ? '<div><span class="lbl">Why</span>' + q.x + "</div>" : "") + "</div></details>";
    }).join("") + "</div></div>";
  }
  return h + "</section>";
};

  startCheck: b => { const tf = b.dataset.tf === "1"; start("check", { list: buildCheck(+b.dataset.n || 30, tf), tfOnly: tf }); },

  },

  unplace: b => { const cur = sess.cur; if (cur.phase !== "ask") return; cur.placed.splice(+b.dataset.pos, 1); render(); },
  resetOrder: () => { sess.cur.placed = []; render(); },
  hint: () => {
    const cur = sess.cur, q = curQ(); if (cur.phase !== "ask" || cur.hinted || sess.kind !== "practice") return;
    cur.hinted = true;
    if (q.type === "mcq") {
      const wrong = shuffle(q.o.map((_, i) => i).filter(i => i !== 0 && i !== cur.sel)).slice(0, 2);
      cur.out = wrong; cur.hintText = (q.h ? q.h + " " : "") + "Two wrong options are crossed out.";
    } else if (q.type === "multi") cur.hintText = q.o.filter(o => o[1]).length + " of these options are correct.";
    else if (q.type === "type") { const a = q.a[0]; cur.hintText = q.h || ("Starts with “" + a[0] + "” and has " + a.replace(/[^\p{L}\p{N}]/gu, "").length + " characters."); }
    else if (q.type === "order") cur.hintText = "It starts with “" + q.o[0] + "” and ends with “" + q.o[q.o.length - 1] + "”.";
    else if (q.type === "list") cur.hintText = "There are " + q.p.length + " key points. One of them: " + q.p[0][0] + ".";
    else cur.hintText = q.h || (TMAP[q.t].hook ? "Memory hook: " + stripTags(TMAP[q.t].hook) : "Re-read the key points for " + TMAP[q.t].name + ".");

    if (q.type === "list") {

    }

  },

  filterGroup: b => { libGroup = b.dataset.g || "all"; if (R.v !== "library") { go("library"); return; } const body = document.getElementById("lib-body"); if (body) body.innerHTML = libBody(); else render(); const f = app.querySelector('.filters [data-g="' + libGroup + '"]'); if (f) f.focus(); },
  clearSearch: () => { libQuery = ""; const el = document.getElementById("lib-q"); if (el) { el.value = ""; el.focus(); } const body = document.getElementById("lib-body"); if (body) body.innerHTML = libBody(); const c = app.querySelector(".search .clear"); if (c) c.hidden = true; },
  openHit: b => {
    const cid = b.dataset.c, kind = b.dataset.kind;

  },
};

document.addEventListener("toggle", e => {

document.addEventListener("keydown", e => {
  if (e.altKey || e.metaKey && e.key !== "Enter") return;
  const tgt = e.target, tag = (tgt.tagName || "").toLowerCase();
  if (tgt.id === "lib-q" && e.key === "Escape" && libQuery) { e.preventDefault(); ACTS.clearSearch(); return; }
  if (e.key === "/" && R.v === "library" && !["input", "textarea", "select"].includes(tag)) { const q = document.getElementById("lib-q"); if (q) { e.preventDefault(); q.focus(); } return; }
  if (R.v !== "quiz" || !sess || !sess.cur) return;
  const cur = sess.cur, q = QMAP[cur.id];
  if (e.key === "Enter") {
    if (tag === "textarea" && !(e.ctrlKey || e.metaKey)) return;
    if (tag === "select") return;
    if (tag === "button" && !tgt.classList.contains("opt") && tgt.dataset.act !== "next") return;
    if (tag === "input" && tgt.type === "checkbox") return;
    e.preventDefault();
    if (cur.phase === "fb") ACTS.next(); else if (cur.phase === "ask") ACTS.check(); else if (cur.phase === "tick") ACTS.confirmList();
    return;
  }
  if (tag === "input" || tag === "textarea" || tag === "select" || e.ctrlKey) return;

    const k = +e.key - 1;
    if (q.type === "tf" && k < 2) { cur.sel = k === 0; render(); }
    else if ((q.type === "mcq" || q.type === "multi") && cur.order && k < cur.order.length) {
      const oi = cur.order[k]; if (cur.out.includes(oi)) return;
      if (q.type === "mcq") cur.sel = oi; else { const j = cur.sel.indexOf(oi); if (j < 0) cur.sel.push(oi); else cur.sel.splice(j, 1); }
      render();
    }
    return;
  }
  if (q.type === "tf" && cur.phase === "ask" && (e.key === "t" || e.key === "T" || e.key === "f" || e.key === "F")) { cur.sel = e.key.toLowerCase() === "t"; render(); return; }
  if ((e.key === "h" || e.key === "H") && cur.phase === "ask") ACTS.hint();
});
