t and broadest layer; cells of variable size and shape (fusiform, triangular, ovoid)"]]},"hook":"Surface to depth: Molecular, then Granular–Pyramidal (external), then Granular–Pyramidal (internal), then Multiform. M, G-P, G-P, M.","traps":["\u003cb>External\u003c/b> layers (II, III) lie nearer the surface than the \u003cb>internal\u003c/b> layers (IV, V).","The \u003cb>motor\u003c/b> area is \u003cb>agranular\u003c/b> (few granule cells); the \u003cb>sensory\u003c/b> area is \u003cb>granular\u003c/b>.","Betz cells are in layer \u003cb>V\u003c/b> (internal pyramidal), not layer III."]},{"id":"t12","lec":18,"name":"Motor cortex & primary motor area","big":"Most voluntary movements happen when the cortex switches on movement patterns stored in lower centres, but fine finger and hand movements get an almost direct cortical route. The primary motor cortex (MI) in the precentral gyrus holds a map of the body and carries the motor command to the LMNs.","pts":["Most \"voluntary\" movements are achieved when the cortex activates \u003cb>patterns stored in lower brain areas\u003c/b>: the cord, brain stem, basal ganglia and cerebellum. These lower centres then send the control signals to the muscles.","For a few movements the cortex has an \u003cb>almost direct pathway to the anterior motor neurons\u003c/b> of the cord, bypassing some motor centres. This is especially true for \u003cb>fine dexterous movements of the fingers and hands\u003c/b>.","The motor cortex has \u003cb>three reciprocally interconnected regions\u003c/b>: the primary motor cortex (MI), the premotor area (PM) and the supplementary motor area (SMA, also called medial premotor).","MI lies in the \u003cb>precentral gyrus\u003c/b> (figure 1).","MI has a \u003cb>topographical map\u003c/b> of the body, similar to the primary somatosensory cortex: head, lips and hands are \u003cb>lateral\u003c/b>; legs and feet are \u003cb>medial\u003c/b>.","The left precentral gyrus sends motor output to the \u003cb>right\u003c/b> side of the body.","The more \u003cb>complex\u003c/b> the movement of a body part, the more motor cortex is devoted to it, so the lips, tongue and hands have large, distorted representations (figure 2).","Function: \u003cb>voluntary control of movement\u003c/b> by carrying the motor command to the \u003cb>LMNs\u003c/b>.","MI has the main role in \u003cb>fine, precise movements\u003c/b> carried out by \u003cb>distal\u003c/b> parts of the body."],"lists":[{"h":"Motor homunculus from medial to lateral (figure 2)","ordered":true,"items":["Toes, ankle, knee","Hip, trunk","Shoulder, elbow, wrist","Hand, then fingers (little to thumb)","Neck, eyebrow, eyelid and eyeball","Face, lips, jaw","Tongue, swallowing"]}],"hook":"Picture the homunculus hanging over the top of the brain: feet dangle down the medial side, while the huge face, lips and hands spill down the lateral side. Big on the map = complex movement, not big body part.","traps":["MI controls the \u003cb>opposite\u003c/b> side: the left precentral gyrus drives the right side of the body.","Legs and feet are \u003cb>medial\u003c/b>; head, lips and hands are \u003cb>lateral\u003c/b>. Don't flip them.","Area on the map follows how \u003cb>complex\u003c/b> the movements are, not how big the body part is."]},{"id":"t13","lec":18,"name":"Premotor, SMA & frontal eye field","big":"The premotor area (PM) and the supplementary motor area (SMA) plan movements: PM for externally cued, learned sequences and gross movements, and SMA for internally generated, two-handed and postural tasks. Damage to either causes apraxia. The frontal eye field controls voluntary scanning eye movements.","pts":["PM plans movements that involve \u003cb>external sensory cues\u003c/b>; SMA plans movements from \u003cb>internally generated\u003c/b> commands or cues.","PM cells fire when there is an \u003cb>intention to move\u003c/b>, rather than during the movement. SMA cells fire while an intended movement is being \u003cb>thought about\u003c/b>.","PM is about \u003cb>six times larger\u003c/b> than MI and gets rich \u003cb>tactile and visuospatial\u003c/b> input from the \u003cb>parietal lobe\u003c/b>.","PM deals with \u003cb>learned motor activities of a complex and sequential nature\u003c/b> by coordinating groups of muscles; for example it is active during \u003cb>writing\u003c/b>.","MI controls \u003cb>fine, precise\u003c/b> distal movements, while PM has a role in \u003cb>gross\u003c/b> movements.","SMA is crucial for complicated tasks that use \u003cb>both sides of the body\u003c/b>, such as \u003cb>typing\u003c/b>.","SMA contains \u003cb>motor maps for postures\u003c/b>; its efferents end \u003cb>bilaterally\u003c/b> on \u003cb>truncal muscles\u003c/b> for postural stabilization.","Damage to PM or SMA causes \u003cb>apraxia\u003c/b>: loss of the ability to carry out familiar, learned, purposeful movements without sensory or motor impairment (normal reflexes, tone and power, but trouble brushing hair, cleaning teeth or dressing).","The \u003cb>frontal eye field (FEF)\u003c/b> controls \u003cb>voluntary scanning eye movements\u003c/b>, e.g. reading. It connects with the \u003cb>superior colliculus\u003c/b> and the gaze centres in the \u003cb>paramedian pontine reticular formation (PPRF)\u003c/b>.","FEF \u003cb>stimulation\u003c/b> turns both eyes towards the \u003cb>opposite side\u003c/b>; an FEF \u003cb>lesion\u003c/b> causes a transient conjugate deviation \u003cb>towards the side of the lesion\u003c/b>."],"table":{"head":["","MI","Premotor area (PM)","Supplementary motor area (SMA)"],"rows":[["Main job","Carries the motor command to the LMNs","Plans movements cued by \u003cb>external\u003c/b> sensory signals","Plans movements from \u003cb>internal\u003c/b> commands or cues"],["Type of movement","Fine, precise, distal","Gross; learned complex sequences (writing)","Two-sided tasks (typing); posture"],["Extra features","Body map (homunculus) in the precentral gyrus","About 6× larger than MI; tactile and visuospatial input from the parietal lobe","Motor maps for postures; bilateral efferents to truncal muscles"],["Lesion","Not described in your notes","Apraxia","Apraxia"]]},"cards":[{"h":"FEF stimulated","items":["Both eyes move together (conjugate)","They turn towards the \u003cb>opposite\u003c/b> side"]},{"h":"FEF damaged","items":["Transient conjugate deviation","Eyes turn towards the \u003cb>side of the lesion\u003c/b>"]}],"hook":"PM = Prompted from outside (external cues); SMA = Self-generated (internal cues). After an FEF lesion the eyes \"look at the lesion\"; when the FEF is stimulated they look away from it.","traps":["Writing (a learned sequence) is the \u003cb>PM\u003c/b> example; two-handed \u003cb>typing\u003c/b> is the \u003cb>SMA\u003c/b> example.","Apraxia is \u003cb>not\u003c/b> weakness: tone, reflexes and power are normal.","FEF stimulation turns the eyes \u003cb>away\u003c/b> from the stimulated side; an FEF lesion turns them \u003cb>towards\u003c/b> the lesion."]},{"id":"t14","lec":18,"name":"Prefrontal & association cortex","big":"The prefrontal cortex passes limbic input about the goal of a movement to the motor cortex. The prefrontal association area integrates motor, sensory and subcortical signals and has two parts: the dorsolateral prefrontal cortex (executive functions) and the ventromedial or orbitofrontal prefrontal cortex (controlling behaviour).","pts":["The prefrontal cortex relays input from the \u003cb>limbic system\u003c/b> to the motor cortex about the \u003cb>desired goal\u003c/b> of the movement.","The prefrontal association area receives, analyses and integrates signals from both \u003cb>motor and sensory cortex\u003c/b> and from \u003cb>subcortical structures\u003c/b>.","It has two divisions: the \u003cb>dorsolateral prefrontal cortex\u003c/b> (executive functions) and the \u003cb>ventromedial prefrontal cortex\u003c/b>, also called the \u003cb>orbitofrontal cortex\u003c/b> (controlling behaviour).","Figure 3 also labels other areas, e.g. \u003cb>Broca's area\u003c/b> (expressive speech), \u003cb>Wernicke's area\u003c/b> (language comprehension), \u003cb>posterior parietal cortex\u003c/b> (stereognosis, contralateral awareness of surroundings) and the \u003cb>amygdala\u003c/b> (fear, anxiety)."],"lists":[{"h":"Dorsolateral prefrontal cortex (executive functions)","ordered":false,"items":["Shares with the motor cortex in \u003cb>planning complex patterns\u003c/b> of voluntary movement","Gives the ability to \u003cb>concentrate\u003c/b> and promotes \u003cb>attention\u003c/b>","Mediates \u003cb>working memory\u003c/b>","Controls the ability to \u003cb>follow and obey rules\u003c/b>","Controls \u003cb>creativity and learning\u003c/b>"]},{"h":"Ventromedial prefrontal cortex (controlling behaviour)","ordered":false,"items":["Plays a role in \u003cb>motivation\u003c/b>","Regulates \u003cb>emotions and impulsive behaviour\u003c/b>","Involved in \u003cb>social decision-making\u003c/b>"]}],"table":{"head":["Area in figure 3","Labelled with"],"rows":[["Prefrontal cortex (lateral)","Motivation, planning, judgement"],["Medial prefrontal cortex","Personality, emotional behaviour, working memory"],["Orbitofrontal cortex","Olfaction, emotional behaviour"],["Broca's area","Expressive speech"],["Wernicke's area","Language comprehension"],["Posterior parietal cortex","Stereognosis; contralateral awareness of surroundings"],["Primary somatosensory cortex","Somatosensation (location, modality, intensity)"],["Primary auditory cortex","Bilateral hearing"],["Primary gustatory cortex","Taste"],["Primary visual cortex","Sight; contralateral visual field"],["Visual association cortex","Colour, spatial appreciation and recognition"],["Amygdala","Fear, anxiety"],["Hippocampus","Memory (short term)"]]},"hook":"Dorsolateral = the Director (executive: plans, concentrates, holds working memory, follows rules, creates). Ventromedial = the brake on behaviour (motivation, emotions and impulses, social decisions).","traps":["Working memory and attention are \u003cb>dorsolateral\u003c/b>; impulse control and social decision-making are \u003cb>ventromedial\u003c/b>.","In your notes the ventromedial prefrontal cortex and the \u003cb>orbitofrontal\u003c/b> cortex are the same region.","Broca's area = \u003cb>expressive\u003c/b> speech; Wernicke's area = language \u003cb>comprehension\u003c/b>."]},{"id":"t15","lec":18,"name":"Motor loops, hierarchy & thalamus","big":"Motor loops (MI with the cerebellum, SMA with the basal ganglia) let the cortex recruit motor programs. Association areas feed higher-order motor areas, which project to MI, which controls the motor neurons. The thalamus relays and screens all sensory input to the cortex and also helps with motor control, arousal and behaviour.","pts":["MI forms a motor loop with the \u003cb>cerebellum\u003c/b>; the SMA forms a loop with the \u003cb>basal ganglia\u003c/b>.","These loops let the cortex \u003cb>recruit and coordinate specific motor programs\u003c/b>.","All association areas feed into \u003cb>higher-order motor areas\u003c/b>, which project to \u003cb>MI\u003c/b>, which ultimately controls the \u003cb>motor neurons\u003c/b> (figure 4).","The \u003cb>diencephalon\u003c/b> is a deep midline structure forming the walls of the \u003cb>third ventricle\u003c/b>; its two main parts are the \u003cb>thalamus\u003c/b> and the \u003cb>hypothalamus\u003c/b>.","The thalamus is a \u003cb>relay station\u003c/b> for preliminary processing: \u003cb>all sensory input\u003c/b> synapses there on its way to the cortex.","It \u003cb>screens out insignificant signals\u003c/b> and routes important sensory impulses to the somatosensory cortex and other brain regions.","Motor role: it receives input from motor regions and projects to a specific cortical region.","It is also involved in \u003cb>arousal\u003c/b>, regulating \u003cb>cortical excitability\u003c/b> and controlling \u003cb>behaviour\u003c/b>."],"lists":[{"h":"Figure 4: from stimulus to movement","ordered":true,"items":["Sensory input from peripheral receptors","Primary sensory area","Association cortex areas (parietal-temporal-occipital, posterior parietal, prefrontal)","Premotor cortex (higher-order motor area)","Primary motor cortex","Lower motor neurones","Movement response"]}],"hook":"Loop partners: MI with the Cerebellum, SMA with the Basal ganglia. The thalamus is the gatekeeper: every sensory signal stops there, and only the important ones are sent on to the cortex.","traps":["It is \u003cb>MI\u003c/b> that loops with the cerebellum and the \u003cb>SMA\u003c/b> that loops with the basal ganglia, not the other way round.","Association areas do not drive motor neurons directly: they act through \u003cb>higher-order motor areas\u003c/b> and then MI.","The thalamus is not only sensory: it also has motor, arousal and behavioural roles."]},{"id":"t16","lec":19,"name":"Stroke overview & ischaemic causes","big":"A stroke is a temporary or permanent loss of brain function caused by interruption of the vascular supply, and it is the third leading cause of death. Strokes are ischaemic or haemorrhagic. Ischaemic strokes come from global hypotension or from focal thrombosis or (more often) embolism, and emboli most often hit the MCA territory.","pts":["\u003cb>Stroke\u003c/b> (cerebrovascular accident): a \u003cb>temporary or permanent\u003c/b> loss of function of brain tissue caused by \u003cb>interruption of the vascular supply\u003c/b>.","Stroke is the \u003cb>third\u003c/b> leading cause of death, after heart disease and cancer.","Two main types: \u003cb>ischaemic\u003c/b> and \u003cb>haemorrhagic\u003c/b>. Each has a different cause, and both can result in infarction (death) of brain tissue.","Ischaemic stroke disrupts the bloodborne supply of oxygen to the brain and produces \u003cb>non-mass lesions\u003c/b>.","\u003cb>Global ischaemia\u003c/b>: severe systemic hypotension, with systolic blood pressure \u003cb>below 50 mmHg\u003c/b>, as in shock.","\u003cb>Focal ischaemia\u003c/b>: \u003cb>thrombosis\u003c/b> (usually on atherosclerotic plaques) or \u003cb>embolism\u003c/b>, which is \u003cb>more common\u003c/b>.","Embolic sources: \u003cb>cardiac\u003c/b> (myocardial dysfunction, valvular disease, atrial fibrillation); \u003cb>arterial\u003c/b> (most often atheromatous plaques in the \u003cb>carotid arteries or aortic arch\u003c/b>); \u003cb>venous\u003c/b> (deep vein thrombosis reaching the brain through a \u003cb>patent foramen ovale\u003c/b>).","The \u003cb>middle cerebral artery\u003c/b> territory, a direct extension of the internal carotid artery, is most frequently affected by embolic infarction.","Emboli tend to lodge where vessels \u003cb>branch\u003c/b> or in areas of \u003cb>stenosis\u003c/b>, usually caused by atherosclerosis."],"lists":[{"h":"Risk factors","ordered":false,"items":["Male gender","Old age","Diabetes","Hypertension","Smoking","Dyslipidaemia","Family history","Genetic predisposition","Previous transient ischaemic attacks (TIAs)"]},{"h":"Other risk factors","ordered":false,"items":["Haematological disorder","Oral contraceptive pills","Alcohol consumption","Vasculitis","Hyperuricaemia"]}],"hook":"Emboli come from the Heart (AF, valves, myocardium), an Artery (carotid or aortic arch plaques) or a Vein (DVT crossing a patent foramen ovale), and they love the MCA, the straight continuation of the internal carotid.","traps":["\u003cb>Embolism\u003c/b>, not thrombosis, is the more common cause of focal ischaemia.","Ischaemic stroke causes \u003cb>non-mass\u003c/b> lesions.","Global ischaemia comes from \u003cb>systemic hypotension\u003c/b> (shock), not from one blocked artery."]},{"id":"t17","lec":19,"name":"Cell injury & clinical picture","big":"In ischaemia, ATP depletion causes cell swelling, glutamate acting on NMDA channels lets in Ca\u003csup>2+\u003c/sup> and kills cells by necrosis, and oedema raises intracranial pressure, which worsens ischaemia. A dead core is surrounded by a salvageable penumbra. Clinically, a stroke is in evolution or completed, causes contralateral deficits, and is classified into four syndromes by artery territory.","pts":["\u003cb>ATP depletion\u003c/b> after hypoxia leads to cellular swelling (oedema), the \u003cb>earliest event\u003c/b> in stroke.","\u003cb>Glutamate\u003c/b> activates \u003cb>NMDA channels\u003c/b>; the Ca\u003csup>2+\u003c/sup> influx causes cell death and swelling. Cells burst as the membrane fails: \u003cb>necrotic\u003c/b> cell death.","Oedema raises \u003cb>intracranial pressure\u003c/b>, compresses cerebral vessels and causes \u003cb>more ischaemia\u003c/b>.","The \u003cb>core\u003c/b> of the infarct has the most severe damage and dies rapidly. Around it, the \u003cb>ischaemic penumbra\u003c/b> has residual blood flow and \u003cb>potentially reversible\u003c/b> damage; its size varies.","\u003cb>Stroke in evolution\u003c/b>: deficits progress over \u003cb>24-48 h\u003c/b> (ongoing infarct). \u003cb>Completed stroke\u003c/b>: deficits no longer increase; this is the \u003cb>most common\u003c/b> type seen.","Key symptoms: dizziness, confusion, unsteadiness, loss of consciousness and/or severe headache, sudden numbness, weakness or paralysis on one side, and sudden blurring or loss of vision, especially in one eye.","Effects vary with \u003cb>which part\u003c/b> of the brain is damaged and the \u003cb>extent\u003c/b> of damage, which depends on \u003cb>which vessel\u003c/b> is affected."],"lists":[{"h":"Signs","ordered":false,"items":["Contralateral hemisensory loss","Contralateral hemiplegia: drooping arm, leg or eyelid, dribbling mouth (\u003cb>dysphagia\u003c/b>), sudden slurred speech (\u003cb>dysarthria\u003c/b>)","Global aphasia: difficulty finding words or understanding speech","Loss of vision, especially in one eye, with homonymous hemianopsia","Gait apraxia"]}],"table":{"head":["Syndrome (by artery territory)","Cause / area affected"],"rows":[["Total anterior circulation stroke","Occlusion of the \u003cb>MCA\u003c/b>, with or without the ACA"],["Partial anterior circulation stroke","Occlusion of \u003cb>branches of the MCA\u003c/b>, or isolated ACA occlusion"],["Posterior circulation stroke","Affects the \u003cb>brainstem, cerebellum or occipital lobe\u003c/b>"],["Lacunar stroke","Occlusion of the \u003cb>deep brain (thalamostriate) arteries\u003c/b>"]]},"hook":"Think of the infarct as a target: a dead bullseye (core) and a ring that can still be saved (penumbra). Four syndromes: Total anterior, Partial anterior, Posterior, Lacunar.","traps":["The \u003cb>completed\u003c/b> stroke, not stroke in evolution, is the most common type seen.","Hemisensory loss and hemiplegia are \u003cb>contralateral\u003c/b> to the lesion.","Total anterior = MCA \u003cb>with or without ACA\u003c/b>; partial anterior = MCA \u003cb>branches\u003c/b> or an \u003cb>isolated\u003c/b> ACA."]},{"id":"t18","lec":19,"name":"Morphology of ischaemic infarcts","big":"Global ischaemia gives a swollen brain with poor grey-white demarcation and watershed infarcts, worst at the ACA-MCA border. A focal infarct evolves in a fixed sequence: no visible change, red neurons, neutrophils, histiocytes, liquefactive necrosis, lipid-laden macrophages and finally gliosis. Haemorrhagic infarcts follow the same course plus blood.","pts":["Global ischaemia: the brain is \u003cb>swollen\u003c/b>, with \u003cb>wide gyri\u003c/b> and \u003cb>narrowed sulci\u003c/b>.","Global ischaemia: \u003cb>poor demarcation\u003c/b> between grey and white matter.","\u003cb>Border zone (watershed) infarcts\u003c/b> occur in the \u003cb>most distal\u003c/b> parts of arterial territories in the brain and spinal cord.","In the hemispheres the border zone between the \u003cb>anterior and middle cerebral arteries\u003c/b> is at greatest risk; it shows a \u003cb>wedge-shaped band of necrosis\u003c/b> over the cerebral convexity.","\u003cb>Haemorrhagic infarcts\u003c/b> usually show \u003cb>multiple, sometimes confluent, petechial haemorrhages\u003c/b>.","Their microscopic picture and evolution \u003cb>parallel ischaemic infarction\u003c/b>, plus blood extravasation and resorption.","In people with \u003cb>coagulopathies\u003c/b>, haemorrhagic infarcts may come with extensive intracerebral haematomas."],"table":{"head":["Time after focal infarct","Changes"],"rows":[["0-12 hours","No gross or microscopic changes"],["12-24 hours","\u003cb>Red neurons\u003c/b> (hypereosinophilic) with pyknotic nuclei; oedema"],["24-48 hours","\u003cb>Neutrophilic\u003c/b> infiltration. Grossly: swollen brain, no grey/white demarcation"],["2-10 days","\u003cb>Histiocytic\u003c/b> infiltration. Grossly: gelatinous, friable tissue; boundary becomes more distinct as oedema resolves"],["2-3 weeks","\u003cb>Liquefactive necrosis\u003c/b>, leaving a fluid-filled cavity that expands as dead tissue is resorbed"],["3 weeks-months","\u003cb>Lipid-laden macrophages\u003c/b> (eat lipid-rich necrotic tissue); fluid-filled cavity"],["Years","\u003cb>Gliosis\u003c/b> surrounds and fills the cyst, often giving a honeycomb look"]]},"hook":"Read the timeline as a clean-up crew: neurons turn red, neutrophils arrive, then histiocytes, the tissue liquefies, lipid-laden macrophages clear it away, and glia finally seal the cyst.","traps":["Global ischaemia: \u003cb>wide\u003c/b> gyri and \u003cb>narrow\u003c/b> sulci, because the brain is swollen.","Neutrophils (24-48 h) come \u003cb>before\u003c/b> histiocytes (2-10 days).","At 2-10 days the boundary becomes \u003cb>more\u003c/b> distinct as oedema resolves."]},{"id":"t19","lec":19,"name":"Haemorrhagic stroke","big":"Haemorrhagic stroke is rupture of a vessel in or around the brain, most often from longstanding untreated hypertension. Hypertensive bleeds hit deep structures (basal ganglia most often), while amyloid angiopathy causes lobar bleeds. Subarachnoid haemorrhage is mostly from ruptured berry aneurysms; AVMs are congenital artery-vein tangles that bleed in young people.","pts":["Haemorrhagic stroke: rupture of a vessel in or around the brain (intracranial arteries are \u003cb>thin\u003c/b> and prone to rupture), or less commonly a bleeding disorder.","Causes of rupture: \u003cb>longstanding untreated hypertension\u003c/b> (most common), berry aneurysm, arteriovenous malformation, trauma (e.g. pressure on a premature baby's head during delivery).","Spontaneous intraparenchymal haemorrhage: most common in mid to late adult life, \u003cb>peak about 60\u003c/b>; usually rupture of a \u003cb>small intraparenchymal vessel\u003c/b>. Hypertension leads; \u003cb>cerebral amyloid angiopathy\u003c/b> is another cause.","Hypertensive bleeds: \u003cb>basal ganglia\u003c/b> (most common), \u003cb>thalamus\u003c/b>, \u003cb>pons\u003c/b>, \u003cb>cerebellum\u003c/b>. Amyloid angiopathy bleeds: \u003cb>lobar\u003c/b> haemorrhages or tiny cortical \u003cb>microhaemorrhages\u003c/b> (under 1 mm).","Morphology: extravasated blood compresses the nearby tissue (oedema, hypoxic injury); later the bleed becomes a \u003cb>cavity with a brown, discoloured rim\u003c/b>.","\u003cb>Intraventricular haemorrhage\u003c/b>: the most common neurological complication in about \u003cb>40%\u003c/b> of premature babies (under 1.5 kg); pressure on the head during delivery can cause it.","\u003cb>Subarachnoid haemorrhage\u003c/b>: a surface vessel bleeds into the subarachnoid space. Traumatic or spontaneous (berry aneurysm or AVM, an intracerebral bleed rupturing into the ventricles, coagulopathies, tumours).","\u003cb>Berry aneurysm\u003c/b>: most common cause of clinically significant SAH; anterior circulation near major branch points, may be multiple; \u003cb>not present at birth\u003c/b>; thin-walled outpouching from defective \u003cb>media and intimal elastic lamina\u003c/b>.","Berry aneurysm ruptures at the \u003cb>apex\u003c/b> of the sac during an \u003cb>acute rise in intracranial pressure\u003c/b> (straining at stool). Later meningeal fibrosis can block CSF flow or resorption, causing \u003cb>hydrocephalus\u003c/b>.","\u003cb>AVM\u003c/b>: \u003cb>congenital\u003c/b> artery-vein connections \u003cb>without capillaries\u003c/b>; wormlike channels; usually presents at \u003cb>10-30 years\u003c/b>; shunting can cause ischaemia, infarction or seizures."],"cards":[{"h":"Hypertensive haemorrhage","items":["Most common site: \u003cb>basal ganglia\u003c/b>","Headache, loss of consciousness, sensorimotor disturbances"]},{"h":"Ruptured aneurysm","items":["Sudden, severe headache","Neck stiffness and vomiting","Loss of consciousness; often focal neurological signs"]}],"lists":[{"h":"Course and outcome","ordered":false,"items":["Onset is sudden, usually while the patient is awake","Massive haemorrhages may rupture brain tissue and leak into the ventricles, giving blood in the CSF","Death occurs when brain \u003cb>herniation\u003c/b> follows the mass effect of oedema and haematoma"]}],"hook":"Hypertension bleeds go deep (basal ganglia, thalamus, pons, cerebellum); amyloid bleeds stay in the lobes. Berry aneurysms grow up (not present at birth); AVMs are born (congenital).","traps":["Berry aneurysm is \u003cb>not\u003c/b> present at birth; an AVM \u003cb>is\u003c/b> congenital.","Hypertension gives \u003cb>deep\u003c/b> bleeds; cerebral amyloid angiopathy gives \u003cb>lobar\u003c/b> bleeds.","Aneurysms rupture at the \u003cb>apex\u003c/b> of the sac."]},{"id":"t20","lec":20,"name":"Plasticity & types of memory","big":"Synaptic plasticity is the ability of synapses to strengthen or weaken with activity, and it underlies learning and memory. Memory is stored in at least two stages, short-term and long-term, linked by consolidation. By content, memory is declarative (explicit) or procedural (implicit).","pts":["\u003cb>Synaptic plasticity\u003c/b>: the ability of synapses to \u003cb>strengthen or weaken over time\u003c/b> in response to increases or decreases in their activity.","Synaptic remodelling happens \u003cb>throughout life\u003c/b>, maximally during \u003cb>development\u003c/b>. Plasticity can take the form of \u003cb>synaptic depression\u003c/b> or \u003cb>synaptic facilitation\u003c/b>.","\u003cb>Memory\u003c/b> is the power to retain and recall information and past experiences. The neural change that stores knowledge is the \u003cb>memory trace\u003c/b>.","Generally \u003cb>concepts\u003c/b>, not literal information, are stored; word-by-word memorizing is possible but not the usual way.","Storage happens in at least two stages: \u003cb>short-term memory\u003c/b> (seconds to hours) and \u003cb>long-term memory\u003c/b> (days to years).","\u003cb>Consolidation\u003c/b> = transferring and fixing short-term memory traces into long-term stores.","\u003cb>Declarative (explicit)\u003c/b> memory = acquiring new facts about the world: \u003cb>episodic\u003c/b> memory (events, e.g. last year's holiday) and \u003cb>semantic\u003c/b> memory (facts, e.g. Paris is the capital of France).","\u003cb>Procedural (motor, non-declarative, implicit)\u003c/b> memory = skills and habits, e.g. riding a bicycle, driving a car, playing tennis or the piano.","Declarative learning is easy (often a \u003cb>single exposure\u003c/b>), needs \u003cb>conscious\u003c/b> recall and may be forgotten. Procedural learning is slow, needs \u003cb>repeated practice\u003c/b>, is recalled \u003cb>unconsciously\u003c/b> and is not easily lost."],"table":{"head":["Table 1","Short-term memory","Long-term memory"],"rows":[["Time of storage","Immediate","Later; must be transferred by consolidation; helped by practice or recycling through short-term mode"],["Duration","Seconds to hours","Days to years"],["Capacity","Limited","Very large"],["Retrieval","Rapid","Slower, except thoroughly ingrained memories, which are rapid"],["Forgetting","Permanently forgotten; fades quickly unless consolidated","Usually only transiently unable to access; relatively stable trace"],["Mechanism","Transient changes in preexisting synapses, e.g. altered amount of transmitter released","Relatively permanent functional or structural changes, e.g. new synapses; new protein synthesis is key"]]},"hook":"Declarative = you can declare it (say it out loud): events (episodic) and facts (semantic). Procedural = the procedures your body just does, like riding a bike.","traps":["Declarative = \u003cb>explicit\u003c/b>; procedural = \u003cb>implicit\u003c/b> (non-declarative).","Short-term memory has a \u003cb>limited\u003c/b> capacity; long-term memory is \u003cb>very large\u003c/b>.","Episodic = \u003cb>events\u003c/b>; semantic = \u003cb>facts\u003c/b>."]},{"id":"t21","lec":20,"name":"Working memory, mechanisms & sites","big":"Working memory, regulated by the prefrontal cortex, briefly holds and combines new and stored information for the task at hand. Short-term memory uses transient changes at existing synapses; long-term memory needs gene activation and protein synthesis for lasting changes. There is no single memory centre, and the cerebellum handles procedural \"how to\" memories.","pts":["\u003cb>Working memory\u003c/b> temporarily holds pieces of information for a \u003cb>current mental task\u003c/b>, combining newly acquired data with previously stored knowledge so you can judge it in context.","This is crucial to \u003cb>reasoning, planning and making judgments\u003c/b>: e.g. following a conversation, calculating a restaurant tip in your head, finding your way home.","Working memory is regulated by the \u003cb>prefrontal association cortex\u003c/b>, a temporary storage site largely responsible for \u003cb>executive functions\u003c/b> (planning, problem solving, organizing).","\u003cb>Short-term memory\u003c/b>: transient changes in \u003cb>preexisting synapses\u003c/b>, e.g. a temporary change in the amount of transmitter released, or temporarily increased postsynaptic responsiveness.","\u003cb>Long-term memory\u003c/b>: relatively permanent functional or structural changes; needs \u003cb>activation of specific genes\u003c/b> controlling \u003cb>protein synthesis\u003c/b>, e.g. new synaptic connections or permanent changes in pre- or postsynaptic membranes.","There is \u003cb>no single memory centre\u003c/b>: memory-trace neurons are widely distributed through subcortical and cortical regions.","The \u003cb>cerebellum\u003c/b> and relevant cortical regions handle \u003cb>procedural (\"how to\") memories\u003c/b> of motor skills gained through repetitive training.","The cortical areas for a procedural memory are the \u003cb>specific motor or sensory systems\u003c/b> used to perform the routine. Such memories come forth without conscious effort (an ice skater \"letting the body take over\")."],"lists":[{"h":"Brain regions most implicated in memory","ordered":false,"items":["Hippocampus and associated structures of the medial temporal lobes","Limbic system","Cerebellum","Prefrontal cortex","Other areas of the cerebral cortex"]}],"hook":"Working memory is the prefrontal desk: you lay new and old papers side by side, work on them, then clear the desk. Long-term memory is the filing cabinet that needs new hardware (genes and proteins).","traps":["Gene activation and protein synthesis are needed for \u003cb>long-term\u003c/b>, not short-term, memory.","There is \u003cb>no single\u003c/b> memory centre, not even the hippocampus.","Working memory = \u003cb>prefrontal\u003c/b> cortex; procedural memory = \u003cb>cerebellum\u003c/b> plus the relevant cortex."]},{"id":"t22","lec":20,"name":"Habituation & sensitization","big":"Habituation and sensitization are simple non-declarative learning, caused by changes in presynaptic channel proteins that alter transmitter release. In habituation Ca\u003csup>2+\u003c/sup> channels open less, so the response fades. In sensitization serotonin blocks K\u003csup>+\u003c/sup> channels, prolonging the action potential so more Ca\u003csup>2+\u003c/sup> enters and the response grows.","pts":["Habituation and sensitization are two forms of \u003cb>non-declarative\u003c/b> memory, due to modification of \u003cb>channel proteins\u003c/b> in the \u003cb>presynaptic terminals\u003c/b> of specific afferent neurons, which changes transmitter release.","\u003cb>Habituation\u003c/b>: \u003cb>decreased\u003c/b> responsiveness to repeated presentations of an \u003cb>indifferent stimulus\u003c/b> (neither rewarding nor punishing).","\u003cb>Sensitization\u003c/b>: \u003cb>increased\u003c/b> responsiveness to mild stimuli following a \u003cb>strong or noxious\u003c/b> stimulus.","Normally an action potential opens \u003cb>voltage-gated Ca\u003csup>2+\u003c/sup> channels\u003c/b>, and Ca\u003csup>2+\u003c/sup> entry triggers exocytosis of transmitter.","Habituation: Ca\u003csup>2+\u003c/sup> channels open \u003cb>less readily\u003c/b>, so less Ca\u003csup>2+\u003c/sup> enters, less transmitter is released, the postsynaptic potential is smaller (EPSP diminished, figure 1) and the response falls or disappears.","Sensitization: Ca\u003csup>2+\u003c/sup> entry is \u003cb>enhanced\u003c/b>, so more transmitter is released, the postsynaptic potential is larger and the response is stronger.","Sensitization has \u003cb>no direct effect\u003c/b> on presynaptic Ca\u003csup>2+\u003c/sup> channels; it works indirectly through \u003cb>presynaptic facilitation\u003c/b>.","A \u003cb>facilitating interneuron\u003c/b> that synapses on the presynaptic terminal releases \u003cb>serotonin\u003c/b>, which \u003cb>blocks K\u003csup>+\u003c/sup> channels\u003c/b>, prolonging the action potential and allowing more Ca\u003csup>2+\u003c/sup> influx (figure 2).","So in simple learning, \u003cb>existing\u003c/b> synaptic pathways can be functionally \u003cb>interrupted (habituated)\u003c/b> or \u003cb>enhanced (sensitized)\u003c/b>."],"cards":[{"h":"Habituation","items":["Repeated indifferent stimulus","Ca\u003csup>2+\u003c/sup> channels open less readily","Less transmitter, smaller EPSP","Response decreases or disappears"]},{"h":"Sensitization","items":["Strong or noxious stimulus first","Serotonin blocks K\u003csup>+\u003c/sup> channels","Longer action potential, more Ca\u003csup>2+\u003c/sup> in","More transmitter, stronger response"]}],"hook":"Habituation = ho-hum: a boring stimulus, so less Ca\u003csup>2+\u003c/sup> and a smaller response. Sensitization = startled: a noxious stimulus, serotonin shuts K\u003csup>+\u003c/sup> channels, a longer spike lets in more Ca\u003csup>2+\u003c/sup>.","traps":["Sensitization does \u003cb>not\u003c/b> act directly on Ca\u003csup>2+\u003c/sup> channels; serotonin blocks \u003cb>K\u003csup>+\u003c/sup>\u003c/b> channels.","Both changes are \u003cb>presynaptic\u003c/b>, in the terminals of afferent neurons.","Habituation needs an \u003cb>indifferent\u003c/b> stimulus; sensitization follows a \u003cb>strong or noxious\u003c/b> one."]},{"id":"t23","lec":20,"name":"Hippocampus, LTP & amnesia","big":"The hippocampus, the medial part of the temporal lobe and part of the limbic system, is central to consolidating new declarative memories, largely through long-term potentiation (LTP). In LTP, glutamate acts on AMPA and NMDA receptors, Ca\u003csup>2+\u003c/sup> enters and the synapse is strengthened. Memory loss can be anterograde or retrograde; dementia is progressive and irreversible.","pts":["\u003cb>Hippocampus\u003c/b>: the \u003cb>medial portion of the temporal lobe\u003c/b>, part of the \u003cb>limbic system\u003c/b>.","It is central in \u003cb>consolidating\u003c/b> newly acquired memories, particularly \u003cb>declarative\u003c/b> memory.","\u003cb>Long-term potentiation (LTP)\u003c/b> is especially prevalent in the hippocampus and is critical for converting short-term into long-term memories.","LTP develops with frequent activity across a synapse: \u003cb>repetitive, intense firing\u003c/b> of an input (like going over a fact again and again when studying) or \u003cb>linking one input with another\u003c/b> firing at the same time.","\u003cb>Anterograde amnesia\u003c/b>: loss of recent memory, including the inability to form new memories, which suggests a defect in \u003cb>storage\u003c/b>.","\u003cb>Retrograde amnesia\u003c/b>: failure of \u003cb>recall\u003c/b> of previously stored memories; it may be progressive, with \u003cb>more recent\u003c/b> memories lost first.","\u003cb>Dementia\u003c/b>: a \u003cb>progressive and irreversible\u003c/b> loss of higher mental function, particularly memory, with mood and behaviour changes that lead to disintegration of the personality.","\u003cb>Alzheimer's disease\u003c/b> is the most common form of dementia, contributing to about \u003cb>60-70%\u003c/b> of cases."],"lists":[{"h":"LTP mechanism (figure 3)","ordered":true,"items":["Glutamate is released from the activated presynaptic neuron.","Glutamate binds both \u003cb>AMPA\u003c/b> and \u003cb>NMDA\u003c/b> receptors.","Binding opens the AMPA receptor-channel.","Na\u003csup>+\u003c/sup> enters through AMPA and depolarizes the postsynaptic neuron (EPSP).","The NMDA gate opens, but \u003cb>Mg\u003csup>2+\u003c/sup>\u003c/b> still blocks it; enough depolarization (this EPSP plus others) drives Mg\u003csup>2+\u003c/sup> out.","Ca\u003csup>2+\u003c/sup> enters through NMDA and activates a Ca\u003csup>2+\u003c/sup> second-messenger pathway.","The second messenger inserts \u003cb>more AMPA receptors\u003c/b>, raising sensitivity to glutamate.","It also triggers release of a retrograde paracrine signal (likely \u003cb>nitric oxide\u003c/b>).","Nitric oxide causes a long-lasting increase in glutamate release by the presynaptic neuron."]}],"hook":"Anterograde = can't move ahead (no new memories); Retrograde = can't go back (old memories lost, newest first). In LTP, AMPA starts the EPSP, and NMDA only lets Ca\u003csup>2+\u003c/sup> in once Mg\u003csup>2+\u003c/sup> has been pushed out.","traps":["\u003cb>Anterograde\u003c/b> = cannot form new memories (storage defect); \u003cb>retrograde\u003c/b> = cannot recall stored ones.","In progressive retrograde amnesia the \u003cb>more recent\u003c/b> memories go first.","Na\u003csup>+\u003c/sup> enters through \u003cb>AMPA\u003c/b>; Ca\u003csup>2+\u003c/sup> enters through \u003cb>NMDA\u003c/b> once Mg\u003csup>2+\u003c/sup> is driven out."]},{"id":"t24","lec":21,"name":"Lateralization & non-language areas","big":"Language areas are highly lateralized, usually to the left hemisphere, and lie along and near the Sylvian fissure. Auditory and visual areas bring spoken and written words in, but your notes class them as non-language areas.","pts":["\u003cb>Language\u003c/b> is a complex form of communication in which \u003cb>written or spoken words\u003c/b> symbolize objects and convey ideas.","Understanding and producing language uses many areas in \u003cb>both\u003c/b> hemispheres, but the language areas themselves are \u003cb>highly lateralized\u003c/b>.","The main language centres are in the \u003cb>left hemisphere\u003c/b> in ~\u003cb>98%\u003c/b> of right-handed people and ~\u003cb>70%\u003c/b> of left-handed people.","The \u003cb>location of the language areas\u003c/b> defines the dominant hemisphere. Handedness may or may not match it.","The right (non-dominant) hemisphere contributes more to \u003cb>melody (prosody)\u003c/b>, rhythm, emotional expression and accent.","The primary language areas lie along and near the \u003cb>Sylvian fissure\u003c/b> (lateral cerebral sulcus) of the \u003cb>categorical\u003c/b> hemisphere.","\u003cb>Auditory areas\u003c/b> deal with \u003cb>spoken\u003c/b> speech; \u003cb>visual areas\u003c/b> deal with \u003cb>written\u003c/b> speech.","After auditory or visual words are interpreted, their meanings are fed into Wernicke's area."],"table":{"head":["","Primary area","Association area","Concerned with"],"rows":[["Auditory areas","41, 42","22","Spoken speech"],["Visual areas","17","18, 19","Written speech"]]},"cards":[{"h":"I. Non-language areas","items":["Auditory areas: primary 41, 42; association 22","Visual areas: primary 17; association 18, 19"]},{"h":"II. Language areas","items":["Wernicke's area","Broca's area (44, 45)","Inferior parietal lobule (39, 40)"]}],"hook":"Right-handers: 98% left-dominant. Left-handers: still mostly (70%) left-dominant. The right hemisphere adds the 'music' of speech: prosody, rhythm, emotion, accent.","traps":["Handedness does not define the dominant hemisphere; the location of the language areas does.","Area 22 is the auditory \u003cb>association\u003c/b> area; the primary auditory area is 41, 42.","Auditory and visual areas are \u003cb>non-language\u003c/b> areas in your notes, even though they feed the language areas."]},{"id":"t25","lec":21,"name":"Wernicke's & Broca's areas","big":"Wernicke's area (posterior superior temporal gyrus) is the comprehension area. Broca's area (areas 44 and 45, left inferior frontal gyrus) builds speech, sends it to the motor cortex and handles grammar.","pts":["\u003cb>Wernicke's area\u003c/b>: a large area in the posterior part of the auditory association area (area 22, left hemisphere), in the \u003cb>posterior superior temporal gyrus\u003c/b>.","Wernicke's area \u003cb>analyses sounds\u003c/b>, associating sound with concept, so spoken and written words are comprehended.","It transforms the visual impression of letters (\u003cb>graphemes\u003c/b>) into mental representations of speech sounds (\u003cb>phonemes\u003c/b>).","\u003cb>Broca's area\u003c/b> = Brodmann areas \u003cb>44 and 45\u003c/b> in the left inferior frontal gyrus.","\u003cb>Area 44\u003c/b> (posterior part) is part of a network that combines sounds into words and words into sentences for language production.","\u003cb>Area 45\u003c/b> (anterior part) stores information and, when needed, projects it to the \u003cb>motor cortex\u003c/b> to start the needed muscle movements.","Broca's area processes the \u003cb>grammatical structure\u003c/b> of sentences and the proper use of grammatical vocabulary and verbs. It is \u003cb>not directly involved in meaning\u003c/b>.","Figure 1 labels Wernicke's area 'contains \u003cb>sound images of words\u003c/b>' and Broca's area 'matches speech sounds to motor programmes for speech articulation'."],"table":{"head":["","Area 44","Area 45"],"rows":[["Part of left inferior frontal gyrus","Posterior part","Anterior part"],["Role","Network combining sounds into words and words into sentences","Stores information; projects it to the motor cortex to start muscle movements"]]},"lists":[{"h":"Functions of Wernicke's area (your notes)","ordered":false,"items":["Understanding auditory and visual information (spoken and written language)","Word recognition","Understanding thoughts","Arranging words into coherent sentences","\u003cb>Analysis of sounds\u003c/b> (sound with concept) for comprehension of spoken and written words","Graphemes (letters seen) into phonemes (speech sounds)"]}],"hook":"Wernicke = Words' meaning (comprehension). Broca = Building speech (production and grammar). In Broca's area the number goes up as you move forward: 44 behind, 45 in front.","traps":["Wernicke's area is in the superior temporal gyrus; Broca's area is in the inferior frontal gyrus.","Area 44 is the \u003cb>posterior\u003c/b> part of Broca's area and area 45 the \u003cb>anterior\u003c/b> part.","Broca's area handles grammar but is \u003cb>not directly involved in meaning\u003c/b>."]},{"id":"t26","lec":21,"name":"Parietal areas & speech circuits","big":"The inferior parietal lobule (angular gyrus 39, supramarginal gyrus 40) links letters and sounds. The arcuate fasciculus joins Wernicke's area to Broca's area in the circuits for spoken and written language.","pts":["The \u003cb>inferior parietal lobule\u003c/b> = \u003cb>angular gyrus (area 39)\u003c/b> + \u003cb>supramarginal gyrus (area 40)\u003c/b>.","\u003cb>Angular gyrus\u003c/b>: in the posterior parietal lobule, posterior to Wernicke's area and anterior to the visual areas 17, 18, 19.","The angular gyrus \u003cb>translates written words into sounds\u003c/b> and is important in writing words that are \u003cb>not phonetic\u003c/b> (e.g. 'circuit').","\u003cb>Supramarginal gyrus\u003c/b>: arches over the end of the \u003cb>lateral sulcus\u003c/b>, next to the inferior part of the somatosensory cortex.","The supramarginal gyrus correlates sounds and letters and acts as \u003cb>short-term auditory memory\u003c/b> to remember how to sound words.","The \u003cb>arcuate fasciculus\u003c/b> connects Wernicke's and Broca's areas, so we produce words that make sense. It is thought to monitor speech and help repetition of words.","In the written-speech circuit, visual association input goes to the \u003cb>left angular gyrus\u003c/b>, where objects are recognised and named; Wernicke's area then sends messages to Broca's area via the arcuate and \u003cb>superior longitudinal fasciculi\u003c/b>.","Figure 1 labels the \u003cb>supplementary speech area\u003c/b> 'vowel vocalisation'. AI in the figure = primary auditory cortex."],"table":{"head":["","Angular gyrus","Supramarginal gyrus"],"rows":[["Brodmann area","39","40"],["Location","Posterior parietal lobule; behind Wernicke's area, in front of visual areas 17-19","Arches over end of lateral sulcus, next to inferior somatosensory cortex"],["Functions","Translates written words into sounds; writing non-phonetic words (e.g. circuit)","Correlates sounds and letters; short-term auditory memory for how to sound words"]]},"lists":[{"h":"Circuit for spoken language","ordered":true,"items":["Auditory apparatus carries the sentence to the \u003cb>primary auditory cortex\u003c/b> (temporal lobe)","\u003cb>Wernicke's area\u003c/b> decodes the language into meaning","To repeat or reply, the information goes forward via the \u003cb>arcuate fasciculus\u003c/b> to \u003cb>Broca's area\u003c/b> (frontal lobe, expressive speech)","Broca's area uses the motor programs of the \u003cb>motor cortex\u003c/b>","The motor cortex activates the \u003cb>tongue and laryngeal muscles\u003c/b>"]},{"h":"Circuit for written language","ordered":true,"items":["Visual cortex (areas 17-19, occipital lobe)","\u003cb>Left angular gyrus\u003c/b>: objects recognised and named","\u003cb>Wernicke's area\u003c/b>: words assembled into sentences","Arcuate and \u003cb>superior longitudinal fasciculi\u003c/b> carry messages to Broca's area","Broca's area drives the primary motor cortex, brainstem centres and the tongue and larynx muscles"]}],"hook":"Angular gyrus = reading Aloud in your head (written words into sounds). Supramarginal = Sound memory. The arcuate is an arc-shaped bridge from Wernicke (back) to Broca (front).","traps":["The angular gyrus is area \u003cb>39\u003c/b>; the supramarginal gyrus is area \u003cb>40\u003c/b>.","The supramarginal gyrus arches over the end of the \u003cb>lateral\u003c/b> sulcus, not the central sulcus.","In the written circuit, visual input reaches the \u003cb>angular gyrus before\u003c/b> Wernicke's area."]},{"id":"t27","lec":21,"name":"Aphasias","big":"Aphasia ('without speech') is a disorder of language itself, caused by a lesion of the language areas in the categorical hemisphere. Where the lesion is decides the type.","pts":["When the language areas are damaged, the clinical syndrome is \u003cb>aphasia\u003c/b>, meaning \u003cb>'without speech'\u003c/b>.","Aphasias are abnormalities of language function that are \u003cb>not\u003c/b> due to defects of vision or hearing or to motor paralysis.","They are caused by lesions in the \u003cb>categorical hemisphere\u003c/b>.","\u003cb>Wernicke's aphasia\u003c/b> (receptive or sensory): fluent speech with melody and rhythm, no difficulty with syntax or grammar, may talk excessively, but content is full of mistakes (wrong words, new words).","\u003cb>Broca's aphasia\u003c/b> (expressive, productive or non-fluent): slow speech, words hard to come by; severe cases are limited to \u003cb>two or three words\u003c/b>.","In Broca's aphasia there is difficulty with syntax and grammar and word/phrase repetition. Speech is \u003cb>ungrammatical but meaningful\u003c/b>, and speech understanding \u003cb>may be intact\u003c/b>.","\u003cb>Conduction aphasia\u003c/b>: damage to the \u003cb>arcuate fasciculus\u003c/b>. Hallmark: \u003cb>cannot repeat words\u003c/b>, though comprehension and expression are intact ('milk' becomes 'the white stuff').","\u003cb>Alexia\u003c/b> (cannot read) with \u003cb>agraphia\u003c/b> (cannot write) follows \u003cb>angular gyrus\u003c/b> damage; the patient understands speech and speaks normally.","An angular gyrus lesion sparing Wernicke's and Broca's areas: speech and hearing are fine, but written language and pictures are not understood, because visual information does not reach Wernicke's area. This is \u003cb>anomic aphasia\u003c/b>."],"table":{"head":["Type","Lesion","Speech","Understanding","Key sign"],"rows":[["Wernicke's (receptive)","Wernicke's area","Fluent; keeps melody and rhythm; may talk a lot","Cannot understand what is heard or seen","Wrong words, new words"],["Broca's (expressive)","Broca's area","Slow, non-fluent; ungrammatical but meaningful","May be intact","Only 2-3 words if severe"],["Conduction","Arcuate fasciculus","Intact","Intact","Cannot repeat words"],["Alexia with agraphia","Angular gyrus","Normal","Understands speech","Cannot read or write"],["Anomic aphasia","Angular gyrus (Wernicke's and Broca's spared)","Normal","Hears fine; cannot understand written language or pictures","Visual input does not reach Wernicke's area"]]},"hook":"Wernicke = Wordy but Wrong (fluent nonsense). Broca = Broken speech (slow, few words, but it makes sense). Conduction = cannot Copy (repeat).","traps":["Wernicke's aphasia patients have \u003cb>no\u003c/b> difficulty with grammar; their problem is understanding, so content is wrong.","Broca's speech is \u003cb>ungrammatical but meaningful\u003c/b>, and understanding may be intact.","Aphasia is \u003cb>not\u003c/b> caused by blindness, deafness or paralysis of the speech muscles."]},{"id":"t28","lec":22,"name":"Brain stem overview & medulla","big":"The brain stem (midbrain, pons, medulla) lies in the posterior cranial fossa and carries tracts, cranial nerve nuclei and the reticular formation. The medulla shows pyramids and olives in front and gracile and cuneate elevations behind.","pts":["The brain stem is the part of the CNS in the \u003cb>posterior cranial fossa\u003c/b>. Parts from above down: \u003cb>midbrain, pons, medulla\u003c/b>.","It is connected to the cerebellum by \u003cb>3 peduncles\u003c/b> (superior, middle and inferior in the figure).","It contains the \u003cb>reticular formation\u003c/b>: control of the level of consciousness and regulation of the cardiovascular and respiratory systems.","\u003cb>Anteromedian fissure\u003c/b>: continues the spinal cord's fissure and divides the medulla into 2 halves. Its lower part is marked by the \u003cb>decussation of the pyramidal (corticospinal) fibres\u003c/b>.","\u003cb>Pyramid\u003c/b>: elevation on either side of the fissure, produced by the corticospinal (pyramidal) tract. \u003cb>Olive\u003c/b>: elevation lateral to the pyramid, produced by the \u003cb>inferior olivary nucleus\u003c/b>.","Cranial nerves 9-12 are related to the medulla. \u003cb>Anterolateral sulcus\u003c/b> (between pyramid and olive): \u003cb>hypoglossal\u003c/b> rootlets.","\u003cb>Posterolateral sulcus\u003c/b> (lateral to the olive): rootlets of the \u003cb>glossopharyngeal, vagus and cranial accessory\u003c/b> nerves.","Dorsal surface: \u003cb>open medulla (cranial)\u003c/b> and \u003cb>closed medulla (caudal)\u003c/b>. The \u003cb>obex\u003c/b> is where the central canal from the spinal cord opens into the fourth ventricle.","Closed medulla, medial to lateral: posterior median sulcus, \u003cb>gracile fasciculus\u003c/b> (gracile tubercle over gracile nucleus), \u003cb>cuneate fasciculus\u003c/b> (cuneate tubercle over cuneate nucleus), then the \u003cb>inferior cerebellar peduncle\u003c/b>."],"lists":[{"h":"Functions of the brain stem","ordered":true,"items":["Pathway of tracts between cerebral cortex and spinal cord","Site of origin of nuclei of cranial nerves 3rd to 12th","Site of emergence of cranial nerves 3rd to 12th","Contains the reticular formation: level of consciousness, cardiovascular and respiratory regulation"]}],"table":{"head":["Ventral medulla (medial to lateral)","What it is","Nerve rootlets"],"rows":[["Anteromedian fissure","Divides medulla into 2 halves; pyramidal decussation in its lower part","-"],["Pyramid","Elevation produced by the corticospinal tract","-"],["Anterolateral sulcus","Groove between pyramid and olive","Hypoglossal (XII)"],["Olive","Elevation produced by the inferior olivary nucleus","-"],["Posterolateral sulcus","Groove lateral to the olive","Glossopharyngeal (IX), vagus (X), cranial accessory (XI)"]]},"hook":"Front of the medulla, medial to lateral: Pyramid, then XII, then Olive, then IX-X-XI. Back of the closed medulla: G before C from the midline (Gracile medial, Cuneate lateral), then the inferior cerebellar peduncle.","traps":["The \u003cb>open\u003c/b> medulla is \u003cb>cranial\u003c/b>; the \u003cb>closed\u003c/b> medulla is \u003cb>caudal\u003c/b>.","The hypoglossal exits \u003cb>in front of\u003c/b> the olive (anterolateral sulcus); IX, X and cranial XI exit \u003cb>behind\u003c/b> it (posterolateral sulcus).","The olive is made by the inferior olivary nucleus; the pyramid by the corticospinal tract."]},{"id":"t29","lec":22,"name":"Pons, midbrain & blood supply","big":"The pons gives exit to cranial nerves 5-8 and forms most of the fourth-ventricle floor. The midbrain has cerebral peduncles in front and four colliculi behind. The whole brain stem is supplied by the vertebral-basilar system.","pts":["Ventral pons: convex from side to side, continuous laterally with the \u003cb>middle cerebellar peduncle\u003c/b>. Its median \u003cb>basilar groove\u003c/b> lodges the basilar artery.","Cranial nerves 5-8 are related to the pons. \u003cb>Trigeminal\u003c/b>: middle part of the pons at its junction with the middle cerebellar peduncle.","\u003cb>Abducent\u003c/b>: lower border of the pons, between it and the \u003cb>pyramid\u003c/b>. \u003cb>Facial and vestibulocochlear\u003c/b>: lower border, between pons and medulla, at the \u003cb>cerebellopontomedullary angle\u003c/b>.","Dorsal pons: separated from the open medulla by an imaginary line; forms the \u003cb>cranial 2/3\u003c/b> of the floor of the 4th ventricle.","Midbrain lumen = \u003cb>cerebral aqueduct\u003c/b> (aqueduct of Sylvius). A coronal plane through it divides the midbrain into \u003cb>cerebral peduncle\u003c/b> and \u003cb>tectum\u003c/b>.","In the cross-section figure, the cerebral peduncle = \u003cb>tegmentum + substantia nigra + crus cerebri\u003c/b>. The crus cerebri is the large column of fibres on each side; the \u003cb>interpeduncular fossa\u003c/b> is the depression between the two peduncles.","\u003cb>Oculomotor (III)\u003c/b> emerges from the medial aspect of the cerebral peduncle. \u003cb>Trochlear (IV)\u003c/b> is the only cranial nerve that emerges from the \u003cb>dorsal\u003c/b> surface of the brain stem.","4 colliculi: two \u003cb>superior\u003c/b> (visual reflexes) and two \u003cb>inferior\u003c/b> (auditory reflexes). Superior brachium goes to the \u003cb>lateral\u003c/b> geniculate body; inferior brachium to the \u003cb>medial\u003c/b> geniculate body.","Blood supply: the entire brain stem is supplied by the posterior vertebral-basilar system; branches of the vertebral, basilar and posterior cerebral arteries supply both dorsal and ventral surfaces."],"table":{"head":["Part","Arterial supply"],"rows":[["Medulla","Two vertebral arteries"],["Pons","Basilar artery"],["Midbrain","Posterior cerebral arteries"]]},"cards":[{"h":"Brainstem death","items":["Spontaneous breathing stops and reflexes are lost","Cardiovascular function can be kept going artificially for a short while","It eventually deteriorates because the regulatory centres in the medulla are lost"]},{"h":"Herniation","items":["Compression of the brain stem by cerebellar or cortical herniation is often fatal","The figure labels transcalvarial, cingulate (subfalcine), central (transtentorial), uncal, upward cerebellar and downward cerebellar (tonsillar) herniation"]}],"hook":"Superior colliculus = Sight; Inferior colliculus = hearing (the ear is lower than the eye). Lateral geniculate = Light; Medial geniculate = Music. Trochlear is the back-door nerve: the only one out of the dorsal side.","traps":["The abducent exits between the pons and the \u003cb>pyramid\u003c/b>; VII and VIII exit between pons and medulla at the cerebellopontomedullary angle.","\u003cb>Superior\u003c/b> colliculi = visual reflexes; \u003cb>inferior\u003c/b> colliculi = auditory reflexes.","Medulla = two vertebral arteries; pons = basilar artery; midbrain = posterior cerebral arteries."]},{"id":"t30","lec":22,"name":"Cranial nerves: functional classes","big":"The 12 cranial nerves are pure sensory, pure motor or mixed. Their fibres and nuclei fall into seven functional types: GSE, SVE, GVE (motor) and GVA, SVA, GSA, SSA (sensory).","pts":["The 12 cranial nerves in order: olfactory, optic, oculomotor, trochlear, trigeminal, abducens, facial, vestibulocochlear, glossopharyngeal, vagus, accessory, hypoglossal.","All 12 are attached to the brain stem and have nuclei of origin there \u003cb>except the first two\u003c/b> (olfactory and optic).","\u003cb>Pure sensory\u003c/b>: olfactory (I), optic (II), vestibulocochlear (VIII).","\u003cb>Pure motor\u003c/b>: oculomotor (III), trochlear (IV), abducens (VI), accessory (XI), hypoglossal (XII).","\u003cb>Mixed\u003c/b>: trigeminal (V), facial (VII), glossopharyngeal (IX), vagus (X).","Reading the code: first letter \u003cb>G\u003c/b>eneral or \u003cb>S\u003c/b>pecial; middle letter \u003cb>S\u003c/b>omatic or \u003cb>V\u003c/b>isceral; last letter \u003cb>E\u003c/b>fferent (= motor) or \u003cb>A\u003c/b>fferent (= sensory)."],"table":{"head":["Type","Branch","Supplies / carries"],"rows":[["GSE","Motor, somatic, general","Skeletal muscle derived from \u003cb>somites\u003c/b> (muscles of orbit and tongue)"],["SVE","Motor, visceral, special","Skeletal muscle derived from \u003cb>branchial arches\u003c/b>"],["GVE","Motor, visceral, general","Smooth muscle and exocrine glands (\u003cb>parasympathetic\u003c/b>)"],["GVA","Sensory, visceral, general","Sensation from viscera (mechanical, pain, temperature, proprioception)"],["SVA","Sensory, visceral, special","\u003cb>Taste\u003c/b> and \u003cb>olfaction\u003c/b>"],["GSA","Sensory, somatic, general","Somatic touch, pain, temperature and proprioception"],["SSA","Sensory, somatic, special","\u003cb>Vision, hearing and equilibrium\u003c/b>"]]},"cards":[{"h":"Pure sensory","items":["Olfactory (I)","Optic (II)","Vestibulocochlear (VIII)"]},{"h":"Pure motor","items":["Oculomotor (III)","Trochlear (IV)","Abducens (VI)","Accessory (XI)","Hypoglossal (XII)"]},{"h":"Mixed","items":["Trigeminal (V)","Facial (VII)","Glossopharyngeal (IX)","Vagus (X)"]}],"hook":"Sensory/Motor/Both, I to XII: 'Some Say Marry Money But My Brother Says Big Brains Matter More'. It matches the table in your notes.","traps":["Vestibulocochlear (VIII) is \u003cb>pure sensory\u003c/b>, not mixed.","Accessory (XI) is \u003cb>pure motor\u003c/b>; only V, VII, IX and X are mixed.","SVE supplies \u003cb>branchial-arch\u003c/b> muscle; GSE supplies \u003cb>somite\u003c/b> muscle."]},{"id":"t31","lec":22,"name":"Cranial nerve nuclei","big":"Each cranial nerve from III to XII has one or more nuclei, each with a functional type. Some nuclei are shared: nucleus ambiguus (SVE) by IX, X and cranial XI, and the solitary nucleus (GVA, SVA) by VII, IX and X.","pts":["\u003cb>GSE\u003c/b> nuclei: oculomotor, trochlear, abducent and hypoglossal.","\u003cb>SVE\u003c/b> nuclei: motor nucleus of trigeminal, motor facial nucleus and nucleus ambiguus.","\u003cb>GVE\u003c/b> (parasympathetic) nuclei: Edinger-Westphal (III), superior salivary (VII), inferior salivary (IX), dorsal vagal (X).","\u003cb>Nucleus ambiguus\u003c/b> supplies IX, X and the cranial part of XI.","\u003cb>Solitary nucleus\u003c/b> (GVA, SVA) is shared by VII, IX and X.","Trigeminal sensory nuclei (all GSA): main sensory = \u003cb>touch\u003c/b>; spinal = \u003cb>pain and temperature\u003c/b>; mesencephalic = \u003cb>proprioception\u003c/b>.","Accessory: cranial part from nucleus ambiguus (SVE); spinal part from the \u003cb>upper 5 or 6 spinal segments\u003c/b> (GSE).","Nuclei figure, \u003cb>midbrain\u003c/b>: Edinger-Westphal, oculomotor and trochlear nuclei, and the trigeminal mesencephalic nucleus.","Nuclei figure, \u003cb>pons\u003c/b>: principal trigeminal, trigeminal motor, abducens and facial motor nuclei (the dorsal cochlear nucleus is also labelled here). \u003cb>Medulla\u003c/b>: e.g. nucleus ambiguus, dorsal motor vagal and hypoglossal nuclei."],"table":{"head":["Nerve","Nuclei (functional type)"],"rows":[["III Oculomotor","Oculomotor nucleus (GSE); Edinger-Westphal nucleus (GVE)"],["IV Trochlear","Trochlear nucleus (GSE)"],["V Trigeminal","Motor nucleus (SVE); main sensory (GSA, touch); spinal (GSA, pain and temperature); mesencephalic (GSA, proprioception)"],["VI Abducent","Abducent nucleus (GSE)"],["VII Facial","Motor facial nucleus (SVE); superior salivary (GVE); solitary (GVA, SVA)"],["VIII Vestibulocochlear","Cochlear nucleus (SSA); vestibular nucleus (SSA)"],["IX Glossopharyngeal","Nucleus ambiguus (SVE); inferior salivary (GVE); solitary (GVA, SVA)"],["X Vagus","Nucleus ambiguus (SVE); dorsal vagal nucleus (GVE); solitary (GVA, SVA)"],["XI Accessory","Cranial part: nucleus ambiguus (SVE); spinal part: upper 5 or 6 spinal segments (GSE)"],["XII Hypoglossal","Hypoglossal nucleus (GSE)"]]},"hook":"Ambiguus = the shared Motor for 9, 10, 11. Solitary = the shared Sensory for 7, 9, 10. Parasympathetic ladder 3-7-9-10: Edinger-Westphal, Superior salivary, Inferior salivary, Dorsal vagal.","traps":["The motor nuclei of V and VII are \u003cb>SVE\u003c/b>, not GSE.","The spinal part of the accessory comes from the \u003cb>upper 5 or 6 spinal segments\u003c/b> (GSE), not from nucleus ambiguus.","\u003cb>Superior\u003c/b> salivary goes with the facial (VII); \u003cb>inferior\u003c/b> salivary with the glossopharyngeal (IX)."]},{"id":"t32","lec":23,"name":"Reflex action & classification","big":"A reflex is the involuntary response of an organ to a stimulus. It runs along a reflex arc from receptor to effector, and reflexes are classified by development, stimulus site, processing site, response and the number of synapses.","pts":["A \u003cb>reflex\u003c/b> is the involuntary response of an organ to a stimulus; it is the simplest motor response to sensory input and occurs in \u003cb>both the somatic and autonomic\u003c/b> nervous systems.","\u003cb>Reflex action\u003c/b> = all the steps from stimulus to response. \u003cb>Reflex arc\u003c/b> = the pathway that begins with the receptor and ends with the effector.","The afferent neuron synapses with the motor neuron directly or through interneurons; this forms the \u003cb>centre\u003c/b> of the reflex.","\u003cb>Innate\u003c/b> (simple, basic) reflexes are built-in, inborn, unlearned and genetically determined, e.g. contraction of the bladder wall when it fills with urine.","\u003cb>Acquired (conditioned)\u003c/b> reflexes need training, previous experience and an \u003cb>intact cerebral cortex\u003c/b>.","\u003cb>Monosynaptic\u003c/b> = one sensory neuron + one motor neuron with one synapse. The \u003cb>stretch reflex is the only example\u003c/b> in the body.","\u003cb>Polysynaptic\u003c/b> = two or more synapses in the arc (two to several hundred), e.g. the withdrawal reflex.","\u003cb>Spinal\u003c/b> reflexes have their centre in the spinal cord; \u003cb>cranial\u003c/b> reflexes have it in the brain (hypothalamus, midbrain, medulla).","\u003cb>Superficial\u003c/b> reflexes: stimulus applied to the skin. \u003cb>Deep\u003c/b> reflexes: stimulus in deep structures such as muscle or tendon.","\u003cb>Somatic\u003c/b> reflexes control skeletal muscle (they include superficial and stretch reflexes). \u003cb>Visceral (autonomic)\u003c/b> reflexes control \u003cb>smooth and cardiac muscle and glands\u003c/b>."],"table":{"head":["Classified by","Types","Key point"],"rows":[["Development","Innate / Acquired","Acquired reflexes need training, experience and an intact cortex"],["Stimulus site","Superficial / Deep","Skin vs muscle or tendon"],["Processing site","Spinal / Cranial","Centre in the spinal cord vs the brain"],["Response","Somatic / Visceral","Skeletal muscle vs smooth and cardiac muscle and glands"],["Complexity of circuit","Monosynaptic / Polysynaptic","One synapse vs two to several hundred"]]},"lists":[{"h":"Reflex arc (in order)","ordered":true,"items":["Receptor (turns the stimulus into nerve impulses)","Afferent (sensory) neuron","Centre in the CNS (synapse, direct or via interneurons)","Motor (efferent) neuron","Effector organ (performs the response)"]},{"h":"Cranial reflex centres","ordered":false,"items":["\u003cb>Hypothalamus\u003c/b>: body temperature, body water, general metabolism","\u003cb>Midbrain\u003c/b>: pupillary light reflex, postural reflexes","\u003cb>Medulla\u003c/b>: cardiovascular, respiratory and digestive functions"]},{"h":"Acquired (conditioned) reflex examples","ordered":false,"items":["Increased heart rate in athletes on seeing the courtyard (anticipatory sympathetic response)","Secretion of digestive juices on seeing or smelling food","Going silent when the lights dim in a cinema"]}],"hook":"MONO = ONE synapse = ONLY the stretch reflex. Acquired reflexes need A Cortex (plus training and experience).","traps":["Reflex \u003cb>action\u003c/b> is all the steps; the reflex \u003cb>arc\u003c/b> is just the pathway from receptor to effector.","The stretch reflex is the \u003cb>only\u003c/b> monosynaptic reflex; any arc with two or more synapses is polysynaptic.","Midbrain = pupillary light and postural reflexes; \u003cb>medulla\u003c/b> = cardiovascular, respiratory and digestive reflexes; hypothalamus = temperature, water and metabolism."]},{"id":"t33","lec":23,"name":"Muscle spindle & stretch reflex","big":"The stretch (myotatic) reflex is reflex contraction of a skeletal muscle in response to its passive stretch. Its receptor is the muscle spindle: Ia and II afferents excite α motor neurons, which contract the muscle and oppose the stretch.","pts":["The stretch reflex is a localized, deep, monosynaptic reflex and the \u003cb>simplest spinal reflex\u003c/b>.","\u003cb>Muscle spindle\u003c/b>: a small, encapsulated, fusiform structure in the fleshy part of the muscle.","The \u003cb>central\u003c/b> part of the intrafusal fibres is the stretch-sensitive receptor area; the \u003cb>peripheral (polar) parts\u003c/b> on both sides are contractile.","Three essential elements: \u003cb>intrafusal fibres\u003c/b>, large myelinated \u003cb>afferents (Ia and II)\u003c/b> from the centre, and small myelinated \u003cb>efferents (γ)\u003c/b> to the polar ends.","\u003cb>Group Ia\u003c/b> = primary (\u003cb>annulospiral\u003c/b>) endings, rapidly adapting: detect the \u003cb>rate of change\u003c/b> of length (speed of movement), allowing quick corrective movements.","\u003cb>Group II\u003c/b> = secondary (\u003cb>flower spray\u003c/b>) endings, slowly adapting: signal the \u003cb>steady-state (static) length\u003c/b>.","\u003cb>γ motor neurons\u003c/b> originate in the \u003cb>ventral roots\u003c/b> and adjust spindle sensitivity. Dynamic γ → dynamic nuclear bag fibres; \u003cb>static γ → static nuclear bag + nuclear chain fibres\u003c/b>.","\u003cb>Centre\u003c/b>: α motor neurons receiving primary and secondary afferents. \u003cb>Efferent\u003c/b>: thick myelinated fibres to the extrafusal fibres (the effector). \u003cb>Response\u003c/b>: contraction.","How it works: stretch → spindle stretched → Ia and II fire → α motor neurons → muscle shortens, so the stretch is opposed and length is maintained."],"table":{"head":["","Dynamic stretch reflex","Static stretch reflex"],"rows":[["Stimulus","Sudden, strong passive stretch","Maintained, weak passive stretch"],["Intrafusal fibres stretched","Nuclear bag fibres","Nuclear chain fibres"],["Endings stimulated","Primary (Ia) endings","Secondary (II) endings"],["Response","Rapid contraction, then rapid relaxation","Maintained sub-tetanic contraction"],["Basis of","\u003cb>Tendon jerks\u003c/b>","\u003cb>Muscle tone\u003c/b>"]]},"hook":"Ia = 'In a hurry': rate of change, rapidly adapting, dynamic. II = 'steady': static length, slowly adapting. Dynamic reflex = tendon jerk.","traps":["Primary (Ia) endings are \u003cb>annulospiral\u003c/b>; secondary (II) endings are \u003cb>flower spray\u003c/b>. Don't swap the names.","Static γ fibres supply \u003cb>both\u003c/b> static nuclear bag and nuclear chain fibres; dynamic γ fibres supply only dynamic nuclear bag fibres.","The spindle's receptor area is the \u003cb>central\u003c/b> part; the ends are contractile. Afferents leave the centre, γ efferents go to the ends."]},{"id":"t34","lec":23,"name":"Supraspinal control & α–γ coactivation","big":"Brain centres change the threshold of the stretch reflex by acting on γ motor neurons through descending tracts, which sets muscle tone for posture. α–γ coactivation keeps the spindle stretched while the muscle shortens.","pts":["Supraspinal \u003cb>facilitatory\u003c/b> and \u003cb>inhibitory\u003c/b> centres act through descending tracts on \u003cb>γ motor neurons\u003c/b>, changing the reflex threshold and so the tone of muscles to keep posture.","Facilitatory centres are \u003cb>normally predominant during rest\u003c/b>.","Facilitatory: \u003cb>facilitatory reticular formation\u003c/b> (via the medial reticulospinal tract), \u003cb>vestibular nucleus\u003c/b> (medulla; via medial and lateral vestibulospinal tracts) and \u003cb>olive nucleus\u003c/b> (medulla).","Inhibitory: \u003cb>inhibitory reticular formation\u003c/b>, via the \u003cb>lateral reticulospinal tract\u003c/b>.","Premotor cortex, paleocerebellum and corpus striatum also influence the stretch reflex through descending control of spinal motor circuits.","γ efferent discharge is also increased by \u003cb>anxiety\u003c/b>, \u003cb>cutaneous painful stimulation\u003c/b> and the \u003cb>Jendrassik manoeuvre\u003c/b> (hooking the fingers together or clenching the teeth while tendon jerks are elicited).","γ stimulation shortens the contractile ends of the intrafusal fibres, stretching the nuclear bag region and firing Ia fibres → reflex contraction. So a muscle can contract directly via α or \u003cb>indirectly via γ\u003c/b>.","Increased γ activity \u003cb>increases spindle sensitivity\u003c/b> during stretch.","\u003cb>α–γ coactivation\u003c/b>: signals from the motor cortex to α motor neurons also stimulate γ motor neurons, so extrafusal and intrafusal fibres shorten together and the spindles \u003cb>remain stretched\u003c/b> throughout contraction."],"table":{"head":["Supraspinal centre","Effect","Route / location"],"rows":[["Facilitatory reticular formation","Facilitatory","Medial reticulospinal tract"],["Vestibular nucleus","Facilitatory","Medulla; medial and lateral vestibulospinal tracts"],["Olive nucleus","Facilitatory","Medulla oblongata"],["Inhibitory reticular formation","Inhibitory","Lateral reticulospinal tract"]]},"hook":"Jendrassik = 'Join hands' (hook the fingers) or Jaw clench → more γ drive while you test the jerk.","traps":["Supraspinal centres change the reflex mainly through \u003cb>γ\u003c/b> (not α) motor neurons.","\u003cb>Medial\u003c/b> reticulospinal tract = facilitatory reticular formation; \u003cb>lateral\u003c/b> reticulospinal tract = inhibitory reticular formation.","More γ activity makes the spindle \u003cb>more\u003c/b> sensitive, not less."]},{"id":"t35","lec":23,"name":"Stretch reflex properties & tone","big":"The stretch reflex keeps muscle length constant and supports posture and balance; its properties follow from having no interneurons. Muscle tone is the continuous reflex sub-tetanic contraction of resting muscle, produced by the static stretch reflex.","pts":["\u003cb>Functions\u003c/b>: keep muscle length constant; control posture; maintain balance in walking and standing; clinical testing.","Tendon jerks (knee, ankle, biceps) help assess the integrity of \u003cb>spinal segments, peripheral nerves and descending control\u003c/b>.","\u003cb>Short total reflex time\u003c/b>: monosynaptic with rapidly conducting fibres.","\u003cb>Localized\u003c/b>: no irradiation to other spinal segments, because there are no interneurons.","\u003cb>No after-discharge\u003c/b>: no interneurons, so the response ends as soon as stimulation stops.","\u003cb>No fatigue\u003c/b>: motor neurons discharge at a \u003cb>low frequency\u003c/b> and \u003cb>alternate\u003c/b> their activity.","\u003cb>Reciprocal innervation\u003c/b>: the same afferent excites an \u003cb>inhibitory interneuron\u003c/b>, so the antagonist relaxes at the same time.","\u003cb>Muscle tone\u003c/b> = continuous reflex \u003cb>sub-tetanic\u003c/b> contraction of skeletal muscles during rest.","Muscles are \u003cb>shorter than the distance between origin and insertion\u003c/b>, so they are continuously stretched, which activates the \u003cb>static stretch reflex\u003c/b>.","Tone is in all skeletal muscles but is more marked in \u003cb>antigravity muscles\u003c/b>, which gravity stretches more."],"lists":[{"h":"Antigravity muscles","ordered":false,"items":["Flexors of the upper limbs","Extensors of the lower limbs","Extensors of the back and back of the neck","Elevators of the lower jaw","Anterior abdominal wall muscles"]},{"h":"Functions of muscle tone","ordered":false,"items":["Maintains the erect posture against gravity","Helps venous return and lymph flow from the lower body","Helps heat production (tone increases in cold weather)","Abdominal muscle tone keeps the viscera in position"]}],"hook":"One synapse makes the stretch reflex Fast (short reflex time), Focal (localized) and Finished on time (no after-discharge); alternating firing keeps it Fresh (no fatigue).","traps":["No irradiation and no after-discharge are due to \u003cb>absent interneurons\u003c/b>; no fatigue is due to \u003cb>low-frequency, alternating\u003c/b> motor neuron firing.","Antigravity muscles are the \u003cb>flexors\u003c/b> of the upper limbs but the \u003cb>extensors\u003c/b> of the lower limbs.","Tone comes from the \u003cb>static\u003c/b> stretch reflex; tendon jerks come from the \u003cb>dynamic\u003c/b> one."]},{"id":"t36","lec":24,"name":"Motor output: UMNs & LMNs","big":"Descending tracts carry motor signals from the brain to lower motor neurones, which directly innervate muscle. Every neurone of the descending system is an upper motor neurone; the tracts split into pyramidal (from the cortex) and extrapyramidal (from the brainstem).","pts":["\u003cb>Voluntary\u003c/b> movement is mostly directed at \u003cb>distal\u003c/b> muscle groups (e.g. complex hand movements).","\u003cb>Involuntary\u003c/b> movement mainly uses \u003cb>proximal and truncal\u003c/b> muscles and is critical for postural stability.","\u003cb>Descending tracts\u003c/b> carry motor signals from the brain to \u003cb>lower motor neurones\u003c/b>, which then directly innervate muscles.","\u003cb>Pyramidal tracts\u003c/b> originate in the \u003cb>cerebral cortex\u003c/b> and carry motor fibres to the spinal cord and brainstem: voluntary control of body and face muscles.","\u003cb>Extrapyramidal tracts\u003c/b> originate in the \u003cb>brainstem\u003c/b> and carry motor fibres to the spinal cord: involuntary, automatic control of \u003cb>muscle tone, balance, posture and locomotion\u003c/b>.","At the end of each descending tract the neurone synapses with a lower motor neurone, so \u003cb>all neurones within the descending motor system are upper motor neurones\u003c/b>.","UMN cell bodies lie in the \u003cb>cerebral cortex or brainstem\u003c/b>, and their axons \u003cb>remain within the CNS\u003c/b>."],"table":{"head":["","Pyramidal tracts","Extrapyramidal tracts"],"rows":[["Origin","Cerebral cortex","Brainstem"],["Fibres go to","Spinal cord and brainstem","Spinal cord"],["Control","Voluntary control of body and face muscles","Involuntary, automatic: tone, balance, posture, locomotion"]]},"lists":[{"h":"Fig 1: the motor chain","ordered":true,"items":["Motor cortex of the brain","Upper motor neurone","Lower motor neurone","Muscle"]}],"hook":"Pyramidal = Purposeful (voluntary, from the cortex). Extrapyramidal = Extra, automatic (from the brainstem: tone, balance, posture, locomotion).","traps":["Voluntary movement favours \u003cb>distal\u003c/b> muscles; involuntary movement favours \u003cb>proximal and truncal\u003c/b> muscles.","UMN axons stay inside the CNS; only the LMN reaches the muscle.","Extrapyramidal neurones are upper motor neurones too: the term covers \u003cb>every\u003c/b> neurone of the descending system."]},{"id":"t37","lec":24,"name":"Pyramidal tracts","big":"Pyramidal tracts, named after the medullary pyramids, give voluntary control: corticospinal tracts to the body and corticobulbar tracts to the head and neck. In the caudal medulla the corticospinal tract splits into a crossed lateral tract and an uncrossed anterior tract.","pts":["Named after the \u003cb>medullary pyramids\u003c/b> of the medulla oblongata, which they pass through.","\u003cb>Corticospinal\u003c/b> tracts supply the musculature of the \u003cb>body\u003c/b>; \u003cb>corticobulbar\u003c/b> tracts supply the \u003cb>head and neck\u003c/b>.","Corticospinal inputs: \u003cb>primary motor cortex, premotor cortex, supplementary motor area\u003c/b>, plus fibres from the \u003cb>somatosensory area\u003c/b> that help regulate the ascending tracts.","Path: cortex → \u003cb>internal capsule\u003c/b> → crus cerebri (midbrain) → pons → medulla → spinal cord.","The \u003cb>internal capsule\u003c/b> is white matter between the thalamus and the basal ganglia. It is very susceptible to compression by \u003cb>haemorrhagic bleeds\u003c/b> and vulnerable to \u003cb>stroke\u003c/b>, which can lesion the descending tracts.","In the \u003cb>most inferior (caudal) part of the medulla\u003c/b> the tract divides into two.","\u003cb>Lateral corticospinal tract\u003c/b>: decussates, descends and ends in the ventral horn at all segmental levels; supplies \u003cb>distal\u003c/b> muscles for \u003cb>precise skilled movements\u003c/b>.","\u003cb>Anterior corticospinal tract\u003c/b>: stays ipsilateral, then most fibres decussate to LMNs for \u003cb>trunk and proximal\u003c/b> muscles (often bilateral); it makes \u003cb>ipsilateral postural adjustments\u003c/b> when the contralateral limb moves voluntarily.","\u003cb>Corticobulbar\u003c/b> tracts arise from the \u003cb>lateral aspect of the primary motor cortex\u003c/b>, get the same inputs, pass through the internal capsule and end on the \u003cb>motor nuclei of cranial nerves\u003c/b>.","Most corticobulbar innervation is \u003cb>bilateral\u003c/b>, so one hemisphere can still give some function. Exceptions (mostly unilateral): \u003cb>lower face\u003c/b> (lower half of facial nucleus) and the \u003cb>hypoglossal nucleus\u003c/b>."],"table":{"head":["","Lateral corticospinal","Anterior corticospinal"],"rows":[["Crossing","Decussates in the caudal medulla","Stays ipsilateral; most fibres cross later in the cord"],["Ends on","Ventral horn LMNs at all segmental levels","LMNs for trunk and proximal muscles (often bilateral)"],["Function","Distal muscles: precise skilled movements","Ipsilateral postural adjustments during contralateral limb movement"]]},"hook":"Lateral = Limbs' fine skills (distal, crossed). Anterior = Axial (trunk and proximal), uncrossed at first.","traps":["The corticospinal tract divides in the \u003cb>caudal medulla\u003c/b>, not in the pons
