group."],["α carbon","All have an α carbon."]],"x":"Every amino acid has a carboxyl group and an amino group on the same α carbon; only the side chain (R group) differs."},{"id":"t8d","t":"t8","type":"type","q":"Amino acids are joined together by ___ (amide) links.","a":["peptide","peptide bonds","peptide links"],"x":"Peptide (amide) links (–CO–NH–) join amino acids into dipeptides, tripeptides, polypeptides and proteins."},{"id":"t8e","t":"t8","type":"mcq","q":"In every amino acid, the amino group and the carboxyl group are bonded to…","o":[["the same carbon atom (the α carbon)"],["carbons at opposite ends of the molecule","They share one carbon, the α carbon."],["the R group","The R group also hangs off the α carbon; it doesn’t hold the other groups."],["a phosphate group","Phosphate belongs to nucleotides, not amino acids."]],"x":"The carboxyl and amino groups both sit on the α carbon."},{"id":"t8f","t":"t8","type":"mcq","q":"Which amino acid has just a hydrogen atom as its side chain?","o":[["Glycine"],["Alanine","Alanine’s side chain is –CH₃."],["Valine","Valine has a branched side chain."],["Tyrosine","Tyrosine has a ring with an –OH."]],"x":"Glycine is the simplest amino acid: R = H."},{"id":"t8g","t":"t8","type":"mcq","q":"Which contractile proteins permit muscle movement?","o":[["Actin and myosin"],["Hemoglobin and immunoglobulins","Hemoglobin carries oxygen; immunoglobulins fight infection."],["LDL and HDL","These are lipoproteins that carry lipids."],["Receptors and enzymes","Receptors sense stimuli; enzymes catalyze reactions."]],"x":"Actin and myosin filaments are contractile proteins that let muscles move."},{"id":"t8h","t":"t8","type":"mcq","d":1,"q":"Which proteins circulate in the blood to fight bacterial and viral infections?","o":[["Immunoglobulins"],["Hemoglobin","Hemoglobin carries oxygen."],["Receptors","Receptors sit on cells and sense stimuli."],["Lipoproteins","Lipoproteins carry lipids."]],"x":"Immunoglobulins (e.g. IgG) circulate in blood to fight bacterial and viral infections."},{"id":"t8i","t":"t8","type":"tf","q":"Receptors are protein structures that let cells sense and respond to stimuli such as hormones and drugs.","a":true,"x":"Receptors are proteins; your notes show dopamine and opiate receptors."},{"id":"t8j","t":"t8","type":"type","q":"The internal protein network that maintains a cell’s shape is the ___.","a":["cytoskeleton"],"x":"The cytoskeleton (microfilaments, intermediate filaments, microtubules) maintains cell shape."},{"id":"t8k","t":"t8","type":"list","q":"List the functions of proteins from your notes (at least 6 of the 7).","p":[["Cytoskeleton maintains cell shape",["cytoskelet","shape","structur"]],["Actin and myosin allow muscle contraction",["actin","myosin","contract","muscle"]],["Hemoglobin carries oxygen",["hemoglobin","haemoglobin","oxygen"]],["Enzymes catalyze reactions",["enzyme","cataly"]],["Receptors sense and respond to stimuli",["receptor","stimul"]],["Immunoglobulins fight infection",["immunoglobulin","antibod","infection","immun"]],["Proteins express genetic information",["genetic","express"]]],"need":6,"x":"Some Cats Only Eat Raw Imported Goods → Shape, Contraction, Oxygen, Enzymes, Receptors, Immunity, Gene expression."},{"id":"t8l","t":"t8","type":"mcq","q":"The two ends of a polypeptide chain are called…","o":[["the amino-terminal end and the carboxyl-terminal end"],["the 5′ end and the 3′ end","Those are the ends of a DNA or RNA strand."],["the head and the tail","That describes a phospholipid."],["the α end and the β end","α and β describe hemoglobin chains or sugar linkages."]],"x":"A polypeptide runs from the amino-terminal end (H₃N⁺) to the carboxyl-terminal end (COO⁻)."},{"id":"t8m","t":"t8","type":"mcq","q":"According to the figure, hemoglobin is made of…","o":[["two α chains and two β chains, with heme groups containing iron"],["a single long carbohydrate chain","Hemoglobin is a protein."],["phospholipids","Phospholipids build membranes."],["DNA and RNA","Hemoglobin is a protein."]],"x":"The figure shows four polypeptide chains (2 α, 2 β), each with a heme group holding iron."},{"id":"t8n","t":"t8","type":"tf","q":"The presence, absence or deficiency of some proteins is associated with specific disorders or diseases.","a":true,"x":"Example from Lecture 3: Pompe disease comes from deficiency of the enzyme acid alpha-glucosidase."},{"id":"t9a","t":"t9","type":"mcq","q":"Why are nucleic acids called “informational biomolecules”?","o":[["They are required for storing and expressing genetic information"],["They are the main source of energy","Lipids and carbohydrates are the energy sources."],["They carry oxygen","Hemoglobin carries oxygen."],["They form cell membranes","Phospholipids form membranes."]],"x":"Nucleic acids store and express genetic information, so they are the informational biomolecules."},{"id":"t9b","t":"t9","type":"multi","d":1,"q":"Which three components make up every nucleotide?","o":[["A nitrogen-containing base",1],["A pentose sugar",1],["A phosphate group",1],["An amino acid",0,"Amino acids build proteins."],["Glycerol",0,"Glycerol is part of lipids."]],"x":"Nucleotide = nitrogenous base + pentose sugar (deoxyribose or ribose) + phosphate."},{"id":"t9c","t":"t9","type":"multi","d":1,"q":"Which bases are purines?","o":[["Adenine",1],["Guanine",1],["Thymine",0,"Thymine is a pyrimidine."],["Cytosine",0,"Cytosine is a pyrimidine."],["Uracil",0,"Uracil is a pyrimidine."]],"x":"Purines: adenine and guanine (“Pure As Gold”). Pyrimidines: cytosine, uracil, thymine (“CUT the Py”)."},{"id":"t9d","t":"t9","type":"mcq","q":"Which base is found in RNA but not in DNA?","o":[["Uracil"],["Thymine","Thymine is in DNA; RNA uses uracil instead."],["Adenine","Adenine is in both."],["Guanine","Guanine is in both."]],"x":"DNA: A, G, C, T. RNA: A, G, C, U. Uracil replaces thymine."},{"id":"t9e","t":"t9","type":"mcq","q":"The sugar in DNA is…","o":[["deoxyribose"],["ribose","Ribose is the sugar in RNA."],["glucose","Glucose is a hexose, not part of nucleic acids."],["fructose","Fructose is a hexose."]],"x":"DNA has deoxyribose (H at carbon 2′); RNA has ribose (–OH at carbon 2′)."},{"id":"t9f","t":"t9","type":"type","q":"A segment of DNA that holds the information to make a biological product (mainly a protein) is called a ___.","a":["gene"],"x":"A gene is a DNA segment carrying the information for a product, mainly a protein."},{"id":"t9g","t":"t9","type":"multi","q":"Which types of RNA are named in your notes?","o":[["Ribosomal RNA (rRNA)",1],["Messenger RNA (mRNA)",1],["Transfer RNA (tRNA)",1],["Deoxy RNA (dRNA)",0,"There is no such RNA; “deoxy” refers to DNA’s sugar."]],"x":"RNAs: rRNA, mRNA and tRNA. The sequence of every RNA is specified by DNA."},{"id":"t9h","t":"t9","type":"order","q":"Put the cAMP signalling pathway in order.","o":["Signal molecule (first messenger, e.g. epinephrine)","Receptor","G protein (with GTP)","Adenylyl cyclase","cAMP (second messenger, made from ATP)","Protein kinase A"],"x":"First messenger binds the receptor → activates a G protein → activates adenylyl cyclase → converts ATP into cAMP (second messenger) → activates protein kinase A."},{"id":"t9i","t":"t9","type":"type","q":"Which nucleotide acts as a “second messenger” in signal transduction?","a":["cAMP","cyclic amp","cyclic adenosine monophosphate","cyclic adenosine mono phosphate"],"x":"Cyclic AMP (cAMP) is the second messenger; the signal molecule (e.g. epinephrine) is the first messenger."},{"id":"t9j","t":"t9","type":"multi","q":"Nucleotides are components of which coenzymes?","o":[["Coenzyme A",1],["FAD",1],["NAD⁺",1],["Hemoglobin",0,"Hemoglobin is a protein, not a coenzyme."]],"x":"Nucleotides are parts of the essential coenzymes coenzyme A, FAD and NAD⁺."},{"id":"t9k","t":"t9","type":"mcq","q":"What are the main donors and acceptors of phosphate groups in energy transduction?","o":[["ATP and ADP"],["cAMP and GTP","cAMP is a second messenger."],["NAD⁺ and FAD","These are coenzymes."],["DNA and RNA","These are nucleic acids."]],"x":"ATP (adenosine triphosphate) and ADP (adenosine diphosphate) donate and accept phosphate groups in metabolism’s energy flow."},{"id":"t9l","t":"t9","type":"list","q":"Besides building nucleic acids, list the other functions of nucleotides (all 4).","p":[["Carriers of intermediates in the synthesis of some carbohydrates",["carrier","intermediate","carbohydrate"]],["Components of coenzymes (coenzyme A, FAD, NAD⁺)",["coenzyme","co enzyme","fad","nad"]],["cAMP acts as a second messenger",["camp","cyclic","second messenger","signal"]],["ATP and ADP donate and accept phosphate in energy transduction",["atp","adp","phosphate","energy"]]],"need":4,"x":"Carriers, coenzymes, cAMP signalling, ATP/ADP energy currency."},{"id":"t9m","t":"t9","type":"tf","q":"The nucleotide sequence of every RNA is specified by a nucleotide sequence in DNA.","a":true,"x":"DNA is the template for every RNA (rRNA, mRNA, tRNA)."},{"id":"t9n","t":"t9","type":"mcq","q":"Which bases are pyrimidines?","o":[["Thymine, uracil and cytosine"],["Adenine and guanine","These are purines."],["Adenine and thymine","Adenine is a purine."],["Guanine and cytosine","Guanine is a purine."]],"x":"Pyrimidines: thymine, uracil, cytosine. Purines: adenine, guanine."},{"id":"t9o","t":"t9","type":"mcq","q":"In the DNA double strand shown in your notes, adenine pairs with…","o":[["thymine"],["guanine","Guanine pairs with cytosine."],["cytosine","Cytosine pairs with guanine."],["uracil","Uracil is only in RNA."]],"x":"In DNA, A pairs with T and G pairs with C."},{"id":"t9p","t":"t9","type":"mcq","q":"According to the diagram, where is DNA copied into mRNA, and where is mRNA translated?","o":[["Copied in the nucleus; translated by ribosomes in the cytoplasm"],["Copied in the cytoplasm; translated in the nucleus","Backwards."],["Both happen in the mitochondria","Not in this diagram."],["Both happen in the Golgi complex","The Golgi processes proteins; it doesn’t copy DNA."]],"x":"mRNA copies a gene in the nucleus, moves to the cytoplasm, and a ribosome translates it while tRNA brings amino acids."},{"id":"t10a","t":"t10","type":"list","q":"Name the four domains of a mitochondrion.","p":[["Outer membrane",["outer"]],["Inner membrane",["inner"]],["Intermembrane space",["intermembrane","inter membrane"]],["Matrix",["matrix"]]],"need":4,"x":"The double membrane creates 4 domains: outer membrane, intermembrane space, inner membrane, matrix. Each has its own functions."},{"id":"t10b","t":"t10","type":"order","d":1,"q":"Order the mitochondrial domains from the outside in.","o":["Outer membrane","Intermembrane space","Inner membrane","Matrix"],"x":"Outside → in: outer membrane, intermembrane space, inner membrane (folded into cristae), matrix (with DNA and ribosomes)."},{"id":"t10c","t":"t10","type":"mcq","q":"Mitochondria range in length from…","o":[["1 to 4 µm"],["10 to 40 µm","Too large."],["0.1 to 0.4 µm","Too small."],["1 to 4 mm","Millimetres would be visible to the naked eye."]],"x":"Mitochondria are bean-shaped, 1–4 µm long."},{"id":"t10d","t":"t10","type":"mcq","q":"What share of an average mammalian liver cell’s volume do mitochondria occupy?","o":[["15–20%"],["1–4%","1–4 is their length in µm."],["40–50%","Too high."],["Over 75%","Too high."]],"x":"Mitochondria take up 15–20% of an average mammalian liver cell’s volume."},{"id":"t10e","t":"t10","type":"type","q":"Mitochondria contain more than how many different proteins?","a":["1000","one thousand","a thousand","thousand"],"x":"Mitochondria contain more than 1000 different proteins."},{"id":"t10f","t":"t10","type":"mcq","q":"In sperm cells, where are the mitochondria located?","o":[["In the midpiece, just behind the nucleus"],["Inside the nucleus","Mitochondria are outside the nucleus."],["At the tip of the head","They sit in the midpiece."],["Spread evenly along the whole tail","They are packed in the midpiece."]],"x":"Sperm mitochondria sit in the midpiece just behind the nucleus; their ATP powers the sperm’s movement."},{"id":"t10g","t":"t10","type":"multi","d":1,"q":"Besides making ATP, which activities involve mitochondria?","o":[["Synthesis of certain amino acids and heme",1],["Uptake and release of calcium ions",1],["Regulation of cell death",1],["Synthesis of steroid hormones",0,"That is the smooth ER (ovaries, testes, adrenal)."],["Hydrolysis of macromolecules",0,"That is the lysosome."]],"x":"Mitochondria also make some amino acids and heme, handle calcium, and regulate cell death."},{"id":"t10h","t":"t10","type":"mcq","q":"When cytosolic calcium rises to abnormally high levels, what takes up some of the excess?","o":[["A calcium transporter in the inner mitochondrial membrane"],["A transporter in the outer mitochondrial membrane","Your notes specify the INNER membrane."],["The Golgi complex","Not in your notes for calcium."],["Lysosomes","Lysosomes digest; they aren’t the calcium example."]],"x":"Mitochondria, together with the ER, regulate cytosolic calcium; a transporter in the inner mitochondrial membrane takes up excess calcium."},{"id":"t10i","t":"t10","type":"tf","q":"Mitochondria have their own genetic material and the machinery to make their own RNAs and proteins.","a":true,"x":"Mitochondria have their own DNA. Mutations in genes for mitochondrial components cause several inherited diseases."},{"id":"t10j","t":"t10","type":"mcq","q":"In the energy diagram, where does glycolysis take place?","o":[["In the cytosol"],["In the mitochondrial matrix","The TCA cycle is in the mitochondrion; glycolysis is outside, in the cytosol."],["On the inner mitochondrial membrane","That is where the electron transport chain is."],["In the nucleus","Not in the diagram."]],"x":"Glycolysis (glucose → pyruvate) happens in the cytosol. Pyruvate then enters the mitochondrion if oxygen is present."},{"id":"t10k","t":"t10","type":"mcq","q":"When oxygen is absent, pyruvate goes through fermentation to form…","o":[["lactate"],["acetyl CoA","Acetyl CoA forms in the mitochondrion when oxygen IS present."],["carbon dioxide and water","These are end products of the aerobic route."],["glucose","Glucose is the starting point."]],"x":"No oxygen → fermentation in the cytosol: pyruvate → lactate, regenerating NAD⁺."},{"id":"t10l","t":"t10","type":"order","q":"Put the aerobic (oxygen present) energy pathway in order.","o":["Glucose","Pyruvate (from glycolysis)","Acetyl CoA","TCA cycle","Electron transport chain","ATP, plus CO₂ and water"],"x":"Glucose → glycolysis makes pyruvate (cytosol) → acetyl CoA → TCA cycle (NADH, FADH₂) → electron transport chain → ATP, with CO₂ and water as end products."},{"id":"t10m","t":"t10","type":"mcq","q":"In the mitochondrion diagram, where are the ATP synthase particles?","o":[["On the inner membrane (the cristae)"],["On the outer membrane","The outer membrane is smooth in the diagram."],["Free in the cytosol","They are part of the mitochondrion."],["Inside the mitochondrial DNA","DNA is in the matrix; ATP synthase sits on the cristae."]],"x":"ATP synthase particles stud the cristae, the folds of the inner membrane."},{"id":"t10n","t":"t10","type":"type","q":"The folds of the inner mitochondrial membrane are called ___.","a":["cristae","crista"],"x":"Cristae are folds of the inner membrane; they carry the ATP synthase particles."},{"id":"t10o","t":"t10","type":"mcq","q":"Mitochondria are best known for…","o":[["making the ATP that runs most of the cell’s energy-requiring activities"],["digesting old organelles","That is lysosomes (autophagy)."],["sorting proteins to their destinations","That is the Golgi complex."],["making proteins for export","That is the rough ER."]],"x":"Energy metabolism (ATP production) is the main focus in the study of mitochondria."},{"id":"t11a","t":"t11","type":"mcq","d":1,"q":"Lysosomes are described as the animal cell’s…","o":[["digestive organelles"],["energy organelles","Mitochondria make ATP."],["protein factories","The rough ER makes proteins."],["distribution point","The Golgi complex is the distribution point."]],"x":"Lysosomes are the animal cell’s digestive organelles."},{"id":"t11b","t":"t11","type":"type","q":"A typical lysosome contains at least how many different hydrolytic enzymes?","a":["50","fifty"],"x":"A typical lysosome holds at least 50 different hydrolytic enzymes."},{"id":"t11c","t":"t11","type":"mcq","d":1,"q":"Where are lysosomal hydrolytic enzymes produced?","o":[["In the rough endoplasmic reticulum"],["In the smooth ER","The smooth ER makes steroids, detoxifies and stores calcium, not these enzymes."],["Inside the lysosome itself","Your notes say they are produced in the rough ER."],["In the mitochondria","Mitochondria make ATP, some amino acids and heme."]],"x":"Lysosomal enzymes are proteins, so they are made in the ribosome-covered rough ER."},{"id":"t11d","t":"t11","type":"type","q":"The regulated destruction of a cell’s own organelles and their replacement is called ___.","a":["autophagy","organelle turnover"],"x":"Autophagy (“self-eating”) = organelle turnover. It helps prevent certain cancers and slows body aging.","h":"“Auto” means self."},{"id":"t11e","t":"t11","type":"mcq","q":"Ingested bacteria are first inactivated in the lysosome by…","o":[["its low pH"],["high temperature","Not in your notes. The low pH inactivates them."],["calcium ions","Calcium is stored by the smooth ER and mitochondria."],["oxygen","Not in your notes."]],"x":"Bacteria are generally inactivated by the lysosome’s low pH, then digested by its enzymes."},{"id":"t11f","t":"t11","type":"multi","q":"Which phagocytic cells are named in your notes?","o":[["Macrophages",1],["Neutrophils",1],["Kupffer cells",1],["Red blood cells",0,"Aging red blood cells are what Kupffer cells engulf."],["Sperm cells",0,"Sperm are the mitochondria example."]],"x":"Macrophages and neutrophils act as scavengers; Kupffer cells in the liver engulf aging red blood cells."},{"id":"t11g","t":"t11","type":"mcq","q":"A Kupffer cell is…","o":[["a phagocytic cell in the liver that engulfs aging red blood cells"],["a muscle cell with abnormal mitochondria","That is the mitochondrial biopsy figure."],["a nerve cell stained by Golgi","Golgi stained nerve cells to find the Golgi complex."],["a steroid-making cell in the adrenal gland","Steroid synthesis happens in the smooth ER."]],"x":"The lysosome micrograph shows a Kupffer cell, a liver phagocyte with lysosomes of variable sizes."},{"id":"t11h","t":"t11","type":"multi","q":"Autophagy plays an important role in…","o":[["Preventing certain types of cancer",1],["Slowing body aging",1],["Making steroid hormones",0,"That is the smooth ER."],["Producing ATP",0,"That is the mitochondria."]],"x":"Autophagy helps prevent certain cancers and slows body aging."},{"id":"t11i","t":"t11","type":"tf","q":"Lysosomal enzymes can hydrolyze practically every type of biological macromolecule.","a":true,"x":"With 50+ hydrolytic enzymes, lysosomes can break down practically any macromolecule."},{"id":"t11j","t":"t11","type":"mcq","q":"What is the difference between phagocytosis and autophagy?","o":[["Phagocytosis ingests outside material (debris, microbes); autophagy destroys the cell’s own organelles"],["They are two names for the same process","One takes in outside material; the other recycles the cell’s own parts."],["Phagocytosis happens only in prokaryotes","Phagocytosis is a eukaryotic feature."],["Autophagy ingests bacteria; phagocytosis recycles organelles","Backwards."]],"x":"Phago- = eat (outside things). Auto-phagy = self-eating (own organelles). Both rely on lysosomes."},{"id":"t12a","t":"t12","type":"mcq","d":1,"q":"What is the basic difference between rough and smooth ER?","o":[["The rough ER is covered by ribosomes"],["The smooth ER is covered by ribosomes","Backwards."],["The rough ER has a double membrane","The ER lumen is separated from the cytosol by a single membrane."],["The smooth ER is not connected to the nucleus","The ER is one continuous network, continuous with the outer nuclear membrane."]],"x":"Ribosomes on its surface give the rough ER its rough look in the electron microscope."},{"id":"t12b","t":"t12","type":"mcq","q":"The membrane of the endoplasmic reticulum is continuous with…","o":[["the outer nuclear membrane"],["the inner mitochondrial membrane","Mitochondria are separate organelles."],["the lysosome membrane","Not in your notes."],["the inner nuclear membrane","Your notes say the OUTER nuclear membrane."]],"x":"The ER membrane is continuous with the outer nuclear membrane."},{"id":"t12c","t":"t12","type":"multi","d":1,"q":"Which are functions of the SMOOTH ER?","o":[["Making steroid hormones (ovaries, testes, adrenal gland)",1],["Detoxication of drugs and foreign chemicals (liver)",1],["Storage and sudden release of calcium ions",1],["Making proteins for export",0,"That is the rough ER."],["Digesting bacteria",0,"That is lysosomes."]],"x":"Smooth ER: steroids (ovaries, testes, adrenal), detoxication (liver), and most commonly calcium storage and sudden release."},{"id":"t12d","t":"t12","type":"mcq","q":"What is the most common role of the smooth ER?","o":[["Storage and sudden release of calcium ions"],["Steroid hormone synthesis","Only in the ovaries, testes and adrenal gland."],["Detoxication of drugs","Only in the liver."],["Making membrane proteins","That is the rough ER."]],"x":"Its function varies by tissue, but the most common role is storing calcium and releasing it suddenly."},{"id":"t12e","t":"t12","type":"mcq","q":"In the liver, the smooth ER is the site of…","o":[["detoxication of foreign chemicals, including drugs"],["steroid hormone synthesis","That is in the ovaries, testes and adrenal gland."],["glycogen breakdown","That is the lysosomal enzyme in Pompe disease."],["ATP production","That is the mitochondria."]],"x":"Liver smooth ER detoxifies foreign chemicals, including drugs."},{"id":"t12f","t":"t12","type":"multi","q":"Which proteins are made in the ROUGH ER, according to your notes?","o":[["Integral membrane proteins of the plasma membrane",1],["Proteins exported to the extracellular medium",1],["Lysosomal hydrolytic enzymes",1],["Steroid hormones",0,"Steroids are lipids, made in the smooth ER."]],"x":"Rough ER makes membrane proteins, export proteins and lysosomal enzymes, which then go to the Golgi for processing."},{"id":"t12g","t":"t12","type":"type","q":"The ER lumen is separated from the cytosol by how many membranes?","a":["1","one","single","a single membrane","one membrane","single membrane","a single one"],"x":"A single membrane separates the ER lumen from the cytosol. Mitochondria, by contrast, have a double membrane."},{"id":"t12h","t":"t12","type":"mcq","q":"In which organs does the smooth ER make steroid hormones?","o":[["Ovaries, testes and adrenal gland"],["Liver, kidney and brain","Liver smooth ER detoxifies; kidney and brain aren’t the examples."],["Pancreas and spleen","Not in your notes."],["Heart and lungs","Not in your notes."]],"x":"Steroid hormones are made by the smooth ER of the ovaries, testes and adrenal gland."},{"id":"t12i","t":"t12","type":"tf","q":"The rough ER looks rough in the electron microscope because mitochondria are attached to it.","a":false,"fix":"Ribosomes cover the rough ER.","x":"Ribosomes, not mitochondria, give the rough ER its rough appearance."},{"id":"t12j","t":"t12","type":"multi","q":"Which two organelles together regulate the calcium concentration of the cytosol?","o":[["Mitochondria",1],["Endoplasmic reticulum",1],["Golgi complex",0,"Not the calcium example."],["Lysosomes",0,"Lysosomes digest."]],"x":"Mitochondria together with the ER regulate cytosolic calcium."},{"id":"t12k","t":"t12","type":"list","q":"State what the smooth ER does in (a) the ovaries, testes and adrenal gland, (b) the liver, and (c) most cells.","p":[["(a) Makes steroid hormones",["steroid"]],["(b) Detoxication of foreign chemicals and drugs",["detox","drug","foreign","toxin"]],["(c) Stores calcium and releases it suddenly",["calcium","ca2"]]],"need":3,"x":"Steroids · detox · calcium."},{"id":"t12l","t":"t12","type":"mcq","q":"The endoplasmic reticulum is best described as…","o":[["a network of membrane-enclosed channels running throughout the cell"],["a stack of flattened sacs that sorts proteins","That describes the Golgi complex."],["a bean-shaped organelle with a double membrane","That describes a mitochondrion."],["a digestive organelle with 50+ enzymes","That describes a lysosome."]],"x":"The ER is a continuous network of membrane-enclosed channels whose lumen is separated from the cytosol by a single membrane."},{"id":"t13a","t":"t13","type":"mcq","d":1,"q":"In what year did Camillo Golgi discover the Golgi complex?","o":[["1898"],["1906","1906 is when he received the Nobel Prize."],["1665","1665 is Hooke’s cork cells."],["1962","1962 is the first mitochondrial-disorder case."]],"x":"Golgi discovered the network in 1898; it helped earn him the Nobel Prize in 1906."},{"id":"t13b","t":"t13","type":"type","q":"In what year did Golgi receive the Nobel Prize?","a":["1906"],"x":"1898 discovery → 1906 Nobel Prize."},{"id":"t13c","t":"t13","type":"mcq","q":"How did Golgi find the Golgi complex?","o":[["He applied a metallic stain to nerve cells"],["He looked at cork through a microscope","That was Hooke and the discovery of cells."],["He used an electron microscope on liver cells","Not in your notes."],["He studied a muscle biopsy","That is the mitochondrial-disorder figure."]],"x":"Golgi, while inventing new staining methods, applied a metallic stain to nerve cells and saw a darkly stained network near the nucleus."},{"id":"t13d","t":"t13","type":"mcq","d":1,"q":"Which statement best describes the Golgi apparatus?","o":[["A stack of flattened sacs; the cell’s distribution point for processing and directing proteins"],["A network of channels continuous with the nuclear membrane","That is the ER."],["A bean-shaped organelle with its own DNA","That is the mitochondrion."],["The digestive organelle of animal cells","That is the lysosome."]],"x":"Proteins made in the rough ER are further processed in the Golgi and directed to their final destination."},{"id":"t13e","t":"t13","type":"order","q":"Trace the route of a protein the cell will export.","o":["Made on ribosomes of the rough ER","Further processed in the Golgi complex","Directed to its final destination (e.g. outside the cell)"],"x":"Rough ER (makes) → Golgi (processes and directs) → destination."},{"id":"t13f","t":"t13","type":"mcq","q":"What nationality was Camillo Golgi?","o":[["Italian"],["English","Robert Hooke was English."],["German","Not in your notes."],["French","Not in your notes."]],"x":"Camillo Golgi was an Italian biologist."},{"id":"t13g","t":"t13","type":"tf","q":"Golgi first saw the Golgi complex as a darkly stained reticular network located near the cell nucleus.","a":true,"x":"It was later found in other cell types and named the Golgi complex."},{"id":"t14a","t":"t14","type":"mcq","d":1,"q":"In the 1962 case, what was abnormal about the patient’s mitochondria?","o":[["They kept oxidizing substrates at a high rate even without ADP, producing heat instead of work"],["They stopped making ATP entirely, so she felt cold","The opposite: they kept working nonstop and made heat."],["They released all their calcium","Not in this case."],["They had no DNA","Not in this case."]],"x":"Normally mitochondria stop when ADP is low. Hers kept oxidizing substrates with no ADP, so energy came out as heat, explaining her elevated temperature."},{"id":"t14b","t":"t14","type":"multi","q":"What symptoms did the 1962 patient have?","o":[["Long-standing fatigue",1],["Muscle weakness",1],["Elevated body temperature",1],["Very low body temperature",0,"Her temperature was elevated; the mitochondria made heat."]],"x":"Fatigue, muscle weakness and an elevated body temperature."},{"id":"t14c","t":"t14","type":"mcq","q":"Normally, when ADP levels are low, mitochondria…","o":[["stop converting ADP to ATP"],["speed up ATP production","There’s little ADP to convert."],["switch to fermentation","Fermentation happens when oxygen is absent; low ADP doesn’t trigger it."],["release calcium","Not the point here."]],"x":"Low ADP → nothing to convert → mitochondria stop. In the 1962 patient they didn’t stop."},{"id":"t14d","t":"t14","type":"mcq","q":"The red-staining “blotches” in the muscle biopsy are caused by…","o":[["abnormal proliferation of mitochondria"],["glycogen building up in lysosomes","That is Pompe disease."],["ruptured lysosomes","Not in your notes."],["excess calcium","Not in your notes."]],"x":"Degenerating muscle fibers show red blotches just below the plasma membrane from abnormal proliferation of mitochondria."},{"id":"t14e","t":"t14","type":"mcq","q":"Most disorders of mitochondrial dysfunction are characterized by…","o":[["degeneration of muscle or brain tissue, sometimes causing death in infancy"],["damage to the liver only","Not in your notes."],["bone fractures","Not in your notes."],["high blood sugar","That relates to diabetes."]],"x":"Most involve degeneration of muscle/brain tissue and can lead to death during infancy."},{"id":"t14f","t":"t14","type":"type","d":1,"q":"Pompe disease is caused by mutations in the gene for which enzyme?","a":["acid alpha-glucosidase","alpha-glucosidase","lysosomal acid alpha-glucosidase","acid α-glucosidase","α-glucosidase","lysosomal acid α-glucosidase","acid a-glucosidase","acid alpha glucosidase","alpha glucosidase"],"x":"Acid alpha-glucosidase (lysosomal acid α-glucosidase) hydrolyzes glycogen in the lysosome.","h":"It breaks down glycogen; its name ends in “-glucosidase”."},{"id":"t14g","t":"t14","type":"mcq","q":"Pompe disease is a disorder of which organelle’s function?","o":[["Lysosome"],["Mitochondrion","The mitochondrial example is the 1962 case."],["Golgi complex","Not in your notes."],["Smooth ER","Not in your notes."]],"x":"Pompe disease is a lysosomal storage disorder: a missing hydrolytic enzyme lets glycogen pile up in lysosomes."},{"id":"t14h","t":"t14","type":"mcq","q":"In Pompe disease, which substance accumulates?","o":[["Glycogen"],["Calcium","Not in Pompe disease."],["Lactate","Lactate is the product of fermentation."],["Cholesterol","Not in Pompe disease."]],"x":"Without acid alpha-glucosidase, glycogen builds up in lysosomes."},{"id":"t14i","t":"t14","type":"multi","q":"Which tissues does Pompe disease damage most seriously?","o":[["Heart",1],["Skeletal muscles",1],["Liver",0,"Your notes name the heart and skeletal muscles."],["Brain",0,"Your notes name the heart and skeletal muscles."]],"x":"Glycogen accumulation damages the skeletal muscles and heart most seriously, causing progressive weakness."},{"id":"t14j","t":"t14","type":"type","q":"Name the approved enzyme replacement therapy drug for Pompe disease.","a":["alglucosidase alfa","alglucosidase alpha","myozyme","alglucosidase"],"x":"Alglucosidase alfa (sold as Myozyme) is the approved enzyme replacement therapy (ERT)."},{"id":"t14k","t":"t14","type":"tf","q":"In the lysosome, acid alpha-glucosidase normally breaks glycogen down (to glucose 1-phosphate, in your notes’ diagram).","a":true,"x":"Your notes’ diagram: glycogen → glucose 1-phosphate by lysosomal acid α-glucosidase."},{"id":"t14l","t":"t14","type":"mcq","q":"What does ERT stand for?","o":[["Enzyme Replacement Therapy"],["Electron Transport Reaction","The electron transport chain is from the mitochondria diagram."],["Endoplasmic Reticulum Transport","Not a term in your notes."],["Energy Release Treatment","Not a term in your notes."]],"x":"ERT = Enzyme Replacement Therapy, e.g. alglucosidase alfa for Pompe disease."},{"id":"t14m","t":"t14","type":"mcq","q":"Lysosomal storage disorders happen because…","o":[["materials accumulate in lysosomes when their hydrolytic enzymes are absent"],["lysosomes make too many enzymes","The problem is a missing enzyme."],["lysosomes fuse with mitochondria","Not in your notes."],["the lysosome’s pH is too low","Low pH is normal for lysosomes."]],"x":"When a hydrolytic enzyme is missing, its substrate builds up inside lysosomes."},{"id":"t14n","t":"t14","type":"mcq","q":"Why did the 1962 patient have an elevated body temperature?","o":[["Her mitochondria released the energy from oxidation as heat rather than mechanical work"],["Her hypothalamus was damaged","Not in your notes."],["Her lysosomes were missing an enzyme","That describes Pompe disease."],["She had an infection","Not in your notes."]],"x":"Uncontrolled oxidation without ADP released energy as heat instead of work."},{"id":"t1t1","t":"t1","type":"tf","q":"Bacteria, yeast and amoebae exist as single cells.","a":true,"x":"These microorganisms are single cells; an adult human is made of about 30 trillion."},{"id":"t1t2","t":"t1","type":"tf","q":"An adult human is made up of about 30 billion cells.","a":false,"fix":"It is about 30 trillion cells (1 trillion = 10¹²).","x":"A billion is 10⁹; your notes say trillion, 10¹²."},{"id":"t1t3","t":"t1","type":"tf","q":"Robert Hooke was an English microscopist.","a":true,"x":"Hooke (1635–1703) was English and became curator of the Royal Society of London."},{"id":"t1t4","t":"t1","type":"tf","q":"Hooke named cells after the honeycomb cells made by bees.","a":false,"fix":"He named them after the small rooms (cells) that monks lived in at a monastery.","x":"The cork looked porous like a honeycomb, but the name came from monks’ cells."},{"id":"t1t5","t":"t1","type":"tf","q":"Hooke became curator of the Royal Society of London at the age of 27.","a":true,"x":"At 27 he became curator of England’s foremost scientific academy."},{"id":"t1t6","t":"t1","type":"tf","q":"Because of their small size, cells can only be observed with the aid of a microscope.","a":true,"x":"A microscope gives a magnified image of a tiny object."},{"id":"t2t1","t":"t2","type":"tf","q":"A tissue is formed when two or more organs work together.","a":false,"fix":"A tissue is a community of similar cells. Organs working together form an organ system.","x":"Cells → tissues → organs → organ systems."},{"id":"t2t2","t":"t2","type":"tf","q":"An organ is formed when two or more different tissues combine.","a":true,"x":"Example: the bladder, made of smooth muscle and skeletal muscle."},{"id":"t2t3","t":"t2","type":"tf","q":"The kidney, ureter, bladder and urethra together form the urinary tract system.","a":true,"x":"That is the organ-system example in your notes."},{"id":"t2t4","t":"t2","type":"tf","q":"Organelles are a more complex level of organization than cells.","a":false,"fix":"Organelles come before cells: atoms → molecules → organelles → cells.","x":"Organelles are parts of a cell, so they are simpler than the cell."},{"id":"t2t5","t":"t2","type":"tf","q":"At the chemical level, atoms bond to form molecules with three-dimensional structures.","a":true,"x":"Example: hydrogen and oxygen atoms forming a water molecule."},{"id":"t3t1","t":"t3","type":"tf","q":"Body temperature is regulated by an area of the brain called the hypothalamus.","a":true,"x":"The hypothalamus works like a thermostat in a room."},{"id":"t3t2","t":"t3","type":"tf","q":"The average human body temperature is 38 °C.","a":false,"fix":"The average is 37 °C.","x":"In humans, 37 °C is the average body temperature."},{"id":"t3t3","t":"t3","type":"tf","q":"Baroreceptors are pressure-sensitive areas in blood vessels.","a":true,"x":"They help maintain homeostasis of blood pressure."},{"id":"t3t4","t":"t3","type":"tf","q":"It is the disruption of homeostasis that causes disease.","a":true,"x":"Homeostasis is the balance the body needs; losing it causes disease."},{"id":"t3t5","t":"t3","type":"tf","q":"Hormones and disease cannot affect body temperature.","a":false,"fix":"Exposure, metabolic rate, hormones and disease can all affect body temperature.","x":"Your notes list these four factors."},{"id":"t3t6","t":"t3","type":"tf","q":"Body temperature feedback adjusts blood sugar level, breathing rate and metabolic rate.","a":true,"x":"These adjustments try to bring the body back to 37 °C."},{"id":"t4t1","t":"t4","type":"tf","q":"Isolated parts of a cell can be cultured in a lab, where they grow and reproduce.","a":false,"fix":"Isolated cell parts simply deteriorate; it is whole cells that can be cultured.","x":"That contrast is why “life” is the most basic property of cells."},{"id":"t4t2","t":"t4","type":"tf","q":"Cells can die by their own hand through an internal program.","a":true,"x":"The program removes cells that are no longer needed or that risk becoming cancerous."},{"id":"t4t3","t":"t4","type":"tf","q":"DNA duplication makes less than one mistake every ten million nucleotides.","a":true,"x":"And most of those mistakes are quickly corrected by a repair mechanism."},{"id":"t4t4","t":"t4","type":"tf","q":"When a cell divides, the contents of the mother cell are distributed into four daughter cells.","a":false,"fix":"They are distributed into two daughter cells.","x":"Cells reproduce by division into two daughter cells."},{"id":"t4t5","t":"t4","type":"tf","q":"The sum total of the chemical reactions in a cell is the cell’s metabolism.","a":true,"x":"All of these reactions require enzymes."},{"id":"t4t6","t":"t4","type":"tf","q":"Receptors provide pathways through which external stimuli induce specific responses in target cells.","a":true,"x":"Receptors for hormones, neurotransmitters and extracellular materials cover most cells."},{"id":"t5t1","t":"t5","type":"tf","q":"Bacteria are prokaryotic cells.","a":true,"x":"Prokaryotes are the structurally simpler class, which includes bacteria."},{"id":"t5t2","t":"t5","type":"tf","q":"Fungi are prokaryotic.","a":false,"fix":"Fungi are eukaryotic, like plants and animals.","x":"Only bacteria are named as prokaryotes in your notes."},{"id":"t5t3","t":"t5","type":"tf","q":"Both prokaryotic and eukaryotic cells conserve chemical energy as ATP using similar apparatus.","a":true,"x":"It is one of the four shared features."},{"id":"t5t4","t":"t5","type":"tf","q":"Phagocytosis is found in both prokaryotes and eukaryotes.","a":false,"fix":"Phagocytosis is a feature of eukaryotic cells only.","x":"It is listed among the features of eukaryotes not found in prokaryotes."},{"id":"t5t5","t":"t5","type":"tf","q":"In bacteria, the DNA is enclosed in a nucleus.","a":false,"fix":"Bacteria have no nucleus; their DNA lies in the nucleoid.","x":"See the bacterial cell diagram: “DNA of nucleoid”."},{"id":"t5t6","t":"t5","type":"tf","q":"Sexual reproduction requiring meiosis and fertilization is a feature of eukaryotic cells.","a":true,"x":"It is one of the six eukaryote-only features."},{"id":"t6t1","t":"t6","type":"tf","q":"Glucose is a ketohexose.","a":false,"fix":"Glucose is an aldohexose. Fructose is the ketohexose.","x":"Glucose has an aldehyde group on carbon 1."},{"id":"t6t2","t":"t6","type":"tf","q":"Ribose is an aldopentose.","a":true,"x":"5 carbons (pentose) with an aldehyde group (aldo-)."},{"id":"t6t3","t":"t6","type":"tf","q":"Sucrose and maltose are polysaccharides.","a":false,"fix":"Sucrose and maltose are disaccharides.","x":"Polysaccharides: glycogen, starch, chitin, cellulose."},{"id":"t6t4","t":"t6","type":"tf","q":"Monosaccharide units in carbohydrates are linked by glycosidic bonds.","a":true,"x":"Peptide bonds link amino acids; glycosidic bonds link sugars."},{"id":"t6t5","t":"t6","type":"tf","q":"Chitin forms the exoskeleton of insects.","a":true,"x":"Chitin → insects, cellulose → plant cell wall, peptidoglycan → bacterial cell wall."},{"id":"t6t6","t":"t6","type":"tf","q":"Cellulose reinforces the bacterial cell wall.","a":false,"fix":"Peptidoglycan reinforces the bacterial cell wall; cellulose gives rigidity to the plant cell wall.","x":"Match each structural carbohydrate to its organism."},{"id":"t6t7","t":"t6","type":"tf","q":"Diabetes mellitus is the most common clinical disorder related to carbohydrates.","a":true,"x":"Lipid imbalance gives obesity and atherosclerosis; carbohydrates give diabetes."},{"id":"t7t1","t":"t7","type":"tf","q":"Lipids are insoluble in water and soluble in organic solvents.","a":true,"x":"This is the property all lipids share."},{"id":"t7t2","t":"t7","type":"tf","q":"Cholesterol is a simple lipid.","a":false,"fix":"Cholesterol is a derived lipid.","x":"Simple lipids are esters of fatty acids with glycerol or higher-MW alcohols."},{"id":"t7t3","t":"t7","type":"tf","q":"Fat yields 9 kcal/g, compared with 4 kcal/g for protein or carbohydrate.","a":true,"x":"That is why lipids are a major source of energy."},{"id":"t7t4","t":"t7","type":"tf","q":"Glycolipids contain fatty acids, an alcohol and a carbohydrate.","a":true,"x":"Complex lipids: + phosphoric acid = phospholipid, + carbohydrate = glycolipid, + protein = lipoprotein."},{"id":"t7t5","t":"t7","type":"tf","q":"Vitamins A, D, E and K are water-soluble.","a":false,"fix":"A, D, E and K are fat-soluble vitamins (derived lipids).","x":"Remember “ADEK” as the fat-soluble set."},{"id":"t7t6","t":"t7","type":"tf","q":"Lipoproteins such as LDL and HDL transport lipids in the blood.","a":true,"x":"Lipoproteins are complex lipids (lipid + protein)."},{"id":"t7t7","t":"t7","type":"tf","q":"Imbalance in lipid metabolism can lead to obesity and atherosclerosis.","a":true,"x":"Atherosclerosis: plaque building up in an artery."},{"id":"t8t1","t":"t8","type":"tf","q":"Twenty different amino acids are commonly found in proteins.","a":true,"x":"All 20 share a carboxyl and amino group on the α carbon."},{"id":"t8t2","t":"t8","type":"tf","q":"Amino acids differ from each other in their carboxyl group.","a":false,"fix":"They differ only in their side chain (R group).","x":"Every amino acid has the same carboxyl and amino groups."},{"id":"t8t3","t":"t8","type":"tf","q":"Amino acids are joined together by glycosidic bonds.","a":false,"fix":"Amino acids are joined by peptide (amide) links.","x":"Glycosidic bonds link sugar units."},{"id":"t8t4","t":"t8","type":"tf","q":"Hemoglobin is a protein that carries oxygen in the blood.","a":true,"x":"Two α and two β chains, each with an iron-containing heme group."},{"id":"t8t5","t":"t8","type":"tf","q":"Actin and myosin are contractile proteins that permit muscle movement.","a":true,"x":"They are one of the seven protein functions."},{"id":"t8t6","t":"t8","type":"tf","q":"Immunoglobulins carry oxygen in the blood.","a":false,"fix":"Immunoglobulins fight bacterial and viral infections; hemoglobin carries oxygen.","x":"Don’t swap the two “-globins”."},{"id":"t9t1","t":"t9","type":"tf","q":"Adenine and guanine are pyrimidines.","a":false,"fix":"Adenine and guanine are purines.","x":"Pyrimidines are thymine, uracil and cytosine."},{"id":"t9t2","t":"t9","type":"tf","q":"RNA contains uracil instead of thymine.","a":true,"x":"DNA: A, G, C, T. RNA: A, G, C, U."},{"id":"t9t3","t":"t9","type":"tf","q":"The sugar in RNA is deoxyribose.","a":false,"fix":"RNA contains ribose; DNA contains deoxyribose.","x":"Ribose has an –OH on carbon 2′; deoxyribose has only H there."},{"id":"t9t4","t":"t9","type":"tf","q":"A gene is a segment of DNA that holds the information to make a biological product, mainly a protein.","a":true,"x":"That is the definition of a gene in your notes."},{"id":"t9t5","t":"t9","type":"tf","q":"cAMP acts as a first messenger in signal transduction.","a":false,"fix":"cAMP is the second messenger; the signal molecule (e.g. epinephrine) is the first messenger.","x":"Signal → receptor → G protein → adenylyl cyclase → cAMP → protein kinase A."},{"id":"t9t6","t":"t9","type":"tf","q":"Nucleotides are components of coenzymes such as coenzyme A, FAD and NAD⁺.","a":true,"x":"That is one of the four extra jobs of nucleotides."},{"id":"t9t7","t":"t9","type":"tf","q":"ATP and ADP are the principal donors and acceptors of phosphate groups in energy transduction.","a":true,"x":"ATP = adenosine triphosphate, ADP = adenosine diphosphate."},{"id":"t10t1","t":"t10","type":"tf","q":"Mitochondria are bounded by a single membrane.","a":false,"fix":"Mitochondria have a double membrane, which creates four domains.","x":"Outer membrane, intermembrane space, inner membrane, matrix."},{"id":"t10t2","t":"t10","type":"tf","q":"Mitochondria are 1 to 4 µm long.","a":true,"x":"They are bean-shaped organelles 1–4 µm in length."},{"id":"t10t3","t":"t10","type":"tf","q":"Mitochondria occupy about half the volume of an average mammalian liver cell.","a":false,"fix":"They occupy 15–20% of the volume.","x":"Your notes give 15–20%."},{"id":"t10t4","t":"t10","type":"tf","q":"In sperm cells, mitochondria sit in the midpiece just behind the nucleus.","a":true,"x":"Their ATP powers the sperm’s movement."},{"id":"t10t5","t":"t10","type":"tf","q":"Glycolysis takes place inside the mitochondrial matrix.","a":false,"fix":"Glycolysis takes place in the cytosol.","x":"Pyruvate enters the mitochondrion only when oxygen is present."},{"id":"t10t6","t":"t10","type":"tf","q":"Mitochondria are sites of synthesis of certain amino acids and heme.","a":true,"x":"This is one of their jobs besides ATP production."},{"id":"t10t7","t":"t10","type":"tf","q":"The process of cell death is regulated by events that occur within mitochondria.","a":true,"x":"Mitochondria also handle calcium and have their own DNA."},{"id":"t11t1","t":"t11","type":"tf","q":"Lysosomes are the animal cell’s digestive organelles.","a":true,"x":"They hold at least 50 hydrolytic enzymes."},{"id":"t11t2","t":"t11","type":"tf","q":"Lysosomal enzymes are produced in the smooth endoplasmic reticulum.","a":false,"fix":"They are produced in the rough endoplasmic reticulum.","x":"Lysosomal enzymes are proteins, made by the ribosome-covered rough ER."},{"id":"t11t3","t":"t11","type":"tf","q":"Ingested bacteria are inactivated by the high pH of the lysosome.","a":false,"fix":"They are inactivated by the lysosome’s LOW pH, then digested by enzymes.","x":"Lysosomes are acidic."},{"id":"t11t4","t":"t11","type":"tf","q":"Kupffer cells are phagocytic cells in the liver that engulf aging red blood cells.","a":true,"x":"The lysosome micrograph in your notes is of a Kupffer cell."},{"id":"t11t5","t":"t11","type":"tf","q":"Autophagy is the destruction of bacteria taken in from outside the cell.","a":false,"fix":"Autophagy is the regulated destruction of the cell’s own organelles and their replacement.","x":"Taking in outside material is phagocytosis."},{"id":"t11t6","t":"t11","type":"tf","q":"Autophagy helps prevent certain types of cancer and slows body aging.","a":true,"x":"Both roles are named in your notes."},{"id":"t12t1","t":"t12","type":"tf","q":"The rough ER is covered by ribosomes.","a":true,"x":"Ribosomes give it a rough look in the electron microscope."},{"id":"t12t2","t":"t12","type":"tf","q":"The ER membrane is continuous with the inner nuclear membrane.","a":false,"fix":"It is continuous with the OUTER nuclear membrane.","x":"Your notes specify the outer nuclear membrane."},{"id":"t12t3","t":"t12","type":"tf","q":"In the liver, the smooth ER is the site of detoxication of drugs and other foreign chemicals.","a":true,"x":"Smooth ER’s three S’s: Steroids, Sanitizing, Storing calcium."},{"id":"t12t4","t":"t12","type":"tf","q":"The most common role of the smooth ER is making steroid hormones.","a":false,"fix":"Its most common role is the storage and sudden release of calcium ions. Steroids are made in the ovaries, testes and adrenal gland.","x":"Steroid synthesis and detox are tissue-specific roles."},{"id":"t12t5","t":"t12","type":"tf","q":"The rough ER makes proteins that the cell exports to the extracellular medium.","a":true,"x":"It also makes integral membrane proteins and lysosomal enzymes."},{"id":"t12t6","t":"t12","type":"tf","q":"The ER lumen is separated from the cytosol by a double membrane.","a":false,"fix":"It is separated by a single membrane.","x":"Mitochondria are the double-membrane organelle in this lecture."},{"id":"t13t1","t":"t13","type":"tf","q":"Camillo Golgi was an Italian biologist.","a":true,"x":"He discovered the Golgi complex in 1898."},{"id":"t13t2","t":"t13","type":"tf","q":"Golgi discovered the Golgi complex in 1906.","a":false,"fix":"He discovered it in 1898; 1906 is when he received the Nobel Prize.","x":"1898 discovery → 1906 Nobel Prize."},{"id":"t13t3","t":"t13","type":"tf","q":"Golgi found the network by applying a metallic stain to nerve cells.","a":true,"x":"He saw a darkly stained reticular network near the nucleus."},{"id":"t13t4","t":"t13","type":"tf","q":"The Golgi complex is where the cell makes its export proteins.","a":false,"fix":"Proteins are made in the rough ER; the Golgi further processes them and directs them to their destination.","x":"Rough ER makes, Golgi processes and ships."},{"id":"t13t5","t":"t13","type":"tf","q":"The Golgi apparatus is a stack of flattened sacs.","a":true,"x":"It is the cell’s distribution point for proteins."},{"id":"t14t1","t":"t14","type":"tf","q":"Pompe disease is caused by a defect in mitochondrial function.","a":false,"fix":"Pompe disease is a lysosomal disorder caused by mutations in the acid alpha-glucosidase gene.","x":"The mitochondrial example is the 1962 case."},{"id":"t14t2","t":"t14","type":"tf","q":"In Pompe disease, accumulated glycogen damages the skeletal muscles and heart most seriously.","a":true,"x":"It causes progressive weakness of the heart and skeletal muscles."},{"id":"t14t3","t":"t14","type":"tf","q":"The 1962 patient had an abnormally low body temperature.","a":false,"fix":"Her body temperature was elevated, because her mitochondria produced heat.","x":"She had fatigue, muscle weakness and an elevated temperature."},{"id":"t14t4","t":"t14","type":"tf","q":"Normally, when ADP levels are low, mitochondria stop converting ADP to ATP.","a":true,"x":"In the 1962 patient they kept going even without ADP."},{"id":"t14t5","t":"t14","type":"tf","q":"Enzyme replacement therapy with alglucosidase alfa is an approved treatment for Pompe disease.","a":true,"x":"The figure shows it sold as Myozyme."},{"id":"t14t6","t":"t14","type":"tf","q":"The red-staining blotches in the muscle biopsy are caused by accumulated glycogen.","a":false,"fix":"They are caused by abnormal proliferation of mitochondria.","x":"Glycogen accumulation belongs to Pompe disease."},{"id":"t14t7","t":"t14","type":"tf","q":"Most mitochondrial disorders are characterized by degeneration of muscle or brain tissue.","a":true,"x":"They can lead to death during infancy."}],"numbers":[["~30 trillion","cells in an adult human","t1"],["10¹²","one trillion","t1"],["1000 µm = 1 mm","cell-size units","t1"],["1665","Hooke describes cork “cells”","t1"],["27","Hooke’s age as curator of the Royal Society","t1"],["37 °C","average human body temperature","t3"],["\u003c 1 per 10 million","DNA duplication errors per nucleotide","t4"],["7","basic properties of cells","t4"],["2","daughter cells from one division","t4"],["3 – 7","carbons in trioses … heptoses","t6"],["9 vs 4 kcal/g","fat vs protein or carbohydrate","t7"],["20","amino acids common in proteins","t8"],["3","parts of a nucleotide","t9"],["1 – 4 µm","length of a mitochondrion","t10"],["4","mitochondrial domains","t10"],["15 – 20%","of a liver cell’s volume is mitochondria","t10"],["> 1000","different proteins in mitochondria","t10"],["≥ 50","hydrolytic enzymes in a lysosome","t11"],["1","membrane between ER lumen and cytosol","t12"],["1898","Golgi discovers the Golgi complex","t13"],["1906","Golgi’s Nobel Prize","t13"],["1962","first mitochondrial-disorder case","t14"]],"where":[["Body temperature control","Hypothalamus","t3"],["Sensing blood pressure","Baroreceptors in blood vessels","t3"],["Bacterial DNA","Nucleoid","t5"],["Glycolysis; fermentation to lactate","Cytosol","t10"],["TCA cycle, electron transport, ATP","Mitochondria","t10"],["Amino acid & heme synthesis (some)","Mitochondria","t10"],["Calcium storage & sudden release","Smooth ER (with mitochondria)","t12"],["Steroid hormones","Smooth ER of ovaries, testes, adrenal","t12"],["Detoxication of drugs","Smooth ER of the liver","t12"],["Membrane & export proteins, lysosomal enzymes","Rough ER","t12"],["Processing & directing proteins","Golgi complex","t13"],["Digesting macromolecules, bacteria, old organelles","Lysosomes","t11"],["Copying a gene into mRNA","Nucleus","t9"],["Translating mRNA","Ribosomes in the cytoplasm","t9"]],"files":[{"name":"Lec 1 - Introduction to Cell Biology & Homeostasis.pdf","note":"10 pages","lecs":[1],"added":1791560286316},{"name":"Lec 2 - Classes of Macromolecules.pdf","note":"11 pages","lecs":[2],"added":1791560286316},{"name":"Lec 3 - Cellular Organelles.pdf","note":"8 pages","lecs":[3],"added":1791560286316}],"created":1791560286316}]},{"id":"medical","name":"Medical","courses":[{"id":"cns","name":"Nervous System","code":"CNS","partLabel":"Lecture","lecs":[{"n":15,"name":"Anatomy of the Cerebrum"},{"n":16,"name":"Blood Supply of the CNS"},{"n":17,"name":"Histological Features of the Cerebral Cortex"},{"n":18,"name":"Organization and Function of Motor and Association Cortex"},{"n":19,"name":"Stroke"},{"n":20,"name":"Synaptic Plasticity and Memory"},{"n":21,"name":"Cortical Areas of Speech"},{"n":22,"name":"Brain Stem Anatomy"},{"n":23,"name":"Spinal Cord Reflexes"},{"n":24,"name":"Motor Output & Descending Tracts"},{"n":25,"name":"Spinal Cord Reflexes Part 2: The Motor Unit"},{"n":26,"name":"Nervous Lesion"},{"n":27,"name":"Neuroglia and Myelination"}],"topics":[{"id":"t1","lec":15,"name":"Lobes, surfaces & main sulci","big":"Each cerebral hemisphere has four lobes you can see (frontal, parietal, temporal, occipital) plus a hidden limbic lobe. It has three surfaces, three poles and three labelled borders, and deep fissures and sulci mark the boundaries between the lobes.","pts":["Four visible lobes: \u003cb>occipital\u003c/b> (vision), \u003cb>temporal\u003c/b> (hearing), \u003cb>parietal\u003c/b> (sensory) and \u003cb>frontal\u003c/b> (motor).","One more lobe cannot be seen from the outside of the brain: the \u003cb>limbic lobe\u003c/b>.","The \u003cb>corpus callosum\u003c/b> connects the two cerebral hemispheres.","Each hemisphere has \u003cb>three surfaces\u003c/b> (superolateral, medial, inferior) and \u003cb>three poles\u003c/b> (frontal, occipital, temporal).","The surfaces figure labels three \u003cb>borders\u003c/b>: superomedial, inferolateral and inferomedial.","\u003cb>Fissures\u003c/b> are deep grooves, \u003cb>gyri\u003c/b> are elevated folds, and \u003cb>sulci\u003c/b> are shallow grooves between the folds.","On the lateral surface, the parietal, occipital and temporal lobes are separated by imaginary lines: the \u003cb>parieto-occipital sulcus\u003c/b> line continued downwards, and the \u003cb>posterior ramus of the lateral fissure\u003c/b> continued backwards to meet it."],"table":{"head":["Groove","What it separates"],"rows":[["Longitudinal fissure","The two cerebral hemispheres"],["Lateral fissure (of Sylvius)","Temporal lobe from the frontal and parietal lobes"],["Central sulcus","Frontal lobe from parietal lobe"],["Parieto-occipital sulcus","Parietal lobe from occipital lobe"]]},"hook":"Lobe jobs: Frontal = Function of muscles (motor), Parietal = Perceiving touch (sensory), Temporal = Tunes (hearing), Occipital = Optics (vision).","traps":["The \u003cb>longitudinal fissure\u003c/b> separates the hemispheres; the \u003cb>corpus callosum\u003c/b> connects them.","Fissures are \u003cb>deep\u003c/b> grooves; sulci are \u003cb>shallow\u003c/b> grooves between gyri.","There are only three poles (frontal, occipital, temporal): there is no parietal pole."]},{"id":"t2","lec":15,"name":"Superolateral surface","big":"The central sulcus and the lateral sulcus are the key landmarks of the superolateral surface. Primary motor cortex lies in front of the central sulcus and primary somatosensory cortex behind it. The lateral sulcus hides the insula, and Broca's area sits around its anterior rami.","pts":["The \u003cb>central sulcus\u003c/b> lies between two parallel sulci: the \u003cb>precentral\u003c/b> and \u003cb>postcentral\u003c/b> sulci.","\u003cb>Primary motor cortex\u003c/b> is in the \u003cb>precentral gyrus\u003c/b>, anterior to the central sulcus.","\u003cb>Primary somatosensory cortex\u003c/b> is in the \u003cb>postcentral gyrus\u003c/b>, posterior to the central sulcus.","Both of these areas control the \u003cb>opposite side\u003c/b> of the body.","The stem of the \u003cb>lateral sulcus\u003c/b> appears on the inferior surface and runs to the lateral surface, where it gives three rami: \u003cb>anterior horizontal\u003c/b>, \u003cb>anterior ascending\u003c/b> (superior) and \u003cb>posterior\u003c/b>.","The lateral sulcus is deep: the cortex folds inwards here to form deep grey matter, the hidden \u003cb>insula\u003c/b>.","\u003cb>Broca's area\u003c/b> is the \u003cb>motor speech centre\u003c/b>. It lies around the \u003cb>ascending and horizontal rami\u003c/b> of the lateral sulcus.","The Brodmann figure in your notes also labels the \u003cb>inferior parietal lobule\u003c/b> as the supramarginal gyrus (BA 40) plus the angular gyrus (BA 39)."],"table":{"head":["Area (Brodmann figure)","Brodmann area (BA)"],"rows":[["Primary motor cortex","BA 4"],["Lateral premotor area","BA 6"],["Frontal eye field","BA 8"],["Broca's area","BA 44, 45"],["Primary somatosensory cortex","BA 3, 1, 2"],["Somatosensory association cortex","BA 5"],["Supramarginal gyrus / angular gyrus","BA 40 / BA 39"],["Primary auditory cortex","BA 41, 42"],["Auditory association cortex","BA 22"],["Primary visual cortex","BA 17"],["Visual association cortex","BA 18, 19"]]},"hook":"PRE-central moves, POST-central feels: motor in front of the central sulcus, sensation behind it.","traps":["Primary \u003cb>motor\u003c/b> = \u003cb>pre\u003c/b>central gyrus (anterior); primary \u003cb>somatosensory\u003c/b> = \u003cb>post\u003c/b>central gyrus (posterior). Don't swap them.","Broca's area is around the \u003cb>ascending and horizontal\u003c/b> rami of the lateral sulcus, not around the posterior ramus.","In the figure, \u003cb>BA 4\u003c/b> is primary motor cortex; BA 6 next to it is the lateral premotor area."]},{"id":"t3","lec":15,"name":"Medial surface","big":"The medial surface is organised around the corpus callosum. The cingulate sulcus and gyrus curve around it, the paracentral lobule holds the lower limb and perineum areas, and the calcarine sulcus splits the occipital lobe into the cuneus above and the lingual gyrus below.","pts":["The \u003cb>cingulate sulcus\u003c/b> follows the curve of the corpus callosum, running through the frontal and parietal lobes.","The \u003cb>cingulate gyrus\u003c/b> lies below the cingulate sulcus and is functionally associated with the \u003cb>limbic lobe\u003c/b>.","The cingulate sulcus ends by turning upwards; this sulcus continues onto the lateral surface as the \u003cb>postcentral sulcus\u003c/b>. The central sulcus is just in front of it, and the gyrus between them is the postcentral gyrus.","The \u003cb>paracentral lobule\u003c/b> lies anterior to where the cingulate sulcus turns up onto the lateral surface. It holds the primary motor and somatosensory regions for the opposite \u003cb>lower limb and perineum\u003c/b>.","The \u003cb>calcarine sulcus\u003c/b> is at the \u003cb>caudal\u003c/b> end of the medial surface. It divides the occipital lobe into two visual parts: the \u003cb>lingual gyrus\u003c/b> (inferior) and the \u003cb>cuneus\u003c/b> (superior).","The \u003cb>cuneus\u003c/b> lies posterior to the \u003cb>parieto-occipital sulcus\u003c/b>.","The \u003cb>medial frontal gyrus\u003c/b> is the part of the frontal lobe in front of the cingulate sulcus. It counts as part of the \u003cb>prefrontal area\u003c/b>: behaviour, attention and concentration.","In the medial surface figure, from front to back along the upper part: medial frontal gyrus, paracentral lobule, precuneus, cuneus."],"hook":"C for Ceiling: the Cuneus is the ceiling above the calcarine sulcus, and the Lingual gyrus Lies Low beneath it.","traps":["The \u003cb>cuneus\u003c/b> is above the calcarine sulcus and the \u003cb>lingual gyrus\u003c/b> is below it, not the other way round.","The upturned end of the cingulate sulcus becomes the \u003cb>postcentral\u003c/b> sulcus, not the precentral sulcus.","The cingulate gyrus is linked with the \u003cb>limbic lobe\u003c/b>; the medial frontal gyrus is \u003cb>prefrontal\u003c/b>."]},{"id":"t4","lec":15,"name":"Inferior surface & clinical notes","big":"The stem of the lateral sulcus divides the inferior surface into an orbital part and a tentorial part. The parahippocampal gyrus and uncus (smell and memory) lie most medially, and the orbitofrontal cortex holds the olfactory gyrus. Clinically, cortical lesions cause problems on the opposite side.","pts":["The inferior surface is divided by the \u003cb>stem of the lateral sulcus\u003c/b> into an \u003cb>orbital part\u003c/b> and a \u003cb>tentorial part\u003c/b>.","On the inferior surface of the temporal lobe, the most medial gyrus is the \u003cb>parahippocampal gyrus\u003c/b>. Its anterior end expands to form the \u003cb>uncus\u003c/b>.","The parahippocampal gyrus and uncus lie \u003cb>medial to the collateral sulcus\u003c/b>.","They are concerned with the \u003cb>olfactory (smell) system and memory\u003c/b>.","The \u003cb>olfactory gyrus\u003c/b> lies in the \u003cb>orbitofrontal cortex\u003c/b>, the part that sits above the orbit.","These structures form part of the \u003cb>limbic system\u003c/b>, which is involved in \u003cb>emotional processing and perception\u003c/b>.","In the inferior surface figure, the \u003cb>gyrus rectus\u003c/b> lies medial to the olfactory bulb and tract; the orbital gyri lie lateral to them."],"cards":[{"h":"Primary motor cortex lesion","items":["Lesion in one hemisphere","Paralysis of the \u003cb>contralateral\u003c/b> extremities"]},{"h":"Calcarine sulcus lesion","items":["Lesion involving the calcarine sulcus","Loss of vision in the \u003cb>opposite\u003c/b> visual field"]}],"hook":"The cortex works crosswise: damage on one side shows up on the other side (paralysis of the opposite limbs, loss of the opposite visual field).","traps":["The parahippocampal gyrus is the most \u003cb>medial\u003c/b> gyrus of the inferior temporal surface and lies \u003cb>medial\u003c/b> to the collateral sulcus.","The \u003cb>uncus\u003c/b> is the expanded \u003cb>anterior\u003c/b> end of the parahippocampal gyrus.","Cortical lesions give \u003cb>contralateral\u003c/b> signs: a calcarine lesion causes loss of the \u003cb>opposite\u003c/b> visual field."]},{"id":"t5","lec":16,"name":"Circulations & internal carotid","big":"The brain is supplied by two circulations: the anterior (carotid) circulation for supratentorial structures and the posterior (vertebrobasilar) circulation for the posterior fossa. The internal carotid artery enters through the carotid canal and foramen lacerum, turns through the cavernous sinus, and divides beside the optic chiasma.","pts":["Blood reaches the brain through the \u003cb>anterior circulation\u003c/b> (carotid system) and the \u003cb>posterior circulation\u003c/b> (vertebrobasilar system).","The anterior circulation supplies \u003cb>supratentorial structures\u003c/b> (your notes: the cortex and diencephalon).","The posterior circulation supplies the \u003cb>posterior fossa\u003c/b>: cerebellum and brainstem.","Entry into the skull: anterior circulation through the \u003cb>foramen lacerum\u003c/b>; posterior circulation through the \u003cb>foramen magnum\u003c/b>.","The carotid system = the intracranial \u003cb>internal carotid artery (ICA)\u003c/b> plus its two terminal branches, the \u003cb>anterior\u003c/b> and \u003cb>middle cerebral arteries\u003c/b>.","The ICA enters through the \u003cb>carotid canal\u003c/b> and emerges inside the skull via the foramen lacerum.","It makes a series of \u003cb>stepwise turns\u003c/b>, passing through the \u003cb>cavernous sinus\u003c/b>.","It emerges next to the \u003cb>optic chiasma\u003c/b>, where it divides into its major branches, the MCA and ACA.","Fig. 1: the \u003cb>common carotid artery\u003c/b> gives the internal and external carotid arteries."],"table":{"head":["","Anterior circulation","Posterior circulation"],"rows":[["System","Carotid system","Vertebrobasilar system"],["Supplies","Supratentorial structures","Posterior fossa: cerebellum and brainstem"],["Enters skull through","Foramen lacerum (ICA, after the carotid canal)","Foramen magnum"],["Main vessels","ICA, ACA, MCA","2 vertebral arteries, basilar artery, 2 PCAs"]]},"lists":[{"h":"Branches of the ICA (Fig. 2)","ordered":true,"items":["Ophthalmic artery","Anterior cerebral artery","Middle cerebral artery","Anterior choroidal artery","Posterior communicating artery"]}],"hook":"Pair them up: Carotid with Lacerum (C-L) for the anterior circulation; Vertebral with Magnum (V-M) for the posterior circulation.","traps":["The \u003cb>anterior\u003c/b> circulation enters through the foramen \u003cb>lacerum\u003c/b>; the \u003cb>posterior\u003c/b> through the foramen \u003cb>magnum\u003c/b>.","The ACA and MCA are the \u003cb>terminal\u003c/b> branches of the ICA; the PCA belongs to the vertebrobasilar system.","The ICA passes through the \u003cb>cavernous sinus\u003c/b>, a venous sinus, on its way to the optic chiasma."]},{"id":"t6","lec":16,"name":"Middle & anterior cerebral arteries","big":"The MCA is the largest ICA branch: its deep striate branches supply the striatum and internal capsule, and occlusion of these deep branches is the chief cause of classic stroke; its distal part supplies most of the lateral brain. The ACA winds around the genu of the corpus callosum to supply the medial frontal and parietal lobes.","pts":["\u003cb>MCA\u003c/b> = the largest and most important branch of the ICA; it receives \u003cb>80%\u003c/b> of the carotid blood flow.","The proximal MCA gives deep branches, the \u003cb>lateral and medial striate arteries\u003c/b> (Fig. 3: lenticulostriate arteries), which supply the \u003cb>striatum and internal capsule\u003c/b>.","Occlusion of these deep arteries is the \u003cb>chief cause of classic stroke\u003c/b>.","The distal MCA travels laterally through the \u003cb>lateral fissure\u003c/b> to supply most of the \u003cb>lateral side\u003c/b> of the brain.","\u003cb>ACA\u003c/b> winds around the \u003cb>genu of the corpus callosum\u003c/b>, then divides into two main terminal branches.","The ACA supplies the \u003cb>medial side of the frontal and parietal lobes\u003c/b> as far back as the \u003cb>parieto-occipital sulcus\u003c/b>, and overlaps onto the \u003cb>orbital and lateral surfaces\u003c/b>.","The ACA gives \u003cb>cortical\u003c/b> and \u003cb>central\u003c/b> branches.","ACA occlusion is \u003cb>rare\u003c/b> but can cause \u003cb>'clumsy hand' syndrome\u003c/b>, with contralateral weakness of the arm and face."],"table":{"head":["","MCA","ACA"],"rows":[["Course","Laterally through the lateral fissure","Around the genu of the corpus callosum"],["Cortical territory","Most of the lateral side of the brain","Medial frontal and parietal lobes back to the parieto-occipital sulcus; overlaps onto orbital and lateral surfaces"],["Deep / central branches","Lateral and medial striate arteries → striatum and internal capsule","Central branches (plus cortical branches)"],["Occlusion","Deep branches: chief cause of classic stroke","Rare; 'clumsy hand' syndrome"]]},"hook":"MCA = Main Carotid Artery-branch: biggest, 80% of the flow, Most of the lateral Cortex. ACA = Around the Corpus cAllosum (genu), on the medial side.","traps":["The deep \u003cb>striate\u003c/b> branches come from the \u003cb>MCA\u003c/b>; their occlusion, not ACA occlusion, is the chief cause of classic stroke.","The ACA winds around the \u003cb>genu\u003c/b> of the corpus callosum, not the splenium.","ACA territory on the medial surface stops at the \u003cb>parieto-occipital sulcus\u003c/b>."]},{"id":"t7","lec":16,"name":"Vertebrobasilar system & PCA","big":"The posterior circulation is two vertebral arteries that join to form the single basilar artery, which ends as the two posterior cerebral arteries. The vertebral artery gives the spinal arteries, PICA and medullary branches; the basilar artery gives cerebellar, pontine and labyrinthine branches; the PCA supplies deep structures, the occipital lobe and the tentorial surface.","pts":["Vertebrobasilar system = \u003cb>2 vertebral arteries\u003c/b> + \u003cb>1 basilar artery\u003c/b> + \u003cb>2 posterior cerebral arteries\u003c/b>.","Vertebral artery: arises in the neck from the \u003cb>1st part of the subclavian artery\u003c/b>; passes through the transverse foramina of \u003cb>C1–C6\u003c/b>; enters the skull via the foramen magnum; runs along the \u003cb>ventral surface of the brainstem\u003c/b>.","\u003cb>Anterior spinal artery\u003c/b>: the two arteries unite into a \u003cb>single trunk\u003c/b> in the \u003cb>anterior median fissure\u003c/b> of the spinal cord.","\u003cb>Posterior spinal artery\u003c/b>: one from each vertebral artery; each divides into two longitudinal branches on each side of the \u003cb>posterior roots\u003c/b> of the spinal nerves.","\u003cb>PICA\u003c/b>: a tortuous artery and the \u003cb>largest branch\u003c/b> of the vertebral artery. \u003cb>Medullary branches\u003c/b> supply the medulla oblongata.","\u003cb>Basilar artery\u003c/b>: formed at the \u003cb>lower border of the pons\u003c/b> by union of the two vertebral arteries; runs on the front of the pons in the midline (pontine sulcus).","\u003cb>PCA\u003c/b>: the two terminal branches of the basilar artery at the upper border of the pons; passes around the \u003cb>midbrain\u003c/b> to the occipital pole and runs inside the \u003cb>calcarine sulcus\u003c/b>.","PCA cortical territory: \u003cb>superolateral\u003c/b> surface = occipital lobe + lowermost 1 finger breadth; \u003cb>inferior\u003c/b> surface = whole tentorial surface except the temporal pole; \u003cb>medial\u003c/b> surface = occipital lobe."],"lists":[{"h":"Branches of the basilar artery","ordered":false,"items":["Anterior inferior cerebellar artery (AICA), which also supplies the cerebellar tonsil","Superior cerebellar artery","Pontine branches","Labyrinthine (internal auditory) artery","Posterior cerebral arteries (terminal branches)"]},{"h":"PCA central branches supply","ordered":false,"items":["Thalamus","Hypothalamus","Globus pallidus","Midbrain","Geniculate bodies"]}],"hook":"Two become one become two: 2 vertebrals → 1 basilar → 2 PCAs. PICA is the 'big' vertebral branch (the largest).","traps":["\u003cb>PICA\u003c/b> comes from the \u003cb>vertebral\u003c/b> artery; \u003cb>AICA\u003c/b> and the superior cerebellar artery come from the \u003cb>basilar\u003c/b> artery.","The \u003cb>anterior\u003c/b> spinal arteries unite into one trunk; the \u003cb>posterior\u003c/b> spinal arteries stay paired and each splits into two longitudinal branches.","The vertebral artery arises from the \u003cb>1st\u003c/b> part of the subclavian artery and runs through the foramina of \u003cb>C1–C6\u003c/b>."]},{"id":"t8","lec":16,"name":"Circle of Willis & cerebral veins","big":"The circle of Willis is an anastomosis at the base of the brain that links the internal carotid and vertebrobasilar systems through one anterior and two posterior communicating arteries. Cerebral veins drain into venous sinuses: superior cerebral veins to the superior sagittal sinus, the superficial middle cerebral vein to the cavernous sinus, and the basal and internal cerebral veins via the great cerebral vein to the straight sinus.","pts":["The \u003cb>circle of Willis\u003c/b> forms at the \u003cb>base of the brain\u003c/b> by interconnecting the \u003cb>vertebrobasilar\u003c/b> and \u003cb>internal carotid\u003c/b> systems.","One \u003cb>anterior communicating artery\u003c/b> connects the left and right \u003cb>ACAs\u003c/b>.","Two \u003cb>posterior communicating arteries\u003c/b>, one on each side, connect the \u003cb>ICA\u003c/b> with the \u003cb>PCA\u003c/b>.","External veins: \u003cb>superior cerebral veins\u003c/b> → superior sagittal sinus; \u003cb>superficial middle cerebral vein\u003c/b> (drains the lateral surface) → cavernous sinus; \u003cb>basal vein\u003c/b> → great cerebral vein → straight sinus.","Internal veins: two \u003cb>internal cerebral veins\u003c/b> unite beneath the \u003cb>splenium of the corpus callosum\u003c/b> to form the \u003cb>great cerebral vein\u003c/b>.","Fig. 8: the transverse sinus continues as the \u003cb>sigmoid sinus\u003c/b>, which leads into the \u003cb>internal jugular vein\u003c/b>."],"table":{"head":["Vein","Drains into"],"rows":[["Superior cerebral veins","Superior sagittal sinus"],["Superficial middle cerebral vein (lateral surface)","Cavernous sinus"],["Basal vein","Great cerebral vein"],["Two internal cerebral veins","Unite beneath the splenium to form the great cerebral vein"],["Great cerebral vein","Straight sinus"]]},"hook":"Superior goes to Superior (superior cerebral veins → superior sagittal sinus). Then 'Great, then Straight': the basal vein and the internal cerebral veins → great cerebral vein → straight sinus.","traps":["The \u003cb>anterior\u003c/b> communicating artery joins the two ACAs; each \u003cb>posterior\u003c/b> communicating artery joins the ICA to the \u003cb>PCA\u003c/b>, not the MCA.","The internal cerebral veins unite beneath the \u003cb>splenium\u003c/b>, not the genu, of the corpus callosum.","The great cerebral vein drains into the \u003cb>straight\u003c/b> sinus, not the superior sagittal sinus."]},{"id":"t9","lec":17,"name":"Cortex structure & neuropil","big":"Each hemisphere has a folded cortex of grey matter over a central mass of white matter. The cortex is built from neuron cell bodies, neuroglia, blood capillaries and the neuropil, an arrangement that allows diffusion between capillaries and neurons that are very sensitive to oxygen and blood sugar changes.","pts":["Each hemisphere = a convoluted \u003cb>cortex of grey matter\u003c/b> overlying a central \u003cb>medullary mass of white matter\u003c/b>.","The cortex folds into \u003cb>gyri\u003c/b> (ridges) and \u003cb>sulci\u003c/b> (furrows), which \u003cb>increase the surface area\u003c/b>.","Collections of nerve cells inside the white matter are called the \u003cb>basal ganglia\u003c/b>.","The cortex has a unique histological structure so it can perform \u003cb>higher functions\u003c/b>.","Cytoarchitecture: (1) \u003cb>neuron cell bodies\u003c/b> in horizontally disposed layers (laminae), (2) \u003cb>neuroglia\u003c/b> such as astrocytes, (3) \u003cb>blood capillaries\u003c/b>, (4) the \u003cb>neuropil\u003c/b>.","\u003cb>Neuropil\u003c/b> (pilus = felt = meshwork): amorphous \u003cb>pale areas\u003c/b> of astrocyte cell bodies and processes tangled with neuron processes, plus \u003cb>intercellular spaces containing tissue fluid\u003c/b>.","This arrangement permits \u003cb>diffusion between capillaries and neurons\u003c/b>.","Cortical neurons are very sensitive to changes in \u003cb>oxygen\u003c/b> and \u003cb>blood sugar level\u003c/b>."],"hook":"Neuropil = neuro + pilus (felt): picture a felt mat of tangled astrocyte and neuron processes, with tissue fluid in the gaps.","traps":["The \u003cb>basal ganglia\u003c/b> are nerve cell collections inside the \u003cb>white matter\u003c/b>, not part of the cortex.","The neuropil is pale, amorphous areas of astrocytes (cell bodies and processes) tangled with neuron processes, plus fluid-filled spaces; it is not a layer of neuron cell bodies.","Gyri are \u003cb>ridges\u003c/b> and sulci are \u003cb>furrows\u003c/b>; folding \u003cb>increases\u003c/b> the surface area."]},{"id":"t10","lec":17,"name":"Neurons of the cortex","big":"All the cortex's hundreds of billions of neurons are variations of just three shapes: pyramidal, fusiform and stellate (granular) cells. Horizontal cells of Cajal and cells of Martinotti are modified forms. Pyramidal cells are the most numerous and are the main output neurons.","pts":["Three basic shapes: \u003cb>pyramidal\u003c/b>, \u003cb>fusiform\u003c/b> and \u003cb>stellate (granular)\u003c/b> cells.","The other cells are modifications of these: \u003cb>horizontal cells of Cajal\u003c/b> and \u003cb>cells of Martinotti\u003c/b>.","\u003cb>Pyramidal cells\u003c/b> make up to \u003cb>75%\u003c/b> of the cells, are the \u003cb>main output neurons\u003c/b>, and vary in size from small to gigantic.","Stellate cells are called \u003cb>granule cells\u003c/b> because they are small and densely packed, giving a granular look.","\u003cb>Fusiform cells\u003c/b> are usually in the \u003cb>deepest\u003c/b> cortical layer."],"table":{"head":["Cell","Where / how many","Processes"],"rows":[["Pyramidal","Up to 75% of cortical cells; main output neurons","One thick apical dendrite toward the surface, multiple basal dendrites; one long axon from the middle of the base → subcortical white matter"],["Stellate (granule)","All cortical laminae; small and densely packed","Numerous branching dendrites; one short axon that ascends to the surface or descends to deeper layers"],["Fusiform","Usually the deepest layer","Dendrite → cortical surface; axon → \u003cb>thalamus\u003c/b>"],["Horizontal cell of Cajal","Only the most superficial part; small, spindle-shaped, parallel to the surface","One axon and one dendrite, both synapsing locally in the most superficial layer"],["Cell of Martinotti","Most dense in the deepest layer; multipolar","Numerous axons and dendrites coursing toward the surface"]]},"hook":"Three basic shapes, PFS: Pyramidal, Fusiform, Stellate. Cajal stays on top; Martinotti lives at the bottom and reaches up.","traps":["Fusiform cell \u003cb>axons go to the thalamus\u003c/b>; their dendrites go toward the surface.","Stellate (granule) cells are present in \u003cb>all\u003c/b> laminae, even though only layers II and IV are named 'granular'.","Cajal cells are \u003cb>superficial\u003c/b>; Martinotti cells are \u003cb>deep\u003c/b>."]},{"id":"t11","lec":17,"name":"Layers & cortical types","big":"Cortical neurons are arranged in layers parallel to the surface, told apart by the size and shape of their cell bodies. A typical section of the motor area shows six layers. The motor area is agranular and rich in pyramidal cells (Betz cells); the sensory area is granular with ill-defined pyramidal layers.","pts":["Neurons have a \u003cb>laminar alignment\u003c/b>: layers parallel to the brain surface, told apart by the \u003cb>size and shape\u003c/b> of the neuronal cell bodies.","A typical section of the motor area shows \u003cb>six layers\u003c/b>, numbered from the surface inwards.","\u003cb>Betz cells\u003c/b> (giant pyramidal cells of layer V) are the projection neurons of the motor cortex: \u003cb>upper motor neurons\u003c/b> whose axons form the \u003cb>pyramidal tracts\u003c/b> descending in the brainstem and spinal cord.","\u003cb>Motor area\u003c/b> (precentral gyrus) = \u003cb>agranular\u003c/b> type: few granule cells, well-developed pyramidal layers (Betz cells in the internal pyramidal layer).","\u003cb>Sensory area\u003c/b> (postcentral gyrus) = \u003cb>granular\u003c/b> type: well-developed granular layers, \u003cb>ill-defined pyramidal layers\u003c/b> (few, small pyramidal cells)."],"table":{"head":["Layer","Name (other name)","Main contents"],"rows":[["I","Molecular (plexiform)","Most superficial, directly under the pia mater; very poor in cells (a few horizontal cells of Cajal); mostly processes of deeper neurons and their synapses"],["II","External granular","Mostly stellate cells, giving a granular look"],["III","External pyramidal","Small and medium pyramidal cells, which get larger and fewer in the deeper part of the layer"],["IV","Internal granular","Mostly stellate cells, like layer II"],["V","Internal pyramidal (ganglionic)","Medium and large pyramidal cells; giant \u003cb>Betz cells\u003c/b> in the motor area"],["VI","Polymorphic (multiform)","Deepes
