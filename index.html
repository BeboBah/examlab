.","Only the \u003cb>lower\u003c/b> face and the \u003cb>hypoglossal\u003c/b> nucleus get mostly unilateral corticobulbar input.","Corticobulbar fibres come from the \u003cb>lateral\u003c/b> aspect of the primary motor cortex."]},{"id":"t38","lec":24,"name":"Extrapyramidal tracts","big":"Four brainstem tracts give involuntary control of tone, balance, posture and locomotion. The vestibulospinal and reticulospinal tracts stay ipsilateral; the rubrospinal and tectospinal tracts cross to give contralateral innervation.","pts":["Four tracts: \u003cb>vestibulospinal\u003c/b> and \u003cb>reticulospinal\u003c/b> do not decussate (ipsilateral); \u003cb>rubrospinal\u003c/b> and \u003cb>tectospinal\u003c/b> decussate (contralateral).","\u003cb>Medial brainstem pathways\u003c/b>: vestibulospinal, reticulospinal, tectospinal. \u003cb>Lateral brainstem pathway\u003c/b>: rubrospinal.","\u003cb>Vestibulospinal\u003c/b> tracts (medial and lateral) arise from the \u003cb>vestibular nuclei\u003c/b> (input from the organs of balance) and control balance and posture through the antigravity muscles.","\u003cb>Medial VST\u003c/b>: to the cervical and upper thoracic cord; acts on interneurons for neck muscles to \u003cb>stabilise the head\u003c/b> as we move.","\u003cb>Lateral VST\u003c/b>: from the lateral vestibular nucleus (medulla), in the ventral funiculus to all levels; acts on \u003cb>extensor\u003c/b> motor neurones to keep the centre of gravity between the feet.","\u003cb>Reticulospinal\u003c/b> tracts (pontine and medullary) reach all spinal levels, mainly ipsilaterally; they maintain posture and modulate muscle tone, especially via γ motor neurons. \u003cb>Pontine = mainly excitatory\u003c/b>; \u003cb>medullary = mainly inhibitory\u003c/b>.","Reticulospinal fibres include the \u003cb>emotional motor system\u003c/b>, which expresses emotion (e.g. the posture of someone with depression differs from someone happy).","\u003cb>Tectospinal\u003c/b>: starts in the \u003cb>superior colliculus\u003c/b> (input from the optic nerves), decussates quickly, ends at \u003cb>cervical\u003c/b> levels; coordinates head movements with visual, auditory and somatic stimuli.","\u003cb>Rubrospinal\u003c/b>: from the \u003cb>red nucleus\u003c/b> (midbrain), decussates; influences motor neurons of distal limb muscles and \u003cb>excites arm flexors\u003c/b>. In humans it is \u003cb>outweighed by the corticospinal\u003c/b> pathway."],"table":{"head":["Tract","Origin","Side","Key role"],"rows":[["Vestibulospinal","Vestibular nuclei","Ipsilateral","Balance and posture (medial: head; lateral: extensors)"],["Reticulospinal","Pons and medulla","Mainly ipsilateral","Posture, muscle tone, emotional motor system"],["Tectospinal","Superior colliculus","Contralateral","Head movements to visual, auditory and somatic stimuli"],["Rubrospinal","Red nucleus","Contralateral","Distal limb muscles"]]},"hook":"Pontine Pushes (excites), Medullary Mutes (inhibits). The two tracts from midbrain sites (red nucleus, superior colliculus) cross; the vestibular and reticular ones stay on the same side.","traps":["\u003cb>Pontine\u003c/b> reticulospinal is mainly excitatory; \u003cb>medullary\u003c/b> reticulospinal is mainly inhibitory.","The \u003cb>lateral\u003c/b> VST acts on extensors at all levels; the \u003cb>medial\u003c/b> VST stabilises the head via the cervical and upper thoracic cord.","Rubrospinal is the \u003cb>lateral\u003c/b> brainstem pathway; the other three are medial pathways."]},{"id":"t39","lec":24,"name":"Posturing in the comatose patient","big":"In a comatose patient, abnormal posture shows which descending tracts still work. Brainstem damage at or below the red nucleus gives decerebrate rigidity (all limbs extend); damage above it gives decorticate rigidity (arms flex, legs extend).","pts":["Abnormal posturing in coma is due to the activity of descending motor tracts; its type indicates the \u003cb>location of the lesion\u003c/b> or the \u003cb>extent of brain damage\u003c/b>.","\u003cb>Decerebrate (spastic) rigidity\u003c/b>: brainstem damaged \u003cb>at or below the red nucleus\u003c/b>, with the pontine and medullary reticular systems and the vestibular system left intact.","In decerebrate rigidity the \u003cb>rubrospinal\u003c/b> tract is disrupted (no flexor facilitation to the upper limbs), while the \u003cb>vestibulospinal and pontine reticulospinal\u003c/b> tracts dominate → strong extensor tone in all limbs.","\u003cb>Decorticate rigidity\u003c/b>: damage \u003cb>above the level of the red nucleus\u003c/b>; there is \u003cb>loss of cortical inhibition\u003c/b>, but the red nucleus is still active.","In decorticate rigidity the rubrospinal tract facilitates \u003cb>flexor tone in the upper limbs\u003c/b>; intact vestibulospinal and pontine reticulospinal tracts give \u003cb>extensor tone in the lower limbs\u003c/b>.","Figure: decerebrate = upper and lower limbs extend; decorticate = upper limbs flex, lower limbs extend."],"table":{"head":["","Decerebrate","Decorticate"],"rows":[["Lesion level","At or below the red nucleus","Above the red nucleus"],["Rubrospinal tract","Disrupted","Active (red nucleus intact)"],["Upper limbs","Extend","Flex"],["Lower limbs","Extend","Extend"],["Extensor drive from","Vestibulospinal + pontine reticulospinal","Vestibulospinal + pontine reticulospinal"]]},"hook":"deCORticate: arms pulled in to the CORe (flexed), red nucleus spared. dEcErEbrate: Everything Extends.","traps":["The landmark is the \u003cb>red nucleus\u003c/b>: above it = decorticate; at or below it = decerebrate.","Upper-limb flexion needs a working \u003cb>rubrospinal\u003c/b> tract.","The lower limbs extend in \u003cb>both\u003c/b> postures."]},{"id":"t40","lec":25,"name":"Inverse stretch reflex","big":"When muscle tension becomes great enough, Golgi tendon organs fire group Ib afferents that excite inhibitory interneurons, so the contracting muscle suddenly relaxes. This protective di-synaptic reflex is the inverse stretch reflex (lengthening reaction, autogenic inhibition).","pts":["Up to a point, the harder a muscle is stretched, the stronger the reflex contraction; when the tension is great enough, contraction \u003cb>suddenly ceases\u003c/b> and the muscle relaxes.","Names: \u003cb>inverse stretch reflex\u003c/b>, \u003cb>lengthening reaction\u003c/b>, \u003cb>autogenic inhibition\u003c/b>.","It is a \u003cb>protective, di-synaptic\u003c/b> reflex.","Receptor: the \u003cb>Golgi tendon organ (GTO)\u003c/b>, located in \u003cb>tendons\u003c/b>; sensitive to muscle \u003cb>tension\u003c/b> (force of contraction), not length; activated during strong contraction.","Afferent: \u003cb>group Ib\u003c/b> fibres, myelinated and rapidly conducting.","Ib afferents excite \u003cb>inhibitory interneurons\u003c/b> → these inhibit the α motor neurons of the same (homonymous) muscle → it relaxes.","The pathway also stimulates an \u003cb>excitatory interneuron\u003c/b> → it excites the α motor neuron of the \u003cb>antagonistic\u003c/b> muscle.","\u003cb>Clasp-knife reflex\u003c/b>: an exaggerated Golgi tendon reflex seen with \u003cb>corticospinal tract disease\u003c/b> (hypertonicity or spasticity).","Example: in a hypertonic arm, over-sensitive spindles in the \u003cb>triceps\u003c/b> resist flexion; rising triceps tension then fires the Golgi tendon reflex, the triceps relaxes and the arm flexes closed like a jackknife."],"lists":[{"h":"Functions of the inverse stretch reflex","ordered":false,"items":["Prevents further increases in tension","Prevents muscle rupture","Protects the tendon from injury by too much tension","Switches off movement and allows the muscle to relax"]}],"hook":"GTO = Gauge of Tension Only (not length). 'Autogenic' = self-generated: the muscle's own tension switches the muscle off.","traps":["GTOs sense \u003cb>tension\u003c/b>, not length, and sit in the \u003cb>tendon\u003c/b>.","The inverse stretch reflex is \u003cb>di-synaptic\u003c/b>: an interneuron sits between the Ib afferent and the motor neuron.","The inverse stretch reflex \u003cb>inhibits\u003c/b> the same (homonymous) muscle through inhibitory interneurons but \u003cb>excites\u003c/b> its antagonist through an excitatory interneuron."]},{"id":"t41","lec":25,"name":"Flexor withdrawal reflex","big":"An injurious stimulus to a limb makes the same-side flexors contract to withdraw it, while the opposite limb extends (crossed extensor response). It is a basic, protective, polysynaptic, superficial spinal reflex that shows irradiation and after-discharge.","pts":["Injurious stimulus → \u003cb>ipsilateral limb flexors\u003c/b> contract → the limb is withdrawn away from the stimulus.","\u003cb>Crossed extensor response\u003c/b>: the \u003cb>contralateral\u003c/b> limb extends; it is properly part of the withdrawal reflex.","It compensates for the extra load that withdrawal puts on the \u003cb>antigravity extensor muscles of the opposite leg\u003c/b>.","Characteristics: a \u003cb>basic, protective, polysynaptic, superficial\u003c/b> spinal reflex.","\u003cb>Irradiation\u003c/b>: a weak noxious stimulus gives minimal flexion; stronger stimuli give greater and greater flexion as the stimulus spreads to more and more of the limb's motor neuron pool.","Stronger stimuli also give a \u003cb>more prolonged\u003c/b> response.","\u003cb>After-discharge\u003c/b>: the prolonged, repeated firing of motor neurons, due to continued activation by impulses arriving by complicated, circuitous polysynaptic paths.","Figure: stepping on a tack stimulates the receptor (\u003cb>dendrites of a pain-sensitive neuron\u003c/b>); in the spinal cord the sensory neuron activates \u003cb>interneurons in several spinal cord segments\u003c/b> (ascending and descending); motor neurons fire and the flexors withdraw the leg."],"hook":"Step on a tack: Flex the hurt side, Extend the other side so you don't fall. More pain spreads wider (irradiation) and lasts longer (after-discharge).","traps":["Flexors contract on the \u003cb>same\u003c/b> side; extensors contract on the \u003cb>opposite\u003c/b> side.","The withdrawal reflex is \u003cb>superficial\u003c/b> and \u003cb>polysynaptic\u003c/b>, and its receptor is a pain-sensitive neuron, not a muscle spindle.","Irradiation = spread to more motor neurons (bigger response); after-discharge = repeated firing (longer response)."]},{"id":"t42","lec":25,"name":"Motor neurons, units & pools","big":"Lower motor neurons drive skeletal muscle, and their activity is modulated by upper motor neurons. A motor unit is one motor neuron plus all the muscle fibres it innervates; units are recruited from small to large to grade the force of contraction.","pts":["\u003cb>LMNs\u003c/b> have axons that end on skeletal muscle: \u003cb>anterior horn cells\u003c/b> of the spinal cord and neurons of the \u003cb>cranial nerve motor nuclei\u003c/b>.","LMNs produce coordinated, graded contractions in both voluntary and involuntary movements; their activity is modulated by UMNs.","\u003cb>UMNs\u003c/b>: neurons in the cerebral cortex and brainstem. They act on brainstem motor nuclei and spinal cord neurons, \u003cb>chiefly of the opposite side\u003c/b>, and never innervate muscles directly.","\u003cb>Motor unit\u003c/b> = one motor neuron and all the muscle fibres it innervates; the \u003cb>smallest functional component\u003c/b> of the motor system.","\u003cb>Innervation ratio\u003c/b> = number of muscle fibres in each motor unit: \u003cb>3 to 2000\u003c/b>.","Leg antigravity muscles: large units, \u003cb>more than 1000\u003c/b> fibres per α motor neuron. Finger and eye muscles: as few as \u003cb>three\u003c/b>.","Figure: small ratio for rapid, precise, low-power movement (e.g. eye muscles); large ratio for power without precise control (e.g. calf muscles).","\u003cb>Recruitment\u003c/b> = increasing the number of active motor units; the more units recruited, the greater the force.","\u003cb>Size principle\u003c/b>: during voluntary movement the smallest units are activated first, then fast fatigue-resistant, and finally fast fatigue units.","\u003cb>Motor (neuron) pool\u003c/b> = the α motor neurons that innervate one muscle (e.g. biceps brachii). It contains two LMN types: \u003cb>α\u003c/b> (larger; extrafusal fibres; force for movement and postural balance) and \u003cb>γ\u003c/b> (smaller; intrafusal fibres; regulate spindle tension)."],"table":{"head":["","Large motor units","Small motor units"],"rows":[["Motoneurons","Large","Small"],["Muscle fibres supplied","Many","Few"],["Threshold","Highest","Lowest"],["Firing order","Fire last","Fire first"],["Force","Largest","Smallest"]]},"hook":"Small units are the early birds: lowest threshold, first to fire, smallest force. Big units are called in last, when you need power.","traps":["Motor \u003cb>unit\u003c/b> = one neuron + its fibres; motor \u003cb>pool\u003c/b> = all the α motor neurons supplying one muscle.","Small innervation ratio = \u003cb>precision\u003c/b> (eyes, fingers); large ratio = \u003cb>power\u003c/b> (leg antigravity muscles, calf).","Large motor units have the \u003cb>highest\u003c/b> threshold and fire \u003cb>last\u003c/b>."]},{"id":"t43","lec":25,"name":"Hierarchy of motor control","big":"Movement is organised in three cooperating levels linked by feedback loops: the highest level plans the strategy, the middle level turns it into tactics and motor programs, and the lowest level executes them.","pts":["The hierarchy is the set of levels that cooperate to \u003cb>plan, initiate and execute\u003c/b> movement; each has a distinct role, but they interact continuously through \u003cb>feedback loops\u003c/b>.","\u003cb>Highest level (strategy/planning)\u003c/b>: association cortex (prefrontal, posterior parietal) and the \u003cb>basal ganglia\u003c/b>.","Highest-level jobs: decide \u003cb>what\u003c/b> movement to make and \u003cb>why\u003c/b>; integrate sensory information with experience and motivation; select the best motor plan (e.g. reaching for a glass vs waving).","\u003cb>Middle level (tactics)\u003c/b>: motor cortex (primary motor area, premotor cortex, supplementary motor area) and the \u003cb>cerebellum\u003c/b>.","Middle-level jobs: translate goals into tactics (sequence, timing and coordination of muscles); generate \u003cb>motor programs\u003c/b>; the cerebellum adjusts for \u003cb>accuracy, smoothness and coordination\u003c/b>.","\u003cb>Lowest level (execution)\u003c/b>: brainstem motor centres (vestibular nuclei, reticular formation, red nucleus, tectum) and the spinal cord (local circuits, motor neurons).","Lowest-level jobs: direct activation of motor neurons; execution of refined movement programs; reflex integration and posture control; adjustment of \u003cb>force, speed and muscle tone\u003c/b>."],"table":{"head":["","Highest (strategy)","Middle (tactics)","Lowest (execution)"],"rows":[["Structures","Association cortex (prefrontal, posterior parietal); basal ganglia","Motor cortex (primary, premotor, SMA); cerebellum","Brainstem centres (vestibular nuclei, reticular formation, red nucleus, tectum); spinal cord"],["Functions","Decide what and why; integrate sensory input with experience and motivation; pick the best plan","Sequence, timing, coordination; motor programs; cerebellum adjusts accuracy and smoothness","Activate motor neurons; execute programs; reflexes and posture; force, speed, tone"]]},"hook":"Strategy → Tactics → Execution = What and why? → How, in what order? → Do it.","traps":["In your notes the \u003cb>basal ganglia\u003c/b> sit at the highest (planning) level and the \u003cb>cerebellum\u003c/b> at the middle (tactics) level.","The red nucleus, vestibular nuclei, reticular formation and tectum are \u003cb>lowest-level\u003c/b> brainstem centres.","Force, speed and muscle tone are adjusted at the \u003cb>lowest\u003c/b> level, not the planning level."]},{"id":"t44","lec":26,"name":"Upper motor neuron lesion (UMNL)","big":"An upper motor neuron lesion damages motor neurons in the motor cortex or the descending tracts above the anterior horn cells or cranial nerve motor nuclei. It usually gives widespread spastic paralysis on the opposite side, with exaggerated deep reflexes, clonus, lost superficial reflexes, a positive Babinski sign and little wasting.","pts":["The motor system starts, controls and carries out voluntary movement. It has two types of motor neuron: \u003cb>upper\u003c/b> and \u003cb>lower\u003c/b>. Each level of lesion gives its own pattern of deficits.","\u003cb>UMNL\u003c/b>: damage to motor neurons in the motor cortex or in descending tracts above the anterior horn cell (spinal cord) or cranial nerve motor nuclei (brainstem). Causes: mainly vascular, trauma, tumour and degenerative disease.","Most common site: the \u003cb>internal capsule\u003c/b>, commonly from vascular disorders.","Paralysis is usually on the \u003cb>opposite side\u003c/b> (the motor tracts cross) and \u003cb>widespread\u003c/b>, because pyramidal fibres form a compact bundle in a small area.","\u003cb>Spasticity\u003c/b> (clasp-knife): less inhibitory discharge from the inhibitory reticular formation (IRF) onto gamma efferents, while the facilitatory reticular formation (FRF) keeps firing. Gamma efferent discharge rises.","Normally the \u003cb>FRF discharges spontaneously\u003c/b>; the \u003cb>IRF does not\u003c/b> and is driven by fibres from the cerebral cortex, which a UMNL cuts. The intact \u003cb>vestibulospinal tracts\u003c/b> add more facilitation of tone.","\u003cb>Hyperreflexia\u003c/b>: supraspinal facilitation makes muscle spindles more active to stretch.","\u003cb>Clonus\u003c/b> (ankle or knee): regular rhythmic contraction and relaxation of a spastic muscle under a sudden sustained stretch, driven by a stretch reflex then inverse stretch reflex (GTO) cycle.","\u003cb>Superficial reflexes\u003c/b> (abdominal, cremasteric) are lost because they need facilitation from the pyramidal tract. \u003cb>Babinski sign\u003c/b>: dorsiflexion of the big toe and fanning of the other toes. It is part of the spinal withdrawal reflex, normally inhibited by the corticospinal tract.","Muscle status: \u003cb>no or little wasting\u003c/b>, because of the hypertonia."],"lists":[{"h":"Clonus cycle","ordered":true,"items":["The muscle is suddenly stretched","Muscle spindles fire and the muscle contracts (stretch reflex)","The examiner's maintained pressure raises muscle tension","Golgi tendon organs (GTO) fire and the muscle relaxes (inverse stretch reflex)","The stretch is still there, so a new stretch reflex occurs (helped by excess spinal facilitation)"]},{"h":"Abdominal reflex test (figure)","ordered":true,"items":["Use a blunt object such as a key or tongue blade","Stroke the abdomen lightly on each side, inward and downward","Normal: the abdominal muscles contract and the umbilicus moves \u003cb>towards\u003c/b> the stimulus"]}],"hook":"UMN signs go UP: tone up (spastic), deep reflexes up, big toe up (Babinski). The odd one out is the superficial reflexes, which go away.","traps":["A UMN lesion in the brain usually gives weakness on the \u003cb>opposite\u003c/b> side, because the motor tracts cross.","Deep reflexes are \u003cb>exaggerated\u003c/b> in UMNL, but superficial reflexes (abdominal, cremasteric) are \u003cb>lost\u003c/b>.","Spasticity comes from the IRF losing its cortical drive, so gamma efferent discharge rises. It is not extra drive from the cortex."]},{"id":"t45","lec":26,"name":"LMN lesion and UMN vs LMN","big":"A lower motor neuron lesion damages the anterior (ventral) horn cells, the cranial nerve motor nuclei or their axons. It gives localized, same-side flaccid paralysis of individual muscles, with reduced or absent deep reflexes, marked wasting and signs of denervation.","pts":["\u003cb>LMNL\u003c/b>: damage to lower motor neurons in the spinal \u003cb>ventral horns\u003c/b>, the \u003cb>motor nuclei of cranial nerves\u003c/b> in the brainstem, or their axons.","Main causes: \u003cb>poliomyelitis\u003c/b> or trauma to peripheral nerves.","Paralysis is on the \u003cb>same side\u003c/b> and \u003cb>localized\u003c/b>, affecting \u003cb>individual muscles\u003c/b> (UMN weakness affects muscle groups).","\u003cb>Hypotonia\u003c/b> or flaccidity, because the \u003cb>stretch reflex arc is cut\u003c/b>.","Deep reflexes are \u003cb>decreased or absent\u003c/b> in the affected segment.","Plantar reflex: \u003cb>normal\u003c/b>, or absent if the muscles involved are paralysed. No Babinski sign.","Superficial reflexes: \u003cb>lost in the affected segment\u003c/b> if they involve contraction of the denervated muscle.","\u003cb>Marked wasting\u003c/b>, because the muscle is deprived of its motor supply.","Signs of denervation: \u003cb>fasciculations\u003c/b> (muscle twitches visible under the skin) and \u003cb>fibrillations\u003c/b> (muscle potentials detected by \u003cb>electromyography\u003c/b>)."],"table":{"head":["Feature","UMN lesion","LMN lesion"],"rows":[["Weakness","Muscle groups","Individual muscles"],["Tone","↑ (spastic)","↓ (flaccid)"],["Reflexes","↑ (hyperreflexia, clonus)","↓ or absent"],["Pathological reflexes","Present (Babinski +)","Absent"],["Superficial reflexes","Absent","Absent"],["Atrophy","Mild (disuse)","Severe (denervation)"],["Fasciculations","Absent","Present"]]},"hook":"LMN = LESS: less tone, fewer reflexes, less muscle (wasting), plus the twitches of denervation (fasciculations).","traps":["The table lists superficial reflexes as \u003cb>absent in both\u003c/b> UMN and LMN lesions (in LMNL they are lost in the affected segment).","Fasciculations are twitches \u003cb>visible under the skin\u003c/b>; fibrillations are muscle potentials detected by \u003cb>electromyography (EMG)\u003c/b>.","Atrophy happens in both: \u003cb>mild (disuse)\u003c/b> in UMNL, \u003cb>severe (denervation)\u003c/b> in LMNL."]},{"id":"t46","lec":26,"name":"SCI: complete cord transection","big":"Spinal cord injury, most often from trauma, causes motor, sensory and autonomic loss that depends on its level and extent. After a complete transection there is first spinal shock (everything below is lost), then a stage of recovery in which reflexes return, often exaggerated. Voluntary movement and sensation below the lesion never return.","pts":["Causes of SCI: trauma, ischemia, infection, tumour, degenerative disease. \u003cb>Trauma\u003c/b> is the most common. Types: complete transection, or incomplete such as hemisection (Brown-Séquard).","Level: above \u003cb>C3\u003c/b> → immediate death from \u003cb>respiratory arrest\u003c/b> (as in hanging). Lower cervical → \u003cb>quadriplegia\u003c/b> (all four limbs). Thoracic → \u003cb>paraplegia\u003c/b> (both lower limbs).","\u003cb>Spinal shock\u003c/b>: all spinal reflexes below the lesion are reduced, mainly from \u003cb>sudden withdrawal of tonic facilitatory influence from the brain\u003c/b>.","Duration is proportionate to the degree of encephalization: \u003cb>1–2 h\u003c/b> in dogs and cats; in humans at least \u003cb>2 weeks\u003c/b> without complications (table: 2–6 weeks).","Spinal shock signs: flaccid paralysis, areflexia, loss of all sensation below the lesion, loss of bladder and bowel control (\u003cb>retention with overflow\u003c/b>), loss of erection.","Blood pressure drops if the transection is at \u003cb>T1\u003c/b>, but only slightly if it is below \u003cb>L2\u003c/b>, because sympathetic activity is blocked.","Complications (\u003cb>urinary tract infection, malnutrition, decubitus ulcers\u003c/b>) make spinal shock last much longer or even prevent recovery.","Recovery: reflexes return, often exaggerated. Sympathetic vasoconstrictor centres in the \u003cb>lateral horn\u003c/b> regain activity, so arterioles and veins regain tone.","Micturition and defecation become \u003cb>automatic\u003c/b>, as in children, with \u003cb>residual urine\u003c/b> because the reflex is weak.","\u003cb>Mass reflex\u003c/b>: a noxious skin stimulus gives flexor spasm of both legs, abdominal wall contraction and autonomic effects (sweating, pallor, swinging BP, micturition, defecation). Voluntary movement and sensation are \u003cb>permanently lost\u003c/b>."],"table":{"head":["","Spinal shock","Recovery"],"rows":[["Duration","2–6 weeks (text: at least 2 weeks in humans)","Variable, weeks to months"],["Cause","Sudden withdrawal of supraspinal facilitation (tonic discharge) on alpha motor neurons from reticulospinal, vestibulospinal and corticospinal tracts","Spinal neurons below the lesion become more excitable: disinhibition, denervation sensitivity, sprouting of collaterals"],["Motor and reflexes","Flaccid paralysis of all muscles below; loss of all deep and superficial reflexes","Stretch reflexes (often exaggerated), Babinski sign, flexor tendon reflexes, mass reflex"],["Sensation and voluntary movement","All sensation below the lesion lost","Voluntary movement and sensation permanently lost"],["Bladder","Retention with overflow","Automatic micturition (with residual urine)"],["Blood pressure","Vasodilatation → hypotension","Gradual rise in blood pressure"]]},"lists":[{"h":"Mechanisms of recovery","ordered":false,"items":["\u003cb>Denervation hypersensitivity\u003c/b> to mediators released by the remaining spinal excitatory endings","\u003cb>Sprouting of collaterals\u003c/b> from existing neurons, forming extra excitatory endings on interneurons and motor neurons","\u003cb>More postsynaptic receptors\u003c/b>","\u003cb>Disinhibition\u003c/b>: no inhibitory impulses from higher motor centres (table)"]}],"hook":"Spinal shock = everything below switched OFF (flaccid, no reflexes, no sensation). Recovery = reflexes switched back ON, often too strongly, but with no voluntary control.","traps":["Above C3 kills (respiratory arrest); a lower cervical lesion gives quadriplegia; a thoracic lesion gives paraplegia.","Reflexes come back in recovery, but \u003cb>voluntary movement and sensation\u003c/b> below a complete transection do not.","Blood pressure drops with a transection at T1; below L2 the drop is only slight."]},{"id":"t47","lec":26,"name":"Hemisection: Brown-Séquard syndrome","big":"Cutting one half of the cord (an incomplete SCI) gives Brown-Séquard syndrome. Below the lesion there is same-side loss of discriminative touch, vibration and proprioception and same-side spastic weakness. On the opposite side, pain and temperature are lost from one or two segments below.","pts":["SCI can be a complete transection or \u003cb>incomplete\u003c/b>, such as a \u003cb>hemisection\u003c/b>, which gives \u003cb>Brown-Séquard syndrome\u003c/b>.","Fasciculus gracilis / cuneatus (dorsal columns) → \u003cb>ipsilateral\u003c/b> loss of discriminative touch, vibration and proprioception below the lesion.","Spinothalamic tract → \u003cb>contralateral\u003c/b> loss of pain and temperature, starting \u003cb>one or two segments below\u003c/b> the lesion.","(Lateral) corticospinal tract → \u003cb>ipsilateral\u003c/b> weakness and spasticity (UMN signs) below the lesion.","Anterior horn cells (figure) → \u003cb>ipsilateral LMN\u003c/b> signs \u003cb>at the level\u003c/b> of the lesion.","A precise hemisection is rare, but the syndrome is common: \u003cb>spinal cord tumour, trauma, degenerative disc disease and ischemia\u003c/b>.","Figure, right hemisection at T12: a band of loss of all sensation on the right at the lesion level; right leg paralysis and loss of proprioception and vibration; left leg loss of pain and temperature.","Localizing rule: the hemisection is on the side of the \u003cb>weakness and dorsal column loss\u003c/b>, opposite the pain and temperature loss."],"table":{"head":["Structure damaged","Side","Deficit"],"rows":[["Dorsal columns (gracilis, cuneatus)","Same side, below lesion","Loss of discriminative touch, vibration, proprioception"],["Spinothalamic tract","Opposite side, from 1–2 segments below","Loss of pain and temperature"],["Lateral corticospinal tract","Same side, below lesion","Weakness and spasticity (UMN)"],["Anterior horn cells","Same side, at the level","LMN dysfunction"]]},"hook":"In Brown-Séquard, pain and temperature are the odd ones out: they are lost on the opposite side. Touch, vibration, proprioception and power are all lost on the same side.","traps":["Pain and temperature loss starts one or two segments \u003cb>below\u003c/b> the lesion, not at it.","Corticospinal damage in the cord gives weakness on the \u003cb>same\u003c/b> side, unlike a UMN lesion in the brain (e.g. internal capsule), which gives weakness on the opposite side.","The anterior horn damage gives \u003cb>LMN\u003c/b> signs only at the level of the lesion; below it the signs are \u003cb>UMN\u003c/b>."]},{"id":"t48","lec":27,"name":"Neuroglia and astrocytes","big":"Neuroglia are the supporting cells of the nervous system and make up about half the brain mass. The CNS has four types (astrocytes, oligodendrocytes, microglia, ependymal cells); the PNS has Schwann cells. Astrocytes are the most common CNS glia: large stellate cells marked by GFAP, in protoplasmic (grey matter) and fibrous (white matter) forms.","pts":["\u003cb>Neuroglia\u003c/b> are the supporting cells of the nervous system and make up about \u003cb>half the brain mass\u003c/b>.","Functions: \u003cb>structural and metabolic support\u003c/b>, \u003cb>immune functions\u003c/b> and \u003cb>electrical insulation of axons\u003c/b>.","CNS neuroglia: \u003cb>astrocytes, oligodendrocytes, microglia, ependymal cells\u003c/b>. PNS neuroglia: \u003cb>Schwann cells\u003c/b>.","\u003cb>Astrocytes\u003c/b> are the most common glial cells in the CNS.","They are told apart from neurons by a specific protein: \u003cb>glial fibrillary acidic protein (GFAP)\u003c/b>.","Origin: \u003cb>radial glial cells\u003c/b>, which in early development span the cerebral cortex as a scaffold for new nerve cells migrating to their destinations.","Structure: large, \u003cb>stellate\u003c/b> cells whose many radiating processes surround \u003cb>neurons, capillaries and the ependymal cells\u003c/b> lining the ventricles.","Two types (Fig. 2): \u003cb>protoplasmic\u003c/b> and \u003cb>fibrous\u003c/b>. The figure shows an astrocyte \u003cb>perivascular foot\u003c/b> on a blood vessel."],"table":{"head":["","Protoplasmic astrocyte","Fibrous astrocyte"],"rows":[["Where","Mainly \u003cb>grey\u003c/b> matter","Mainly \u003cb>white\u003c/b> matter of the CNS"],["Processes","Many, \u003cb>short, branching\u003c/b>","\u003cb>Long, unbranched\u003c/b>"]]},"hook":"Protoplasmic = plenty of short branches, in grey matter. Fibrous = long straight fibres, in white matter.","traps":["Schwann cells are the PNS glia. The other four types (astrocytes, oligodendrocytes, microglia, ependymal cells) are all in the CNS.","Protoplasmic astrocytes are in \u003cb>grey\u003c/b> matter with short branched processes; fibrous astrocytes are in \u003cb>white\u003c/b> matter with long unbranched ones."]},{"id":"t49","lec":27,"name":"Astrocyte functions and the BBB","big":"Astrocytes help form the blood–brain barrier, control K+ around neurons, store glycogen for neurons, handle neurotransmitters and may signal with Ca2+ waves through gap junctions. The barrier itself is the tightly joined endothelium of continuous brain capillaries, with features induced by factors from astrocyte endfeet.","pts":["The \u003cb>blood–brain barrier (BBB)\u003c/b> stops blood-borne compounds entering the brain unless they are specifically transported.","Layers from the lumen outward: \u003cb>endothelial cells\u003c/b> (of the \u003cb>continuous\u003c/b> brain capillaries) → \u003cb>basement membrane\u003c/b> → \u003cb>astrocyte endfeet\u003c/b>. Fig. 3 also labels \u003cb>pericytes (P)\u003c/b>.","The endfeet \u003cb>do not touch\u003c/b> the endothelial cells. They produce \u003cb>factors that induce\u003c/b> the special features of the endothelium.","Endothelial features: \u003cb>high transendothelial resistance\u003c/b> (from long, complex \u003cb>tight junctions\u003c/b> between endothelial cells), \u003cb>very few pores\u003c/b> and \u003cb>limited transcytosis\u003c/b>.","Astrocytes regulate \u003cb>K\u003csup>+\u003c/sup>\u003c/b> levels in the extracellular medium around neurons.","They store \u003cb>glycogen\u003c/b> and supply it to neurons as \u003cb>lactate\u003c/b> when needed.","They control neurotransmitter distribution by \u003cb>restricting diffusion\u003c/b> and \u003cb>taking transmitters up\u003c/b> to be metabolized or recycled.","Signalling: astrocytes are linked by \u003cb>gap junctions\u003c/b>. Neurotransmitters trigger Ca\u003csup>2+\u003c/sup> changes that spread between astrocytes as \u003cb>waves\u003c/b>. Gap junctions with neurons may let Ca\u003csup>2+\u003c/sup> pass and modulate neuron behaviour."],"hook":"BBB from blood to brain is E-B-A: Endothelium, Basement membrane, Astrocyte endfeet.","traps":["The tight junctions of the BBB are between \u003cb>endothelial cells\u003c/b>, not between astrocyte endfeet.","Astrocyte endfeet do \u003cb>not\u003c/b> touch the endothelium; a basement membrane lies between them.","Astrocytes are linked to each other by \u003cb>gap\u003c/b> junctions, which carry the Ca\u003csup>2+\u003c/sup> waves."]},{"id":"t50","lec":27,"name":"Oligodendrocytes, microglia, ependyma","big":"Oligodendrocytes are large cells with few processes that myelinate CNS axons; one cell may wrap several axons. Microglia are small spiny cells that act as macrophages: busy in development, quiet in the adult, reactive after injury. Ependymal cells are ciliated epithelial cells lining the ventricles, not joined by tight junctions.","pts":["\u003cb>Oligodendrocytes\u003c/b>: CNS neuroglia; \u003cb>large\u003c/b> cells with \u003cb>few processes\u003c/b>.","They carry out \u003cb>myelination in the CNS\u003c/b>. One oligodendrocyte may wrap \u003cb>several axons\u003c/b> with segments of myelin, while a Schwann cell myelinates a \u003cb>single\u003c/b> axon.","\u003cb>Microglia\u003c/b>: \u003cb>small\u003c/b> CNS cells with long \u003cb>spiny processes\u003c/b>.","In development they release \u003cb>growth factors\u003c/b> and act as \u003cb>macrophages\u003c/b>, removing debris from the programmed cell death that happens on a large scale then.","In the adult they are normally \u003cb>relatively inactive\u003c/b>. After almost any injury they revert to phagocytic macrophages and are called \u003cb>reactive\u003c/b>.","\u003cb>Ependymal cells\u003c/b>: simple epithelial cells with numerous \u003cb>microvilli\u003c/b> and \u003cb>one or two cilia\u003c/b> on the apical surface.","Their basolateral surface contacts astrocytic processes. They line the ventricles and are \u003cb>not connected by tight junctions\u003c/b> (Fig. 4 shows gap junctions, with the CSF below)."],"table":{"head":["","Oligodendrocyte","Microglia","Ependymal cell"],"rows":[["Look","Large, few processes","Small, long spiny processes","Simple epithelium; microvilli, 1–2 apical cilia"],["Key job","CNS myelination (several axons each)","Macrophage (development; reactive after injury)","Lines the ventricles"]]},"hook":"Microglia are the brain's small clean-up crew: quiet in the healthy adult, but they turn reactive and start eating debris after an injury.","traps":["CNS myelin comes from \u003cb>oligodendrocytes\u003c/b>; PNS myelin comes from Schwann cells.","Adult microglia are normally \u003cb>quiet\u003c/b>; they only become phagocytic (reactive) after injury.","Ependymal cells are \u003cb>not\u003c/b> joined by tight junctions."]},{"id":"t51","lec":27,"name":"Schwann cells, myelin and regeneration","big":"Schwann cells are flattened PNS glia that myelinate a single axon by wrapping their plasma membrane around it. Gaps between neighbouring cells form the nodes of Ranvier. Schwann cells also guide regrowth of peripheral axons at 2–5 mm a day, whereas CNS glia release factors that block axon regrowth.","pts":["\u003cb>Schwann cells\u003c/b>: PNS neuroglia; \u003cb>flattened\u003c/b> cells with a flattened nucleus. Each myelinates a \u003cb>single axon\u003c/b>, with the cell body closely apposed to the myelin sheath.","Myelination (Fig. 5): the Schwann cell \u003cb>envelops\u003c/b> the axon, \u003cb>rotates\u003c/b> several times wrapping its plasma membrane around it, then its cytoplasm is \u003cb>forced out\u003c/b> from between the membranes.","The squeezed-out cytoplasm plus the nucleus form the outer \u003cb>neurilemmal sheath (neurilemma)\u003c/b>.","\u003cb>Nodes of Ranvier\u003c/b>: regular gaps in the myelin that expose the axon. Each is the interface between the myelin sheaths of \u003cb>two different Schwann cells\u003c/b>.","A \u003cb>basal lamina\u003c/b> covers the outside of Schwann cells and \u003cb>dips into the nodes of Ranvier\u003c/b>, covering the overlapped myelin lamellae of adjacent cells.","\u003cb>Grey matter\u003c/b>: cell bodies and unmyelinated axons. \u003cb>White matter\u003c/b>: axons, most of them myelinated. \u003cb>Dendrites are never myelinated.\u003c/b>","Peripheral regeneration needs the axon tip to contact a Schwann cell. The axon then regrows \u003cb>2–5 mm per day\u003c/b> along the Schwann cells, which remyelinate it.","Damaged CNS neurons do not regenerate well, because \u003cb>CNS glial cells release factors that specifically inhibit axon growth\u003c/b>."],"lists":[{"h":"Regeneration of a peripheral axon","ordered":true,"items":["The axon tip makes contact with a Schwann cell","This stimulates mitosis in the Schwann cell","The Schwann cell extends processes towards the axon's growth cone","The axon regrows along the Schwann cells (2–5 mm per day)","The Schwann cells remyelinate the new axon"]}],"hook":"Schwann cells are loyal: one Schwann cell, one axon. Oligodendrocytes share themselves across several axons.","traps":["Each node of Ranvier lies \u003cb>between two different\u003c/b> Schwann cells, not in the middle of one.","Dendrites are \u003cb>never\u003c/b> myelinated.","Peripheral axons can regrow along Schwann cells; damaged CNS axons are blocked by factors from CNS glia."]}],"questions":[{"id":"t1q1","t":"t1","type":"mcq","d":1,"q":"On the superolateral surface, which groove forms the boundary between the frontal lobe and the parietal lobe?","o":[["Central sulcus"],["Lateral fissure","The lateral fissure is not the boundary between the frontal and parietal lobes."],["Calcarine sulcus","It is on the medial surface, inside the occipital lobe."],["Cingulate sulcus","It is on the medial surface, not at the boundary between these lobes."]],"x":"The \u003cb>central sulcus\u003c/b> separates the frontal lobe (in front) from the parietal lobe (behind)."},{"id":"t1q2","t":"t1","type":"tf","q":"The lateral fissure (of Sylvius) separates the temporal lobe from the frontal and parietal lobes.","a":true,"x":"The \u003cb>lateral fissure\u003c/b> has the temporal lobe below it and the frontal and parietal lobes above it."},{"id":"t1q3","t":"t1","type":"tf","q":"The parieto-occipital sulcus separates the parietal lobe from the temporal lobe.","a":false,"fix":"The parieto-occipital sulcus separates the parietal lobe from the occipital lobe.","x":"As its name says, the \u003cb>parieto-occipital sulcus\u003c/b> lies between the \u003cb>parietal\u003c/b> and \u003cb>occipital\u003c/b> lobes."},{"id":"t1q4","t":"t1","type":"type","q":"Which fissure separates the two cerebral hemispheres?","a":["longitudinal fissure","longitudinal","the longitudinal fissure","median longitudinal fissure"],"x":"The \u003cb>longitudinal fissure\u003c/b> is the deep groove in the midline between the right and left hemispheres."},{"id":"t1q5","t":"t1","type":"mcq","q":"Which structure connects the two cerebral hemispheres?","o":[["Corpus callosum"],["Longitudinal fissure","A fissure is a groove; it cannot connect the hemispheres."],["Insula","The insula lies within one hemisphere and does not join the two."],["Paracentral lobule","It is a region of the medial surface of one hemisphere."]],"x":"The \u003cb>corpus callosum\u003c/b> connects the two cortical hemispheres. Don't mix it up with the longitudinal fissure, which separates them."},{"id":"t1q6","t":"t1","type":"tf","q":"Sulci are the deep grooves of the cortex, while fissures are the shallow grooves between folds.","a":false,"fix":"Fissures are the deep grooves; sulci are the shallow grooves between folds (gyri).","x":"Your notes: \u003cb>fissures\u003c/b> = deep grooves, \u003cb>gyri\u003c/b> = elevated folds, \u003cb>sulci\u003c/b> = shallow grooves between folds."},{"id":"t1q7","t":"t1","type":"list","q":"Your notes link each of the four visible lobes with one main function. Give the function of the occipital, temporal, parietal and frontal lobes.","p":[["Occipital lobe: vision",["vision","visual","sight","see"]],["Temporal lobe: hearing",["hear","audit","sound"]],["Parietal lobe: sensory",["sens","touch","somat"]],["Frontal lobe: motor",["motor","move"]]],"need":4,"x":"Occipital = \u003cb>vision\u003c/b>, temporal = \u003cb>hearing\u003c/b>, parietal = \u003cb>sensory\u003c/b>, frontal = \u003cb>motor\u003c/b>."},{"id":"t1q8","t":"t1","type":"tf","q":"Besides the four main lobes, there is a limbic lobe that cannot be seen from the outside of the brain.","a":true,"x":"The \u003cb>limbic lobe\u003c/b> is the hidden fifth lobe. The four lobes you see from outside are frontal, parietal, temporal and occipital."},{"id":"t1q9","t":"t1","type":"multi","q":"Which are poles of the cerebral hemisphere? (select all)","o":[["Frontal pole",1],["Occipital pole",1],["Temporal pole",1],["Parietal pole",0,"Your notes list only three poles: frontal, occipital and temporal."],["Limbic pole",0,"The limbic lobe is hidden from view and is not one of the three poles."]],"x":"Each hemisphere has three poles: \u003cb>frontal\u003c/b>, \u003cb>occipital\u003c/b> and \u003cb>temporal\u003c/b>."},{"id":"t1q10","t":"t1","type":"tf","q":"Each cerebral hemisphere has four surfaces: superolateral, medial, inferior and posterior.","a":false,"fix":"Each hemisphere has three surfaces: superolateral, medial and inferior.","x":"Three surfaces: \u003cb>superolateral\u003c/b>, \u003cb>medial\u003c/b> and \u003cb>inferior\u003c/b>. The back of the hemisphere ends at the occipital pole, not a separate surface."},{"id":"t1q11","t":"t1","type":"mcq","q":"Which set correctly lists the borders of the cerebral hemisphere labelled in your notes?","o":[["Superomedial, inferolateral and inferomedial"],["Superomedial, superolateral and inferomedial","Superolateral is the name of a surface, not a border."],["Anteromedial, inferolateral and posteromedial","Your notes do not label anteromedial or posteromedial borders."],["Superomedial, inferolateral and posterolateral","The third labelled border is inferomedial, not posterolateral."]],"x":"The surfaces figure labels three borders: \u003cb>superomedial\u003c/b> (purple), \u003cb>inferolateral\u003c/b> (red) and \u003cb>inferomedial\u003c/b> (green)."},{"id":"t1q12","t":"t1","type":"mcq","q":"On the lateral surface, how are the boundaries between the parietal, occipital and temporal lobes established?","o":[["By continuing the parieto-occipital sulcus line downwards and the posterior ramus of the lateral fissure backwards to meet it"],["By continuing the central sulcus downwards until it meets the lateral fissure","The central sulcus is far in front of this area."],["By the calcarine sulcus running across the lateral surface","The calcarine sulcus is on the medial surface, not the lateral surface."],["By a separate deep temporo-occipital fissure","Your notes describe no such fissure; the boundary is made of imaginary lines."]],"x":"There is no real sulcus here. Extend the \u003cb>parieto-occipital sulcus\u003c/b> line downwards and the \u003cb>posterior ramus of the lateral fissure\u003c/b> backwards until they meet; these imaginary lines divide the parietal, occipital and temporal lobes."},{"id":"t2q1","t":"t2","type":"mcq","d":1,"q":"Which statement about the central sulcus is correct?","o":[["Primary motor cortex lies anterior to it (precentral gyrus); primary somatosensory cortex lies posterior to it (postcentral gyrus)"],["Primary somatosensory cortex lies anterior to it; primary motor cortex lies posterior to it","This is reversed: motor is precentral, sensory is postcentral."],["It separates the temporal lobe from the frontal lobe","That is not the role of the central sulcus."],["Primary auditory cortex lies directly in front of it","The gyrus directly in front of it holds the primary motor cortex."]],"x":"The central sulcus is a functional landmark: \u003cb>precentral gyrus = primary motor cortex\u003c/b> (in front), \u003cb>postcentral gyrus = primary somatosensory cortex\u003c/b> (behind)."},{"id":"t2q2","t":"t2","type":"tf","q":"The central sulcus lies between two parallel sulci, the precentral and postcentral sulci.","a":true,"x":"The \u003cb>precentral sulcus\u003c/b> runs in front of the central sulcus and the \u003cb>postcentral sulcus\u003c/b> behind it, parallel to it."},{"id":"t2q3","t":"t2","type":"multi","q":"On the lateral surface, which rami does the lateral sulcus give? (select all)","o":[["Anterior horizontal ramus",1],["Anterior ascending (superior) ramus",1],["Posterior ramus",1],["Inferior descending ramus",0,"Your notes list only three rami: anterior horizontal, anterior ascending and posterior."],["Medial ramus",0,"This is not one of the lateral sulcus rami in your notes."]],"x":"The stem of the lateral sulcus reaches the lateral surface and gives three rami: \u003cb>anterior horizontal\u003c/b>, \u003cb>anterior ascending (superior)\u003c/b> and \u003cb>posterior\u003c/b>."},{"id":"t2q4","t":"t2","type":"type","q":"What is the deep grey matter called that forms where the cortex folds into the lateral sulcus and stays hidden inside it?","a":["insula","the insula","insular cortex"],"x":"The lateral sulcus is deep. The cortex invaginates here and forms the \u003cb>insula\u003c/b>, which is hidden from the surface."},{"id":"t2q5","t":"t2","type":"mcq","q":"Broca's area lies around which part of the lateral sulcus?","o":[["Its ascending and horizontal rami"],["Its posterior ramus","Broca's area is at the front, around the two anterior rami."],["Its stem on the inferior surface","The stem is on the inferior surface; Broca's area is on the superolateral surface."],["The insula in its depth","The insula is hidden deep grey matter, not Broca's area."]],"x":"\u003cb>Broca's area\u003c/b> sits around the \u003cb>anterior ascending and anterior horizontal rami\u003c/b> of the lateral sulcus."},{"id":"t2q6","t":"t2","type":"tf","q":"In the Brodmann figure in your notes, the primary motor cortex is labelled BA 6.","a":false,"fix":"The primary motor cortex is BA 4; BA 6 is the lateral premotor area.","x":"Primary motor cortex (precentral gyrus) = \u003cb>BA 4\u003c/b>. In front of it the figure shows the lateral premotor area (BA 6), then the frontal eye field (BA 8)."},{"id":"t2q7","t":"t2","type":"tf","q":"In the Brodmann figure, the inferior parietal lobule is made up of the supramarginal gyrus (BA 40) and the angular gyrus (BA 39).","a":true,"x":"The figure brackets the \u003cb>supramarginal gyrus (BA 40)\u003c/b> and the \u003cb>angular gyrus (BA 39)\u003c/b> together as the \u003cb>inferior parietal lobule\u003c/b>, behind the primary somatosensory cortex."},{"id":"t3q1","t":"t3","type":"mcq","d":1,"q":"A region on the medial surface contains the primary motor and somatosensory areas for the opposite lower limb and perineum. Which region is it?","o":[["Paracentral lobule"],["Cingulate gyrus","Your notes do not give it motor or sensory limb areas."],["Medial frontal gyrus","Your notes do not give it motor or sensory limb areas."],["Cuneus","It is part of the occipital lobe, not a limb area."]],"x":"The \u003cb>paracentral lobule\u003c/b> contains both the primary motor and the somatosensory regions for the \u003cb>lower limb and perineum\u003c/b>, controlling the opposite side of the body."},{"id":"t3q2","t":"t3","type":"tf","q":"The cingulate sulcus follows the curvature of the corpus callosum and extends through both the frontal and parietal lobes.","a":true,"x":"The \u003cb>cingulate sulcus\u003c/b> arches around the corpus callosum on the medial surface, running through the frontal and parietal lobes."},{"id":"t3q3","t":"t3","type":"mcq","q":"Functionally, the cingulate gyrus is associated with which of these?","o":[["Limbic lobe"],["Occipital lobe","Your notes link the cingulate gyrus with the limbic lobe, not the occipital lobe."],["Prefrontal area","Your notes give the prefrontal role to a different medial gyrus; the cingulate gyrus is linked with the limbic lobe."],["Temporal lobe","Your notes link the cingulate gyrus with the limbic lobe, not the temporal lobe."]],"x":"The \u003cb>cingulate gyrus\u003c/b> lies just below the cingulate sulcus and is functionally associated with the \u003cb>limbic lobe\u003c/b>."},{"id":"t3q4","t":"t3","type":"tf","q":"The cingulate sulcus ends by turning upwards and continues onto the lateral surface as the precentral sulcus.","a":false,"fix":"It continues onto the lateral surface as the postcentral sulcus.","x":"The upturned end of the cingulate sulcus becomes the \u003cb>postcentral sulcus\u003c/b>. The central sulcus is just in front of it, so the gyrus between them is the postcentral gyrus."},{"id":"t3q5","t":"t3","type":"tf","q":"The paracentral lobule lies anterior to the point where the cingulate sulcus turns up onto the lateral surface.","a":true,"x":"Use the upturned end of the cingulate sulcus as a landmark: the \u003cb>paracentral lobule\u003c/b> is just in front of it."},{"id":"t3q6","t":"t3","type":"type","q":"Which gyrus lies below (inferior to) the calcarine sulcus?","a":["lingual gyrus","lingual","the lingual gyrus"],"x":"The calcarine sulcus splits the occipital lobe into the \u003cb>lingual gyrus\u003c/b> below and the cuneus above. Both parts are linked with vision."},{"id":"t3q7","t":"t3","type":"mcq","q":"On the medial surface, the cuneus lies posterior to which sulcus?","o":[["Parieto-occipital sulcus"],["Cingulate sulcus","It lies well in front of the occipital lobe."],["Collateral sulcus","It is on the inferior surface."],["Central sulcus","It is far forward, between the precentral and postcentral gyri."]],"x":"The \u003cb>cuneus\u003c/b> is the part of the occipital lobe above the calcarine sulcus, lying behind the \u003cb>parieto-occipital sulcus\u003c/b>."},{"id":"t3q8","t":"t3","type":"tf","q":"The calcarine sulcus is located at the front (rostral) end of the medial surface.","a":false,"fix":"The calcarine sulcus is at the caudal (back) end of the medial surface.","x":"The calcarine sulcus is in the occipital lobe, at the \u003cb>caudal end\u003c/b> of the medial surface."},{"id":"t3q9","t":"t3","type":"mcq","q":"Functionally, the medial frontal gyrus is considered part of which area?","o":[["Prefrontal area (behaviour, attention and concentration)"],["Primary motor cortex","That lies in the precentral gyrus."],["Limbic lobe","Your notes class the medial frontal gyrus as prefrontal, not limbic."],["Primary somatosensory cortex","That lies in the postcentral gyrus."]],"x":"The \u003cb>medial frontal gyrus\u003c/b> is part of the frontal lobe in front of the cingulate sulcus. It counts as \u003cb>prefrontal\u003c/b> cortex, responsible for behaviour, attention and concentration."},{"id":"t3q10","t":"t3","type":"order","q":"Using the medial surface figure in your notes, put these in order from front to back along the upper part of the medial surface.","o":["Medial frontal gyrus","Paracentral lobule","Precuneus","Cuneus"],"x":"Front to back: medial frontal gyrus → paracentral lobule → precuneus → cuneus."},{"id":"t4q1","t":"t4","type":"mcq","d":1,"q":"What divides the inferior surface of the cerebral hemisphere into an orbital part and a tentorial part?","o":[["The stem of the lateral sulcus"],["The collateral sulcus","It runs within the tentorial part; it does not separate it from the orbital part."],["The calcarine sulcus","It is an occipital lobe sulcus linked with vision."],["The longitudinal fissure","It does not cross the inferior surface of one hemisphere."]],"x":"The \u003cb>stem of the lateral sulcus\u003c/b> crosses the inferior surface: in front is the \u003cb>orbital\u003c/b> part (above the orbit) and behind it is the \u003cb>tentorial\u003c/b> part."},{"id":"t4q2","t":"t4","type":"tf","q":"On the inferior surface of the temporal lobe, the parahippocampal gyrus is the most lateral gyrus.","a":false,"fix":"The parahippocampal gyrus is the most medial gyrus on the inferior surface of the temporal lobe.","x":"The \u003cb>parahippocampal gyrus\u003c/b> is the \u003cb>most medial\u003c/b> gyrus of the inferior temporal surface."},{"id":"t4q3","t":"t4","type":"type","q":"The anterior end of the parahippocampal gyrus expands to form which structure?","a":["uncus","the uncus"],"x":"The \u003cb>uncus\u003c/b> is the expanded anterior end of the parahippocampal gyrus. In the inferior surface figure it sits next to the rhinal sulcus."},{"id":"t4q4","t":"t4","type":"mcq","q":"The parahippocampal gyrus and uncus lie medial to which sulcus?","o":[["Collateral sulcus"],["Calcarine sulcus","It belongs to the occipital lobe's visual area."],["Occipitotemporal sulcus","In the figure it lies further lateral, beyond the collateral sulcus."],["Central sulcus","It is on the superolateral surface."]],"x":"Your notes: the parahippocampal gyrus and uncus are \u003cb>medial to the collateral sulcus\u003c/b>. In the figure, the occipitotemporal sulcus lies further lateral."},{"id":"t4q5","t":"t4","type":"multi","q":"The parahippocampal gyrus and uncus are concerned with which functions? (select all)","o":[["Smell (olfactory system)",1],["Memory",1],["Vision",0,"Your notes link these gyri with smell and memory, not vision."],["Motor speech",0,"Your notes link these gyri with smell and memory, not speech."]],"x":"Your notes link these medial temporal structures with the \u003cb>olfactory (smell) system\u003c/b> and \u003cb>memory\u003c/b>."},{"id":"t4q6","t":"t4","type":"tf","q":"The olfactory gyrus is located in the orbitofrontal cortex, the part of the brain that sits above the orbit.","a":true,"x":"The \u003cb>orbitofrontal cortex\u003c/b> sits above the orbit in the skull and contains the \u003cb>olfactory gyrus\u003c/b>."},{"id":"t4q7","t":"t4","type":"mcq","q":"Your notes say the olfactory gyrus and related structures form part of the limbic system. What is the limbic system involved in?","o":[["Emotional processing and perception"],["Voluntary movement of the opposite side","Your notes link the limbic system with emotional processing and perception, not movement."],["Producing speech","Your notes link the limbic system with emotional processing and perception, not speech."],["Hearing","Your notes link the limbic system with emotional processing and perception, not hearing."]],"x":"The olfactory gyrus and related structures belong to the \u003cb>limbic system\u003c/b>, which is involved in \u003cb>emotional processing and perception\u003c/b>."},{"id":"t4q8","t":"t4","type":"tf","q":"A lesion involving the calcarine sulcus causes loss of vision in the visual field on the same side.","a":false,"fix":"It causes loss of vision in the opposite visual field.","x":"The calcarine sulcus region is visual cortex, and like the motor cortex it works crosswise: a lesion causes loss of vision in the \u003cb>opposite visual field\u003c/b>."},{"id":"t4q9","t":"t4","type":"mcq","q":"In the inferior surface figure in your notes, which gyrus lies medial to the olfactory tract on the orbital surface?","o":[["Gyrus rectus"],["Medial orbital gyrus","It is one of the orbital gyri, lateral to the olfactory tract."],["Uncus","It lies behind the stem of the lateral sulcus, in the tentorial part."],["Lingual gyrus","It lies far back, in the occipital part of the tentorial surface."]],"x":"On the orbital part, the \u003cb>gyrus rectus\u003c/b> runs along the medial edge, beside the olfactory bulb and tract; the orbital gyri lie lateral to them."},{"id":"t5q1","t":"t5","type":"mcq","d":1,"q":"Which pairing of circulation and territory is correct?","o":[["Anterior: supratentorial structures; posterior: posterior fossa structures (cerebellum and brainstem)"],["Anterior: posterior fossa structures; posterior: supratentorial structures","This is reversed."],["Anterior: cerebellum; posterior: cerebral cortex","The cerebellum is in the posterior fossa, so it is supplied by the posterior circulation."],["Anterior: brainstem; posterior: cerebellum only","The brainstem and cerebellum are both posterior fossa structures, supplied by the posterior circulation."]],"x":"The \u003cb>anterior (carotid)\u003c/b> circulation supplies supratentorial structures (your notes: the cortex and diencephalon). The \u003cb>posterior (vertebrobasilar)\u003c/b> circulation supplies the posterior fossa: the cerebellum and brainstem."},{"id":"t5q2","t":"t5","type":"tf","q":"The anterior circulation enters the skull cavity through the foramen magnum.","a":false,"fix":"The anterior circulation enters through the foramen lacerum; the posterior circulation enters through the foramen magnum.","x":"Front door and back door: the ICA comes in through the \u003cb>foramen lacerum\u003c/b>, while the vertebral arteries come in through the \u003cb>foramen magnum\u003c/b>."},{"id":"t5q3","t":"t5","type":"tf","q":"The internal carotid artery enters the skull through the carotid canal.","a":true,"x":"The ICA runs through the \u003cb>carotid canal\u003c/b> and then emerges inside the skull."},{"id":"t5q4","t":"t5","type":"mcq","q":"During its stepwise turns, the intracranial internal carotid artery passes through which venous sinus?","o":[["Cavernous sinus"],["Superior sagittal sinus","Your notes describe the ICA passing through the cavernous sinus, not this one."],["Straight sinus","Your notes describe the ICA passing through the cavernous sinus, not this one."],["Transverse sinus","Your notes describe the ICA passing through the cavernous sinus, not this one."]],"x":"The intracranial ICA makes a series of \u003cb>stepwise turns\u003c/b> as it passes through the \u003cb>cavernous sinus\u003c/b> on each side."},{"id":"t5q5","t":"t5","type":"type","q":"Next to which structure does each internal carotid artery emerge and divide into its major branches?","a":["optic chiasma","optic chiasm","chiasma","chiasm"],"x":"Each ICA emerges beside the \u003cb>optic chiasma\u003c/b> and divides there into the MCA and ACA."},{"id":"t5q6","t":"t5","type":"list","q":"Name at least four of the five branches of the internal carotid artery listed in your notes.","p":[["Ophthalmic artery",["ophthalm","opthalm"]],["Anterior cerebral artery",["anterior cerebral","aca","ant cerebral"]],["Middle cerebral artery",["middle cerebral","mca","middle"]],["Anterior choroidal artery",["choroid","ant choroid"]],["Posterior communicating artery",["posterior communicat","pcom","post comm"]]],"need":4,"x":"ICA branches (Fig. 2): \u003cb>ophthalmic\u003c/b>, \u003cb>anterior cerebral\u003c/b>, \u003cb>middle cerebral\u003c/b>, \u003cb>anterior choroidal\u003c/b> and \u003cb>posterior communicating\u003c/b> arteries. The ACA and MCA are its two terminal branches."},{"id":"t5q7","t":"t5","type":"tf","q":"In Fig. 1, the internal and external carotid arteries both arise from the common carotid artery.","a":true,"x":"Fig. 1 follows the anterior circulation from the aorta up the \u003cb>common carotid artery\u003c/b>, which gives the internal and external carotid arteries."},{"id":"t6q1","t":"t6","type":"mcq","d":1,"q":"Occlusion of which arteries is described in your notes as the chief cause of classic stroke?","o":[["The deep (lateral and medial striate) branches of the MCA"],["The anterior communicating artery","It is a connecting vessel of the circle of Willis, not the vessel your notes link with classic stroke."],["The posterior cerebral artery","Your notes do not name PCA occlusion as the chief cause of classic stroke."],["The ophthalmic artery","It is an ICA branch, but your notes do not link it with classic stroke."]],"x":"The \u003cb>lateral and medial striate arteries\u003c/b> are the deep branches of the proximal MCA (labelled lenticulostriate arteries in Fig. 3). Their occlusion is the \u003cb>chief cause of classic stroke\u003c/b>."},{"id":"t6q2","t":"t6","type":"type","q":"Which artery is the largest and most important branch of the internal carotid artery?","a":["middle cerebral artery","MCA","middle cerebral","the middle cerebral artery"],"x":"The \u003cb>MCA\u003c/b> is the largest and most important ICA branch; the ACA is the other terminal branch."},{"id":"t6q3","t":"t6","type":"tf","q":"The middle cerebral artery receives about 20% of the carotid blood flow.","a":false,"fix":"The MCA receives 80% of the carotid blood flow.","x":"\u003cb>80%\u003c/b> of the carotid blood flow goes into the MCA, leaving the rest for the other ICA branches."},{"id":"t6q4","t":"t6","type":"mcq","q":"The lateral and medial striate arteries supply which structures?","o":[["The striatum and the internal capsule"],["The thalamus and hypothalamus","Your notes do not give these to the striate arteries."],["The medulla oblongata","It gets the medullary branches of the vertebral artery."],["The medial surface of the frontal lobe","That is ACA territory."]],"x":"The striate arteries are the deep branches of the proximal MCA (the lenticulostriate arteries of Fig. 3). They supply the \u003cb>striatum\u003c/b> and the \u003cb>internal capsule\u003c/b>."},{"id":"t6q5","t":"t6","type":"tf","q":"The distal part of the MCA travels laterally through the lateral fissure to supply most of the lateral side of the brain.","a":true,"x":"After giving its deep branches, the MCA runs out through the \u003cb>lateral fissure\u003c/b> and spreads over most of the \u003cb>lateral surface\u003c/b> (the yellow area in the territory figure)."},{"id":"t6q6","t":"t6","type":"mcq","q":"The ACA winds around which part of the corpus callosum before dividing into its two main terminal branches?","o":[["Genu"],["Splenium","The ACA curves around the genu, not the splenium."],["Body","Your notes specify the genu."],["Rostrum","Your notes specify the genu."]],"x":"The \u003cb>ACA\u003c/b> curves around the \u003cb>genu of the corpus callosum\u003c/b> and then splits into two main terminal branches. Fig. 4 shows its branches, such as the pericallosal and callosomarginal arteries."},{"id":"t6q7","t":"t6","type":"mcq","q":"What is the main cortical territory of the ACA?","o":[["The medial side of the frontal and parietal lobes, as far back as the parieto-occipital sulcus"],["Most of the lateral side of the brain","This is MCA territory."],["The occipital lobe and the tentorial surface","This is PCA territory."],["The striatum and internal capsule","These are supplied by deep MCA branches."]],"x":"The \u003cb>ACA\u003c/b> covers the \u003cb>medial surface\u003c/b> of the frontal and parietal lobes back to the \u003cb>parieto-occipital sulcus\u003c/b> (the blue area in the territory figure, medial view)."},{"id":"t6q8","t":"t6","type":"tf","q":"The anterior cerebral artery gives only cortical branches.","a":false,"fix":"The ACA gives both cortical and central branches.","x":"Your notes list two sets of ACA branches: \u003cb>cortical\u003c/b> branches and \u003cb>central\u003c/b> branches."},{"id":"t6q9","t":"t6","type":"tf","q":"The territory of the ACA overlaps onto the orbital and lateral surfaces of the brain.","a":true,"x":"Besides the medial surface, the ACA spills over onto the \u003cb>orbital\u003c/b> and \u003cb>lateral\u003c/b> surfaces. In the territory figure (lateral view) it shows as a blue strip along the top edge."},{"id":"t6q10","t":"t6","type":"mcq","q":"Occlusion of which artery is rare but can cause 'clumsy hand' syndrome with contralateral weakness?","o":[["Anterior cerebral artery"],["Lateral striate arteries","Your notes link their occlusion with classic stroke, not 'clumsy hand' syndrome."],["Posterior cerebral artery","Your notes do not link the PCA with 'clumsy hand' syndrome."],["Basilar artery","Your notes do not link the basilar artery with 'clumsy hand' syndrome."]],"x":"Your notes: \u003cb>ACA occlusion is rare\u003c/b> but can cause \u003cb>'clumsy hand' syndrome\u003c/b>, with contralateral weakness of the arm and face."},{"id":"t7q1","t":"t7","type":"mcq","d":1,"q":"Which is the largest branch of the vertebral artery?","o":[["Posterior inferior cerebellar artery (PICA)"],["Anterior spinal artery","It is a spinal branch, not the largest branch."],["Anterior inferior cerebellar artery (AICA)","AICA is not a vertebral branch in your notes."],["Posterior spinal artery","It is a spinal branch, not the largest branch."]],"x":"\u003cb>PICA\u003c/b> is a tortuous artery and the \u003cb>largest branch of the vertebral artery\u003c/b>."},{"id":"t7q2","t":"t7","type":"multi","q":"Which vessels make up the vertebrobasilar (posterior) circulation? (select all)","o":[["Two vertebral arteries",1],["The basilar artery",1],["Two posterior cerebral arteries",1],["Two middle cerebral arteries",0,"The MCAs are terminal branches of the internal carotid artery."],["Two anterior cerebral arteries",0,"The ACAs belong to the carotid (anterior) system."]],"x":"Vertebrobasilar system = \u003cb>2 vertebral arteries\u003c/b> → \u003cb>1 basilar artery\u003c/b> → \u003cb>2 posterior cerebral arteries\u003c/b>."},{"id":"t7q3","t":"t7","type":"tf","q":"The vertebral artery arises in the neck from the 2nd part of the subclavian artery.","a":false,"fix":"The vertebral artery arises from the 1st part of the subclavian artery.","x":"Origin: the \u003cb>1st part of the subclavian artery\u003c/b>, in the neck. Fig. 1 shows the vertebral artery leaving the subclavian artery."},{"id":"t7q4","t":"t7","type":"mcq","q":"The vertebral artery passes through the transverse foramina of which vertebrae?","o":[["C1–C6"],["C1–C7","Your notes say C1–C6; C7 is not included."],["C2–C7","Your notes say C1–C6."],["T1–T6","These are thoracic vertebrae; the artery runs through cervical vertebrae."]],"x":"The vertebral artery climbs through the transverse foramina of \u003cb>C1–C6\u003c/b>, then enters the skull and runs along the ventral surface of the brainstem."},{"id":"t7q5","t":"t7","type":"mcq","q":"How is the anterior spinal artery formed, and where does it run?","o":[["Two arteries, one from each vertebral artery, unite into a single trunk in the anterior median fissure of the spinal cord"],["A single branch of the basilar artery running on the front of the pons","The anterior spinal artery comes from the vertebral arteries, not the basilar artery."],["A branch of PICA running in the posterior median sulcus","Your notes say it comes from the two vertebral arteries and runs in the anterior median fissure."],["Two separate arteries that stay apart on each side of the anterior roots","The two arteries unite into a single trunk."]],"x":"The two anterior spinal arteries \u003cb>unite into one trunk\u003c/b> that runs in the \u003cb>anterior median fissure\u003c/b> of the spinal cord."},{"id":"t7q6","t":"t7","type":"tf","q":"Each posterior spinal artery divides into two longitudinal branches that descend on each side of the posterior roots of the spinal nerves.","a":true,"x":"There are two posterior spinal arteries, one from each vertebral artery. Each splits into two longitudinal branches around the \u003cb>posterior roots\u003c/b>."},{"id":"t7q7","t":"t7","type":"mcq","q":"Where and how is the basilar artery formed?","o":[["At the lower border of the pons, by union of the two vertebral arteries"],["At the upper border of the pons, by union of the two PCAs","The PCAs are the terminal branches of the basilar artery, not its origin."],["At the foramen magnum, from the left vertebral artery alone","Both vertebral arteries join to form it."],["From the internal carotid artery beside the optic chiasma","The basilar artery belongs to the posterior circulation, not the carotid system."]],"x":"The single \u003cb>basilar artery\u003c/b> forms at the \u003cb>lower border of the pons\u003c/b>, where the two vertebral arteries join. It then runs on the front of the pons in the midline (pontine sulcus)."},{"id":"t7q8","t":"t7","type":"list","q":"Apart from its terminal posterior cerebral arteries, name at least three of the four branches of the basilar artery listed in your notes.","p":[["Anterior inferior cerebellar artery (AICA)",["anterior inferior","aica","ant inf"]],["Superior cerebellar artery",["superior cerebellar","sca","sup cereb"]],["Pontine branches",["pontine","pons"]],["Labyrinthine (internal auditory) artery",["labyrinth","internal auditory","auditory"]]],"need":3,"x":"Basilar branches: \u003cb>AICA\u003c/b>, \u003cb>superior cerebellar\u003c/b> artery, \u003cb>pontine\u003c/b> branches, \u003cb>labyrinthine (internal auditory)\u003c/b> artery, and finally the two PCAs as terminal branches."},{"id":"t7q9","t":"t7","type":"tf","q":"On the superolateral surface, the cortical branches of the PCA supply the occipital lobe plus the uppermost 1 finger breadth of this surface.","a":false,"fix":"They supply the occipital lobe plus the lowermost 1 finger breadth of the superolateral surface.","x":"PCA cortical territory on the superolateral surface = the \u003cb>occipital lobe\u003c/b> plus the \u003cb>lowermost 1 finger breadth\u003c/b>. In the territory figure (lateral view) this is the red area at the back and along the bottom edge; the upper edge is where the ACA overlaps."},{"id":"t7q10","t":"t7","type":"type","q":"Around which part of the brainstem does the posterior cerebral artery pass to reach the occipital pole?","a":["midbrain","the midbrain","mesencephalon"],"x":"The PCA starts at the upper border of the pons, curves around the \u003cb>midbrain\u003c/b>, and reaches the occipital pole of the cerebrum."},{"id":"t7q11","t":"t7","type":"tf","q":"The posterior cerebral artery passes inside the calcarine sulcus.","a":true,"x":"The PCA runs inside the \u003cb>calcarine sulcus\u003c/b>; Fig. 7 labels a calcarine artery among its branches."},{"id":"t7q12","t":"t7","type":"multi","q":"Which structures do the central branches of the PCA supply? (select all)","o":[["Thalamus",1],["Hypothalamus",1],["Globus pallidus",1],["Geniculate bodies",1],["Internal capsule",0,"Your notes do not list the internal capsule among the PCA central branch targets."],["Medulla oblongata",0,"It is supplied by the medullary branches of the vertebral artery."]],"x":"PCA central branches supply the \u003cb>thalamus\u003c/b>, \u003cb>hypothalamus\u003c/b>, \u003cb>globus pallidus\u003c/b>, \u003cb>midbrain\u003c/b> and \u003cb>geniculate bodies\u003c/b>."},{"id":"t7q13","t":"t7","type":"mcq","q":"On the inferior surface of the cerebrum, what do the cortical branches of the PCA supply?","o":[["The whole tentorial surface except the temporal pole"],["Only the orbital surface","The PCA goes to the tentorial part, behind the orbital part."],["Only the temporal pole","The temporal pole is the one part of the tentorial surface the PCA does not supply."],["The whole inferior surface, including the orbital part","The PCA supplies the tentorial part, not the orbital part."]],"x":"PCA cortical territory on the inferior surface = the \u003cb>whole tentorial surface except the temporal pole\u003c/b>. In the territory figure (inferior view) the temporal pole is yellow (MCA) while the rest of the tentorial surface is red (PCA)."},{"id":"t8q1","t":"t8","type":"mcq","d":1,"q":"What does the anterior communicating artery connect?","o":[["The left and right anterior cerebral arteries"],["The left and right middle cerebral arteries","Your notes do not describe a vessel joining the two MCAs."],["The anterior cerebral artery with the middle cerebral artery on the same side","Your notes say it joins the two ACAs to each other."],["The two vertebral arteries","Your notes do not describe a communicating artery between them."]],"x":"The single \u003cb>anterior communicating artery\u003c/b> joins the \u003cb>left and right ACAs\u003c/b> at the front of the circle of Willis."},{"id":"t8q2","t":"t8","type":"tf","q":"Each posterior communicating artery connects the internal carotid artery with the middle cerebral artery.","a":false,"fix":"Each posterior communicating artery connects the internal carotid artery with the posterior cerebral artery.","x":"There are \u003cb>two\u003c/b> posterior communicating arteries, one on each side, each joining the \u003cb>ICA\u003c/b> to the \u003cb>PCA\u003c/b>."},{"id":"t8q3","t":"t8","type":"mcq","q":"The circle of Willis is an anastomosis formed at the base of the brain by interconnecting which two systems?","o":[["The vertebrobasilar and internal carotid systems"],["The internal and external carotid systems","The external carotid artery is not part of the circle in your notes."],["The vertebral and subclavian systems","The subclavian artery is in the neck; the circle forms at the base of the brain."],["The superficial and deep cerebral veins","The circle of Willis is made of arteries, not veins."]],"x":"The \u003cb>circle of Willis\u003c/b> joins the \u003cb>internal carotid (anterior)\u003c/b> and \u003cb>vertebrobasilar (posterior)\u003c/b> systems at the base of the brain through the communicating arteries. This anastomosis links the two circulations."},{"id":"t8q4","t":"t8","type":"type","q":"Into which venous sinus do the superior cerebral veins empty?","a":["superior sagittal sinus","superior sagittal","the superior sagittal sinus","SSS"],"x":"The \u003cb>superior cerebral veins\u003c/b> run up over the hemisphere and empty into the \u003cb>superior sagittal sinus\u003c/b> (Fig. 8)."},{"id":"t8q5","t":"t8","type":"mcq","q":"The superficial middle cerebral vein drains the lateral surface of the hemisphere. Into which sinus does it empty?","o":[["Cavernous sinus"],["Transverse sinus","Your notes do not send the superficial middle cerebral vein here."],["Inferior sagittal sinus","Your notes do not send the superficial middle cerebral vein here."],["Occipital sinus","Your notes do not send the superficial middle cerebral vein here."]],"x":"The \u003cb>superficial middle cerebral vein\u003c/b> runs along the lateral surface and empties into the \u003cb>cavernous sinus\u003c/b>."},{"id":"t8q6","t":"t8","type":"order","q":"Put this venous drainage route in order, starting from the basal vein.","o":["Basal vein","Great cerebral vein","Straight sinus"],"x":"The \u003cb>basal vein\u003c/b> ultimately joins the \u003cb>great cerebral vein\u003c/b>, which in turn drains into the \u003cb>straight sinus\u003c/b>."},{"id":"t8q7","t":"t8","type":"mcq","q":"The two internal cerebral veins unite to form the great cerebral vein beneath which structure?","o":[["Splenium of the corpus callosum"],["Genu of the corpus callosum","Your notes place the union beneath the splenium, not the genu."],["Body of the corpus callosum","Your notes place the union beneath the splenium."],["Lateral fissure","Your notes place the union beneath the splenium of the corpus callosum."]],"x":"Two \u003cb>internal cerebral veins\u003c/b> unite beneath the \u003cb>splenium of the corpus callosum\u003c/b> to form the great cerebral vein."},{"id":"t8q8","t":"t8","type":"tf","q":"In Fig. 8, the sigmoid sinus continues into the internal jugular vein.","a":true,"x":"Fig. 8 shows the transverse sinus curving down as the \u003cb>sigmoid sinus\u003c/b>, which continues as the \u003cb>internal jugular vein\u003c/b>."},{"id":"t9q1","t":"t9","type":"mcq","d":1,"q":"What is the neuropil of the cerebral cortex?","o":[["Amorphous pale areas of astrocytes tangled with neuron processes, plus intercellular spaces containing tissue fluid"],["The central medullary mass of white matter","That is the white matter under the cortex, not the neuropil."],["A dense layer of small stellate cells","That describes a granular layer, not the neuropil."],["The pia mater covering the cortex","The pia mater lies over the cortex; the neuropil is within it."]],"x":"\u003cb>Neuropil\u003c/b> comes from pilus = felt = meshwork. It appears as amorphous \u003cb>pale areas\u003c/b> made of astrocyte bodies and processes tangled with neuron processes, plus intercellular spaces with tissue fluid."},{"id":"t9q2","t":"t9","type":"tf","q":"Each cerebral hemisphere consists of a convoluted cortex of grey matter overlying a central medullary mass of white matter.","a":true,"x":"Grey matter outside (the \u003cb>cerebral cortex\u003c/b>), white matter inside (the \u003cb>medullary mass\u003c/b>)."},{"id":"t9q3","t":"t9","type":"type","q":"What are the collections of nerve cells within the white matter of the cerebral hemispheres called?","a":["basal ganglia","basal ganglion","the basal ganglia","basal nuclei"],"x":"The white matter of each hemisphere contains clusters of nerve cells called the \u003cb>basal ganglia\u003c/b>. They are not part of the cortex."},{"id":"t9q4","t":"t9","type":"tf","q":"Folding of the cerebral cortex into gyri and sulci reduces its surface area.","a":false,"fix":"Folding into gyri (ridges) and sulci (furrows) increases the surface area.","x":"Gyri are ridges and sulci are furrows; together they \u003cb>increase\u003c/b> the surface area of the cortex."},{"id":"t9q5","t":"t9","type":"multi","q":"Which are listed in your notes as components of the cytoarchitecture of the cerebral cortex? (select all)","o":[["Cell bodies of neurons",1],["Neuroglia, such as astrocytes",1],["Blood capillaries",1],["Neuropil",1],["Lymphatic vessels",0,"Your notes list neurons, neuroglia, capillaries and neuropil only."]],"x":"Four components: \u003cb>neuron cell bodies\u003c/b>, \u003cb>neuroglia\u003c/b> such as astrocytes, \u003cb>blood capillaries\u003c/b> and the \u003cb>neuropil\u003c/b>."},{"id":"t9q6","t":"t9","type":"tf","q":"The arrangement of the cortical tissue, including the neuropil, permits diffusion between capillaries and neurons.","a":true,"x":"The neuropil's intercellular spaces hold tissue fluid, and this arrangement permits \u003cb>diffusion between capillaries and neurons\u003c/b>."},{"id":"t9q7","t":"t9","type":"mcq","q":"Your notes say cortical neurons are very sensitive to changes in what?","o":[["Oxygen and blood sugar level"],["Carbon dioxide and pH","Your notes name oxygen and blood sugar, not these."],["Sodium and potassium levels","Your notes name oxygen and blood sugar, not these."],["Blood calcium and phosphate","Your notes name oxygen and blood sugar, not these."]],"x":"Your notes stress that cortical neurons are very sensitive to changes in \u003cb>oxygen\u003c/b> and \u003cb>blood sugar level\u003c/b>, which is why their close contact with capillaries matters."},{"id":"t10q1","t":"t10","type":"mcq","d":1,"q":"Which cells are the main output neurons of the cerebral cortex?","o":[["Pyramidal cells"],["Stellate (granule) cells","They have a single short axon and are not the main output cells."],["Horizontal cells of Cajal","Their processes synapse locally."],["Cells of Martinotti","They are a modified cell type, not the main output cell."]],"x":"\u003cb>Pyramidal cells\u003c/b> are the main output neurons of the cerebral cortex. They range in size from small to gigantic."},{"id":"t10q2","t":"t10","type":"multi","q":"All cortical neurons are variations of three basic shapes. Which are they? (select all)","o":[["Pyramidal cells",1],["Fusiform cells",1],["Stellate (granular) cells",1],["Horizontal cells of Cajal",0,"These are a modification of the basic shapes, not one of the three."],["Cells of Martinotti",0,"These are also a modified type, not one of the three basic shapes."]],"x":"Three basic shapes: \u003cb>pyramidal\u003c/b>, \u003cb>fusiform\u003c/b> and \u003cb>stellate (granular)\u003c/b>. Cajal and Martinotti cells are modifications of t
