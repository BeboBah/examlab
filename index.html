,["Acting as the primary auditory cortex",0,"Wernicke's area lies in the auditory association area, not the primary auditory cortex."]],"x":"These four come straight from the list of Wernicke's functions in your notes. Wernicke's area is the comprehension area of the language network."},{"id":"t25q7","t":"t25","type":"type","q":"Wernicke's area transforms the visual impression of letters (graphemes) into mental representations of speech sounds. What are these speech-sound representations called?","a":["phonemes","phoneme"],"x":"\u003cb>Graphemes\u003c/b> are the visual impressions of letters; \u003cb>phonemes\u003c/b> are mental representations of speech sounds. Wernicke's area converts the first into the second."},{"id":"t25q8","t":"t25","type":"tf","q":"Wernicke's area analyses sounds, associating sound with concept, so that both spoken and written words can be comprehended.","a":true,"x":"This is the function your notes put in bold: \u003cb>associating sound with concept\u003c/b> is how Wernicke's area turns heard and read words into meaning."},{"id":"t25q9","t":"t25","type":"mcq","q":"In Figure 1 of your notes, what label is attached to Wernicke's area?","o":[["Contains sound images of words"],["Spoken word","That label marks the auditory input arriving at AI."],["Phonation or handwriting","That label marks the motor output."],["Written words or thoughts","That label marks the visual input arriving at the occipital lobe."]],"x":"Figure 1 labels Wernicke's area as the store of \u003cb>sound images of words\u003c/b>, which fits its role in comprehension."},{"id":"t25q10","t":"t25","type":"tf","q":"In Figure 1 of your notes, Broca's area is labelled as matching speech sounds to motor programmes for speech articulation.","a":true,"x":"Figure 1 shows Broca's area in the frontal lobe, labelled as \u003cb>matching speech sounds to motor programmes\u003c/b> for speech articulation. This fits its role in speech production."},{"id":"t26q1","t":"t26","type":"mcq","q":"Which gyrus lies in the posterior parietal lobule, posterior to Wernicke's area and anterior to the visual areas 17, 18 and 19?","o":[["Angular gyrus"],["Supramarginal gyrus","It is the other part of the inferior parietal lobule, but not the one described here."],["Inferior frontal gyrus","That holds Broca's area, in the frontal lobe."],["Superior temporal gyrus","That holds Wernicke's area itself."]],"x":"The \u003cb>angular gyrus\u003c/b> lies in the posterior parietal lobule, with Wernicke's area in front of it and the visual occipital areas (17, 18, 19) behind it.","d":1},{"id":"t26q2","t":"t26","type":"tf","q":"The supramarginal gyrus is Brodmann area 39.","a":false,"x":"The inferior parietal lobule is areas 39 and 40: \u003cb>angular gyrus = 39\u003c/b>, \u003cb>supramarginal gyrus = 40\u003c/b>.","fix":"The supramarginal gyrus is area 40; the angular gyrus is area 39."},{"id":"t26q3","t":"t26","type":"mcq","q":"Which function does your handout give to the angular gyrus?","o":[["Translation of written words into sounds"],["Decoding spoken language into meaning","In the spoken circuit, Wernicke's area does this."],["Starting the muscle movements of speech","That is the motor cortex, driven by Broca's area."],["First cortical reception of heard speech","That is the primary auditory cortex in the temporal lobe."]],"x":"The angular gyrus \u003cb>translates written words into sounds\u003c/b>. It is the parietal link between what we read and how it sounds."},{"id":"t26q4","t":"t26","type":"tf","q":"The angular gyrus is important in writing words that are not phonetic, such as 'circuit'.","a":true,"x":"Words like 'circuit' are not spelled the way they sound, so writing them relies on the \u003cb>angular gyrus\u003c/b>."},{"id":"t26q5","t":"t26","type":"multi","q":"Which are functions of the supramarginal gyrus? (select all)","o":[["Correlating sounds and letters",1],["Acting as short-term auditory memory to remember how to sound words",1],["Decoding spoken language into meaning",0,"In the spoken circuit, Wernicke's area does this."],["First cortical reception of heard speech",0,"That is the primary auditory cortex."]],"x":"The \u003cb>supramarginal gyrus\u003c/b> associates letters with sounds and works as a \u003cb>short-term auditory memory\u003c/b>, holding how words should sound."},{"id":"t26q6","t":"t26","type":"tf","q":"The supramarginal gyrus arches over the end of the central sulcus.","a":false,"x":"The supramarginal gyrus caps the end of the \u003cb>lateral (Sylvian) sulcus\u003c/b>, next to the lower part of the somatosensory cortex.","fix":"It arches over the end of the lateral sulcus, next to the inferior part of the somatosensory cortex."},{"id":"t26q7","t":"t26","type":"type","q":"In the circuit for written speech, messages go from Wernicke's area to Broca's area via the arcuate fasciculus and which other fasciculus?","a":["superior longitudinal fasciculus","superior longitudinal","slf"],"x":"In the written route, Wernicke's area assembles words into sentences and sends the messages to Broca's area via the arcuate and \u003cb>superior longitudinal\u003c/b> fasciculi."},{"id":"t26q8","t":"t26","type":"order","q":"Put the basic circuit for hearing a sentence and repeating it in order.","o":["Auditory apparatus","Primary auditory cortex","Wernicke's area","Broca's area","Motor cortex","Tongue and laryngeal muscles"],"x":"Ear (auditory apparatus) → primary auditory cortex (temporal lobe) → Wernicke's area decodes meaning → forward to Broca's area (expressive speech, frontal lobe) → motor programs of the motor cortex → tongue and laryngeal muscles."},{"id":"t26q9","t":"t26","type":"mcq","q":"In the circuit for written speech, input from the visual association area goes next to which area, where objects are recognised and named?","o":[["Left angular gyrus"],["Broca's area","Broca's area comes later, after Wernicke's area."],["Primary auditory cortex","That is the first cortical stop for spoken, not written, language."],["Supramarginal gyrus","Your notes route visual input to the angular gyrus, not the supramarginal gyrus."]],"x":"Written route: visual cortex (17-19) → \u003cb>left angular gyrus\u003c/b> (objects recognised and named) → Wernicke's area (words assembled into sentences) → Broca's area → motor cortex."},{"id":"t26q10","t":"t26","type":"mcq","q":"In Figure 1 of your notes, the supplementary speech area is labelled as concerned with what?","o":[["Vowel vocalisation"],["Phonation or handwriting","That label marks the motor output."],["Spoken word","That label marks the auditory input arriving at AI."],["Written words or thoughts","That label marks the visual input to the occipital lobe."]],"x":"Figure 1 places the \u003cb>supplementary speech area\u003c/b> in the frontal lobe and labels it '\u003cb>vowel vocalisation\u003c/b>'. AI in the same figure is the primary auditory cortex."},{"id":"t27q1","t":"t27","type":"mcq","q":"A patient understands speech and can speak, but cannot repeat words. Asked to repeat 'milk', she says 'the white stuff'. Where is the lesion?","o":[["Arcuate fasciculus"],["Wernicke's area","Wernicke's damage destroys comprehension, which is intact here."],["Broca's area","Broca's damage makes speech slow and non-fluent, which is not the case here."],["Supramarginal gyrus","Your notes link failure of repetition to the Wernicke-Broca connection, not this gyrus."]],"x":"This is \u003cb>conduction aphasia\u003c/b>. Wernicke's area (comprehension) and Broca's area (production) both work, but the understood word cannot be passed forward to Broca's area to be repeated.","d":1},{"id":"t27q2","t":"t27","type":"multi","q":"Which features fit Wernicke's aphasia? (select all)","o":[["Fluent speech that keeps its melody and rhythm",1],["No difficulty with syntax or grammar",1],["Speech full of mistakes, with wrong or invented words",1],["May talk excessively",1],["Slow speech in which words are hard to come by",0,"That describes Broca's aphasia."]],"x":"Patients with Wernicke's aphasia cannot understand the language they hear or see. So although speech flows with normal grammar, melody and rhythm, its content is full of mistakes."},{"id":"t27q3","t":"t27","type":"mcq","q":"Which pairing of aphasia names is correct?","o":[["Wernicke's = receptive (sensory); Broca's = expressive (productive, non-fluent)"],["Wernicke's = expressive; Broca's = receptive","Backwards."],["Wernicke's = conduction; Broca's = anomic","Conduction and anomic are names of two other aphasias in your notes."],["Wernicke's = non-fluent; Broca's = sensory","Both labels are misplaced: non-fluent goes with Broca's and sensory with Wernicke's."]],"x":"Wernicke's area handles comprehension, so damage gives \u003cb>receptive/sensory\u003c/b> aphasia. Broca's area handles production, so damage gives \u003cb>expressive/productive/non-fluent\u003c/b> aphasia."},{"id":"t27q4","t":"t27","type":"tf","q":"In Broca's aphasia, speech is grammatical but meaningless.","a":false,"x":"Broca's patients have difficulty with \u003cb>syntax and grammar\u003c/b>, so their speech is \u003cb>ungrammatical\u003c/b>, yet what they say is still \u003cb>meaningful\u003c/b>.","fix":"In Broca's aphasia, speech is ungrammatical but meaningful."},{"id":"t27q5","t":"t27","type":"mcq","q":"Patients with severe damage to Broca's area may be limited to how many words to express their whole range of meaning and emotion?","o":[["Two or three"],["None at all","Your notes say a few words remain."],["About ten","Too many for severe Broca's aphasia."],["Unlimited, but spoken too fast","Speech in Broca's aphasia is slow, not fast."]],"x":"In severe Broca's aphasia only \u003cb>two or three words\u003c/b> remain for every meaning and emotion. Speech is slow and words are hard to come by."},{"id":"t27q6","t":"t27","type":"tf","q":"In Broca's aphasia, speech understanding may be intact.","a":true,"x":"Broca's aphasia is mainly a production problem: speech is slow and ungrammatical, but understanding of speech \u003cb>may be intact\u003c/b>."},{"id":"t27q7","t":"t27","type":"tf","q":"Aphasia can be caused by paralysis of the speech muscles.","a":false,"x":"Aphasia is a disorder of \u003cb>language\u003c/b> itself. Problems that come from the eyes, the ears or the muscles are not aphasia.","fix":"Aphasias are not due to defects of vision or hearing or to motor paralysis."},{"id":"t27q8","t":"t27","type":"type","q":"What does the word 'aphasia' mean, according to your notes?","a":["without speech","no speech","without speaking"],"x":"Aphasia = \u003cb>without speech\u003c/b>. It is the clinical syndrome that results when the language areas are damaged."},{"id":"t27q9","t":"t27","type":"tf","q":"Aphasias are caused by lesions in the categorical hemisphere.","a":true,"x":"The language areas lie in the \u003cb>categorical hemisphere\u003c/b>, so lesions there produce aphasia."},{"id":"t27q10","t":"t27","type":"mcq","q":"A patient cannot read or write but understands speech and speaks normally. Which area is most likely damaged?","o":[["Angular gyrus"],["Broca's area","Speech would be slow and non-fluent."],["Wernicke's area","Comprehension of speech would be lost."],["Supramarginal gyrus","Your notes link this picture to the other gyrus of the inferior parietal lobule."]],"x":"\u003cb>Alexia\u003c/b> (inability to read) with \u003cb>agraphia\u003c/b> (inability to write) comes from damage to the \u003cb>angular gyrus\u003c/b>. Understanding speech and speaking stay normal."},{"id":"t27q11","t":"t27","type":"type","q":"A lesion in the categorical hemisphere spares Wernicke's and Broca's areas. The patient speaks and understands what they hear normally, but cannot understand written language or pictures because visual information does not reach Wernicke's area. What is this called?","a":["anomic aphasia","anomic","anomia"],"x":"Your notes call this \u003cb>anomic aphasia\u003c/b>. The lesion is in the angular gyrus, so visual information is not processed and passed on to Wernicke's area."},{"id":"t28q1","t":"t28","type":"mcq","q":"Where is the brain stem located?","o":[["Posterior cranial fossa"],["Middle cranial fossa","Too far forward for the brain stem."],["Anterior cranial fossa","The brain stem lies at the back of the skull base, with the cerebellum."],["Within the vertebral canal","The spinal cord continues below the medulla; the brain stem itself is inside the skull."]],"x":"Your notes define the brain stem as the part of the CNS present in the \u003cb>posterior cranial fossa\u003c/b>, where it is joined to the cerebellum."},{"id":"t28q2","t":"t28","type":"order","q":"Order the parts of the brain stem from top (cranial) to bottom (caudal).","o":["Midbrain","Pons","Medulla oblongata"],"x":"Midbrain on top, pons in the middle and the medulla oblongata below, continuous with the spinal cord."},{"id":"t28q3","t":"t28","type":"tf","q":"The brain stem is connected to the cerebellum by two peduncles.","a":false,"x":"\u003cb>Three\u003c/b> peduncles join the brain stem to the cerebellum; the figure labels them superior, middle and inferior.","fix":"It is connected to the cerebellum by three peduncles."},{"id":"t28q4","t":"t28","type":"mcq","q":"Which brain stem component controls the level of consciousness and regulates the cardiovascular and respiratory systems?","o":[["Reticular formation"],["Cerebral aqueduct","It is the narrow lumen of the midbrain, not a control centre."],["Interpeduncular fossa","It is a depression between the two cerebral peduncles."],["Inferior cerebellar peduncle","It is a connection between the brain stem and the cerebellum."]],"x":"One of the four brain stem functions in your notes: it contains the \u003cb>reticular formation\u003c/b>, which controls the level of consciousness and regulates the cardiovascular and respiratory systems."},{"id":"t28q5","t":"t28","type":"tf","q":"The lower part of the anteromedian fissure of the medulla is marked by the decussation of the pyramidal (corticospinal) fibres.","a":true,"x":"The anteromedian fissure continues the spinal cord's fissure and divides the medulla into two halves. Low down, crossing \u003cb>pyramidal fibres\u003c/b> mark it (the 'decussation' label in the figure)."},{"id":"t28q6","t":"t28","type":"mcq","q":"What produces the olive of the medulla?","o":[["Inferior olivary nucleus"],["Corticospinal tract","That tract produces the pyramid."],["Gracile nucleus","It lies under the gracile tubercle on the dorsal surface."],["Cuneate nucleus","It lies under the cuneate tubercle on the dorsal surface."]],"x":"The \u003cb>olive\u003c/b> is an elevation lateral to the pyramid, produced by the underlying \u003cb>inferior olivary nucleus\u003c/b>."},{"id":"t28q7","t":"t28","type":"mcq","q":"Rootlets of which cranial nerve leave the medulla through the anterolateral sulcus, between the pyramid and the olive?","o":[["Hypoglossal (XII)"],["Abducent (VI)","It is one of the nerves related to the pons (5-8)."],["Facial (VII)","It is a pons-related nerve (5-8), not a medulla nerve."],["Oculomotor (III)","It emerges from the midbrain."]],"x":"Cranial nerves 9-12 are related to the medulla. The groove between the pyramid and the olive, the \u003cb>anterolateral sulcus\u003c/b>, gives exit to the \u003cb>hypoglossal\u003c/b> rootlets.","d":1},{"id":"t28q8","t":"t28","type":"multi","q":"Which nerves' rootlets leave through the posterolateral sulcus, lateral to the olive? (select all)","o":[["Glossopharyngeal (IX)",1],["Vagus (X)",1],["Cranial accessory (XI)",1],["Trigeminal (V)",0,"The trigeminal is related to the pons, not the medulla."],["Abducent (VI)",0,"The abducent is one of the pons nerves (5-8)."]],"x":"The \u003cb>posterolateral sulcus\u003c/b>, behind the olive, carries the rootlets of the \u003cb>glossopharyngeal, vagus and cranial accessory\u003c/b> nerves."},{"id":"t28q9","t":"t28","type":"type","q":"What is the point called where the central canal of the medulla opens into the fourth ventricle?","a":["obex","the obex"],"x":"The \u003cb>obex\u003c/b> is where the central canal, continuing up from the spinal cord, opens into the fourth ventricle. It is the landmark that divides the dorsal medulla into open and closed parts."},{"id":"t28q10","t":"t28","type":"tf","q":"The open medulla is the caudal (lower) part of the medulla.","a":false,"x":"The dorsal medulla is divided into the \u003cb>open\u003c/b> medulla (\u003cb>cranial\u003c/b>) and the \u003cb>closed\u003c/b> medulla (\u003cb>caudal\u003c/b>). The gracile and cuneate elevations are features of the closed part.","fix":"The open medulla is the cranial part; the closed medulla is the caudal part."},{"id":"t28q11","t":"t28","type":"tf","q":"On the dorsal surface of the closed medulla, the cuneate fasciculus lies lateral to the gracile fasciculus.","a":true,"x":"From the midline outwards: posterior median sulcus, \u003cb>gracile\u003c/b> fasciculus, then \u003cb>cuneate\u003c/b> fasciculus. Each fasciculus overlies its tract and swells at its upper end into a tubercle over its nucleus."},{"id":"t28q12","t":"t28","type":"mcq","q":"Which structure forms the ridge lateral to the cuneate tubercle?","o":[["Inferior cerebellar peduncle"],["Middle cerebellar peduncle","It is continuous with the ventral pons laterally."],["Olive","The olive is on the ventral surface of the medulla."],["Superior colliculus","It is on the dorsal surface of the midbrain."]],"x":"The ridge lateral to the cuneate tubercle is the \u003cb>inferior cerebellar peduncle\u003c/b>, which links the medulla to the cerebellum."},{"id":"t29q1","t":"t29","type":"mcq","q":"Which nerve emerges from the middle part of the pons at its junction with the middle cerebellar peduncle?","o":[["Trigeminal (V)"],["Abducent (VI)","It emerges at the lower border of the pons."],["Facial (VII)","It emerges at the lower border of the pons."],["Oculomotor (III)","It emerges from the midbrain."]],"x":"The \u003cb>trigeminal\u003c/b> nerve leaves the \u003cb>middle\u003c/b> of the pons where the pons meets the middle cerebellar peduncle. Cranial nerves 5-8 are the pons nerves.","d":1},{"id":"t29q2","t":"t29","type":"tf","q":"The abducent nerve emerges at the lower border of the pons, between the pons and the olive.","a":false,"x":"The abducent leaves the lower border of the pons next to the \u003cb>pyramid\u003c/b>, between the pons and the pyramid.","fix":"It emerges at the lower border of the pons, between the pons and the pyramid."},{"id":"t29q3","t":"t29","type":"mcq","q":"At which site do cranial nerves VII and VIII exit?","o":[["Cerebellopontomedullary angle"],["Posterolateral sulcus of the medulla","That groove lies lateral to the olive and serves medulla nerves."],["Interpeduncular fossa","That is a midbrain depression between the cerebral peduncles."],["Anteromedian fissure","That fissure divides the medulla into two halves."]],"x":"The \u003cb>facial and vestibulocochlear\u003c/b> nerves emerge at the lower border of the pons, between pons and medulla, at the \u003cb>cerebellopontomedullary angle\u003c/b>."},{"id":"t29q4","t":"t29","type":"type","q":"What is the median groove on the ventral surface of the pons called?","a":["basilar groove","basilar sulcus","basilar"],"x":"It is the \u003cb>basilar groove\u003c/b>, named because it lodges the \u003cb>basilar artery\u003c/b>. The ventral pons on either side of it is convex from side to side."},{"id":"t29q5","t":"t29","type":"tf","q":"The dorsal surface of the pons forms the cranial two-thirds of the floor of the fourth ventricle.","a":true,"x":"The dorsal pons, separated from the open medulla by an imaginary line, makes up the \u003cb>cranial 2/3\u003c/b> of the floor of the fourth ventricle."},{"id":"t29q6","t":"t29","type":"mcq","q":"A coronal plane through the cerebral aqueduct divides the midbrain into which two divisions?","o":[["Cerebral peduncle and tectum"],["Pons and medulla","Those are other parts of the brain stem."],["Superior and inferior colliculi","These are the four elevations on the dorsal surface."],["Open and closed parts","That division belongs to the medulla."]],"x":"The \u003cb>cerebral aqueduct\u003c/b> (aqueduct of Sylvius) is the narrow lumen of the midbrain. A coronal plane through it splits the midbrain into the \u003cb>cerebral peduncle\u003c/b> in front and the \u003cb>tectum\u003c/b> behind."},{"id":"t29q7","t":"t29","type":"mcq","q":"Where does the oculomotor nerve (III) emerge?","o":[["Medial aspect of the cerebral peduncle"],["Lower border of the pons","That is a pons site; the oculomotor is a midbrain nerve."],["Groove between the pyramid and the olive","That is a medulla groove."],["Lateral side of the superior colliculus","The colliculi are on the dorsal surface; III emerges ventrally."]],"x":"The \u003cb>oculomotor\u003c/b> nerve emerges from the \u003cb>medial aspect of the cerebral peduncle\u003c/b>, on the ventral surface of the midbrain."},{"id":"t29q8","t":"t29","type":"multi","q":"In the midbrain cross-section figure in your notes, which parts make up the cerebral peduncle? (select all)","o":[["Tegmentum",1],["Substantia nigra",1],["Crus cerebri",1],["Interpeduncular fossa",0,"It is the depression between the two cerebral peduncles."],["Superior colliculus",0,"The colliculi are elevations on the dorsal surface, not part of the peduncle."]],"x":"The figure brackets \u003cb>tegmentum, substantia nigra and crus cerebri\u003c/b> together as the cerebral peduncle. The crus cerebri is the large column of fibres on each side."},{"id":"t29q9","t":"t29","type":"tf","q":"The inferior colliculi are concerned with visual reflexes.","a":false,"x":"The dorsal midbrain has four colliculi: two \u003cb>superior\u003c/b> (visual reflexes) and two \u003cb>inferior\u003c/b> (part of auditory reflexes).","fix":"The superior colliculi are concerned with visual reflexes; the inferior colliculi form part of auditory reflexes."},{"id":"t29q10","t":"t29","type":"mcq","q":"The superior brachium connects the superior colliculus with which structure?","o":[["Lateral geniculate body"],["Medial geniculate body","The inferior brachium goes to the medial geniculate body."],["Pineal body","It is a separate midline structure in the dorsal-view figure."],["Inferior colliculus","A brachium runs from a colliculus to a geniculate body, not between colliculi."]],"x":"Each colliculus sends a brachium from its lateral side: \u003cb>superior to the lateral geniculate body\u003c/b>, \u003cb>inferior to the medial geniculate body\u003c/b>."},{"id":"t29q11","t":"t29","type":"type","q":"Which is the only cranial nerve that emerges from the dorsal surface of the brain stem?","a":["trochlear nerve","trochlear","fourth cranial nerve","4th cranial nerve","CN IV","CN 4","IV"],"x":"The \u003cb>trochlear (IV)\u003c/b> nerve marks the dorsal surface of the midbrain. It is the only cranial nerve to leave from the back of the brain stem."},{"id":"t29q12","t":"t29","type":"mcq","q":"Which pairing of brain stem part and its arterial supply is correct?","o":[["Midbrain: posterior cerebral arteries"],["Medulla: basilar artery","The medulla is supplied by the two vertebral arteries."],["Pons: posterior cerebral arteries","The pons is supplied by the basilar artery."],["Midbrain: vertebral arteries","The vertebral arteries supply the medulla."]],"x":"The whole brain stem has a posterior (vertebral-basilar) supply. \u003cb>Medulla\u003c/b>: two vertebral arteries. \u003cb>Pons\u003c/b>: basilar artery. \u003cb>Midbrain\u003c/b>: posterior cerebral arteries."},{"id":"t29q13","t":"t29","type":"mcq","q":"In brainstem death, what happens to cardiovascular function?","o":[["It can be kept going artificially for a short while but eventually deteriorates"],["It stops at once, at the same moment as breathing","Your notes say it can be artificially maintained for a short while."],["It continues normally, because its control centres are in the cortex","The regulatory centres are in the medulla."],["It recovers once breathing is supported","It eventually deteriorates despite support."]],"x":"In brainstem death spontaneous breathing stops and reflexes are lost. The circulation can be supported for a short time, but it fails because the \u003cb>regulatory centres in the medulla\u003c/b> are lost."},{"id":"t29q14","t":"t29","type":"tf","q":"Compression injuries of the brain stem caused by cerebellar or cortical herniation are often fatal.","a":true,"x":"This is the second clinical correlation in your notes. The herniation figure labels transcalvarial, cingulate (subfalcine), central (transtentorial), uncal, upward cerebellar and downward cerebellar (tonsillar) herniation."},{"id":"t30q1","t":"t30","type":"multi","q":"Which of these are pure motor cranial nerves? (select all)","o":[["Oculomotor (III)",1],["Trochlear (IV)",1],["Abducens (VI)",1],["Accessory (XI)",1],["Hypoglossal (XII)",1],["Vestibulocochlear (VIII)",0,"It is a pure sensory nerve."]],"x":"Your notes list five pure motor nerves: \u003cb>oculomotor (III), trochlear (IV), abducens (VI), accessory (XI) and hypoglossal (XII)\u003c/b>.","d":1},{"id":"t30q2","t":"t30","type":"tf","q":"The optic nerve (II) is a mixed cranial nerve.","a":false,"x":"Three nerves are \u003cb>pure sensory\u003c/b>: olfactory (I), optic (II) and vestibulocochlear (VIII).","fix":"The optic nerve is pure sensory, like the olfactory (I) and vestibulocochlear (VIII)."},{"id":"t30q3","t":"t30","type":"list","q":"Name the four mixed cranial nerves.","p":[["Trigeminal (V)",["trigem","trigemin"]],["Facial (VII)",["facial","7th"]],["Glossopharyngeal (IX)",["glosso","pharyng"]],["Vagus (X)",["vag","10th"]]],"need":4,"x":"Mixed nerves carry both motor and sensory fibres: \u003cb>trigeminal (V), facial (VII), glossopharyngeal (IX) and vagus (X)\u003c/b>."},{"id":"t30q4","t":"t30","type":"order","q":"Put these cranial nerves in numerical order, starting from III.","o":["Oculomotor","Trochlear","Trigeminal","Abducens","Facial","Vestibulocochlear","Glossopharyngeal","Vagus"],"x":"III oculomotor, IV trochlear, V trigeminal, VI abducens, VII facial, VIII vestibulocochlear, IX glossopharyngeal, X vagus. XI accessory and XII hypoglossal follow."},{"id":"t30q5","t":"t30","type":"mcq","q":"Which two cranial nerves are NOT attached to the brain stem and have no nuclei of origin there?","o":[["Olfactory (I) and optic (II)"],["Trochlear (IV) and abducens (VI)","Both have their own nuclei in the brain stem."],["Facial (VII) and glossopharyngeal (IX)","Both are attached to the brain stem and have nuclei there."],["Vestibulocochlear (VIII) and vagus (X)","Both have nuclei within the brain stem."]],"x":"All 12 cranial nerves are attached to the brain stem and have nuclei there \u003cb>except the first two\u003c/b>. That is why the brain stem is the site of origin and emergence of cranial nerves \u003cb>3rd to 12th\u003c/b>."},{"id":"t30q6","t":"t30","type":"mcq","q":"How do GSE and SVE fibres differ?","o":[["GSE supply skeletal muscle from somites; SVE supply skeletal muscle from branchial arches"],["GSE supply skeletal muscle from branchial arches; SVE supply skeletal muscle from somites","This swaps them: GSE is somite muscle and SVE is branchial-arch muscle."],["GSE supply smooth muscle; SVE supply exocrine glands","Both GSE and SVE go to skeletal muscle."],["GSE carry touch; SVE carry taste","Both GSE and SVE are motor fibres to skeletal muscle."]],"x":"Both are motor to \u003cb>skeletal muscle\u003c/b>. GSE muscles come from \u003cb>somites\u003c/b> (e.g. muscles of the orbit and tongue); SVE muscles come from \u003cb>branchial arches\u003c/b>."},{"id":"t30q7","t":"t30","type":"mcq","q":"Which fibre type is motor to smooth muscle and exocrine glands (parasympathetic)?","o":[["GVE"],["GSE","GSE goes to skeletal muscle."],["SVE","SVE also goes to skeletal muscle."],["GVA","GVA is a sensory type, not motor."]],"x":"\u003cb>GVE\u003c/b> (general visceral efferent) is the parasympathetic motor supply to \u003cb>smooth muscle and exocrine glands\u003c/b>."},{"id":"t30q8","t":"t30","type":"mcq","q":"Which fibre type carries taste and olfaction?","o":[["SVA"],["SSA","SSA is the other special sensory type, for different senses."],["GVA","GVA is the general, not special, visceral sensory type."],["GSA","GSA is a somatic, not visceral, sensory type."]],"x":"\u003cb>SVA\u003c/b> (special visceral afferent) carries \u003cb>taste and olfaction\u003c/b>."},{"id":"t30q9","t":"t30","type":"tf","q":"Hearing and equilibrium are carried by GSA fibres.","a":false,"x":"\u003cb>SSA\u003c/b> (special somatic afferent) carries the special senses of \u003cb>vision, hearing and equilibrium\u003c/b>.","fix":"Vision, hearing and equilibrium are carried by SSA fibres."},{"id":"t30q10","t":"t30","type":"tf","q":"GVA fibres carry sensation from the viscera, such as mechanical, pain, temperature and proprioceptive sensation.","a":true,"x":"\u003cb>GVA\u003c/b> (general visceral afferent) is ordinary sensation coming from the viscera."},{"id":"t30q11","t":"t30","type":"tf","q":"In the functional classification, efferent fibres are motor and afferent fibres are sensory.","a":true,"x":"This decodes the last letter: \u003cb>E = efferent = motor\u003c/b>, \u003cb>A = afferent = sensory\u003c/b>. The first letter is General or Special and the middle letter Somatic or Visceral."},{"id":"t30q12","t":"t30","type":"type","q":"Which fibre type (give the abbreviation) carries somatic touch, pain, temperature and proprioception?","a":["GSA","general somatic afferent"],"x":"\u003cb>GSA\u003c/b> = general somatic afferent: ordinary body sensation. The trigeminal's three sensory nuclei are GSA."},{"id":"t31q1","t":"t31","type":"mcq","q":"Which nucleus supplies the glossopharyngeal, vagus and cranial part of the accessory nerve?","o":[["Nucleus ambiguus"],["Solitary nucleus","It is a sensory (GVA, SVA) nucleus, so it cannot supply the accessory."],["Dorsal vagal nucleus","It is not shared by these three nerves."],["Hypoglossal nucleus","It serves only the hypoglossal nerve."]],"x":"\u003cb>Nucleus ambiguus\u003c/b> is shared: your notes list it for the glossopharyngeal ('+10+11'), the vagus and the cranial part of the accessory.","d":1},{"id":"t31q2","t":"t31","type":"list","q":"Name the GVE (parasympathetic) nucleus of each nerve: oculomotor, facial, glossopharyngeal and vagus.","p":[["Oculomotor: Edinger-Westphal nucleus",["edinger","westphal","wesphal"]],["Facial: superior salivary nucleus",["superior saliv","sup saliv"]],["Glossopharyngeal: inferior salivary nucleus",["inferior saliv","inf saliv"]],["Vagus: dorsal vagal nucleus",["dorsal vag","dorsal motor"]]],"need":4,"x":"Each parasympathetic nucleus belongs to one nerve: \u003cb>Edinger-Westphal\u003c/b> (III), \u003cb>superior salivary\u003c/b> (VII), \u003cb>inferior salivary\u003c/b> (IX), \u003cb>dorsal vagal\u003c/b> (X)."},{"id":"t31q3","t":"t31","type":"mcq","q":"Which list correctly matches the trigeminal sensory nuclei to what they carry?","o":[["Main sensory: touch; spinal: pain and temperature; mesencephalic: proprioception"],["Main sensory: pain and temperature; spinal: touch; mesencephalic: proprioception","Touch and pain/temperature are swapped."],["Main sensory: touch; spinal: proprioception; mesencephalic: pain and temperature","Spinal and mesencephalic are swapped."],["Main sensory: proprioception; spinal: pain and temperature; mesencephalic: touch","Main sensory and mesencephalic are swapped."]],"x":"All three trigeminal sensory nuclei are GSA: main sensory = \u003cb>touch\u003c/b>, spinal = \u003cb>pain and temperature\u003c/b>, mesencephalic = \u003cb>proprioception\u003c/b>."},{"id":"t31q4","t":"t31","type":"multi","q":"Which of these nuclei are SVE in your notes? (select all)","o":[["Motor nucleus of trigeminal",1],["Motor facial nucleus",1],["Nucleus ambiguus",1],["Cochlear nucleus",0,"It is a sensory nucleus (SSA)."],["Main sensory nucleus of trigeminal",0,"It is a sensory nucleus (GSA)."]],"x":"The SVE nuclei in your notes are the \u003cb>motor nucleus of trigeminal\u003c/b>, the \u003cb>motor facial nucleus\u003c/b> and \u003cb>nucleus ambiguus\u003c/b>. Note that the motor nuclei of V and VII are SVE, not GSE."},{"id":"t31q5","t":"t31","type":"multi","q":"Which of these nuclei are GSE in your notes? (select all)","o":[["Oculomotor nucleus",1],["Trochlear nucleus",1],["Abducent nucleus",1],["Hypoglossal nucleus",1],["Solitary nucleus",0,"It is a sensory nucleus (GVA, SVA)."],["Spinal nucleus of trigeminal",0,"It is a sensory nucleus (GSA)."]],"x":"These four motor nuclei are \u003cb>GSE\u003c/b> in your notes: \u003cb>oculomotor, trochlear, abducent and hypoglossal\u003c/b>."},{"id":"t31q6","t":"t31","type":"mcq","q":"Which three cranial nerves share the solitary nucleus (GVA, SVA)?","o":[["Facial, glossopharyngeal and vagus"],["Oculomotor, facial and vagus","The oculomotor nerve has no solitary nucleus component in your notes."],["Trigeminal, facial and vagus","The trigeminal's sensory nuclei are its own GSA nuclei."],["Facial, vestibulocochlear and glossopharyngeal","The vestibulocochlear has its own cochlear and vestibular nuclei."]],"x":"The \u003cb>solitary nucleus\u003c/b> (GVA, SVA) is shared by the \u003cb>facial, glossopharyngeal and vagus\u003c/b> nerves."},{"id":"t31q7","t":"t31","type":"mcq","q":"Where does the spinal part of the accessory nerve arise?","o":[["Upper 5 or 6 spinal segments (GSE)"],["Nucleus ambiguus (SVE)","Not for the spinal part: your notes give it a spinal cord origin."],["Lower 5 or 6 spinal segments","Your notes say the upper segments."],["Hypoglossal nucleus (GSE)","That nucleus supplies the hypoglossal nerve."]],"x":"The \u003cb>spinal part\u003c/b> of the accessory nerve comes from the \u003cb>upper 5 or 6 spinal segments\u003c/b> and is \u003cb>GSE\u003c/b>."},{"id":"t31q8","t":"t31","type":"mcq","q":"According to the nuclei figure in your notes, which of these nuclei lies in the midbrain?","o":[["Trochlear nucleus"],["Facial motor nucleus","The figure places it lower, in the pons."],["Dorsal motor vagal nucleus","The figure places it in the medulla."],["Nucleus ambiguus","The figure places it in the medulla."]],"x":"The figure's midbrain level holds the \u003cb>Edinger-Westphal, oculomotor and trochlear\u003c/b> nuclei, plus the trigeminal mesencephalic nucleus."},{"id":"t31q9","t":"t31","type":"tf","q":"In the nuclei figure, the abducens nucleus lies in the pons.","a":true,"x":"The figure's pons level shows the principal trigeminal, trigeminal motor, \u003cb>abducens\u003c/b> and facial motor nuclei."},{"id":"t31q10","t":"t31","type":"tf","q":"In the nuclei figure, the hypoglossal nucleus lies in the pons.","a":false,"x":"The figure shows the \u003cb>hypoglossal nucleus\u003c/b> as a long column in the \u003cb>medulla\u003c/b>, beside the dorsal motor vagal nucleus.","fix":"The hypoglossal nucleus lies in the medulla."},{"id":"t32q1","t":"t32","type":"mcq","d":1,"q":"Which reflex do your notes name as the only monosynaptic reflex in the body?","o":[["The stretch reflex"],["The flexion-withdrawal reflex","Its arc activates interneurons, so it has more than one synapse."],["Contraction of the bladder wall when it fills","Your notes name the stretch reflex as the only monosynaptic reflex in the body."],["The pupillary light reflex","Your notes name the stretch reflex as the only monosynaptic reflex in the body."]],"x":"A monosynaptic reflex has one sensory neuron and one motor neuron with a \u003cb>single synapse\u003c/b> between them. Your notes say the \u003cb>stretch reflex\u003c/b> is the only example in the body."},{"id":"t32q2","t":"t32","type":"type","q":"What is a reflex called when its reflex arc contains two or more synapses?","a":["polysynaptic","polysynaptic reflex","poly-synaptic","multisynaptic"],"x":"A \u003cb>polysynaptic\u003c/b> reflex has two or more synapses in its arc; the classification chart says two to several hundred. The withdrawal reflex is the example in your notes."},{"id":"t32q3","t":"t32","type":"tf","q":"Acquired (conditioned) reflexes can develop without an intact cerebral cortex.","a":false,"fix":"Acquired reflexes need training, previous experience and an intact cerebral cortex.","x":"Innate reflexes are inborn and genetically determined, but \u003cb>acquired\u003c/b> reflexes are learned. They need training, previous experience and an \u003cb>intact cerebral cortex\u003c/b>."},{"id":"t32q4","t":"t32","type":"multi","q":"Which of these are examples of acquired (conditioned) reflexes in your notes? (select all)","o":[["Increased heart rate in an athlete on seeing the courtyard",1],["Secretion of digestive juices on seeing or smelling food",1],["Going silent when the lights dim in a cinema",1],["Contraction of the bladder wall when it is filled with urine",0,"This is an innate reflex: built-in, inborn and genetically determined."]],"x":"All three learned examples depend on previous experience. The athlete's raised heart rate is an \u003cb>anticipatory sympathetic response\u003c/b>. Bladder wall contraction on filling is inborn, so it is innate."},{"id":"t32q5","t":"t32","type":"mcq","q":"Reflexes that regulate cardiovascular, respiratory and digestive functions have their centre in which part of the CNS?","o":[["Medulla oblongata"],["Hypothalamus","Hypothalamic reflexes regulate body temperature, body water and general metabolism."],["Midbrain","Midbrain reflexes include the pupillary light reflex and postural reflexes."],["Spinal cord","These are cranial reflexes, so their centre is in the brain, not the spinal cord."]],"x":"These are \u003cb>medullary\u003c/b> reflexes. Cranial reflexes have their centre in the brain: hypothalamus (temperature, water, metabolism), midbrain (pupillary light and postural reflexes) or medulla (cardiovascular, respiratory, digestive)."},{"id":"t32q6","t":"t32","type":"tf","q":"Reflexes occur in both the somatic and the autonomic nervous systems.","a":true,"x":"Your notes define the reflex as the simplest motor response to sensory input and say it occurs in \u003cb>both\u003c/b> the autonomic and somatic nervous systems."},{"id":"t32q7","t":"t32","type":"tf","q":"In deep reflexes, the stimulus is applied to deep structures such as a muscle or tendon.","a":true,"x":"Classified by stimulus site: in \u003cb>superficial\u003c/b> reflexes the stimulus is applied to the skin; in \u003cb>deep\u003c/b> reflexes it acts on deep structures such as muscle or tendon."},{"id":"t32q8","t":"t32","type":"order","q":"Put the parts of a reflex arc in order, from start to finish.","o":["Receptor","Afferent (sensory) neuron","Centre in the CNS","Motor (efferent) neuron","Effector organ"],"x":"The \u003cb>receptor\u003c/b> turns the stimulus into nerve impulses carried by the \u003cb>afferent\u003c/b> neuron to the CNS. There it synapses, directly or via interneurons, with the motor neuron (the \u003cb>centre\u003c/b>), which drives the \u003cb>effector\u003c/b> to give the response."},{"id":"t32q9","t":"t32","type":"mcq","q":"According to the classification chart in your notes, visceral (autonomic) reflexes control which effectors?","o":[["Smooth and cardiac muscle, and glands"],["Skeletal muscle only","That describes somatic reflexes, which include superficial and stretch reflexes."],["Skeletal muscle and glands","Skeletal muscle is controlled by somatic reflexes, not visceral ones."],["The intrafusal fibres of muscle spindles","These are supplied by γ motor neurons, not by visceral reflexes."]],"x":"Classified by response, \u003cb>somatic\u003c/b> reflexes control skeletal muscle contraction, while \u003cb>visceral (autonomic)\u003c/b> reflexes control smooth muscle, cardiac muscle and glands."},{"id":"t33q1","t":"t33","type":"mcq","d":1,"q":"Which muscle spindle afferents detect the rate of change in muscle length during a stretch?","o":[["Group Ia (primary) afferents"],["Group II (secondary) afferents","These signal the steady-state (static) length of the muscle."],["γ efferent fibres","These are motor fibres that adjust spindle sensitivity; they carry no sensory signal."],["Thick myelinated α efferent fibres","These carry the motor command to the extrafusal fibres."]],"x":"Rapidly adapting \u003cb>Ia\u003c/b> endings sense fast, dynamic change in length. They tell the CNS about the \u003cb>speed\u003c/b> of movement and allow quick corrective movements."},{"id":"t33q2","t":"t33","type":"type","q":"What name do your notes give to the secondary (group II) endings of the muscle spindle?","a":["flower spray","flower-spray","flowerspray","flower spray endings"],"x":"Secondary group II endings are \u003cb>flower spray\u003c/b> endings. Primary group Ia endings are \u003cb>annulospiral\u003c/b> endings."},{"id":"t33q3","t":"t33","type":"tf","q":"The central part of the intrafusal fibres is the stretch-sensitive receptor area, while the parts on both sides are contractile.","a":true,"x":"Intrafusal fibres have a \u003cb>noncontractile centre\u003c/b> (the receptor area, where Ia and II afferents begin) and \u003cb>contractile polar ends\u003c/b> supplied by γ efferents."},{"id":"t33q4","t":"t33","type":"mcq","q":"Static γ efferent fibres supply which fibres?","o":[["Static nuclear bag fibres and nuclear chain fibres"],["Dynamic nuclear bag fibres only","These are supplied by the dynamic γ efferent fibres."],["Extrafusal muscle fibres","These are supplied by thick myelinated α efferent fibres."],["Nuclear chain fibres only","Static γ fibres also supply the static nuclear bag fibres."]],"x":"There are two types of γ motor neuron. \u003cb>Dynamic γ\u003c/b> fibres supply the dynamic nuclear bag fibres; \u003cb>static γ\u003c/b> fibres supply the static nuclear bag fibres \u003cb>and\u003c/b> the nuclear chain fibres."},{"id":"t33q5","t":"t33","type":"tf","q":"The γ motor neurons that supply the muscle spindle originate in the dorsal roots.","a":false,"fix":"γ motor neurons originate in the ventral roots.","x":"The spindle has its own motor supply, the \u003cb>γ motor neurons\u003c/b>, which originate in the \u003cb>ventral roots\u003c/b>. They adjust spindle sensitivity so it responds properly during contraction."},{"id":"t33q6","t":"t33","type":"type","q":"Which neurons form the centre of the stretch reflex, receiving impulses from the primary and secondary spindle endings?","a":["alpha motor neurons","α motor neurons","alpha motor neuron","alpha motoneurons","α-motor neurons","alpha motoneurones"],"x":"The centre is the \u003cb>α motor neurons\u003c/b>. Their thick myelinated axons supply the extrafusal fibres, which contract as the response."},{"id":"t33q7","t":"t33","type":"multi","q":"Which are the essential elements of every muscle spindle? (select all)","o":[["A group of specialized intrafusal muscle fibres",1],["Myelinated afferent nerves of types Ia and II",1],["Myelinated γ efferent nerves",1],["Extrafusal muscle fibres",0,"These are the ordinary muscle fibres outside the spindle, supplied by α efferents."],["An inhibitory interneuron",0,"Inhibitory interneurons are in the spinal cord (e.g. reciprocal innervation), not in the spindle."]],"x":"Each spindle has three essential elements: \u003cb>intrafusal fibres\u003c/b>, large myelinated \u003cb>afferents (Ia and II)\u003c/b> and small myelinated \u003cb>efferents\u003c/b> to the contractile ends."},{"id":"t33q8","t":"t33","type":"mcq","q":"Which reflex is the basis of the tendon jerks?","o":[["Dynamic stretch reflex"],["Static stretch reflex","This gives a maintained sub-tetanic contraction, not a quick jerk."],["Reciprocal innervation","This relaxes the antagonist; it is a property of the stretch reflex, not the jerk itself."],["α–γ coactivation","This keeps the spindle stretched during a voluntary contraction."]],"x":"A sudden strong passive stretch stretches the nuclear bag fibres and fires the primary endings. The result is \u003cb>rapid contraction followed by rapid relaxation\u003c/b>, which is the tendon jerk. This reflex opposes sudden changes in length."},{"id":"t33q9","t":"t33","type":"tf","q":"In the static stretch reflex, a maintained weak stretch stretches mainly the nuclear bag fibres.","a":false,"fix":"It stretches the nuclear chain fibres, stimulating the secondary endings.","x":"Static reflex: maintained weak stretch → \u003cb>nuclear chain fibres\u003c/b> → \u003cb>secondary (II) endings\u003c/b> → maintained sub-tetanic contraction. Nuclear bag fibres belong to the dynamic reflex."},{"id":"t34q1","t":"t34","type":"mcq","d":1,"q":"What is the significance of α–γ coactivation during a voluntary contraction?","o":[["The muscle spindles stay stretched throughout the contraction"],["The antagonist muscle relaxes","That is reciprocal innervation, through an inhibitory interneuron."],["Spindle sensitivity is switched off while the muscle shortens","Coactivation does the opposite: intrafusal fibres shorten with extrafusal fibres so the spindle keeps working."],["γ motor neurons are silenced whenever α motor neurons fire","Signals to α motor neurons stimulate γ motor neurons at the same time."]],"x":"Signals from the motor cortex to α motor neurons also stimulate γ motor neurons. Extrafusal and intrafusal fibres shorten \u003cb>together\u003c/b>, so the spindle does not go slack and \u003cb>remains stretched\u003c/b> throughout the contraction."},{"id":"t34q2","t":"t34","type":"tf","q":"Supraspinal facilitatory centres are normally predominant during rest.","a":true,"x":"Both facilitatory and inhibitory centres act on the stretch reflex, but the \u003cb>facilitatory\u003c/b> centres normally predominate at rest."},{"id":"t34q3","t":"t34","type":"multi","q":"Which are supraspinal FACILITATORY centres for the stretch reflex? (select all)","o":[["Facilitatory reticular formation",1],["Vestibular nucleus",1],["Olive nucleus",1],["Inhibitory reticular formation",0,"This is the supraspinal inhibitory centre in your notes."]],"x":"Facilitatory centres: the \u003cb>facilitatory reticular formation\u003c/b>, the \u003cb>vestibular nucleus\u003c/b> and the \u003cb>olive nucleus\u003c/b> (both in the medulla oblongata)."},{"id":"t34q4","t":"t34","type":"mcq","q":"The inhibitory reticular formation influences the stretch reflex through which tract?","o":[["Lateral reticulospinal tract"],["Medial reticulospinal tract","This carries the facilitatory reticular formation's influence."],["Lateral vestibulospinal tract","This carries facilitation from the vestibular nucleus."],["Medial vestibulospinal tract","This also carries facilitation from the vestibular nucleus."]],"x":"The \u003cb>inhibitory\u003c/b> reticular formation acts through the \u003cb>lateral\u003c/b> reticulospinal tract; the facilitatory one uses the \u003cb>medial\u003c/b> reticulospinal tract."},{"id":"t34q5","t":"t34","type":"tf","q":"Supraspinal centres change the threshold of the stretch reflex mainly by acting on α motor neurons.","a":false,"fix":"They act through descending tracts on γ motor neurons.","x":"By changing \u003cb>γ motor neuron\u003c/b> activity, supraspinal centres change the reflex threshold. This changes the tone of various muscles to keep the posture of the body."},{"id":"t34q6","t":"t34","type":"type","q":"What is the manoeuvre called in which the patient hooks the fingers together or clenches the teeth while a tendon jerk is being elicited?","a":["Jendrassik manoeuvre","Jendrassik maneuver","Jendrassik","Jendrassiks manoeuvre","jendrassic"],"x":"The \u003cb>Jendrassik manoeuvre\u003c/b> is one of the things your notes say increases γ efferent discharge while tendon jerks are being tested."},{"id":"t34q7","t":"t34","type":"tf","q":"Anxiety and painful stimulation of the skin can both increase γ efferent discharge.","a":true,"x":"Your notes list three things that raise γ efferent discharge: \u003cb>anxiety\u003c/b>, \u003cb>cutaneous painful stimulation\u003c/b> and the Jendrassik manoeuvre."},{"id":"t34q8","t":"t34","type":"mcq","q":"Apart from stimulating α motor neurons, how else can a muscle be made to contract?","o":[["By stimulating γ motor neurons, which act indirectly through the stretch reflex"],["By relaxing its antagonist through reciprocal innervation","Reciprocal innervation relaxes the antagonist; it does not make the muscle itself contract."],["By increasing the activity of the inhibitory reticular formation","This is a supraspinal inhibitory centre, so it would not drive contraction."],["By blocking the group Ia afferents","The γ route needs the Ia fibres: γ stimulation works by firing Ia impulses."]],"x":"γ stimulation shortens the \u003cb>contractile ends\u003c/b> of the intrafusal fibres, which stretches the nuclear bag region and fires \u003cb>Ia\u003c/b> fibres. These excite α motor neurons, so the muscle contracts \u003cb>indirectly\u003c/b> via the stretch reflex."},{"id":"t34q9","t":"t34","type":"tf","q":"Increased γ motor neuron activity reduces the sensitivity of the muscle spindle during stretch.","a":false,"fix":"Increased γ motor neuron activity increases spindle sensitivity during stretch.","x":"γ activity shortens the intrafusal ends and stretches the receptor area, so the spindle responds more to any stretch: spindle \u003cb>sensitivity increases\u003c/b>."},{"id":"t35q1","t":"t35","type":"mcq","d":1,"q":"Why does the stretch reflex show no fatigue?","o":[["Its motor neurons discharge at a low frequency and alternate their activity"],["It has no interneurons","This is a real feature, but it explains other properties, not the lack of fatigue."],["Its fibres conduct rapidly","This is a real feature, but it explains a different property, not the lack of fatigue."],["Its antagonist relaxes at the same time","This is reciprocal innervation, a separate property of the reflex."]],"x":"Each property has its own reason in your notes. \u003cb>No fatigue\u003c/b> is because the motor neurons fire at a \u003cb>low frequency\u003c/b> and \u003cb>alternate\u003c/b> their activity."},{"id":"t35q2","t":"t35","type":"tf","q":"The stretch reflex irradiates to other spinal cord segments.","a":false,"fix":"The stretch reflex is localized, with no irradiation, because it has no interneurons.","x":"The stretch reflex is \u003cb>localized\u003c/b>. With no interneurons, the impulse has no path to spread to other spinal segments."},{"id":"t35q3","t":"t35","type":"tf","q":"The stretch reflex has no after-discharge, so the response ends as soon as the stimulation stops.","a":true,"x":"There are no interneurons to keep the motor neurons firing, so there is \u003cb>no after-discharge\u003c/b>: the response stops immediately."},{"id":"t35q4","t":"t35","type":"mcq","q":"In the stretch reflex, how does the antagonistic muscle relax at the same time?","o":[["The same afferent excites an inhibitory interneuron that inhibits the antagonist's motor neuron"],["The cerebral cortex switches off the antagonist","Your notes explain it by a second spinal reflex arc, not by the cortex."],["The Ia afferent synapses directly on the antagonist's muscle fibres","Afferents synapse in the spinal cord, not on muscle fibres."],["γ motor neurons to the antagonist stop firing","Your notes explain it by an inhibitory interneuron acting on the antagonist's motor neuron."]],"x":"This is \u003cb>reciprocal innervation\u003c/b>. Another reflex arc, through an \u003cb>inhibitory interneuron\u003c/b> excited by the same afferent, inhibits the motor neuron to the antagonist (figure: 'motor neuron to antagonistic muscles is inhibited')."},{"id":"t35q5","t":"t35","type":"mcq","q":"Why does the stretch reflex have a short total reflex time?","o":[["It is monosynaptic and uses rapidly conducting fibres"],["It passes through many interneurons","Extra interneurons would add synapses and lengthen the reflex time."],["Its centre is in the cerebral cortex","Its centre is the α motor neurons in the spinal cord."],["It is a conditioned reflex learned with practice","Conditioned reflexes need the cortex; the stretch reflex is a simple spinal reflex."]],"x":"One synapse plus \u003cb>rapidly conducting fibres\u003c/b> gives the stretch reflex a \u003cb>short total reflex time\u003c/b>."},{"id":"t35q6","t":"t35","type":"list","q":"List the four functions of the stretch reflex given in your notes.","p":[["Keeps muscle length constant",["length","constant"]],["Controls posture",["postur","position"]],["Maintains balance during walking and standing",["balanc","walk","stand"]],["Clinical use in neurological examination (tendon jerks)",["clinic","jerk","exam","neuro"]]],"need":3,"x":"Functions: constant \u003cb>muscle length\u003c/b>, \u003cb>posture\u003c/b>, \u003cb>balance\u003c/b> in walking and standing, and \u003cb>clinical\u003c/b> value. Knee, ankle and biceps jerks help assess spinal segments, peripheral nerves and descending control."},{"id":"t35q7","t":"t35","type":"mcq","q":"Which is the best definition of muscle tone?","o":[["Continuous reflex sub-tetanic contraction of skeletal muscles during rest"],["A voluntary, sustained tetanic contraction","Tone is a reflex and sub-tetanic, not voluntary or tetanic."],["Contraction found only in antigravity muscles","Tone is present in all skeletal muscles; it is just more marked in antigravity muscles."],["Complete relaxation of skeletal muscle at rest","Tone is a continuous contraction, not relaxation."]],"x":"\u003cb>Muscle tone\u003c/b> is the continuous reflex \u003cb>sub-tetanic\u003c/b> contraction of skeletal muscles \u003cb>during rest\u003c/b>."},{"id":"t35q8","t":"t35","type":"tf","q":"Tone in the abdominal muscles helps keep the viscera in position.","a":true,"x":"One of the four functions of muscle tone in your notes: \u003cb>abdominal muscle tone keeps the viscera in position\u003c/b>. The anterior abdominal wall muscles are also among the antigravity muscles."},{"id":"t35q9","t":"t35","type":"multi","q":"Which are antigravity muscles, in which muscle tone is more marked? (select all)","o":[["Flexors of the upper limbs",1],["Extensors of the lower limbs",1],["Elevators of the lower jaw",1],["Anterior abdominal wall muscles",1],["Extensors of the upper limbs",0,"In the upper limbs, the antigravity muscles are the flexors."],["Flexors of the lower limbs",0,"In the lower limbs, the antigravity muscles are the extensors."]],"x":"Antigravity muscles are stretched more by gravity, so tone is more marked: \u003cb>upper limb flexors\u003c/b>, \u003cb>lower limb extensors\u003c/b>, back and back-of-neck extensors, \u003cb>lower jaw elevators\u003c/b> and \u003cb>anterior abdominal wall\u003c/b> muscles."},{"id":"t35q10","t":"t35","type":"tf","q":"Muscle tone helps heat production, and tone increases in cold weather.","a":true,"x":"Functions of tone: erect posture against gravity, venous return and lymph flow, \u003cb>heat production\u003c/b> (tone rises in the cold), and keeping the viscera in place."},{"id":"t35q11","t":"t35","type":"mcq","q":"Why are skeletal muscles continuously stretched at rest?","o":[["They are shorter than the distance between their origin and insertion"],["Their antagonists are always contracting","Your notes explain the stretch by the muscle's length relative to its origin and insertion."],["Gravity stretches every muscle equally","Gravity explains why tone is more marked in antigravity muscles, not why all muscles are stretched."],["The spindles shorten the whole muscle","γ-driven shortening affects only the intrafusal fibres inside the spindle."]],"x":"Because muscles are \u003cb>shorter than the distance between origin and insertion\u003c/b>, they are always slightly stretched. This keeps the static stretch reflex active, giving tone."},{"id":"t36q1","t":"t36","type":"mcq","d":1,"q":"Which neurones are classed as upper motor neurones in your notes?","o":[["All neurones within the descending motor system"],["Neurones whose axons directly innervate the muscles","These are lower motor neurones."],["Only the neurones of the pyramidal tracts","Extrapyramidal tract neurones are also upper motor neurones."],["Sensory neurones of the ascending tracts","Upper motor neurones are motor neurones of the descending pathways."]],"x":"At the end of every descending tract the neurone synapses on a lower motor neurone. So \u003cb>all\u003c/b> neurones in the descending motor system, pyramidal or extrapyramidal, are \u003cb>upper motor neurones\u003c/b>."},{"id":"t36q2","t":"t36","type":"tf","q":"Upper motor neurones have their cell bodies in the cerebral cortex or brainstem, and their axons remain within the CNS.","a":true,"x":"UMN cell bodies are in the \u003cb>cerebral cortex or brainstem\u003c/b>, and their axons stay \u003cb>inside the CNS\u003c/b>. Only the lower motor neurone leaves to reach the muscle."},{"id":"t36q3","t":"t36","type":"tf","q":"Voluntary movement is mostly directed at proximal and truncal muscle groups.","a":false,"fix":"Voluntary movement is mostly directed at distal muscle groups, such as the hand.","x":"Voluntary movement mostly targets \u003cb>distal\u003c/b> muscles (complex hand movements). Involuntary movement mainly uses \u003cb>proximal and truncal\u003c/b> muscles and is critical for postural stability."},{"id":"t36q4","t":"t36","type":"mcq","q":"Which group of descending tracts originates in the brainstem?","o":[["Extrapyramidal tracts"],["Pyramidal tracts","These originate in the cerebral cortex."],["Corticospinal tracts","These are pyramidal tracts that begin in the cerebral cortex."],["Corticobulbar tracts","These are pyramidal tracts that begin in the motor cortex."]],"x":"\u003cb>Extrapyramidal\u003c/b> tracts originate in the \u003cb>brainstem\u003c/b> and carry motor fibres to the spinal cord. Pyramidal tracts begin in the cerebral cortex."},{"id":"t36q5","t":"t36","type":"multi","q":"Which functions do your notes give to the extrapyramidal tracts? (select all)","o":[["Muscle tone",1],["Balance",1],["Posture",1],["Locomotion",1],["Voluntary control of the face muscles",0,"Voluntary control of body and face muscles is the job of the pyramidal tracts."],["Precise skilled movements of the hand",0,"This is voluntary control, carried by the pyramidal tracts."]],"x":"Extrapyramidal tracts give \u003cb>involuntary and automatic\u003c/b> control of all musculature, such as \u003cb>muscle tone, balance, posture and locomotion\u003c/b>."},{"id":"t36q6","t":"t36","type":"order","q":"Put the parts of the motor pathway in Fig 1 of your notes in order.","o":["Motor cortex of the brain","Upper motor neurone","Lower motor neurone","Muscle"],"x":"Fig 1: the \u003cb>upper motor neurone\u003c/b> runs from the motor cortex to synapse on the \u003cb>lower motor neurone\u003c/b>, which directly innervates the \u003cb>muscle\u003c/b>."},{"id":"t37q1","t":"t37","type":"type","q":"The pyramidal tracts get their name from which structures that they pass through?","a":["medullary pyramids","pyramids","pyramids of the medulla","medullary pyramid"],"x":"They are named after the \u003cb>medullary pyramids\u003c/b> of the medulla oblongata, which the fibres pass through on their way down."},{"id":"t37q2","t":"t37","type":"mcq","q":"Which pyramidal tract supplies the musculature of the head and neck?","o":[["Corticobulbar tract"],["Lateral corticospinal tract","Corticospinal tracts supply the musculature of the body."],["Anterior corticospinal tract","Corticospinal tracts supply the musculature of the body."],["Tectospinal tract","This is an extrapyramidal tract, not a pyramidal one."]],"x":"Pyramidal tracts split into \u003cb>corticospinal\u003c/b> (body) and \u003cb>corticobulbar\u003c/b> (head and neck). Corticobulbar fibres end on cranial nerve motor nuclei.","d":1},{"id":"t37q3","t":"t37","type":"multi","q":"From which areas do the corticospinal tracts receive fibres? (select all)","o":[["Primary motor cortex",1],["Premotor cortex",1],["Supplementary motor area",1],["Somatosensory area",1],["Red nucleus",0,"This is a brainstem structure; corticospinal fibres begin in the cerebral cortex."],["Vestibular nuclei",0,"These are in the brainstem; corticospinal fibres begin in the cerebral cortex."]],"x":"Inputs: \u003cb>primary motor cortex, premotor cortex and supplementary motor area\u003c/b>. Fibres from the \u003cb>somatosensory area\u003c/b> also join and help regulate the activity of the ascending tracts."},{"id":"t37q4","t":"t37","type":"order","q":"Put the structures the corticospinal tract passes through in order, from where it starts to where it ends.","o":["Cerebral cortex","Internal capsule","Crus cerebri of the midbrain","Pons","Medulla","Ventral horn of the spinal cord"],"x":"From the cortex the fibres converge through the \u003cb>internal capsule\u003c/b>, then the \u003cb>crus cerebri\u003c/b>, \u003cb>pons\u003c/b> and \u003cb>medulla\u003c/b>, and finally end on LMNs in the \u003cb>ventral horn\u003c/b>."},{"id":"t37q5","t":"t37","type":"tf","q":"The corticospinal tract divides into its lateral and anterior parts in the pons.","a":false,"fix":"It divides in the most inferior (caudal) part of the medulla.","x":"The tract passes through the pons into the medulla. In the \u003cb>most inferior (caudal) part of the medulla\u003c/b> it divides into the lateral and anterior corticospinal tracts."},{"id":"t37q6","t":"t37","type":"mcq","q":"Which tract innervates the distal muscle groups for precise, skilled movements?","o":[["Lateral corticospinal tract"],["Anterior corticospinal tract","Its fibres end on LMNs controlling trunk and proximal muscles."],["Corticobulbar tract","This ends on cranial nerve motor nuclei for head and neck muscles."],["Reticulospinal tract","This is an extrapyramidal tract for posture and muscle tone."]],"x":"The \u003cb>lateral corticospinal tract\u003c/b> innervates LMNs in the anterior horn that supply \u003cb>distal\u003c/b> muscles for \u003cb>precise skilled movements\u003c/b>."},{"id":"t37q7","t":"t37","type":"tf","q":"Fibres of the lateral corticospinal tract decussate, whereas the anterior corticospinal tract stays ipsilateral as it descends into the spinal cord.","a":true,"x":"The \u003cb>lateral\u003c/b> tract crosses to the other side and ends in the ventral horn at all levels. The \u003cb>anterior\u003c/b> tract stays ipsilateral; most of its fibres cross later, so its innervation is often bilateral."},{"id":"t37q8","t":"t37","type":"mcq","q":"What is the main role of the anterior corticospinal tract?","o":[["Ipsilateral postural adjustments when voluntary movements are made with the contralateral limb"],["Precise skilled movements of the distal muscles","This is the role of the lateral corticospinal tract."],["Voluntary control of the face and neck muscles","This is the role of the corticobulbar tract."],["Keeping the centre of gravity between the feet","Your notes give this role to an extrapyramidal tract, not a pyramidal one."]],"x":"The anterior corticospinal tract acts on \u003cb>trunk and proximal\u003c/b> muscles, often bilaterally. It makes \u003cb>ipsilateral postural adjustments\u003c/b> while the opposite limb performs a voluntary movement."},{"id":"t37q9","t":"t37","type":"multi","q":"Which motor cranial nerve nuclei receive mostly UNILATERAL corticobulbar innervation? (select all)","o":[["Lower half of the facial nucleus (lower face muscles)",1],["Hypoglossal nucleus",1],["Upper half of the facial nucleus (upper face muscles)",0,"Only the lower half of the facial nucleus is listed as an exception; other nuclei get bilateral fibres."],["Nuclei supplying the neck muscles",0,"Your notes list only the lower face and hypoglossal nuclei as exceptions to bilateral innervation."]],"x":"Most corticobulbar fibres reach cranial motor nuclei \u003cb>bilaterally\u003c/b>, so if one hemisphere is damaged the other can still give some function. The exceptions are the \u003cb>lower face\u003c/b> (lower half of facial nucleus) and the \u003cb>hypoglossal nucleus\u003c/b>."},{"id":"t37q10","t":"t37","type":"tf","q":"The corticobulbar tracts arise from the medial aspect of the primary motor cortex.","a":false,"fix":"They arise from the lateral aspect of the primary motor cortex.","x":"Corticobulbar tracts arise from the \u003cb>lateral aspect\u003c/b> of the primary motor cortex, receive the same inputs as the corticospinal tracts and pass through the internal capsule to the brainstem."},{"id":"t38q1","t":"t38","type":"multi","d":1,"q":"Which extrapyramidal tracts decussate and so give contralateral innervation? (select all)","o":[["Rubrospinal tract",1],["Tectospinal tract",1],["Vestibulospinal tract",0,"It does not decussate, so its innervation is ipsilateral."],["Reticulospinal tract",0,"It does not decussate; it descends mainly ipsilaterally."]],"x":"Of the four extrapyramidal tracts, the \u003cb>rubrospinal\u003c/b> and \u003cb>tectospinal\u003c/b> tracts decussate (contralateral). The vestibulospinal and reticulospinal tracts do not (ipsilateral)."},{"id":"t38q2","t":"t38","type":"mcq","q":"Which tract descends to the cervical and upper thoracic spinal cord and acts on neck muscles to stabilise the head as we move?","o":[["Medial vestibulospinal tract"],["Lateral vestibulospinal tract","This one descends in the ventral funiculus to all levels of the spinal cord."],["Pontine reticulospinal tract","Reticulospinal tracts project to all spinal levels."],["Corticobulbar tract","This pyramidal tract ends on cranial nerve motor nuclei, not in the spinal cord."]],"x":"The \u003cb>medial VST\u003c/b> goes to the cervical and upper thoracic cord and acts on interneurons that facilitate neck muscles, \u003cb>stabilising the head\u003c/b> as the body moves."},{"id":"t38q3","t":"t38","type":"tf","q":"The lateral vestibulospinal tract keeps the centre of gravity between the feet by acting mainly on flexor motor neurones.","a":false,"fix":"It acts on extensor motor neurones.","x":"The \u003cb>lateral VST\u003c/b> arises from the lateral vestibular nucleus in the medulla, runs in the ventral funiculus to all levels and acts on \u003cb>extensor\u003c/b> motor neurones to keep balance."},{"id":"t38q4","t":"t38","type":"tf","q":"The pontine reticulospinal tract is primarily inhibitory, while the medullary reticulospinal tract is primarily excitatory.","a":false,"fix":"The pontine tract is primarily excitatory; the medullary tract is primarily inhibitory.","x":"\u003cb>Pontine\u003c/b> reticulospinal = mainly \u003cb>excitatory\u003c/b>; \u003cb>medullary\u003c/b> reticulospinal = mainly \u003cb>inhibitory\u003c/b>. Both reach all spinal levels, mainly ipsilaterally, and help maintain posture and modulate muscle tone."},{"id":"t38q5","t":"t38","type":"mcq","q":"A person with depression shows different posture and body language from someone who is happy. Which tracts contain the emotional motor system fibres that mediate this?","o":[["Reticulospinal tracts"],["Tectospinal tract","Your notes do not link this tract to the expression of emotion."],["Rubrospinal tract","Your notes link this tract to distal limb muscles, not to emotional expression."],["Lateral corticospinal tract","This pyramidal tract controls precise voluntary movement, not emotional posture."]],"x":"The \u003cb>reticulospinal\u003c/b> tracts contain a network of fibres forming the \u003cb>emotional motor system\u003c/b>, which mediates the expression of emotion through posture and body language."},{"id":"t38q6","t":"t38","type":"type","q":"The tectospinal tract begins in which structure of the midbrain?","a":["superior colliculus","superior colliculi","the superior colliculus"],"x":"The tectospinal tract begins in the \u003cb>superior colliculus\u003c/b>, which receives input from the optic nerves. Its fibres decussate quickly and enter the spinal cord."},{"id":"t38q7","t":"t38","type":"tf","q":"The tectospinal tract terminates at the lumbar levels of the spinal cord.","a":false,"fix":"It terminates at the cervical levels of the spinal cord.","x":"The tectospinal tract ends at \u003cb>cervical\u003c/b> levels, which fits its job of moving the head."},{"id":"t38q8","t":"t38","type":"mcq","q":"What does the tectospinal tract coordinate?","o":[["Movements of the head in relation to visual, auditory and somatic stimuli"],["Stabilising the head through neck muscles as the body moves","That is the medial vestibulospinal tract."],["Keeping the centre of gravity between the feet","That is the lateral vestibulospinal tract."],["Expression of emotion through posture","That is the emotional motor system in the reticulospinal tracts."]],"x":"The tectospinal tract coordinates \u003cb>head movements\u003c/b> in relation to \u003cb>vision, hearing and somatic stimuli\u003c/b>. Its origin, the superior colliculus, gets optic nerve input."},{"id":"t38q9","t":"t38","type":"tf","q":"In humans, the function of the rubrospinal tract is outweighed by the corticospinal pathway.","a":true,"x":"The rubrospinal tract influences motor neurons of distal limb muscles, but in humans the \u003cb>corticospinal\u003c/b> pathway outweighs it."},{"id":"t38q10","t":"t38","type":"type","q":"The rubrospinal tract originates from which midbrain nucleus?","a":["red nucleus","the red nucleus","nucleus ruber"],"x":"The rubrospinal tract starts in the \u003cb>red nucleus\u003c/b> of the midbrain. Its fibres decussate as they emerge and descend into the spinal cord."},{"id":"t38q11","t":"t38","type":"tf","q":"Your notes group the rubrospinal tract as a lateral brainstem pathway, and the vestibulospinal, reticulospinal and tectospinal tracts as medial brainstem pathways.","a":true,"x":"Medial brainstem pathways: \u003cb>vestibulospinal, reticulospinal, tectospinal\u003c/b>. Lateral brainstem pathway: \u003cb>rubrospinal\u003c/b>."},{"id":"t39q1","t":"t39","type":"mcq","d":1,"q":"A comatose patient lies with both the upper and lower limbs extended. Where is the brainstem lesion most likely to be?","o":[["At or below the level of the red nucleus"],["Above the level of the red nucleus","A lesion above the red nucleus produces the other (decorticate) posture."],["In the lower motor neurones of the limbs","Abnormal posturing reflects the activity of descending motor tracts, not LMN damage."],["In the spinal cord below the neck","Your notes place both rigidities in the brainstem, relative to the red nucleus."]],"x":"Extension of all limbs is \u003cb>decerebrate rigidity\u003c/b>: the brainstem is damaged \u003cb>at or below the red nucleus\u003c/b>, while the pontine and medullary reticular systems and the vestibular system are left intact."},{"id":"t39q2","t":"t39","type":"tf","q":"In decorticate posturing, the upper limbs flex while the lower limbs extend.","a":true,"x":"Figure B in your notes: \u003cb>decorticate\u003c/b> = upper limbs flex, lower limbs extend. Figure A: decerebrate = upper and lower limbs extend."},{"id":"t39q3","t":"t39","type":"type","q":"In decorticate rigidity, which descending tract is still active and facilitates flexor tone in the upper limbs?","a":["rubrospinal tract","rubrospinal","rubrospinal pathway"],"x":"Above-red-nucleus damage spares the red nucleus, so the \u003cb>rubrospinal tract\u003c/b> still facilitates flexor tone in the upper limbs. In decerebrate rigidity this tract is disrupted, so the arms lose flexor facilitation."},{"id":"t39q4","t":"t39","type":"multi","q":"In decerebrate rigidity, which tracts dominate to produce strong extensor tone in all limbs? (select all)","o":[["Vestibulospinal tract",1],["Pontine reticulospinal tract",1],["Rubrospinal tract",0,"This tract is disrupted in decerebrate rigidity."],["Medullary reticulospinal tract",0,"Your notes name only the vestibulospinal and pontine reticulospinal tracts; the medullary tract is mainly inhibitory."]],"x":"With the rubrospinal tract cut off, the intact \u003cb>vestibulospinal\u003c/b> and \u003cb>pontine reticulospinal\u003c/b> tracts dominate, giving strong extensor tone in all limbs. The same two tracts give the lower-limb extension in decorticate rigidity."},{"id":"t39q5","t":"t39","type":"mcq","q":"In decorticate rigidity, what is lost?","o":[["Cortical inhibition"],["Rubrospinal tract activity","The red nucleus is still active in decorticate rigidity."],["Vestibulospinal tract activity","This tract stays intact and gives extensor tone in the lower limbs."],["Pontine reticulospinal tract activity","This tract stays intact and gives extensor tone in the lower limbs."]],"x":"Damage above the red nucleus causes \u003cb>loss of cortical inhibition\u003c/b>, but the red nucleus is still active and the vestibulospinal and pontine reticulospinal tracts are intact."},{"id":"t39q6","t":"t39","type":"tf","q":"The type of abnormal posturing in a comatose patient gives no clue about where the lesion is.","a":false,"fix":"The type of posturing can indicate the location of the lesion or the extent of the brain damage.","x":"Abnormal posturing in coma comes from the activity of descending motor tracts, so its \u003cb>type\u003c/b> can point to the \u003cb>location\u003c/b> of the lesion or the \u003cb>extent\u003c/b> of brain damage."},{"id":"t40q1","t":"t40","type":"mcq","d":1,"q":"What do Golgi tendon organs detect?","o":[["Muscle tension (the force of contraction)"],["Muscle length","GTOs respond to tension, not length."],["Painful stimuli on the skin","These trigger the withdrawal reflex through pain-sensitive neurons."],["The speed of a sudden stretch","GTOs are tension receptors; they are activated during strong muscle contraction."]],"x":"GTOs are sensitive to \u003cb>muscle tension\u003c/b>, or the force of contraction, not length. That is why they are activated during \u003cb>strong muscle contraction\u003c/b>."},{"id":"t40q2","t":"t40","type":"type","q":"Counting its synapses, what kind of reflex do your notes call the inverse stretch reflex?","a":["di-synaptic","disynaptic","bisynaptic","two synapses"],"x":"It is a protective \u003cb>di-synaptic\u003c/b> reflex: Ib afferent → interneuron → α motor neuron, giving two synapses."},{"id":"t40q3","t":"t40","type":"type","q":"Besides 'lengthening reaction', what other name do your notes give the inverse stretch reflex?","a":["autogenic inhibition","autogenic"],"x":"\u003cb>Autogenic inhibition\u003c/b> means self-generated inhibition: tension in a muscle inhibits that same muscle's motor neurons, so it relaxes."},{"id":"t40q4","t":"t40","type":"tf","q":"Golgi tendon organs lie in the fleshy part of the muscle, among the muscle fibres.","a":false,"fix":"Golgi tendon organs are located in tendons.","x":"As the name says, GTOs are located in \u003cb>tendons\u003c/b>, where they sense the pull of the contracting muscle."},{"id":"t40q5","t":"t40","type":"mcq","q":"Group Ib afferents from the Golgi tendon organ act first on which neurons in the spinal cord?","o":[["Inhibitory interneurons"],["The α motor neurons of the same muscle, directly","A direct link would be monosynaptic; the Ib pathway goes through interneurons."],["γ motor neurons of the same muscle","Your notes describe Ib afferents acting on interneurons, not on γ motor neurons."],["Upper motor neurons in the motor cortex","The inverse stretch reflex is a spinal reflex; Ib afferents act in the spinal cord."]],"x":"Ib afferents excite \u003cb>inhibitory interneurons\u003c/b>, which inhibit the α motor neurons of the muscle that was contracting (\u003cb>homonymous\u003c/b>), so it relaxes."},{"id":"t40q6","t":"t40","type":"tf","q":"In the inverse stretch reflex, the α motor neuron of the antagonistic muscle is stimulated through an excitatory interneuron.","a":true,"x":"While the tense muscle is inhibited and relaxes, its \u003cb>antagonist\u003c/b> is excited through an \u003cb>excitatory interneuron\u003c/b>."},{"id":"t40q7","t":"t40","type":"tf","q":"Group Ib fibres from the Golgi tendon organs are slowly conducting sensory fibres.","a":false,"fix":"Group Ib fibres are myelinated, rapidly conducting sensory fibres.","x":"The fibres from the GTOs make up the \u003cb>Ib group\u003c/b> of \u003cb>myelinated, rapidly conducting\u003c/b> sensory nerve fibres."},{"id":"t40q8","t":"t40","type":"list","q":"List the functions of the inverse stretch reflex given in your notes.","p":[["Prevents further increases in tension",["tension","increas"]],["Prevents muscle rupture",["ruptur","tear"]],["Protects the tendon from injury by too much tension",["tendon","injur"]],["Switches off movement and lets the muscle relax",["switch","relax","off"]]],"need":3,"x":"It is a \u003cb>protective\u003c/b> reflex: it stops tension rising further, prevents \u003cb>muscle rupture\u003c/b>, protects the \u003cb>tendon\u003c/b>, and switches off movement so the muscle relaxes."},{"id":"t40q9","t":"t40","type":"mcq","q":"A patient with disease of the corticospinal tracts has a hypertonic arm. When you flex the elbow it resists strongly, then the resistance suddenly gives way and the arm flexes closed. What is this called?","o":[["Clasp-knife reflex"],["Withdrawal reflex","This is triggered by an injurious stimulus to a limb, not by passive flexion."],["Crossed extensor response","This is part of the withdrawal reflex, which needs an injurious stimulus."],["Recruitment of motor units","This raises force by activating more motor units; it does not cause sudden relaxation."]],"x":"The \u003cb>clasp-knife reflex\u003c/b> is an exaggerated Golgi tendon reflex seen with \u003cb>corticospinal tract disease\u003c/b> (hypertonicity or spasticity). The arm closes suddenly, like a jackknife."},{"id":"t40q10","t":"t40","type":"mcq","q":"In your notes' clasp-knife example, what causes the initial strong resistance to flexion of the hypertonic arm?","o":[["Increased sensitivity of the muscle spindles in the triceps"],["Activation of the Golgi tendon organs in the triceps","GTO activation comes later and makes the triceps relax."],["Increased sensitivity of the muscle spindles in the biceps","The biceps is a flexor; resistance to flexion comes from the extensor, the triceps."],["Lower motor neuron damage in the arm","Your notes link the clasp-knife reflex to corticospinal tract disease."]],"x":"Over-sensitive spindles in the \u003cb>triceps\u003c/b> (extensor) resist flexion. As triceps tension rises it activates the \u003cb>Golgi tendon reflex\u003c/b>, the triceps relaxes and the arm flexes."},{"id":"t41q1","t":"t41","type":"mcq","d":1,"q":"A person steps on a tack with the right foot. Which response does the withdrawal reflex produce?","o":[["Right leg flexors contract and left leg extensors contract"],["Right leg extensors contract and left leg flexors contract","This is the reverse: the stimulated limb flexes and the opposite limb extends."],["Right leg flexors contract and the left leg does not respond","The crossed extensor response of the opposite limb is properly part of the withdrawal reflex."],["Both legs flex","The opposite leg extends rather than flexes."]],"x":"An injurious stimulus makes the \u003cb>ipsilateral flexors\u003c/b> contract, withdrawing the limb from the stimulus, while the \u003cb>contralateral\u003c/b> limb extends. This is the \u003cb>crossed extensor response\u003c/b>."},{"id":"t41q2","t":"t41","type":"tf","q":"The crossed extensor response compensates for the extra load that limb withdrawal places on the antigravity extensor muscles of the opposite leg.","a":true,"x":"Lifting one leg away puts extra weight on the other leg, so its \u003cb>antigravity extensors\u003c/b> must work harder; the crossed extensor response provides this."},{"id":"t41q3","t":"t41","type":"multi","q":"Which terms describe the flexor withdrawal reflex in your notes? (select all)","o":[["Polysynaptic",1],["Superficial",1],["Protective",1],["Basic",1],["Conditioned (learned)",0,"Your notes call it a basic reflex, not a learned one."],["Deep",0,"Your notes call it a superficial spinal reflex."]],"x":"Your notes describe it as a \u003cb>basic, protective, polysynaptic, superficial\u003c/b> spinal reflex."},{"id":"t41q4","t":"t41","type":"mcq","q":"What is meant by irradiation in the withdrawal reflex?","o":[["A stronger stimulus spreads to more and more of the
