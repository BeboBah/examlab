<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Lab</title>
<meta name="description" content="Lessons, practice questions and mastery checks for our courses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Exam Lab — a study bench styled after an H&E-stained slide.
   Hematoxylin purple = actions and structure; eosin pink = mastery (topic tiles stain darker as they are mastered).
   Light theme = brightfield microscope, dark theme = fluorescence view. One reading column, quiet chrome, the tiles are the memorable part. */
:root {
  --bg: #f6f5fa; --surface: #ffffff; --surface-2: #eeedf6; --surface-3: #e4e2f0;
  --ink: #1b1834; --muted: #5a5576; --line: #dedbeb; --line-strong: #c7c3dc;
  --hema: #3b37a3; --hema-ink: #ffffff; --hema-soft: #e7e5f9; --hema-text: #3b37a3;
  --eosin: #c8336f; --eosin-soft: #fbe4ee; --eosin-text: #a3285a;
  --good: #13744b; --good-soft: #ddf1e7;
  --warn: #8f570a; --warn-soft: #f8edd6;
  --bad: #b32d2b; --bad-soft: #f9e1e0;
  --shadow: 0 1px 2px rgba(27,24,52,.05), 0 4px 16px rgba(27,24,52,.05);
  --shadow-lift: 0 2px 4px rgba(27,24,52,.06), 0 10px 28px rgba(27,24,52,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-s: 8px; --r-m: 12px; --r-l: 16px;
  --tabbar-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e1b; --surface: #161829; --surface-2: #1e2138; --surface-3: #272a45;
    --ink: #ecebf8; --muted: #a8a7c7; --line: #2d3050; --line-strong: #3d4066;
    --hema: #a3a0ff; --hema-ink: #0d0e1b; --hema-soft: #262850; --hema-text: #b9b7ff;
    --eosin: #ff6aa3; --eosin-soft: #3a1c2e; --eosin-text: #ff9cc2;
    --good: #52d39d; --good-soft: #12332a; --warn: #f0b552; --warn-soft: #382a12; --bad: #ff7b7b; --bad-soft: #3c1919;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lift: 0 1px 0 rgba(255,255,255,.04), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e1b; --surface: #161829; --surface-2: #1e2138; --surface-3: #272a45;
  --ink: #ecebf8; --muted: #a8a7c7; --line: #2d3050; --line-strong: #3d4066;
  --hema: #a3a0ff; --hema-ink: #0d0e1b; --hema-soft: #262850; --hema-text: #b9b7ff;
  --eosin: #ff6aa3; --eosin-soft: #3a1c2e; --eosin-text: #ff9cc2;
  --good: #52d39d; --good-soft: #12332a; --warn: #f0b552; --warn-soft: #382a12; --bad: #ff7b7b; --bad-soft: #3c1919;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 6px 20px rgba(0,0,0,.35);
  --shadow-lift: 0 1px 0 rgba(255,255,255,.04), 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}

/* Base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.012em; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
sup, sub { line-height: 0; }
a { color: var(--hema-text); }
:focus-visible { outline: 2px solid var(--eosin); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tnum { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 60; padding: 10px 14px; border-radius: var(--r-s); background: var(--hema); color: var(--hema-ink); font-weight: 700; text-decoration: none; }
.skip:focus { top: 10px; }

/* Header */
.top { position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 8px 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 4px; margin-left: -4px; cursor: pointer; border-radius: var(--r-s); flex: none; }
.brand .mark { width: 26px; height: 26px; flex: none; }
.mark .m1 { fill: var(--hema); } .mark .m2 { fill: var(--surface); opacity: .92; } .mark .m3 { fill: var(--eosin); }
.brand .name { font: 700 18px/1 var(--f-display); letter-spacing: -0.01em; white-space: nowrap; }
.brand .code { font: 500 12px/1 var(--f-mono); letter-spacing: .06em; padding: 5px 7px; border-radius: 5px; background: var(--hema); color: var(--hema-ink); }
.nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; margin-left: auto; min-width: 0; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: var(--r-s); cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); }
.tools { display: flex; gap: 4px; align-items: center; }
.nav + .tools { margin-left: 4px; }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-s); border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.iconbtn:hover { color: var(--ink); background: var(--surface-2); }
.iconbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--line-strong); background: var(--surface); }
.m-only { display: none; }
@media (max-width: 980px) { .m-only { display: inline-grid; } }
.badge { font: 700 12px/1 var(--f-body); background: var(--bad); color: #fff; border-radius: 999px; padding: 3px 6px; min-width: 20px; text-align: center; }
/* Bottom tab bar: phones only, when a course is open */
.tabbar { display: none; }
@media (max-width: 980px) {
  .top .wrap { min-height: 56px; }
  .nav { display: none; }
  .tools, .nav + .tools { margin-left: auto; }
  body.has-tabbar { --tabbar-h: calc(64px + env(safe-area-inset-bottom, 0px)); }
  body.has-tabbar .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in oklab, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .tabbar button { position: relative; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font: 700 11.5px/1.1 var(--f-body); border-radius: var(--r-s); cursor: pointer; min-height: 52px; }
  .tabbar button[aria-current="page"] { color: var(--hema-text); background: var(--hema-soft); }
  .tabbar .ic { width: 22px; height: 22px; }
  .tabbar .badge { position: absolute; top: 2px; left: calc(50% + 6px); font-size: 11px; padding: 2px 5px; min-width: 18px; }
}
main.wrap { padding-block: 24px calc(80px + var(--tabbar-h)); display: grid; gap: 28px; }
main.wrap:focus { outline: none; }

/* Buttons and controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: var(--r-s); border: 1px solid transparent; background: var(--hema); color: var(--hema-ink); font-weight: 700; cursor: pointer; text-decoration: none; transition: background .15s ease, transform .08s ease; }
.btn:hover { background: color-mix(in oklab, var(--hema) 86%, var(--ink)); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.quiet { background: transparent; color: var(--muted); border-color: transparent; padding-inline: 10px; }
.btn.quiet:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 40%, var(--line)); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .k { font: 500 11px/1 var(--f-mono); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; opacity: .85; }
.btn .ic { width: 18px; height: 18px; }
@media (hover: none) { .k { display: none; } }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.txt { width: 100%; font: 17px/1.4 var(--f-body); padding: 11px 14px; border-radius: var(--r-s); border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.txt:focus { outline: none; border-color: var(--hema); box-shadow: 0 0 0 3px var(--hema-soft); }
textarea.txt { min-height: 140px; resize: vertical; font-size: 16px; }
select.txt { font-size: 16px; }
.txt.is-right { border-color: var(--good); background: var(--good-soft); }
.txt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.ask-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ask-row .txt, .ask-row input { flex: 1 1 220px; min-width: 0; }
.lbl { font: 700 13px/1.3 var(--f-body); color: var(--muted); display: block; margin-bottom: 4px; }

/* Surfaces and text styles */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font: 700 13.5px/1.3 var(--f-body); color: var(--muted); letter-spacing: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-h h2 { font-size: 22px; }
.empty { color: var(--muted); font-size: 15px; }
.notice { padding: 12px 16px; border-radius: var(--r-m); background: var(--warn-soft); font-size: 15px; }
.stack { display: grid; gap: 12px; align-content: start; }
.stack-lg { display: grid; gap: 22px; align-content: start; }
main.wrap > *, .stack > *, .stack-lg > *, .lesson > *, .quiz > *, .page-h > * { min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12.5px/1 var(--f-body); padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip.weak { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.shaky { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.chip.solid { color: var(--hema-text); background: var(--hema-soft); border-color: transparent; }
.chip.mastered { color: var(--good); background: var(--good-soft); border-color: transparent; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--eosin); border-radius: inherit; }
.bar.thin { height: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); font-size: 14px; }
.meta > span { min-width: 0; overflow-wrap: anywhere; }
.slide-label { justify-self: start; display: inline-flex; flex-wrap: wrap; max-width: 100%; font: 500 12px/1 var(--f-mono); letter-spacing: .04em; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; background: var(--surface); }
.slide-label span { padding: 6px 9px; border-right: 1px solid var(--line); }
.slide-label span:first-child { background: var(--hema); color: var(--hema-ink); border-right-color: var(--hema); }
.slide-label span:last-child { border-right: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 14px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.crumbs li { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.crumbs li + li::before { content: "/"; color: var(--line-strong); }
.crumbs button { background: none; border: 0; padding: 4px 2px; color: var(--hema-text); font-weight: 700; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in oklab, currentColor 35%, transparent); text-underline-offset: 3px; }
.crumbs button:hover { text-decoration-color: currentColor; }
.crumbs [aria-current] { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
.page-h { display: grid; gap: 8px; }
.page-h h1 { font-size: clamp(28px, 4.6vw, 40px); font-weight: 800; }
.page-h .sub { color: var(--muted); max-width: 66ch; }
.page-h .row { margin-top: 4px; }

/* Library */
.lib-head { display: grid; gap: 14px; padding-block: 8px 0; }
.lib-head h1 { font-size: clamp(32px, 5.6vw, 50px); font-weight: 800; max-width: 16ch; letter-spacing: -0.02em; }
.lib-head .lede { color: var(--muted); max-width: 58ch; font-size: 17px; }
.search { position: relative; max-width: 620px; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: 17px/1.3 var(--f-body); padding: 14px 44px 14px 44px; border-radius: var(--r-m); border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.search input:focus { outline: none; border-color: var(--hema); box-shadow: 0 0 0 3px var(--hema-soft); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14.5px; cursor: pointer; }
.filters button span { color: var(--muted); font-weight: 400; }
.filters button[aria-pressed="true"] { background: var(--hema); border-color: var(--hema); color: var(--hema-ink); }
.filters button[aria-pressed="true"] span { color: inherit; opacity: .85; }
.resume-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 20px; align-items: center; padding: 18px 20px; border-radius: var(--r-l); background: var(--hema-soft); border: 1px solid color-mix(in oklab, var(--hema) 22%, transparent); }
.resume-card h2 { font-size: 21px; }
.resume-card .meta { margin-top: 4px; }
.resume-card .others { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.resume-card .others button { background: none; border: 0; padding: 2px 0; color: var(--hema-text); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 560px) { .resume-card { grid-template-columns: 1fr; } }
.grp-sec { display: grid; gap: 12px; scroll-margin-top: 84px; }
.grp-sec > h2 { font-size: 22px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grp-sec > h2 span { font: 400 14px/1 var(--f-body); color: var(--muted); }
.grp-sec .empty { margin: 0; }
.ccard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 16px; align-items: center; padding: 16px 18px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.ccard.cur { border-color: var(--hema); box-shadow: inset 0 0 0 1px var(--hema), var(--shadow); }
.ccard .cm { display: contents; }
.ccard .cm > div { min-width: 0; display: grid; gap: 4px; }
.ccard b { font-family: var(--f-display); font-size: 18px; line-height: 1.2; display: block; }
.ccard .bar { max-width: 260px; }
.ccard > .row { justify-content: flex-end; }
.ccode { align-self: start; margin-top: 2px; font: 500 12px/1 var(--f-mono); letter-spacing: .05em; padding: 6px 8px; border-radius: 5px; background: var(--hema-soft); color: var(--hema-text); white-space: nowrap; }
.ccard .fnames { overflow-wrap: anywhere; }
.ccard.edit { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (max-width: 640px) {
  .ccard { grid-template-columns: auto minmax(0, 1fr); }
  .ccard > .row { grid-column: 1 / -1; justify-content: flex-start; }
}
.results { display: grid; gap: 18px; }
.results h2 { font-size: 18px; }
.rlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rlist button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.rlist button:hover { border-color: var(--hema); }
.rlist b { font-family: var(--f-display); font-size: 16.5px; }
.rlist .where { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.rlist .ic { color: var(--muted); width: 18px; height: 18px; }
mark { background: var(--eosin-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

/* Course home */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.hero .lede { margin-top: 2px; color: var(--muted); max-width: 54ch; }
.next { display: grid; gap: 12px; padding: 18px; border-radius: var(--r-m); background: var(--hema-soft); }
.next p { font-size: 16px; }
.ready { display: grid; gap: 12px; align-content: start; }
.ready-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ready-num { font: 800 60px/0.9 var(--f-display); letter-spacing: -0.03em; color: var(--eosin); font-variant-numeric: tabular-nums; }
.ready-num small { font-size: 26px; }
.ready-label { text-align: right; }
.ready-label b { font-family: var(--f-display); font-size: 18px; display: block; }
details.qmap-box > summary, details.lec-sec > summary { cursor: pointer; list-style: none; }
details.qmap-box > summary::-webkit-details-marker, details.lec-sec > summary::-webkit-details-marker { display: none; }
details.qmap-box > summary { font-weight: 700; font-size: 14.5px; color: var(--hema-text); display: inline-flex; align-items: center; gap: 6px; }
details.qmap-box[open] > summary { margin-bottom: 10px; }
.qmap { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.qmap .grp { display: flex; flex-wrap: wrap; gap: 2px; max-width: 100%; }
.qmap i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--surface); display: block; }
.qmap i.l { background: var(--hema-soft); border-color: var(--hema); }
.qmap i.w { background: var(--bad); border-color: var(--bad); }
.qmap i.m { background: var(--eosin); border-color: var(--eosin); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--line-strong); display: inline-block; }
.sync { font-size: 13px; color: var(--muted); }
.lec-list { display: grid; gap: 10px; }
details.lec-sec { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
details.lec-sec > summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-m); }
details.lec-sec > summary:hover { background: var(--surface-2); }
details.lec-sec[open] > summary { border-bottom: 1px solid var(--line); border-radius: var(--r-m) var(--r-m) 0 0; }
.lec-no { font: 500 12px/1 var(--f-mono); letter-spacing: .04em; padding: 6px 8px; border-radius: 5px; background: var(--hema); color: var(--hema-ink); }
.lec-title { min-width: 0; display: grid; gap: 6px; }
.lec-title b { font-family: var(--f-display); font-size: 17px; line-height: 1.25; }
.lec-title .bar { max-width: 220px; }

.tbar .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbar .tv { font: 500 13px/1 var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.tbar .bar.weak > span { background: var(--bad); } .tbar .bar.shaky > span { background: var(--warn); } .tbar .bar.strong > span { background: var(--good); }

.missed { display: grid; gap: 8px; }

/* Content check page */
.report { display: grid; gap: 10px; }
.report li { line-height: 1.45; }
.ok-banner { padding: 14px 16px; border-radius: var(--r-m); background: var(--good-soft); color: var(--good); font-weight: 700; }

/* Owner tools */
.drop { position: relative; display: grid; place-items: center; gap: 6px; text-align: center; padding: 28px 16px; border: 2px dashed var(--line-strong); border-radius: var(--r-l); background: var(--surface-2); cursor: pointer; }

.steps .sd { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); }

.chip.jump { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

<script type="application/json" id="catalog">{"v":1,"updated":1791562886920,"applied":[],"groups":[{"id":"bme","name":"Biomedical Engineering","courses":[{"id":"ebe2101","name":"Fundamentals of Cell & Molecular Biology","code":"EBE2101","partLabel":"Lecture","lecs":[{"n":1,"name":"Introduction to Cell Biology & Homeostasis"},{"n":2,"name":"Classes of Macromolecules"},{"n":3,"name":"Cellular Organelles"}],"topics":[{"id":"t1","lec":1,"name":"Cells & their discovery","big":"The cell is the basic unit of life. Robert Hooke named it in 1665 after looking at cork.","pts":["Some organisms live as a \u003cb>single cell\u003c/b>: bacteria, yeast and amoebae.","An adult human is made of about \u003cb>30 trillion cells\u003c/b> (1 trillion = 10\u003csup>12\u003c/sup>), organized into \u003cb>tissues\u003c/b>.","Cells are measured in \u003cb>micrometres (µm)\u003c/b>: 1000 µm = 1 mm. They are too small to see without a \u003cb>microscope\u003c/b>, an instrument that gives a magnified image of a tiny object.","\u003cb>Robert Hooke\u003c/b> (1635–1703), an English microscopist, became curator of the Royal Society of London at age \u003cb>27\u003c/b>.","He wanted to know why \u003cb>cork\u003c/b> stoppers (cork is part of tree bark) were so good at holding air in a bottle.","In \u003cb>1665\u003c/b> he cut a thin slice of cork with a razor-sharp penknife and saw under the microscope that it was porous, like a honeycomb.","He called the pores \u003cb>“cells”\u003c/b> because they reminded him of the small rooms that \u003cb>monks\u003c/b> lived in at a monastery."],"hook":"Hooke + cork + monks’ rooms = “cells”, 1665.","traps":["A trillion is 10\u003csup>12\u003c/sup>. 10\u003csup>9\u003c/sup> is only a billion.","1 mm = 1000 µm, not 100 µm.","1635 and 1703 are Hooke’s birth and death years. 1665 is the cork observation."]},{"id":"t2","lec":1,"name":"Levels of organization","big":"Structure builds up in levels, each more complex than the one before: atoms → molecules → organelles → cells → tissues → organs → organ systems → organism.","table":{"head":["Level","Definition (from your notes)","Example in your notes"],"rows":[["Chemical","Atoms bond to form molecules with three-dimensional structures","Hydrogen + oxygen atoms → water molecule"],["Cellular","A variety of molecules combine to form the fluid and organelles of a body cell","Smooth muscle cell"],["Tissue","A community of \u003cb>similar\u003c/b> cells forms a body tissue","Smooth muscle tissue"],["Organ","Two or more \u003cb>different\u003c/b> tissues combine to form an organ","Bladder (smooth muscle + skeletal muscle)"],["Organ system","Two or more organs work closely together to perform the functions of a body system","Urinary tract system: kidney, ureter, bladder, urethra"],["Organismal","Many organ systems work harmoniously together to perform the functions of an independent organism","The whole person"]]},"pts":["Full sequence in the text: atoms, molecules, \u003cb>organelles\u003c/b>, cells, tissues, organs, organ systems, whole organism.","Summary line from the figure: molecules form cells, cells form tissues, tissues form organs, organs form organ systems, organ systems form organisms."],"hook":"“A Mighty Orange Cat Takes Over Our Office” → Atoms, Molecules, Organelles, Cells, Tissues, Organs, Organ systems, Organism.","traps":["Tissue = \u003cb>similar\u003c/b> cells. Organ = two or more \u003cb>different\u003c/b> tissues.","Organelles sit between molecules and cells.","The bladder is an \u003cb>organ\u003c/b>; the urinary tract is an \u003cb>organ system\u003c/b>."]},{"id":"t3","lec":1,"name":"Homeostasis","big":"Homeostasis is the state of balance the body needs to function properly and survive. Body systems keep adjusting to changes outside and inside the body, and disruption of homeostasis causes disease.","cards":[{"h":"Example 1 · Body temperature","items":["Regulated by the brain’s \u003cb>hypothalamus\u003c/b>, like a thermostat controlling the temperature of a room.","Average human body temperature: \u003cb>37 °C\u003c/b>.","Can be affected by \u003cb>exposure, metabolic rate, hormones and disease\u003c/b>.","Feedback adjusts \u003cb>blood sugar level, breathing rate and metabolic rate\u003c/b> to return to the average."]},{"h":"Example 2 · Blood pressure","items":["Maintained via \u003cb>baroreceptors\u003c/b>: pressure-sensitive areas in blood vessels (the figure shows the carotid sinus on the carotid artery).","Baroreceptors send blood-pressure information to the \u003cb>brain\u003c/b>.","In your notes, the brain then sends hormones produced by the \u003cb>thyroid gland and the hypothalamus\u003c/b> to regulate metabolism and the whole circulation."]}],"hook":"Hypothalamus = the body’s thermostat. “Baro-” means pressure, as in barometer.","traps":["It is the \u003cb>disruption\u003c/b> of homeostasis that causes disease.","Systems respond to changes \u003cb>outside and inside\u003c/b> the body, not only inside.","Temperature feedback changes blood sugar, breathing rate and metabolic rate — not the number of cells."]},{"id":"t4","lec":1,"name":"Basic properties of cells","big":"Cells share seven basic properties. “Enumerate” questions on these are likely.","lists":[{"h":"The 7 properties","ordered":true,"items":["\u003cb>Life\u003c/b> — whole cells removed from a plant or animal can be cultured in a lab, growing and reproducing for long periods. Isolated cell parts simply deteriorate.","\u003cb>They can die by their own hand\u003c/b> — an internal program eliminates cells that are no longer needed or that risk becoming cancerous.","\u003cb>A genetic program and the means to use it\u003c/b> — information in genes made of DNA, packaged into chromosomes in the nucleus.","\u003cb>Highly complex and organized\u003c/b> — errors are rare: DNA duplication makes less than \u003cb>1 mistake per 10 million nucleotides\u003c/b>, and most are quickly corrected by a repair mechanism.","\u003cb>Reproduce by division\u003c/b> — the contents of a “mother” cell are distributed into \u003cb>two “daughter” cells\u003c/b>.","\u003cb>Carry out chemical reactions\u003c/b> — all chemical changes need \u003cb>enzymes\u003c/b> (molecules that greatly increase reaction rate). The sum total of reactions is \u003cb>metabolism\u003c/b>.","\u003cb>Respond to stimuli\u003c/b> — receptors for hormones, neurotransmitters and extracellular materials let outside stimuli trigger specific responses in target cells."]}],"hook":"“Lazy Dogs Grab Cookies, Run, Chew, Repeat” → Life, Die, Genetic program, Complex, Reproduce, Chemical reactions, Respond.","traps":["\u003cb>All\u003c/b> chemical changes in cells require enzymes, not just some.","Division gives \u003cb>two\u003c/b> daughter cells.","Isolated cell parts deteriorate; it is \u003cb>whole\u003c/b> cells that survive in culture."]},{"id":"t5","lec":1,"name":"Prokaryotes vs eukaryotes","big":"There are two basic classes of cells, distinguished by their size and the types of internal structures (organelles) they contain.","table":{"head":["","Prokaryotic","Eukaryotic"],"rows":[["Examples","Bacteria","Fungi, plants, animals"],["Structure","Simpler","More complex"],["DNA","In a \u003cb>nucleoid\u003c/b> (no nucleus)","In a nucleus, as complex chromosomes (DNA + proteins)"],["Plasma membrane, ribosomes","Yes","Yes"],["Complex organelles (ER, Golgi, lysosomes, endosomes, peroxisomes)","No","Yes"],["Complex cytoskeleton + motor proteins","No","Yes"],["Phagocytosis","No","Yes"],["Mitotic spindle, meiosis & fertilization","No","Yes"]]},"lists":[{"h":"Shared by both (4)","items":["Plasma membrane of similar construction","Similar transcription and translation of genetic information","Shared metabolic pathways","Similar apparatus for conserving chemical energy as ATP"]},{"h":"Eukaryotes only (6)","items":["Complex chromosomes made of DNA and associated proteins","Complex organelles: ER, Golgi complex, lysosomes, endosomes, peroxisomes","Complex cytoskeleton (microfilaments, intermediate filaments, microtubules) and motor proteins","Phagocytosis: ingesting particles by enclosing them in plasma-membrane vesicles","Cell division with a microtubule-containing mitotic spindle","Sexual reproduction requiring meiosis and fertilization"]},{"h":"Diagram labels to know","items":["\u003cb>Bacterial cell:\u003c/b> capsule, cell wall, plasma membrane, cytoplasm, ribosomes, DNA of nucleoid, pilus, flagellum","\u003cb>Plant cell extras:\u003c/b> cell wall, chloroplast, large vacuole, plasmodesma","\u003cb>Animal cell extras:\u003c/b> centrosome with centrioles, lysosome, microvilli, cilium, glycogen granules"]}],"hook":"Shared: Membrane, Message (transcription/translation), Metabolism, ATP. Eukaryote-only: “Cool Owls Can Perch Silently Sometimes” → Chromosomes, Organelles, Cytoskeleton, Phagocytosis, Spindle, Sexual reproduction.","traps":["Bacteria \u003cb>do\u003c/b> have ribosomes, a plasma membrane and a cell wall.","Plant cells have a cell wall but are still eukaryotic.","Both classes conserve energy as ATP."]},{"id":"t6","lec":2,"name":"Carbohydrates","big":"Carbohydrates are aldehyde or ketone derivatives of polyhydric alcohols. Their sugar units are linked by glycosidic bonds.","table":{"head":["Group","Examples in your notes"],"rows":[["Monosaccharides (by carbon number: trioses 3, tetroses 4, pentoses 5, hexoses 6, heptoses 7)","Glucose = \u003cb>aldo\u003c/b>hexose · Fructose = \u003cb>keto\u003c/b>hexose · Ribose = \u003cb>aldo\u003c/b>pentose"],["Disaccharides","Sucrose (glucose + fructose in the structure), maltose"],["Polysaccharides","Glycogen, starch (amylose), chitin, cellulose"]]},"lists":[{"h":"Functions","items":["\u003cb>Energy:\u003c/b> glucose oxidation gives a significant fraction of dietary calories.","\u003cb>Storage:\u003c/b> glycogen is the body’s storage form of energy.","\u003cb>Nucleic acids:\u003c/b> ribose and deoxyribose are components of RNA and DNA.","\u003cb>Cell communication:\u003c/b> glycoproteins and glycolipids in the cell membrane.","\u003cb>Structure:\u003c/b> chitin → insect exoskeleton · cellulose → rigid plant cell wall · peptidoglycan → reinforces bacterial cell wall."]}],"pts":["Most common clinical disorder related to carbohydrates: \u003cb>diabetes mellitus\u003c/b>."],"hook":"“Aldo” = aldehyde, the C=O at the end (carbon 1). “Keto” = ketone, the C=O inside the chain (carbon 2). Then count the carbons: hex = 6, pent = 5.","traps":["Fructose is a \u003cb>keto\u003c/b>hexose; glucose is an \u003cb>aldo\u003c/b>hexose.","Sucrose and maltose are \u003cb>di\u003c/b>saccharides, not polysaccharides.","Sugars are joined by \u003cb>glycosidic\u003c/b> bonds; amino acids by \u003cb>peptide\u003c/b> bonds."]},{"id":"t7","lec":2,"name":"Lipids","big":"Lipids (fats, oils, waxes, steroids and related compounds) share one property: insoluble in water, soluble in organic solvents.","table":{"head":["Class","What it is","Examples"],"rows":[["Simple","Esters of fatty acids with glycerol or higher molecular weight alcohols","Fat: glycerol + 3 fatty acid tails"],["Complex","Fatty acids + alcohol + something extra","Phospholipids (+ phosphoric acid) · glycolipids (+ carbohydrate) · lipoproteins (+ protein)"],["Derived","—","Fatty acids, cholesterol, steroid hormones (testosterone, estrogens), fat-soluble vitamins A, D, E, K, eicosanoids"]]},"pts":["\u003cb>Fatty acids:\u003c/b> long-chain hydrocarbons with an \u003cb>even\u003c/b> number of carbons and a terminal carboxyl group."],"lists":[{"h":"Functions","items":["\u003cb>Energy:\u003c/b> 9 kcal/g fat vs 4 kcal/g protein or carbohydrate.","\u003cb>Adipose fat:\u003c/b> thermal insulator under the skin; protects organs such as the kidney.","\u003cb>Electrical insulators\u003c/b> in myelinated nerves → rapid nerve impulses.","\u003cb>Phospholipids\u003c/b> build the cell membrane: hydrophilic head (polar group, phosphate, glycerol) + hydrophobic fatty acyl tails → bilayer.","\u003cb>Cholesterol:\u003c/b> in the cell membrane; needed to make steroid hormones, bile acids and vitamin D.","\u003cb>Regulation:\u003c/b> fat-soluble vitamins, steroid hormones, eicosanoids.","\u003cb>Transport:\u003c/b> lipoproteins (LDL, HDL) carry lipids in blood."]}],"hook":"Fat-soluble vitamins: “ADEK”. Energy: fat 9, others 4. Complex-lipid names tell you the extra part: phospho- (phosphate), glyco- (sugar), lipo-protein (protein).","traps":["Cholesterol and steroid hormones are \u003cb>derived\u003c/b> lipids, not simple ones.","Phospholipids and lipoproteins are \u003cb>complex\u003c/b> lipids.","Lipid imbalance → \u003cb>obesity and atherosclerosis\u003c/b>. Diabetes belongs to carbohydrates."]},{"id":"t8","lec":2,"name":"Proteins","big":"Proteins are polymers of amino acids joined by peptide (amide) links.","pts":["\u003cb>20\u003c/b> amino acids are commonly found in proteins.","Each has a carboxyl group and an amino group on the \u003cb>same carbon (the α carbon)\u003c/b>. They differ only in the \u003cb>side chain (R group)\u003c/b>.","Examples: glycine (R = H, the simplest), alanine (CH\u003csub>3\u003c/sub>), proline, valine, phenylalanine, tyrosine (ring with –OH), tryptophan.","Peptide links (–CO–NH–) build dipeptides, tripeptides, tetrapeptides, polypeptides and proteins. A chain runs from the \u003cb>amino-terminal\u003c/b> end to the \u003cb>carboxyl-terminal\u003c/b> end.","The presence, absence or deficiency of some proteins causes specific disorders or diseases."],"lists":[{"h":"Functions (7)","items":["\u003cb>Cytoskeleton\u003c/b> maintains cell shape.","\u003cb>Actin and myosin\u003c/b> are contractile proteins for muscle movement.","\u003cb>Hemoglobin\u003c/b> carries oxygen in blood (2 α + 2 β chains, heme groups with iron).","\u003cb>Enzymes\u003c/b> catalyze reactions that generate energy and synthesize or degrade biomolecules.","\u003cb>Receptors\u003c/b> let cells sense and respond to stimuli (hormones, drugs).","\u003cb>Immunoglobulins\u003c/b> circulate in blood to fight bacterial and viral infections.","Proteins are the instruments through which \u003cb>genetic information is expressed\u003c/b>."]}],"hook":"“Some Cats Only Eat Raw Imported Goods” → Shape, Contraction, Oxygen, Enzymes, Receptors, Immunity, Gene expression.","traps":["Amino acids differ \u003cb>only\u003c/b> in the R group.","5′ and 3′ ends belong to DNA/RNA. Proteins have amino- and carboxyl-terminal ends.","Hemoglobin carries oxygen; immunoglobulins fight infection. Don’t swap them."]},{"id":"t9","lec":2,"name":"Nucleic acids & nucleotides","big":"Nucleic acids store and express genetic information, so they are the informational biomolecules. DNA and RNA are both built from nucleotides.","fig":"nucleotide","table":{"head":["","DNA","RNA"],"rows":[["Sugar","Deoxyribose (H at carbon 2′)","Ribose (–OH at carbon 2′)"],["Bases","A, G, C, \u003cb>T\u003c/b>","A, G, C, \u003cb>U\u003c/b>"],["Strands (diagram)","Two, antiparallel; A–T and G–C pairs","One"],["Role","Holds genes: segments coding for products, mainly proteins","rRNA, mRNA, tRNA — each sequence specified by DNA"]]},"pts":["Purines (two rings): \u003cb>adenine, guanine\u003c/b>. Pyrimidines (one ring): \u003cb>thymine, uracil, cytosine\u003c/b>.","Protein synthesis (diagram): mRNA copies a gene in the \u003cb>nucleus\u003c/b> → moves to the \u003cb>cytoplasm\u003c/b> → a ribosome translates it while tRNA brings amino acids."],"lists":[{"h":"Other jobs of nucleotides (4)","items":["Carriers of intermediates in the synthesis of some carbohydrates.","Components of coenzymes: \u003cb>coenzyme A, FAD, NAD⁺\u003c/b>.","\u003cb>cAMP\u003c/b> is a second messenger in signal transduction.","\u003cb>ATP and ADP\u003c/b> are the main donors and acceptors of phosphate in energy transduction."]}],"fig2":"camp","hook":"Purines: “Pure As Gold” (Adenine, Guanine). Pyrimidines: “CUT the Py” (Cytosine, Uracil, Thymine). U replaces T in RNA.","traps":["Uracil is RNA-only; thymine is DNA-only.","Epinephrine is the \u003cb>first\u003c/b> messenger; cAMP is the \u003cb>second\u003c/b>.","A nucleotide has three parts: base, pentose sugar, phosphate."]},{"id":"t10","lec":3,"name":"Mitochondria","big":"Mitochondria are bean-shaped, double-membrane organelles best known for making the ATP that powers most of the cell’s energy-requiring activities.","fig":"mito","pts":["Size: \u003cb>1–4 µm\u003c/b> long. They occupy \u003cb>15–20%\u003c/b> of an average mammalian liver cell’s volume and contain \u003cb>more than 1000\u003c/b> different proteins.","The double membrane creates \u003cb>4 domains\u003c/b>, each with its own functions: outer membrane, intermembrane space, inner membrane (folded into \u003cb>cristae\u003c/b> carrying ATP synthase particles), and matrix (with DNA and ribosomes).","In \u003cb>sperm\u003c/b>, mitochondria sit in the \u003cb>midpiece just behind the nucleus\u003c/b>; their ATP powers the sperm’s movement."],"fig2":"aerobic","lists":[{"h":"Other jobs besides ATP","items":["Synthesis of certain \u003cb>amino acids\u003c/b> and \u003cb>heme\u003c/b>.","Uptake and release of \u003cb>calcium ions\u003c/b>: with the ER they regulate cytosolic calcium. When it gets abnormally high, a calcium transporter in the \u003cb>inner\u003c/b> membrane takes up the excess.","Regulation of \u003cb>cell death\u003c/b>.","They have their \u003cb>own DNA\u003c/b> and machinery for their own RNAs and proteins. Mutations in mitochondrial-system genes cause several inherited diseases."]}],"hook":"Outside in: “Only In Inner Matrix” → Outer membrane, Intermembrane space, Inner membrane, Matrix.","traps":["Glycolysis happens in the \u003cb>cytosol\u003c/b>, not in the mitochondrion.","No oxygen → fermentation → \u003cb>lactate\u003c/b>. Oxygen → acetyl CoA → TCA cycle → electron transport chain → ATP + CO\u003csub>2\u003c/sub> + water.","The calcium transporter and ATP synthase are on the \u003cb>inner\u003c/b> membrane."]},{"id":"t11","lec":3,"name":"Lysosomes","big":"Lysosomes are the animal cell’s digestive organelles.","pts":["A typical lysosome holds \u003cb>at least 50 different hydrolytic enzymes\u003c/b>, produced in the \u003cb>rough ER\u003c/b>. Together they can hydrolyze practically every type of biological macromolecule.","Figure: lysosomes of variable sizes in a \u003cb>Kupffer cell\u003c/b>, a phagocytic cell in the liver that engulfs aging red blood cells.","\u003cb>Phagocytic cells\u003c/b> such as \u003cb>macrophages and neutrophils\u003c/b> act as scavengers, ingesting debris and dangerous microorganisms. Ingested bacteria are inactivated by the lysosome’s \u003cb>low pH\u003c/b>, then digested by enzymes.","\u003cb>Autophagy\u003c/b> (organelle turnover) is the regulated destruction of the cell’s own organelles and their replacement. It helps \u003cb>prevent certain cancers\u003c/b> and \u003cb>slows body aging\u003c/b>."],"hook":"Phago-cytosis = eating outside things. Auto-phagy = self-eating (own organelles). Both end in the lysosome.","traps":["Lysosomal enzymes are made in the \u003cb>rough\u003c/b> ER, not the smooth ER or the lysosome itself.","Low pH (acid) inactivates bacteria \u003cb>before\u003c/b> enzymes digest them.","Kupffer cells are in the \u003cb>liver\u003c/b> and eat \u003cb>aging red blood cells\u003c/b>."]},{"id":"t12","lec":3,"name":"Endoplasmic reticulum","big":"The ER is a network of membrane-enclosed channels running throughout the cell. Its lumen is separated from the cytosol by a single membrane, and its membrane is continuous with the outer nuclear membrane.","table":{"head":["","Smooth ER","Rough ER"],"rows":[["Surface","No ribosomes","Covered by \u003cb>ribosomes\u003c/b> (rough look in the electron microscope)"],["Jobs","Ovaries, testes, adrenal gland → \u003cb>steroid hormones\u003c/b>\u003cbr>Liver → \u003cb>detoxication\u003c/b> of foreign chemicals and drugs\u003cbr>Most common role → \u003cb>storage and sudden release of calcium\u003c/b>","Makes \u003cb>proteins\u003c/b>: integral membrane proteins of the plasma membrane, proteins exported to the extracellular medium, and lysosomal enzymes"],["Shape in diagram","Tubes","Flattened sacs (cisternae) around the cisternal space"]]},"hook":"Smooth ER’s three S’s: Steroids, Sanitizing (detox), Storing calcium. Rough ER = Ribosomes = pRoteins.","traps":["The ER is continuous with the \u003cb>outer\u003c/b> nuclear membrane.","Its lumen is separated from the cytosol by a \u003cb>single\u003c/b> membrane (mitochondria have two).","Calcium storage is the \u003cb>most common\u003c/b> SER role; steroids and detox are tissue-specific."]},{"id":"t13","lec":3,"name":"Golgi complex","big":"The Golgi complex is a stack of flattened sacs and the cell’s distribution point: proteins made in the rough ER are processed here, then sent to their final destination.","pts":["\u003cb>1898:\u003c/b> the Italian biologist \u003cb>Camillo Golgi\u003c/b>, while inventing new staining methods, applied a \u003cb>metallic stain to nerve cells\u003c/b>.","He found a darkly stained reticular network \u003cb>near the cell nucleus\u003c/b>. It was later found in other cell types and named the Golgi complex.","The discovery helped earn him the \u003cb>Nobel Prize in 1906\u003c/b>."],"fig":"route","hook":"The Golgi is the cell’s post office: the rough ER writes the letter, the Golgi packs and addresses it.","traps":["1898 = discovery. 1906 = Nobel Prize.","He stained \u003cb>nerve\u003c/b> cells with a \u003cb>metallic\u003c/b> stain.","The Golgi processes and directs proteins; the rough ER makes them."]},{"id":"t14","lec":3,"name":"Organelle disorders","big":"“The Human Perspective”: what goes wrong when mitochondria or lysosomes fail.","table":{"head":["","Mitochondrial disorder","Lysosomal disorder: Pompe disease"],"rows":[["Key case / cause","\u003cb>1962\u003c/b>: woman with long-standing fatigue, muscle weakness and \u003cb>elevated body temperature\u003c/b>","Mutations in the gene for \u003cb>acid alpha-glucosidase\u003c/b>, the enzyme that hydrolyzes glycogen (→ glucose 1-phosphate in your notes)"],["What went wrong","Normally mitochondria stop converting ADP to ATP when ADP is low. Hers kept oxidizing substrates fast \u003cb>even without ADP\u003c/b>, making \u003cb>heat instead of mechanical work\u003c/b>","Enzyme reduced or absent → \u003cb>glycogen accumulates\u003c/b> in lysosomes (a glycogen storage disease)"],["Effects","Most mitochondrial disorders: degeneration of \u003cb>muscle/brain\u003c/b> tissue; can cause death in infancy","Progressive weakness; damages \u003cb>skeletal muscles and heart\u003c/b> most seriously"],["Evidence / treatment","Muscle biopsy: red-staining “blotches” under the plasma membrane from \u003cb>abnormal proliferation of mitochondria\u003c/b>","\u003cb>Enzyme Replacement Therapy (ERT)\u003c/b> with \u003cb>alglucosidase alfa\u003c/b> (Myozyme)"]]},"pts":["Lysosomal storage disorders in general: rare, serious disorders where materials accumulate in lysosomes because their hydrolytic enzymes are absent."],"hook":"Pompe: “Pompe pumps no glycogen out” — the missing lysosomal enzyme lets glycogen pile up in heart and muscle.","traps":["Pompe disease is \u003cb>lysosomal\u003c/b>, not mitochondrial.","The 1962 patient was \u003cb>hot\u003c/b>, not cold — energy left as heat.","The red blotches are extra \u003cb>mitochondria\u003c/b>, not glycogen."]}],"questions":[{"id":"t1a","t":"t1","type":"mcq","d":1,"q":"About how many cells make up an adult human, according to your notes?","o":[["About 30 trillion (30 × 10¹²)"],["About 30 billion","A billion is 10⁹. Your notes say trillion (10¹²), a thousand times more."],["About 3 trillion","Off by a factor of ten. The figure is about 30 trillion."],["About 300 trillion","Too high by a factor of ten. The figure is about 30 trillion."]],"x":"An adult human is made of about 30 trillion cells (1 trillion = 10¹²), organized into tissues."},{"id":"t1b","t":"t1","type":"mcq","d":1,"q":"Who is credited with the discovery of cells?","o":[["Robert Hooke"],["Camillo Golgi","Golgi discovered the Golgi complex in 1898, long after cells were known."],["Gregor Mendel","Mendel is linked to Mendelian genetics, not the discovery of cells."],["Charles Darwin","Darwin is known for evolution, not for discovering cells."]],"x":"Robert Hooke, an English microscopist (1635–1703), saw and named cells in a slice of cork in 1665."},{"id":"t1c","t":"t1","type":"type","q":"Hooke called the pores in cork “cells” because they reminded him of the rooms of which people?","a":["monks","monk","monks in a monastery","monks living in a monastery","monastery"],"x":"The pores reminded Hooke of the small rooms (cells) where monks lived in a monastery.","h":"They lived in a monastery."},{"id":"t1d","t":"t1","type":"mcq","q":"What material was Hooke examining when he first saw “cells”?","o":[["A thin slice of cork"],["Onion skin","Not in your notes. Hooke looked at cork, part of the bark of trees."],["A drop of pond water","Not in your notes. Hooke looked at cork."],["His own blood","Not in your notes. Hooke looked at cork."]],"x":"Hooke cut a thin slice of cork with a penknife sharpened like a razor and saw a honeycomb-like pattern of pores."},{"id":"t1e","t":"t1","type":"tf","q":"1 mm is equal to 100 µm.","a":false,"fix":"1 mm = 1000 µm.","x":"Cells are measured in micrometres (µm); 1000 µm make 1 mm."},{"id":"t1f","t":"t1","type":"multi","q":"Which of these exist as single cells, according to your notes?","o":[["Bacteria",1],["Yeast",1],["Amoebae",1],["Insects",0,"Insects are many-celled organisms."]],"x":"Bacteria, yeast and amoebae are microorganisms that exist as single cells."},{"id":"t1g","t":"t1","type":"mcq","q":"In which year did Hooke write his description of cork “cells”?","o":[["1665"],["1635","1635 is the year Hooke was born."],["1703","1703 is the year Hooke died."],["1898","1898 is when Camillo Golgi discovered the Golgi complex."]],"x":"Hooke described the cork cells in 1665. He lived from 1635 to 1703."},{"id":"t1h","t":"t1","type":"type","q":"An instrument that provides a magnified image of a tiny object is called a ___.","a":["microscope"],"x":"Because cells are so small, they can only be seen with a microscope."},{"id":"t1i","t":"t1","type":"mcq","q":"Which question was Hooke trying to answer when he looked at cork?","o":[["Why cork stoppers are so good at holding air in a bottle"],["Why plants are green","Not in your notes."],["How blood moves around the body","Not in your notes."],["Why trees lose their bark","Cork is part of tree bark, but his question was about cork stoppers holding air."]],"x":"Hooke wanted to know why stoppers made of cork were so well suited to holding air in a bottle."},{"id":"t1j","t":"t1","type":"type","q":"1 trillion = 10 to the power of what?","a":["12","10^12","twelve","10 12"],"x":"1 trillion = 10¹². (10⁹ is a billion.)"},{"id":"t1k","t":"t1","type":"mcq","q":"At what age did Hooke become curator of the Royal Society of London?","o":[["27"],["37","37 is the average body temperature in °C (homeostasis)."],["17","Too young. Your notes say 27."],["65","You may be thinking of 1665, the year of his cork observation."]],"x":"Hooke became curator of the Royal Society of London, England’s foremost scientific academy, at age 27."},{"id":"t2a","t":"t2","type":"order","d":1,"q":"Put the levels of structural organization in order, from simplest to most complex.","o":["Atoms","Molecules","Organelles","Cells","Tissues","Organs","Organ systems","Organism"],"x":"Atoms → molecules → organelles → cells → tissues → organs → organ systems → whole organism."},{"id":"t2b","t":"t2","type":"mcq","d":1,"q":"“A community of similar cells” is the definition of which level?","o":[["Tissue level"],["Organ level","An organ is two or more different tissues combined."],["Organ system level","An organ system is two or more organs working together."],["Cellular level","The cellular level is molecules combining into the fluid and organelles of one cell."]],"x":"Tissue level: a community of similar cells forms a body tissue (e.g. smooth muscle tissue)."},{"id":"t2c","t":"t2","type":"mcq","q":"An organ forms when…","o":[["two or more different tissues combine"],["similar cells group together","That describes a tissue."],["two or more organs work closely together","That describes an organ system."],["atoms bond to form molecules","That is the chemical level."]],"x":"Organ level: two or more different tissues combine, e.g. the bladder (smooth muscle + skeletal muscle)."},{"id":"t2d","t":"t2","type":"multi","q":"Which organs belong to the urinary tract system shown in your notes?","o":[["Kidney",1],["Ureter",1],["Bladder",1],["Urethra",1],["Liver",0,"The liver is not part of the urinary tract system."]],"x":"The urinary tract system (organ system level) includes the kidney, ureter, bladder and urethra."},{"id":"t2e","t":"t2","type":"type","q":"Which level of organization comes between molecules and cells?","a":["organelles","organelle","organelle level"],"x":"Molecules combine to form organelles, which together with cell fluid make up a cell."},{"id":"t2f","t":"t2","type":"mcq","q":"In your notes, the bladder is the example used for which level?","o":[["Organ level"],["Tissue level","Smooth muscle tissue is the tissue example."],["Organ system level","The urinary tract system is the organ-system example."],["Cellular level","A smooth muscle cell is the cellular example."]],"x":"The bladder combines different tissues (smooth and skeletal muscle), so it sits at the organ level."},{"id":"t2g","t":"t2","type":"tf","q":"At the cellular level, a variety of molecules combine to form the fluid and organelles of a body cell.","a":true,"x":"That is the definition of the cellular level, shown with a smooth muscle cell."},{"id":"t2h","t":"t2","type":"mcq","q":"Which example illustrates the chemical level?","o":[["A water molecule formed from hydrogen and oxygen atoms"],["A smooth muscle cell","That is the cellular level."],["Smooth muscle tissue","That is the tissue level."],["The kidney","That is an organ."]],"x":"Chemical level: atoms bond to form molecules with three-dimensional structures, like H and O forming water."},{"id":"t2i","t":"t2","type":"mcq","q":"At the organismal level…","o":[["many organ systems work together as an independent organism"],["two or more organs work together to perform one body system’s functions","That is the organ-system level."],["two or more tissues form an organ","That is the organ level."],["similar cells form a tissue","That is the tissue level."]],"x":"The organismal level is the top of the pyramid: many organ systems working harmoniously as one independent organism."},{"id":"t3a","t":"t3","type":"mcq","d":1,"q":"Homeostasis is best defined as…","o":[["the state of balance needed for the body to function properly and survive"],["the sum of all chemical reactions in a cell","That is metabolism."],["the division of a mother cell into two daughter cells","That is cell division."],["the increase in complexity from atoms to organisms","That describes the levels of organization."]],"x":"Homeostasis is a state of balance. Body systems keep adjusting to changes outside and inside the body, and disruption of homeostasis causes disease."},{"id":"t3b","t":"t3","type":"type","d":1,"q":"Which area of the brain regulates body temperature, like a thermostat in a room?","a":["hypothalamus","the hypothalamus"],"x":"The hypothalamus regulates body temperature, like a thermostat controlling room temperature.","h":"It starts with “hypo-”."},{"id":"t3c","t":"t3","type":"mcq","q":"What is the average human body temperature?","o":[["37 °C"],["35 °C","Too low. The average is 37 °C."],["36 °C","Close, but your notes say 37 °C."],["38.5 °C","That would be a fever. The average is 37 °C."]],"x":"In humans, 37 °C is the average body temperature."},{"id":"t3d","t":"t3","type":"multi","q":"When body temperature drifts, feedback leads to adjustments in which of these?","o":[["Blood sugar level",1],["Breathing rate",1],["Metabolic rate",1],["Number of cells in the body",0,"Not in your notes."]],"x":"Temperature feedback adjusts blood sugar level, breathing rate and metabolic rate to return to the average (37 °C)."},{"id":"t3e","t":"t3","type":"type","q":"The pressure-sensitive areas in blood vessels that help maintain blood pressure are called ___.","a":["baroreceptors","baroreceptor"],"x":"Baroreceptors are pressure-sensitive areas in blood vessels (e.g. the carotid sinus). “Baro-” means pressure.","h":"“Baro-” means pressure."},{"id":"t3f","t":"t3","type":"mcq","q":"According to your notes, what causes disease?","o":[["Disruption of homeostasis"],["Too many baroreceptors","Not in your notes."],["A body temperature of 37 °C","37 °C is the normal average."],["Cells responding to stimuli","Responding to stimuli is a normal property of cells."]],"x":"It is the disruption of homeostasis that causes disease."},{"id":"t3g","t":"t3","type":"multi","q":"Which factors can affect body temperature, according to your notes?","o":[["Exposure",1],["Metabolic rate",1],["Hormones",1],["Disease",1],["Blood type",0,"Not in your notes."]],"x":"Exposure, metabolic rate, hormones and disease can all affect body temperature."},{"id":"t3h","t":"t3","type":"mcq","q":"After baroreceptors send blood-pressure information to the brain, the brain sends hormones produced by…","o":[["the thyroid gland and the hypothalamus"],["the pancreas and the liver","Not in your notes."],["the ovaries and the testes","These make steroid hormones (Lecture 3), not the blood-pressure example."],["the kidneys and the bladder","These are the urinary-system example from levels of organization."]],"x":"In your notes, the brain sends hormones produced by the thyroid gland and the hypothalamus to regulate metabolism and the whole circulation."},{"id":"t3i","t":"t3","type":"list","q":"Give the two examples of homeostasis from your notes, and name the structure that controls or senses each.","p":[["Body temperature",["temperature","temp"]],["Controlled by the hypothalamus",["hypothalamus"]],["Blood pressure",["pressure","bp"]],["Sensed by baroreceptors",["baroreceptor"]]],"need":4,"x":"Body temperature is regulated by the hypothalamus (around 37 °C). Blood pressure is maintained via baroreceptors, which report to the brain."},{"id":"t3j","t":"t3","type":"tf","q":"In homeostasis, body systems adjust only to changes inside the body.","a":false,"fix":"They adjust to changes both outside and inside the body.","x":"Body systems constantly adjust in response to changes outside and inside the body."},{"id":"t4a","t":"t4","type":"list","q":"List the basic properties of cells from your notes (at least 6 of the 7).","p":[["Life: whole cells can be cultured and keep growing and reproducing",["life","alive","living","cultur"]],["They can die by their own internal program",["die","death","suicide","apoptosis","eliminat"]],["They have a genetic program (genes made of DNA) and the means to use it",["genetic","gene","dna"]],["They are highly complex and organized",["complex","organi"]],["They reproduce by division",["reproduc","divi"]],["They carry out chemical reactions (enzymes, metabolism)",["chemical","reaction","metabol","enzyme"]],["They respond to stimuli (receptors)",["respond","response","stimul","receptor"]]],"need":6,"x":"Mnemonic: Lazy Dogs Grab Cookies, Run, Chew, Repeat → Life, Die, Genetic program, Complex, Reproduce, Chemical reactions, Respond."},{"id":"t4b","t":"t4","type":"mcq","d":1,"q":"Why is “life” called the most basic property of cells?","o":[["Whole cells can be cultured in a lab and grow and reproduce, while isolated cell parts just deteriorate"],["Cells contain DNA, while their parts do not","Not the reason given. The point is that whole cells survive and reproduce in culture, while isolated parts deteriorate."],["Cells can never die","Wrong: cells can die by their own internal program."],["Cells are made of tissues","Backwards: tissues are made of cells."]],"x":"Isolated cell parts deteriorate, but whole cells removed from a plant or animal can be cultured in a lab and grow and reproduce for long periods."},{"id":"t4c","t":"t4","type":"mcq","q":"What error rate for DNA duplication is given in your notes?","o":[["Less than 1 mistake per 10 million nucleotides"],["About 1 mistake per 1000 nucleotides","Far too high. It is less than one in ten million."],["About 1 mistake per 100 nucleotides","Far too high. It is less than one in ten million."],["Zero: DNA copying never makes mistakes","Mistakes do happen, rarely, and most are quickly fixed by a repair mechanism."]],"x":"DNA duplication makes less than one mistake every ten million nucleotides, and most are quickly corrected by a repair mechanism."},{"id":"t4d","t":"t4","type":"type","d":1,"q":"The sum total of the chemical reactions in a cell is called the cell’s ___.","a":["metabolism","cell metabolism"],"x":"All chemical changes in cells need enzymes; the sum total of these reactions is metabolism."},{"id":"t4e","t":"t4","type":"type","q":"Molecules that greatly increase the rate of a chemical reaction are called ___.","a":["enzymes","enzyme"],"x":"Every chemical change in a cell requires enzymes, which greatly speed up reactions."},{"id":"t4f","t":"t4","type":"mcq","q":"Cells eliminate themselves through an internal program when they…","o":[["are no longer needed, or risk becoming cancerous"],["become too large","Not in your notes."],["are exposed to hormones","Responding to hormones is a normal property (receptors)."],["start to divide","Division is reproduction, not self-elimination."]],"x":"Cells may die “by their own hand” through an internal program that removes cells no longer needed or at risk of becoming cancerous."},{"id":"t4g","t":"t4","type":"mcq","q":"When a cell divides, the contents of the “mother” cell are distributed into…","o":[["two daughter cells"],["four daughter cells","Your notes describe division into two daughter cells."],["one larger cell","Division splits a cell; it doesn’t merge cells."],["the surrounding tissue","The contents go into two daughter cells."]],"x":"Cells reproduce by division: the contents of a mother cell are distributed into two daughter cells."},{"id":"t4h","t":"t4","type":"multi","q":"Cell receptors respond to which of these, according to your notes?","o":[["Hormones",1],["Neurotransmitters",1],["Extracellular materials",1],["Ribosomes",0,"Ribosomes are inside the cell and make proteins; they aren’t a stimulus."]],"x":"Most cells are covered with receptors for hormones, neurotransmitters and extracellular materials."},{"id":"t4i","t":"t4","type":"tf","q":"Genetic information is packaged into chromosomes that occupy the cell nucleus.","a":true,"x":"Genes are made of DNA; this information is packaged into chromosomes in the nucleus."},{"id":"t4j","t":"t4","type":"tf","q":"Only some of the chemical changes in cells need enzymes.","a":false,"fix":"All chemical changes that take place in cells require enzymes.","x":"Your notes say all chemical changes in cells require enzymes."},{"id":"t5a","t":"t5","type":"mcq","d":1,"q":"Prokaryotic and eukaryotic cells are distinguished by…","o":[["their size and the types of internal structures (organelles) they contain"],["whether or not they contain DNA","Both contain DNA. In bacteria it sits in a nucleoid."],["whether or not they have a plasma membrane","Both have a plasma membrane of similar construction."],["whether or not they use ATP","Both conserve chemical energy as ATP with similar apparatus."]],"x":"The two classes differ in size and in the types of internal structures (organelles) they contain."},{"id":"t5b","t":"t5","type":"multi","q":"Which of these are made of eukaryotic cells?","o":[["Fungi",1],["Plants",1],["Animals",1],["Bacteria",0,"Bacteria are prokaryotic, the structurally simpler class."]],"x":"Prokaryotes: bacteria. Eukaryotes: fungi, plants and animals."},{"id":"t5c","t":"t5","type":"multi","d":1,"q":"Which features are shared by BOTH prokaryotic and eukaryotic cells?","o":[["Plasma membrane of similar construction",1],["Similar transcription and translation of genetic information",1],["Shared metabolic pathways",1],["Similar apparatus for conserving chemical energy as ATP",1],["A microtubule-containing mitotic spindle",0,"Eukaryotes only."],["A Golgi complex",0,"Complex organelles like the Golgi are eukaryotes only."]],"x":"Four shared features: plasma membrane, transcription/translation, metabolic pathways, ATP apparatus (Membrane, Message, Metabolism, ATP)."},{"id":"t5d","t":"t5","type":"mcq","q":"Which of these is found in eukaryotic cells but NOT in prokaryotes?","o":[["Phagocytosis"],["Ribosomes","Bacteria have ribosomes too (see the bacterial cell diagram)."],["A plasma membrane","Both have a plasma membrane of similar construction."],["Conserving energy as ATP","Both share similar ATP apparatus."]],"x":"Phagocytosis, ingesting particles inside plasma-membrane vesicles, is a eukaryotic feature."},{"id":"t5e","t":"t5","type":"type","q":"In a bacterial cell, the DNA is located in a region called the ___.","a":["nucleoid","the nucleoid"],"x":"Bacteria have no nucleus. Their DNA lies in the nucleoid (see the bacterial cell diagram)."},{"id":"t5f","t":"t5","type":"tf","q":"Cell division using a microtubule-containing mitotic spindle occurs in both prokaryotes and eukaryotes.","a":false,"fix":"The mitotic spindle is a feature of eukaryotic cells only.","x":"It is listed among the features of eukaryotic cells not found in prokaryotes."},{"id":"t5g","t":"t5","type":"list","q":"List the features of eukaryotic cells that are NOT found in prokaryotes (at least 5 of the 6).","p":[["Complex chromosomes made of DNA and associated proteins",["chromosom"]],["Complex organelles (ER, Golgi, lysosomes, endosomes, peroxisomes)",["organelle","golgi","endoplasmic","lysosom","peroxisom","endosom"]],["Complex cytoskeleton and motor proteins",["cytoskelet","microfilament","intermediate","motor"]],["Phagocytosis",["phagocyt","ingest"]],["Cell division with a microtubule-containing mitotic spindle",["spindle","mitotic","mitosis"]],["Sexual reproduction requiring meiosis and fertilization",["sexual","meiosis","fertili"]]],"need":5,"x":"Cool Owls Can Perch Silently Sometimes → Chromosomes, Organelles, Cytoskeleton, Phagocytosis, Spindle, Sexual reproduction."},{"id":"t5h","t":"t5","type":"mcq","q":"Which structure appears in the bacterial cell diagram?","o":[["Pilus"],["Nucleus","Bacteria have no nucleus; their DNA is in a nucleoid."],["Golgi complex","Complex organelles are eukaryotic only."],["Mitochondrion","Mitochondria are eukaryotic organelles."]],"x":"The bacterial cell shows a capsule, cell wall, plasma membrane, cytoplasm, ribosomes, DNA of the nucleoid, pili and a flagellum."},{"id":"t5i","t":"t5","type":"multi","q":"Which structures does the plant cell diagram show that the animal cell diagram does not?","o":[["Chloroplast",1],["Cell wall",1],["Large vacuole",1],["Mitochondrion",0,"Both plant and animal cells have mitochondria."],["Golgi complex",0,"Both have a Golgi complex."]],"x":"The plant cell has a cell wall, chloroplasts, a large vacuole and plasmodesmata. Mitochondria, Golgi, ER and ribosomes are in both."},{"id":"t5j","t":"t5","type":"mcq","q":"Ingesting particles by enclosing them in plasma-membrane vesicles is called…","o":[["phagocytosis"],["autophagy","Autophagy is the destruction of the cell’s own organelles by lysosomes."],["meiosis","Meiosis is cell division for sexual reproduction."],["transcription","Transcription copies DNA into RNA."]],"x":"Phagocytosis is a eukaryotic feature; phagocytic cells like macrophages use it to ingest debris and microorganisms."},{"id":"t5k","t":"t5","type":"tf","q":"Prokaryotic cells are structurally more complex than eukaryotic cells.","a":false,"fix":"Prokaryotic cells (bacteria) are the structurally simpler class.","x":"Prokaryotes = simpler (bacteria). Eukaryotes = more complex (fungi, plants, animals)."},{"id":"t6a","t":"t6","type":"mcq","d":1,"q":"Chemically, carbohydrates are…","o":[["aldehyde or ketone derivatives of polyhydric alcohols"],["esters of fatty acids with glycerol","That defines simple lipids."],["polymers of amino acids","That defines proteins."],["polymers of nucleotides","That defines nucleic acids."]],"x":"Carbohydrates are aldehyde or ketone derivatives of polyhydric alcohols (alcohols with many –OH groups)."},{"id":"t6b","t":"t6","type":"mcq","d":1,"q":"Glucose is classified as an…","o":[["aldohexose"],["ketohexose","That is fructose (C=O on carbon 2)."],["aldopentose","That is ribose (5 carbons)."],["aldotriose","Glucose has 6 carbons, not 3."]],"x":"Glucose has 6 carbons (hexose) and an aldehyde group on carbon 1 (aldo-)."},{"id":"t6c","t":"t6","type":"mcq","q":"Fructose is classified as a…","o":[["ketohexose"],["aldohexose","That is glucose."],["aldopentose","That is ribose."],["ketopentose","Fructose has 6 carbons, so it is a hexose."]],"x":"Fructose has 6 carbons and a ketone group (C=O on carbon 2), so it is a ketohexose."},{"id":"t6d","t":"t6","type":"type","q":"Ribose is classified as an ___.","a":["aldopentose"],"x":"Ribose has 5 carbons (pentose) and an aldehyde group (aldo-): an aldopentose.","h":"Aldehyde group + 5 carbons."},{"id":"t6e","t":"t6","type":"type","q":"Monosaccharide units in carbohydrates are linked by ___ bonds.","a":["glycosidic","glycosidic bonds","glycoside"],"x":"Glycosidic bonds link sugar units. Don’t confuse them with peptide bonds (proteins)."},{"id":"t6f","t":"t6","type":"mcq","q":"A monosaccharide with 6 carbon atoms is a…","o":[["hexose"],["pentose","Pentose = 5 carbons."],["heptose","Heptose = 7 carbons."],["tetrose","Tetrose = 4 carbons."]],"x":"Trioses 3, tetroses 4, pentoses 5, hexoses 6, heptoses 7."},{"id":"t6g","t":"t6","type":"multi","q":"Which of these are polysaccharides?","o":[["Glycogen",1],["Starch",1],["Chitin",1],["Cellulose",1],["Sucrose",0,"Sucrose is a disaccharide."],["Maltose",0,"Maltose is a disaccharide."]],"x":"Polysaccharides: glycogen, starch, chitin, cellulose. Disaccharides: sucrose, maltose."},{"id":"t6h","t":"t6","type":"mcq","q":"Which carbohydrate gives rigidity to the plant cell wall?","o":[["Cellulose"],["Chitin","Chitin forms the insect exoskeleton."],["Glycogen","Glycogen stores energy in the body."],["Peptidoglycan","Peptidoglycan reinforces the bacterial cell wall."]],"x":"Cellulose → plant cell wall; chitin → insect exoskeleton; peptidoglycan → bacterial cell wall."},{"id":"t6i","t":"t6","type":"mcq","q":"Peptidoglycan reinforces the…","o":[["bacterial cell wall"],["insect exoskeleton","That is chitin."],["plant cell wall","That is cellulose."],["animal cell membrane","Animal cells have no cell wall; their membranes carry glycoproteins and glycolipids."]],"x":"Peptidoglycan reinforces the bacterial cell wall."},{"id":"t6j","t":"t6","type":"type","q":"What is the most common clinical disorder related to carbohydrates?","a":["diabetes mellitus","diabetes"],"x":"Diabetes mellitus is the most common clinical disorder related to carbohydrates."},{"id":"t6k","t":"t6","type":"mcq","q":"Which carbohydrate is the body’s storage form of energy?","o":[["Glycogen"],["Cellulose","Cellulose is structural (plant cell wall)."],["Chitin","Chitin is structural (insect exoskeleton)."],["Ribose","Ribose is part of RNA."]],"x":"Glucose oxidation provides much of our dietary calories, and glycogen stores energy in the body."},{"id":"t6l","t":"t6","type":"tf","q":"Glycoproteins and glycolipids in the cell membrane are involved in intercellular communication.","a":true,"x":"They are important cell-membrane components involved in communication between cells."},{"id":"t6m","t":"t6","type":"list","q":"List the functions of carbohydrates from your notes (at least 4).","p":[["Energy: glucose oxidation provides dietary calories",["energy","calor","oxidation","fuel"]],["Storage: glycogen stores energy",["glycogen","storage","store"]],["Ribose and deoxyribose are parts of nucleic acids",["ribose","nucleic","dna"]],["Glycoproteins and glycolipids in membranes for cell communication",["glycoprotein","glycolipid","communicat"]],["Structure: chitin, cellulose, peptidoglycan",["chitin","cellulose","peptidoglycan","exoskeleton","wall","struct"]]],"need":4,"x":"Energy, energy storage, nucleic-acid sugars, membrane communication, structural support."},{"id":"t6n","t":"t6","type":"mcq","q":"Which pair are both disaccharides?","o":[["Sucrose and maltose"],["Glucose and fructose","These are monosaccharides."],["Starch and glycogen","These are polysaccharides."],["Ribose and deoxyribose","These are pentose monosaccharides."]],"x":"Disaccharides in your notes: sucrose and maltose."},{"id":"t6o","t":"t6","type":"mcq","q":"The sucrose structure in your notes shows which two sugars joined together?","o":[["Glucose and fructose"],["Glucose and glucose","Chains of glucose units are shown for starch (amylose), not sucrose."],["Ribose and deoxyribose","These are nucleic-acid sugars."],["Fructose and ribose","Ribose is not part of sucrose."]],"x":"Sucrose = a glucose ring joined by a glycosidic bond to a fructose ring."},{"id":"t7a","t":"t7","type":"mcq","q":"What property do all lipids share?","o":[["Insoluble in water, soluble in organic solvents"],["Soluble in water, insoluble in organic solvents","Backwards."],["They are all polymers of amino acids","That is proteins."],["They all contain phosphate","Only phospholipids contain phosphoric acid."]],"x":"Fats, oils, waxes, steroids and related compounds share one property: insoluble in water, soluble in organic solvents."},{"id":"t7b","t":"t7","type":"mcq","q":"Simple lipids are…","o":[["esters of fatty acids with glycerol or higher molecular weight alcohols"],["fatty acids + alcohol + phosphoric acid","That is a phospholipid, a complex lipid."],["cholesterol and steroid hormones","Those are derived lipids."],["fatty acids + alcohol + protein","That is a lipoprotein, a complex lipid."]],"x":"Simple lipids = esters of fatty acids with glycerol or higher molecular weight alcohols (e.g. glycerol + 3 fatty acid tails)."},{"id":"t7c","t":"t7","type":"mcq","d":1,"q":"A lipid made of fatty acids, an alcohol and phosphoric acid is a…","o":[["phospholipid (a complex lipid)"],["glycolipid","Glycolipids contain a carbohydrate, not phosphoric acid."],["lipoprotein","Lipoproteins contain a protein."],["simple lipid","Simple lipids are only fatty acids + alcohol."]],"x":"Complex lipids add something to fatty acids + alcohol: phosphoric acid → phospholipids; carbohydrate → glycolipids; protein → lipoproteins."},{"id":"t7d","t":"t7","type":"multi","q":"Which of these are derived lipids?","o":[["Cholesterol",1],["Testosterone",1],["Vitamin D",1],["Eicosanoids",1],["Phospholipids",0,"Phospholipids are complex lipids."],["Lipoproteins",0,"Lipoproteins are complex lipids."]],"x":"Derived lipids: fatty acids, cholesterol, steroid hormones (testosterone, estrogens), fat-soluble vitamins (A, D, E, K) and eicosanoids."},{"id":"t7e","t":"t7","type":"multi","q":"Which vitamins are fat-soluble?","o":[["Vitamin A",1],["Vitamin B",0,"Not in the fat-soluble list (A, D, E, K)."],["Vitamin C",0,"Not in the fat-soluble list (A, D, E, K)."],["Vitamin D",1],["Vitamin E",1],["Vitamin K",1]],"x":"Fat-soluble vitamins: A, D, E and K (“ADEK”)."},{"id":"t7f","t":"t7","type":"mcq","d":1,"q":"How does the energy yield of fat compare with protein or carbohydrate?","o":[["Fat 9 kcal/g; protein or carbohydrate 4 kcal/g"],["Fat 4 kcal/g; protein or carbohydrate 9 kcal/g","Backwards. Fat gives more."],["All give 9 kcal/g","Only fat gives 9."],["Fat 7 kcal/g; protein or carbohydrate 4 kcal/g","The figure for fat is 9."]],"x":"Fatty-acid oxidation yields 9 kcal/g, compared with 4 kcal/g for protein or carbohydrate."},{"id":"t7g","t":"t7","type":"tf","q":"Fatty acids are long-chain hydrocarbons with an odd number of carbon atoms and a terminal carboxyl group.","a":false,"fix":"Fatty acids contain an EVEN number of carbon atoms.","x":"Fatty acids: long-chain hydrocarbon, even number of carbons, terminal carboxyl group."},{"id":"t7h","t":"t7","type":"mcq","q":"How do lipids allow rapid propagation of nerve impulses?","o":[["They act as electrical insulators in myelinated nerves"],["They store and release calcium ions","That is the smooth ER and mitochondria."],["They act as enzymes","Enzymes are proteins."],["They carry oxygen to nerves","Hemoglobin, a protein, carries oxygen."]],"x":"Lipids in myelin act as electrical insulators, so impulses travel quickly."},{"id":"t7i","t":"t7","type":"multi","q":"Cholesterol is essential for the synthesis of…","o":[["Steroid hormones",1],["Bile acids",1],["Vitamin D",1],["Glycogen",0,"Glycogen is a carbohydrate made from glucose."],["Hemoglobin",0,"Hemoglobin is a protein."]],"x":"Cholesterol is a membrane constituent and the starting material for steroid hormones, bile acids and vitamin D."},{"id":"t7j","t":"t7","type":"type","q":"LDL and HDL are ___ that transport lipids in the blood.","a":["lipoproteins","lipoprotein"],"x":"Lipoproteins (e.g. LDL and HDL) transport lipids in blood. They are complex lipids (lipid + protein)."},{"id":"t7k","t":"t7","type":"multi","q":"An imbalance in lipid metabolism can lead to which problems, according to your notes?","o":[["Obesity",1],["Atherosclerosis",1],["Diabetes mellitus",0,"Your notes list diabetes under carbohydrates."],["Pompe disease",0,"Pompe disease is a lysosomal glycogen-storage disorder."]],"x":"Lipid imbalance → obesity and atherosclerosis (plaque in an artery)."},{"id":"t7l","t":"t7","type":"mcq","q":"In a glycerophospholipid, the hydrophilic head is made of…","o":[["a polar group, phosphate and glycerol"],["two fatty acyl tails","The tails are the hydrophobic part."],["a cholesterol ring","Cholesterol is a separate lipid."],["amino acids","Amino acids build proteins."]],"x":"Head (water-loving): polar group + phosphate + glycerol. Tails (water-fearing): fatty acyl chains. They line up into a bilayer."},{"id":"t7m","t":"t7","type":"list","q":"List the functions of lipids from your notes (at least 5).","p":[["Major energy source (9 kcal/g)",["energy","kcal","fuel"]],["Adipose fat: thermal insulation and protection of organs",["thermal","heat","subcutaneous","adipose","protect","kidney"]],["Electrical insulators in myelinated nerves",["electric","myelin","nerve","impulse"]],["Phospholipids build the cell membrane",["phospholipid","bilayer","membrane"]],["Cholesterol: makes steroid hormones, bile acids, vitamin D",["cholesterol","bile"]],["Regulation: fat-soluble vitamins, steroid hormones, eicosanoids",["regulat","vitamin","eicosanoid","hormone"]],["Lipoproteins transport lipids in blood",["lipoprotein","transport","ldl","hdl"]]],"need":5,"x":"Energy, insulation (thermal and electrical), membranes, cholesterol as a precursor, regulation, transport."},{"id":"t7n","t":"t7","type":"mcq","q":"Fat stored in adipose tissue around organs such as the kidney serves to…","o":[["protect them"],["digest them","Lysosomes digest; fat does not."],["make hormones for them","Not in your notes."],["carry oxygen to them","Hemoglobin carries oxygen."]],"x":"Adipose fat is a thermal insulator under the skin and a protective layer around organs like the kidney."},{"id":"t8a","t":"t8","type":"mcq","q":"Proteins are polymers of…","o":[["amino acids"],["nucleotides","Nucleotides build nucleic acids."],["monosaccharides","Monosaccharides build polysaccharides."],["fatty acids","Fatty acids are part of lipids."]],"x":"Proteins are polymers of amino acids joined by peptide links."},{"id":"t8b","t":"t8","type":"type","q":"How many different amino acids are commonly found in proteins?","a":["20","twenty"],"x":"Twenty different amino acids are commonly found in proteins."},{"id":"t8c","t":"t8","type":"mcq","d":1,"q":"Amino acids differ from each other only in their…","o":[["side chain (R group)"],["carboxyl group","Every amino acid has the same carboxyl group."],["amino group","Every amino acid has the same amino
