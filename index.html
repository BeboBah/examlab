hese."},{"id":"t10q3","t":"t10","type":"tf","q":"Pyramidal cells make up only about 25% of the cellular component of the cortex.","a":false,"fix":"Pyramidal cells make up to 75% of the cellular component of the cortex.","x":"Pyramidal cells are the majority: up to \u003cb>75%\u003c/b> of the cortical cells."},{"id":"t10q4","t":"t10","type":"mcq","q":"Where does the long axon of a pyramidal cell arise, and where does it go?","o":[["From the middle of the base; it leaves the cortex and enters the subcortical white matter"],["From the apex; it runs up to the cortical surface","The axon arises from the base, not the apex."],["From the base; it ends locally within the same layer","The pyramidal axon is long and leaves the cortex."],["From a basal dendrite; it stays in the molecular layer","The axon arises from the middle of the base and leaves the cortex."]],"x":"One long axon arises from the \u003cb>middle of the base\u003c/b>, leaves the cortex and enters the \u003cb>subcortical white matter\u003c/b>."},{"id":"t10q5","t":"t10","type":"tf","q":"A pyramidal cell usually has several apical dendrites and a single basal dendrite.","a":false,"fix":"It usually has one thick apical dendrite and multiple basal dendrites.","x":"Pyramidal cells have \u003cb>one thick apical dendrite\u003c/b> running toward the cortical surface and \u003cb>multiple basal dendrites\u003c/b>."},{"id":"t10q6","t":"t10","type":"type","q":"Which cortical cells are small and densely packed, giving a granular appearance?","a":["stellate cells","stellate","granule cells","granular cells","granule","stellate granular cells"],"x":"\u003cb>Stellate cells\u003c/b> are also called granule cells because they are small and densely packed, which looks granular."},{"id":"t10q7","t":"t10","type":"tf","q":"Granule (stellate) cells are present in all cortical laminae.","a":true,"x":"Although only layers II and IV are named 'granular', stellate cells are found in \u003cb>every\u003c/b> cortical layer."},{"id":"t10q8","t":"t10","type":"mcq","q":"Where does the axon of a fusiform cell project?","o":[["To the thalamus"],["Toward the cortical surface","That is the direction of the fusiform cell's dendrite."],["Locally within the most superficial layer","That describes cells whose processes stay local, not fusiform cells."],["To the opposite hemisphere","Your notes say the fusiform axon goes to the thalamus."]],"x":"\u003cb>Fusiform cells\u003c/b>, usually in the deepest layer, send their dendrite toward the surface and their \u003cb>axon to the thalamus\u003c/b>."},{"id":"t10q9","t":"t10","type":"mcq","q":"Which cells are small and spindle-shaped, lie parallel to the surface, and are seen only in the most superficial part of the cortex?","o":[["Horizontal cells of Cajal"],["Cells of Martinotti","Martinotti cells are multipolar, not small spindle-shaped surface cells."],["Fusiform cells","Fusiform cells are usually in the deepest layer."],["Pyramidal cells","They have a pyramid shape with apical and basal dendrites, not a spindle shape."]],"x":"\u003cb>Horizontal cells of Cajal\u003c/b> lie flat, parallel to the surface, in the most superficial part. Their one axon and one dendrite synapse locally there."},{"id":"t10q10","t":"t10","type":"tf","q":"Cells of Martinotti are multipolar neurons that are most densely located in the most superficial layer of the cortex.","a":false,"fix":"Cells of Martinotti are most densely located in the deepest layer of the cortex.","x":"\u003cb>Martinotti cells\u003c/b> sit mainly in the \u003cb>deepest\u003c/b> layer, but their numerous axons and dendrites run up toward the surface."},{"id":"t10q11","t":"t10","type":"tf","q":"A stellate cell has numerous branching dendrites and a single short axon that may ascend to the surface or descend to deeper layers.","a":true,"x":"Stellate cells: many branching dendrites and \u003cb>one short axon\u003c/b>, which can go up or down within the cortex."},{"id":"t11q1","t":"t11","type":"order","q":"Put the six layers of the cerebral cortex in order, from the surface inwards.","o":["Molecular layer","External granular layer","External pyramidal layer","Internal granular layer","Internal pyramidal layer","Polymorphic layer"],"x":"Surface → deep: I molecular, II external granular, III external pyramidal, IV internal granular, V internal pyramidal, VI polymorphic. Granular and pyramidal layers alternate, external before internal."},{"id":"t11q2","t":"t11","type":"mcq","d":1,"q":"In which layer of the motor area are the giant pyramidal (Betz) cells found?","o":[["Layer V, the internal pyramidal layer"],["Layer III, the external pyramidal layer","Layer III has small and medium-sized pyramidal cells."],["Layer IV, the internal granular layer","Layer IV consists mostly of stellate cells."],["Layer VI, the polymorphic layer","Betz cells are in the layer just above it."]],"x":"\u003cb>Layer V\u003c/b> (internal pyramidal) holds medium and large pyramidal cells; in the motor area its key feature is the giant \u003cb>Betz cells\u003c/b>."},{"id":"t11q3","t":"t11","type":"tf","q":"The molecular layer (layer I) is rich in neuronal cell bodies.","a":false,"fix":"Layer I is very poor in cells (only a few horizontal cells of Cajal); it is mostly processes of deeper neurons and their synapses.","x":"Layer I lies directly under the pia mater. It has very few cells; most of it is made of the \u003cb>processes and synapses\u003c/b> of neurons in deeper layers."},{"id":"t11q4","t":"t11","type":"multi","q":"Which statements about Betz cells are correct? (select all)","o":[["They are the projection neurons of the motor cortex",1],["They are upper motor neurons",1],["Their axons form the pyramidal tracts descending in the brainstem and spinal cord",1],["Their axons project only to the thalamus",0,"Betz cell axons descend in the pyramidal tracts."],["They are small cells that synapse only within layer I",0,"Betz cells are giant pyramidal cells."]],"x":"\u003cb>Betz cells\u003c/b> are giant pyramidal cells and the projection neurons of the motor cortex. As \u003cb>upper motor neurons\u003c/b>, their axons form the \u003cb>pyramidal tracts\u003c/b> through the brainstem and spinal cord."},{"id":"t11q5","t":"t11","type":"tf","q":"In the external pyramidal layer (layer III), the pyramidal cells increase in size and decrease in number in the deeper parts of the layer.","a":true,"x":"Layer III has small and medium-sized pyramidal cells; going deeper within it, they get \u003cb>bigger but fewer\u003c/b>."},{"id":"t11q6","t":"t11","type":"type","q":"Which layer has cells of variable sizes and shapes, such as fusiform, triangular and ovoid cells?","a":["polymorphic layer","polymorphic","multiform layer","multiform","layer VI","layer 6"],"x":"\u003cb>Layer VI\u003c/b>, the polymorphic layer, is the deepest and broadest layer of the cortex. Its cells vary in size and shape: fusiform, triangular and ovoid."},{"id":"t11q7","t":"t11","type":"mcq","q":"Why is the motor area (precentral gyrus) described as the agranular type of cortex?","o":[["It has few granule cells, while its pyramidal cell layers are well developed"],["It has no pyramidal cells at all","The motor area has well-developed pyramidal layers."],["It lacks the molecular layer","Six layers can be identified in a typical section of the motor area."],["Its granule cells are replaced by fusiform cells","Your notes say only that granule cells are few."]],"x":"Motor area = \u003cb>agranular\u003c/b>: \u003cb>few granule cells\u003c/b> but \u003cb>well-developed pyramidal cell layers\u003c/b>."},{"id":"t11q8","t":"t11","type":"tf","q":"In the sensory area (postcentral gyrus), the pyramidal layers are well developed, with many large pyramidal cells.","a":false,"fix":"The sensory area has ill-defined pyramidal layers with few, small pyramidal cells; it is the granular type.","x":"Sensory area = \u003cb>granular\u003c/b> type: well-developed granular layers and \u003cb>ill-defined pyramidal layers\u003c/b> with few, small pyramidal cells."},{"id":"t11q9","t":"t11","type":"mcq","q":"Cortical neurons form layers parallel to the brain surface. How are these layers distinguished from each other?","o":[["By the size and shape of the neuronal cell bodies"],["By the colour of their nerve fibres","Your notes say layers differ by the size and shape of the neuronal bodies."],["By the number of blood capillaries in each","Your notes say layers differ by the size and shape of the neuronal bodies."],["By the amount of tissue fluid in each","Your notes say layers differ by the size and shape of the neuronal bodies."]],"x":"Cortical neurons have a \u003cb>laminar alignment\u003c/b>: they form layers parallel to the brain surface, and each layer is recognised by the \u003cb>size and shape\u003c/b> of its cell bodies."},{"id":"t11q10","t":"t11","type":"mcq","q":"Which other name do your notes give for the internal pyramidal layer (layer V)?","o":[["Ganglionic layer"],["Plexiform layer","This is another name for the molecular layer (I)."],["Multiform layer","This is another name for the polymorphic layer (VI)."],["External granular layer","This is layer II."]],"x":"Layer V, the internal pyramidal layer, is also called the \u003cb>ganglionic layer\u003c/b>."},{"id":"t12q1","t":"t12","type":"mcq","d":1,"q":"According to your notes, how are most \"voluntary\" movements initiated by the cerebral cortex achieved?","o":[["The cortex activates movement patterns stored in lower areas such as the cord, brain stem, basal ganglia and cerebellum"],["The cortex drives every muscle directly, with no help from lower centres","Your notes say the cortex mostly works through patterns stored in lower centres."],["The cerebellum starts each voluntary movement on its own, without the cortex","The movements are initiated by the cerebral cortex; the cerebellum is one of the lower centres it uses."],["The frontal eye field coordinates all limb movements","The frontal eye field controls voluntary scanning movements of the eyes."]],"x":"The cortex initiates most voluntary movements by switching on \u003cb>stored patterns\u003c/b> in lower centres (cord, brain stem, basal ganglia and cerebellum). Those lower centres then send the specific control signals to the muscles."},{"id":"t12q2","t":"t12","type":"tf","q":"For fine dexterous movements of the fingers and hands, the cortex has an almost direct pathway to the anterior motor neurons of the cord.","a":true,"x":"Most movements go through lower centres, but for a few, especially \u003cb>fine finger and hand movements\u003c/b>, the cortex bypasses some motor centres and reaches the \u003cb>anterior motor neurons\u003c/b> almost directly."},{"id":"t12q3","t":"t12","type":"list","q":"Name the three reciprocally interconnected regions that make up the motor cortex.","p":[["Primary motor cortex (MI)",["primary","mi","m1"]],["Premotor area (PM)",["premotor","pm","pre-motor"]],["Supplementary motor area (SMA)",["supplementary","sma"]]],"need":3,"x":"The motor cortex is \u003cb>MI\u003c/b> plus two secondary association areas: the \u003cb>premotor area\u003c/b> and the \u003cb>supplementary motor area\u003c/b> (also called medial premotor). All three are reciprocally interconnected."},{"id":"t12q4","t":"t12","type":"order","q":"Using the motor homunculus (figure 2), put these body parts in order from the most medial to the most lateral part of MI.","o":["Toes","Knee","Trunk","Hand","Face","Tongue"],"x":"Legs and feet are mapped \u003cb>medially\u003c/b> (figure 3B shows them on the medial surface), the trunk sits near the top, and the hand, face and tongue spread down the \u003cb>lateral\u003c/b> surface. Your notes say this layout is similar to the primary somatosensory cortex."},{"id":"t12q5","t":"t12","type":"mcq","q":"Why do the lips, tongue and hands have such large, distorted areas on the MI map?","o":[["Their movements are varied and complex, and more complex movement gets more motor cortex"],["They are the biggest parts of the body","Map size follows how complex the movements are, not the size of the body part."],["They are controlled by both hemispheres equally","MI controls the opposite side of the body."],["They are mapped on the medial surface, which has more space","Head, lips and hands are mapped laterally; legs and feet are medial."]],"x":"In MI, \u003cb>the more complex the movement\u003c/b> of a body part, the more cortex is devoted to it. We use the lips, tongue and hands to explore and communicate, so their areas are enlarged."},{"id":"t12q6","t":"t12","type":"tf","q":"MI is involved in the voluntary control of movement by carrying the motor command to the lower motor neurons (LMNs).","a":true,"x":"MI is the cortical output for voluntary movement: it carries the \u003cb>motor command to the LMNs\u003c/b>. The planning areas (PM, SMA) and association areas act through it."},{"id":"t13q1","t":"t13","type":"mcq","d":1,"q":"How does movement planning by the premotor area (PM) differ from planning by the supplementary motor area (SMA)?","o":[["PM plans movements that involve external sensory cues; SMA plans movements from internally generated cues"],["PM plans internally generated movements; SMA plans externally cued movements","This is reversed."],["PM carries the final command to the LMNs; SMA only controls eye movements","MI carries the command to the LMNs, and the frontal eye field controls scanning eye movements."],["Neither area plans movements; both only execute them","Your notes describe both PM and SMA as planning areas."]],"x":"Both are planning areas. \u003cb>PM\u003c/b> plans movements that involve \u003cb>external sensory cues\u003c/b>, while the \u003cb>SMA\u003c/b> is concerned with \u003cb>internally generated\u003c/b> commands or cues."},{"id":"t13q2","t":"t13","type":"tf","q":"Premotor (PM) cells are mainly active during the movement itself rather than when there is an intention to move.","a":false,"fix":"PM cells are active when there is an intention to make a movement, rather than during the movement.","x":"PM activity is \u003cb>temporally linked\u003c/b> to movement, but the cells fire at the stage of \u003cb>intention\u003c/b>, which fits PM's role in planning."},{"id":"t13q3","t":"t13","type":"mcq","q":"From which part of the brain does the premotor area receive rich tactile and visuospatial input?","o":[["The parietal lobe"],["The limbic system","Limbic input about the goal of a movement reaches the motor cortex through the prefrontal cortex."],["The occipital lobe","Your notes name the parietal lobe as the source of PM's sensory input."],["The temporal lobe","Your notes name the parietal lobe as the source of PM's sensory input."]],"x":"PM receives rich \u003cb>tactile and visuospatial\u003c/b> input from the \u003cb>parietal lobe\u003c/b>. This suits an area that plans movements guided by sensory cues. PM is also about six times larger than MI."},{"id":"t13q4","t":"t13","type":"tf","q":"The premotor area deals with learned motor activities of a complex and sequential nature by coordinating the contractions of specific groups of muscles.","a":true,"x":"That is why PM is active during \u003cb>writing\u003c/b>: a learned task in which groups of muscles must contract in the right sequence."},{"id":"t13q5","t":"t13","type":"mcq","q":"Which statement correctly compares MI and the premotor area (PM) in motor control?","o":[["MI mainly controls fine, precise distal movements; PM has a role in gross movements"],["MI mainly controls gross movements; PM controls fine, precise distal movements","This is reversed."],["Both mainly control voluntary scanning movements of the eyes","Scanning eye movements are the job of the frontal eye field."],["Both mainly stabilise posture through the trunk muscles","Postural maps and bilateral truncal efferents belong to the SMA."]],"x":"This is the ILO comparison. \u003cb>MI\u003c/b> has the main role in \u003cb>fine, precise\u003c/b> movements of \u003cb>distal\u003c/b> body parts. \u003cb>PM\u003c/b> has a role in \u003cb>gross\u003c/b> movements (figure 3A labels it \"gross movement\")."},{"id":"t13q6","t":"t13","type":"mcq","q":"Typing is a complicated task that uses both hands together. Which motor area is crucial for this kind of task?","o":[["Supplementary motor area (SMA)"],["Premotor area (PM)","PM's example in your notes is writing, a learned sequential task."],["Frontal eye field","It controls voluntary scanning eye movements."],["Primary somatosensory cortex","It is a sensory area (somatosensation), not a motor planning area."]],"x":"The \u003cb>SMA\u003c/b> is crucial for complicated tasks that involve \u003cb>both sides of the body\u003c/b>, such as two-handed typing."},{"id":"t13q7","t":"t13","type":"tf","q":"The SMA contains motor maps for postures, and its efferents supply the truncal muscles of the opposite side only.","a":false,"fix":"SMA efferents generally terminate bilaterally, supplying the truncal muscles for postural stabilization.","x":"The SMA holds \u003cb>motor maps for postures\u003c/b>. Its efferents end \u003cb>bilaterally\u003c/b> on the \u003cb>truncal\u003c/b> muscles, which is how it helps stabilise posture."},{"id":"t13q8","t":"t13","type":"type","q":"What is the loss of the ability to carry out familiar, learned, purposeful movements, in the absence of sensory or motor impairment, called?","a":["apraxia"],"x":"\u003cb>Apraxia\u003c/b>. Reflexes, tone and power are normal, yet the patient cannot do complex learned tasks such as brushing hair, cleaning teeth or dressing."},{"id":"t13q9","t":"t13","type":"mcq","q":"A patient has normal muscle tone, normal reflexes and no weakness, but cannot brush her hair or dress herself. Damage to which area is the most likely cause?","o":[["The premotor area or supplementary motor area"],["The frontal eye field","It controls eye movements, not learned limb tasks."],["Wernicke's area","Figure 3 labels it with language comprehension, not movement."],["The primary visual cortex","Figure 3 labels it with sight."]],"x":"This is \u003cb>apraxia\u003c/b>, which your notes link to damage of the \u003cb>PM or SMA\u003c/b>. Reflexes, tone and power are normal, yet complex learned tasks fail."},{"id":"t13q10","t":"t13","type":"type","q":"Which region of the motor cortex controls voluntary scanning movements of the eyes, such as during reading?","a":["frontal eye field","frontal eye fields","fef","frontal eye field region"],"x":"The \u003cb>frontal eye field\u003c/b> drives voluntary scanning eye movements, for example when you read. Figure 3A labels it \"conjugate eye movements\"."},{"id":"t13q11","t":"t13","type":"mcq","q":"The right frontal eye field is stimulated. What happens to the eyes?","o":[["Both eyes turn together to the left"],["Both eyes turn together to the right","Stimulation turns the eyes away from the stimulated side, not towards it."],["Only the right eye turns outwards","The deviation is conjugate: both eyes move together."],["The eyes stay still but scanning becomes faster","Your notes describe a conjugate deviation of the eyes."]],"x":"FEF stimulation causes \u003cb>conjugate deviation\u003c/b> of the eyes towards the \u003cb>opposite side\u003c/b>. So stimulating the right FEF turns both eyes to the left."},{"id":"t13q12","t":"t13","type":"tf","q":"Damage to the left frontal eye field causes a transient conjugate deviation of the eyes towards the left.","a":true,"x":"An FEF lesion causes a \u003cb>transient\u003c/b> conjugate deviation \u003cb>towards the side of the lesion\u003c/b>, so a left-sided lesion makes the eyes look left."},{"id":"t13q13","t":"t13","type":"multi","q":"Which structures does the frontal eye field connect with? (select all)","o":[["Superior colliculus",1],["Gaze centres in the paramedian pontine reticular formation",1],["Hippocampus",0,"Your notes name only the superior colliculus and the PPRF gaze centres as FEF connections."],["Primary auditory cortex",0,"Your notes name only the superior colliculus and the PPRF gaze centres as FEF connections."]],"x":"The FEF connects with the \u003cb>superior colliculus\u003c/b> and the \u003cb>gaze centres in the paramedian pontine reticular formation (PPRF)\u003c/b>."},{"id":"t14q1","t":"t14","type":"mcq","d":1,"q":"The prefrontal cortex relays input to the motor cortex about the desired goal of a movement. Where does this input come from?","o":[["The limbic system"],["The cerebellum","Your notes place the cerebellum in a motor loop, not as the source of goal information."],["The superior colliculus","It connects with the frontal eye field for eye movements."],["The basal ganglia","Your notes place the basal ganglia in a motor loop, not as the source of goal information."]],"x":"The prefrontal cortex passes \u003cb>limbic\u003c/b> input about the \u003cb>desired goal\u003c/b> of the movement on to the motor cortex."},{"id":"t14q2","t":"t14","type":"mcq","q":"Which signals does the prefrontal association area receive, analyse and integrate?","o":[["Signals from both motor and sensory cortex, as well as from subcortical structures"],["Signals from the sensory cortex only","It integrates motor as well as sensory signals."],["Signals from the motor cortex only","It integrates sensory as well as motor signals."],["Signals from the frontal eye field only","Your notes describe much wider input: motor cortex, sensory cortex and subcortical structures."]],"x":"The prefrontal association area is an integrator: it takes in signals from \u003cb>both motor and sensory cortex\u003c/b> and from \u003cb>subcortical structures\u003c/b>."},{"id":"t14q3","t":"t14","type":"tf","q":"The dorsolateral prefrontal cortex is concerned with controlling behaviour, while the ventromedial prefrontal cortex handles executive functions.","a":false,"fix":"The dorsolateral prefrontal cortex handles executive functions; the ventromedial (orbitofrontal) prefrontal cortex controls behaviour.","x":"Your notes divide the prefrontal association area into the \u003cb>dorsolateral\u003c/b> part (\u003cb>executive functions\u003c/b>) and the \u003cb>ventromedial\u003c/b> part (\u003cb>controlling behaviour\u003c/b>)."},{"id":"t14q4","t":"t14","type":"type","q":"What other name do your notes give the ventromedial prefrontal cortex?","a":["orbitofrontal cortex","orbitofrontal","orbito-frontal cortex","ofc"],"x":"The ventromedial prefrontal cortex = the \u003cb>orbitofrontal cortex\u003c/b>. Figure 3B labels the orbitofrontal cortex with olfaction and emotional behaviour."},{"id":"t14q5","t":"t14","type":"multi","q":"Which are functions of the dorsolateral prefrontal cortex? (select all)","o":[["Giving the ability to concentrate and promoting attention",1],["Controlling the ability to follow and obey rules",1],["Controlling creativity and learning",1],["Social decision-making",0,"This is a ventromedial prefrontal function."],["Regulating emotions and impulsive behaviour",0,"This is a ventromedial prefrontal function."]],"x":"The \u003cb>dorsolateral\u003c/b> prefrontal cortex is the \u003cb>executive\u003c/b> part: it gives the ability to concentrate and promotes attention, controls following and obeying rules, and controls creativity and learning. Emotions, impulses and social decisions belong to the \u003cb>ventromedial\u003c/b> part."},{"id":"t14q6","t":"t14","type":"tf","q":"The dorsolateral prefrontal cortex shares with the motor cortex in planning complex patterns of voluntary movement.","a":true,"x":"This is the first dorsolateral function in your notes and links the prefrontal cortex to motor control: it helps the motor cortex \u003cb>plan complex patterns\u003c/b> of voluntary movement."},{"id":"t14q7","t":"t14","type":"tf","q":"The ventromedial prefrontal cortex plays a role in motivation.","a":true,"x":"The ventromedial prefrontal cortex has three listed functions: \u003cb>motivation\u003c/b>, regulating emotions and impulsive behaviour, and social decision-making."},{"id":"t14q8","t":"t14","type":"tf","q":"Figure 3 labels the posterior parietal cortex with taste.","a":false,"fix":"Figure 3 labels the posterior parietal cortex with stereognosis and contralateral awareness of surroundings; taste is the primary gustatory cortex.","x":"The \u003cb>posterior parietal cortex\u003c/b> is labelled with \u003cb>stereognosis\u003c/b> and \u003cb>contralateral awareness of surroundings\u003c/b>."},{"id":"t14q9","t":"t14","type":"type","q":"Which structure does figure 3 label with fear and anxiety?","a":["amygdala","the amygdala"],"x":"Figure 3B (medial surface) labels the \u003cb>amygdala\u003c/b> with \u003cb>fear\u003c/b> and \u003cb>anxiety\u003c/b>, and the hippocampus with memory (short term)."},{"id":"t15q1","t":"t15","type":"mcq","d":1,"q":"Which pairing of cortical area and motor loop is correct?","o":[["MI loops with the cerebellum; SMA loops with the basal ganglia"],["MI loops with the basal ganglia; SMA loops with the cerebellum","This is reversed."],["MI loops with the limbic system; SMA loops with the thalamus","Your notes describe MI-cerebellum and SMA-basal ganglia loops."],["MI loops with the superior colliculus; SMA loops with the amygdala","Your notes describe MI-cerebellum and SMA-basal ganglia loops."]],"x":"Your notes describe two motor loops: \u003cb>MI with the cerebellum\u003c/b> and \u003cb>SMA with the basal ganglia\u003c/b>."},{"id":"t15q2","t":"t15","type":"tf","q":"The motor loops with the cerebellum and basal ganglia allow the cortex to recruit and coordinate specific motor programs.","a":true,"x":"The purpose of these loops is to let the cortex \u003cb>recruit and coordinate specific motor programs\u003c/b>."},{"id":"t15q3","t":"t15","type":"order","q":"Using figure 4, put these stages in order, from a sensory stimulus towards the primary motor cortex.","o":["Sensory input from peripheral receptors","Primary sensory area","Association cortex areas","Premotor cortex","Primary motor cortex"],"x":"Association areas feed the \u003cb>higher-order motor areas\u003c/b> (premotor cortex), which then project to \u003cb>MI\u003c/b>. MI ultimately controls the motor neurons that produce the movement."},{"id":"t15q4","t":"t15","type":"mcq","q":"The diencephalon is a deep midline structure. The walls of which cavity does it form?","o":[["The third ventricle"],["The fourth ventricle","Your notes say the diencephalon forms the walls of the third ventricle."],["The lateral ventricles","Your notes say the diencephalon forms the walls of the third ventricle."],["The subarachnoid space","The diencephalon is deep in the brain, around the third ventricle."]],"x":"The diencephalon forms the walls of the \u003cb>third ventricle\u003c/b>, one of the spaces through which CSF flows."},{"id":"t15q5","t":"t15","type":"type","q":"The diencephalon has two main parts. One is the thalamus. What is the other?","a":["hypothalamus","the hypothalamus"],"x":"The diencephalon = \u003cb>thalamus\u003c/b> + \u003cb>hypothalamus\u003c/b>."},{"id":"t15q6","t":"t15","type":"tf","q":"Only some sensory input synapses in the thalamus; the rest travels straight to the cortex.","a":false,"fix":"All sensory input synapses in the thalamus on its way to the cortex.","x":"Your notes stress that \u003cb>all\u003c/b> sensory input synapses in the thalamus, which acts as a relay station for preliminary processing."},{"id":"t15q7","t":"t15","type":"mcq","q":"What does the thalamus do with the sensory signals it receives?","o":[["It screens out insignificant signals and routes the important ones to the somatosensory cortex and other regions"],["It passes every signal on unchanged","It screens out insignificant signals."],["It stores them as long-term memories","Your notes describe the thalamus as a relay and screening station."],["It sends them straight to the lower motor neurones","It routes sensory impulses to the cortex and other brain regions."]],"x":"The thalamus is a filter as well as a relay: it \u003cb>screens out insignificant signals\u003c/b> and sends the \u003cb>important\u003c/b> sensory impulses to the right areas of the somatosensory cortex and to other brain regions."},{"id":"t15q8","t":"t15","type":"multi","q":"Apart from relaying sensory input, which roles does the thalamus have? (select all)","o":[["Arousal",1],["Regulating the level of cortical excitability",1],["Controlling behaviour",1],["Motor control: receiving input from motor regions and projecting to a specific cortical region",1],["Language comprehension",0,"Figure 3 gives this label to Wernicke's area."],["Taste",0,"Figure 3 gives this label to the primary gustatory cortex."]],"x":"The thalamus also plays an important role in \u003cb>motor control\u003c/b> (input from motor regions, projection to a specific cortical region) and is involved in \u003cb>arousal\u003c/b>, \u003cb>cortical excitability\u003c/b> and \u003cb>controlling behaviour\u003c/b>."},{"id":"t16q1","t":"t16","type":"tf","q":"A stroke can be a temporary or a permanent loss of function of brain tissue caused by interruption of its vascular supply.","a":true,"x":"Your notes define a stroke (cerebrovascular accident) as a \u003cb>temporary or permanent\u003c/b> loss of brain function caused by \u003cb>interruption of the vascular supply\u003c/b>."},{"id":"t16q2","t":"t16","type":"mcq","q":"Where does stroke rank among the causes of death in your notes?","o":[["Third, after heart disease and cancer"],["First, ahead of heart disease and cancer","Your notes rank stroke third."],["Second, after heart disease only","Cancer also ranks ahead of stroke."],["Fifth, after infections and accidents","Your notes rank stroke third, after heart disease and cancer."]],"x":"Stroke is the \u003cb>third\u003c/b> leading cause of death, after \u003cb>heart disease\u003c/b> and \u003cb>cancer\u003c/b>."},{"id":"t16q3","t":"t16","type":"multi","q":"Which of these are listed as risk factors for stroke? (select all)","o":[["Male gender",1],["Old age",1],["Previous transient ischaemic attacks",1],["Intake of oral contraceptive pills",1],["Female gender",0,"Your notes list male gender as the risk factor."],["Young age",0,"Your notes list old age as the risk factor."]],"x":"Main risk factors include \u003cb>male gender\u003c/b>, \u003cb>old age\u003c/b>, diabetes, hypertension, smoking, dyslipidaemia, family history, genetic predisposition and \u003cb>previous TIAs\u003c/b>. Other risk factors include \u003cb>oral contraceptive pills\u003c/b>, alcohol, vasculitis, haematological disorders and hyperuricaemia."},{"id":"t16q4","t":"t16","type":"tf","q":"Ischaemic stroke typically produces mass lesions.","a":false,"fix":"Ischaemic stroke produces non-mass lesions.","x":"Ischaemic stroke is due to loss of the bloodborne \u003cb>oxygen supply\u003c/b>, and it results in \u003cb>non-mass lesions\u003c/b>."},{"id":"t16q5","t":"t16","type":"mcq","q":"A patient in shock has a systolic blood pressure below 50 mmHg. Which type of ischaemia does this cause?","o":[["Global ischaemia"],["Focal ischaemia from thrombosis","Thrombosis causes focal ischaemia, usually on an atherosclerotic plaque."],["Focal ischaemia from embolism","Embolism causes focal ischaemia from a cardiac, arterial or venous source."],["Haemorrhagic stroke","Haemorrhagic stroke is rupture of a vessel, not low blood pressure."]],"x":"Severe \u003cb>systemic hypotension\u003c/b> (systolic below 50 mmHg in shock) starves the whole brain, giving \u003cb>global ischaemia\u003c/b>. Thrombosis and embolism cause \u003cb>focal\u003c/b> ischaemia."},{"id":"t16q6","t":"t16","type":"tf","q":"Embolism is a more common cause of focal cerebral ischaemia than thrombosis.","a":true,"x":"Focal ischaemia is due to \u003cb>thrombosis\u003c/b> (usually on atherosclerotic plaques) or \u003cb>embolism\u003c/b>, and your notes mark embolism as the \u003cb>more common\u003c/b> cause."},{"id":"t16q7","t":"t16","type":"mcq","q":"A patient with a deep vein thrombosis has an embolic stroke. Which heart defect let the embolus reach the brain instead of the lung?","o":[["Patent foramen ovale (atrial septal defect)"],["Atrial fibrillation","AF is itself a cardiac source of emboli, not a defect that lets venous clots cross over."],["Valvular disease","Valve disease is itself a cardiac source of emboli."],["Carotid atheromatous plaque","This is an arterial source of emboli, not a route for venous clots."]],"x":"Venous emboli from a \u003cb>DVT\u003c/b> normally lodge in the lung. In a patient with a \u003cb>patent foramen ovale\u003c/b> (atrial septal defect), they reach the brain instead."},{"id":"t16q8","t":"t16","type":"type","q":"Arterial emboli most often come from atheromatous plaques in the carotid arteries or in which other vessel?","a":["aortic arch","the aortic arch","arch of aorta","arch of the aorta","aorta"],"x":"The arterial source of emboli is most often \u003cb>atheromatous plaques\u003c/b> in the \u003cb>carotid arteries\u003c/b> or the \u003cb>aortic arch\u003c/b>."},{"id":"t16q9","t":"t16","type":"mcq","d":1,"q":"Which arterial territory is most frequently affected by embolic infarction?","o":[["Middle cerebral artery"],["Anterior cerebral artery","Your notes name the MCA, the direct extension of the internal carotid artery."],["Posterior cerebral artery","Your notes name the MCA, the direct extension of the internal carotid artery."],["Basilar artery","Your notes name the MCA, the direct extension of the internal carotid artery."]],"x":"The \u003cb>middle cerebral artery\u003c/b>, a \u003cb>direct extension of the internal carotid artery\u003c/b>, has the territory most frequently affected by embolic infarction."},{"id":"t16q10","t":"t16","type":"tf","q":"Emboli tend to lodge where vessels branch or in areas of stenosis.","a":true,"x":"Emboli tend to lodge at \u003cb>branch points\u003c/b> and in areas of \u003cb>stenosis\u003c/b>; the stenosis is usually caused by atherosclerosis."},{"id":"t17q1","t":"t17","type":"order","q":"Put the steps of this vicious cycle in ischaemic stroke in order.","o":["Hypoxia","ATP depletion","Cellular swelling (oedema)","Increased intracranial pressure","Compression of cerebral vessels","More ischaemia"],"x":"ATP depletion after hypoxia causes cell swelling, the \u003cb>earliest event\u003c/b> in stroke. Oedema then raises \u003cb>intracranial pressure\u003c/b>, which compresses cerebral vessels and causes \u003cb>more ischaemia\u003c/b>."},{"id":"t17q2","t":"t17","type":"type","q":"In ischaemic stroke, glutamate causes cell death by activating which channels?","a":["NMDA channels","nmda","nmda receptors","nmda channel"],"x":"Glutamate opens \u003cb>NMDA\u003c/b> channels. The resulting Ca\u003csup>2+\u003c/sup> influx causes cell death and adds to the swelling."},{"id":"t17q3","t":"t17","type":"tf","q":"When ischaemic brain cells finally burst because their membrane fails, this is apoptotic cell death.","a":false,"fix":"Cells that burst as the membrane fails die by necrotic cell death.","x":"Your notes call this \u003cb>necrotic\u003c/b> cell death: the swollen cells burst once the cell membrane fails."},{"id":"t17q4","t":"t17","type":"mcq","d":1,"q":"What is the zone around the infarct core, with residual blood flow and potentially reversible damage, called?","o":[["Ischaemic penumbra"],["Infarct core","In the core the damage is most severe and the tissue dies rapidly."],["Haematoma","A haematoma is a collection of blood from bleeding."],["Area of liquefactive necrosis","Liquefactive necrosis is dead tissue seen weeks later, which cannot recover."]],"x":"The \u003cb>penumbra\u003c/b> surrounds the dead core. It still has some blood flow, so its damage is \u003cb>potentially reversible\u003c/b>. Its size is variable."},{"id":"t17q5","t":"t17","type":"mcq","q":"A patient's neurological deficits keep getting worse over 24-48 hours after a stroke. What is this presentation called?","o":[["Stroke in evolution"],["Completed stroke","In a completed stroke the deficits do not increase further."],["Global ischaemia","Global ischaemia is caused by severe systemic hypotension."],["Transient ischaemic attack","Your notes list previous TIAs as a risk factor; deficits that keep worsening over 24-48 h are a stroke in evolution."]],"x":"Progression over \u003cb>24-48 h\u003c/b> suggests an \u003cb>ongoing infarct\u003c/b>: a \u003cb>stroke in evolution\u003c/b>."},{"id":"t17q6","t":"t17","type":"tf","q":"Stroke in evolution is the most common type of stroke presentation seen.","a":false,"fix":"Completed stroke is the most common type seen.","x":"In a \u003cb>completed stroke\u003c/b> the infarction is complete and the deficits stop increasing. This is the \u003cb>most common\u003c/b> type seen."},{"id":"t17q7","t":"t17","type":"multi","q":"Which of these are signs of stroke listed in your notes? (select all)","o":[["Contralateral hemisensory loss",1],["Global aphasia",1],["Homonymous hemianopsia",1],["Gait apraxia",1],["Ipsilateral hemiplegia",0,"Hemiplegia is contralateral to the lesion."],["Gradual loss of vision in both eyes over months",0,"Visual loss in stroke is sudden and especially in one eye."]],"x":"Signs: \u003cb>contralateral\u003c/b> hemisensory loss, \u003cb>contralateral\u003c/b> hemiplegia, \u003cb>global aphasia\u003c/b>, loss of vision especially in one eye with \u003cb>homonymous hemianopsia\u003c/b>, and \u003cb>gait apraxia\u003c/b>."},{"id":"t17q8","t":"t17","type":"type","q":"What term do your notes use for sudden slurred speech after a stroke?","a":["dysarthria"],"x":"Slurred speech = \u003cb>dysarthria\u003c/b>. Your notes link a dribbling mouth to \u003cb>dysphagia\u003c/b>. Both appear under contralateral hemiplegia."},{"id":"t17q9","t":"t17","type":"mcq","q":"Occlusion of the middle cerebral artery, with or without the anterior cerebral artery, produces which stroke syndrome?","o":[["Total anterior circulation stroke"],["Partial anterior circulation stroke","This comes from occlusion of MCA branches or an isolated ACA occlusion."],["Global ischaemia","Global ischaemia comes from severe systemic hypotension, not one artery."],["Haemorrhagic stroke","Occlusion causes ischaemia; haemorrhagic stroke is rupture of a vessel."]],"x":"Blocking the whole \u003cb>MCA\u003c/b> (with or without the ACA) knocks out the anterior circulation: a \u003cb>total anterior circulation stroke\u003c/b>. Blocking only MCA \u003cb>branches\u003c/b> or an isolated ACA gives a \u003cb>partial\u003c/b> anterior circulation stroke."},{"id":"t17q10","t":"t17","type":"type","q":"Lacunar stroke is produced by occlusion of which arteries?","a":["thalamostriate arteries","thalamostriate","deep brain arteries","deep thalamostriate arteries","deep arteries"],"x":"Lacunar strokes come from occlusion of the \u003cb>deep brain (thalamostriate) arteries\u003c/b>."},{"id":"t17q11","t":"t17","type":"tf","q":"A posterior circulation stroke affects the brainstem, cerebellum or occipital lobe.","a":true,"x":"The \u003cb>posterior circulation\u003c/b> syndrome is the one affecting the \u003cb>brainstem, cerebellum or occipital lobe\u003c/b>."},{"id":"t18q1","t":"t18","type":"mcq","d":1,"q":"In the cerebral hemispheres, which border zone is at greatest risk of a watershed infarct?","o":[["Between the anterior and middle cerebral artery territories"],["Between the middle and posterior cerebral artery territories","Your notes name the ACA-MCA border as the highest-risk zone."],["The centre of the MCA territory","Watershed infarcts occur at the most distal parts of arterial territories, not their centres."],["The brainstem","Your notes place the highest-risk border zone between the ACA and MCA."]],"x":"Border zone (watershed) infarcts hit the \u003cb>most distal\u003c/b> parts of arterial territories. In the hemispheres, the zone between the \u003cb>anterior and middle cerebral arteries\u003c/b> is at greatest risk."},{"id":"t18q2","t":"t18","type":"tf","q":"In global ischaemia the brain shows narrow gyri and widened sulci.","a":false,"fix":"In global ischaemia the brain is swollen, with wide gyri and narrowed sulci.","x":"The swollen brain has \u003cb>wide\u003c/b> gyri and \u003cb>narrowed\u003c/b> sulci. Grey-white demarcation is also poor."},{"id":"t18q3","t":"t18","type":"tf","q":"A border zone (watershed) infarct in the hemispheres appears as a wedge-shaped band of necrosis over the cerebral convexity.","a":true,"x":"The watershed infarct between the ACA and MCA territories shows a \u003cb>wedge-shaped band of necrosis\u003c/b> over the \u003cb>cerebral convexity\u003c/b>."},{"id":"t18q4","t":"t18","type":"order","q":"Put these changes in a focal brain infarct in the order in which they appear.","o":["No gross or microscopic changes","Red neurons","Neutrophilic infiltration","Histiocytic infiltration","Liquefactive necrosis","Lipid-laden macrophages","Gliosis around the cyst"],"x":"0-12 h nothing; 12-24 h \u003cb>red neurons\u003c/b>; 24-48 h \u003cb>neutrophils\u003c/b>; 2-10 days \u003cb>histiocytes\u003c/b>; 2-3 weeks \u003cb>liquefactive necrosis\u003c/b>; 3 weeks-months \u003cb>lipid-laden macrophages\u003c/b>; years \u003cb>gliosis\u003c/b> with a honeycomb look."},{"id":"t18q5","t":"t18","type":"mcq","q":"What do the \"red neurons\" seen 12-24 hours after a focal infarct look like?","o":[["Hypereosinophilic, with pyknotic nuclei"],["Pale, with large swollen nuclei","Your notes describe them as hypereosinophilic with pyknotic nuclei."],["Filled with lipid droplets","Lipid-laden cells are macrophages, seen from 3 weeks to months."],["Shrunken and stained blue","Your notes describe them as hypereosinophilic, which is why they are called red."]],"x":"Red neurons are \u003cb>hypereosinophilic\u003c/b> with \u003cb>pyknotic nuclei\u003c/b>, and oedema is present at the same stage (12-24 h)."},{"id":"t18q6","t":"t18","type":"tf","q":"At 2-10 days after an infarct, the boundary between normal and abnormal tissue becomes less distinct as oedema spreads into nearby tissue.","a":false,"fix":"At 2-10 days the boundary becomes more distinct as oedema resolves in the adjacent viable tissue.","x":"At 2-10 days the tissue is \u003cb>gelatinous and friable\u003c/b>, and the edge of the infarct gets \u003cb>clearer\u003c/b> as the oedema in the surrounding viable tissue \u003cb>resolves\u003c/b>."},{"id":"t18q7","t":"t18","type":"mcq","q":"How do haemorrhagic infarcts usually appear?","o":[["As multiple, sometimes confluent, petechial haemorrhages"],["As a pale infarct with no blood","Haemorrhagic infarcts contain blood, as petechial haemorrhages."],["As blood only in the subarachnoid space","That describes subarachnoid haemorrhage."],["As blood only inside the ventricles","That describes intraventricular haemorrhage."]],"x":"Haemorrhagic infarcts usually show \u003cb>multiple, sometimes confluent, petechial haemorrhages\u003c/b> within the infarcted tissue."},{"id":"t18q8","t":"t18","type":"tf","q":"The microscopic picture and evolution of haemorrhagic infarction parallel those of ischaemic infarction, with added blood extravasation and resorption.","a":true,"x":"A haemorrhagic infarct goes through the same timeline as an ischaemic one, with \u003cb>blood extravasation and resorption\u003c/b> added on top."},{"id":"t18q9","t":"t18","type":"type","q":"In people with which kind of disorder may haemorrhagic infarcts be associated with extensive intracerebral haematomas?","a":["coagulopathies","coagulopathy","bleeding disorder","clotting disorder","coagulation disorder"],"x":"In people with \u003cb>coagulopathies\u003c/b>, a haemorrhagic infarct may be associated with \u003cb>extensive intracerebral haematomas\u003c/b>."},{"id":"t19q1","t":"t19","type":"mcq","d":1,"q":"What is the most common cause of vessel rupture in haemorrhagic stroke?","o":[["Longstanding untreated hypertension"],["Berry aneurysm","It is a cause, but your notes name hypertension as the most common."],["Arteriovenous malformation","It is a cause, but less common than hypertension."],["Trauma","Trauma is a cause, but not the most common."]],"x":"Rupture can be due to hypertension, berry aneurysm, AVM or trauma, but \u003cb>longstanding untreated hypertension\u003c/b> is the \u003cb>most common\u003c/b> cause."},{"id":"t19q2","t":"t19","type":"multi","q":"Where do hypertensive intraparenchymal haemorrhages typically occur? (select all)","o":[["Basal ganglia",1],["Thalamus",1],["Pons",1],["Cerebellum",1],["Subarachnoid space",0,"Bleeding into the subarachnoid space is subarachnoid haemorrhage, not intraparenchymal."]],"x":"Hypertensive intraparenchymal bleeds are deep: \u003cb>basal ganglia\u003c/b> (the most common site), \u003cb>thalamus\u003c/b>, \u003cb>pons\u003c/b> and \u003cb>cerebellum\u003c/b>."},{"id":"t19q3","t":"t19","type":"mcq","q":"Where do haemorrhages associated with cerebral amyloid angiopathy often occur?","o":[["In the lobes of the cerebral cortex (lobar haemorrhages)"],["Mainly in the pons","Your notes place amyloid angiopathy bleeds in the cortical lobes."],["Mainly in the thalamus","Your notes place amyloid angiopathy bleeds in the cortical lobes."],["Only in the subarachnoid space","Your notes describe lobar bleeds and cortical microhaemorrhages."]],"x":"Amyloid deposition in the vessel wall (\u003cb>cerebral amyloid angiopathy\u003c/b>) gives \u003cb>lobar\u003c/b> haemorrhages, or tiny cortical \u003cb>microhaemorrhages\u003c/b> under 1 mm."},{"id":"t19q4","t":"t19","type":"tf","q":"Spontaneous (nontraumatic) intraparenchymal haemorrhage has a peak incidence at about 30 years of age.","a":false,"fix":"It is most common in mid to late adult life, with a peak incidence at about 60.","x":"Spontaneous intraparenchymal haemorrhage is a disease of \u003cb>mid to late adult life\u003c/b>, peaking at \u003cb>about 60\u003c/b>."},{"id":"t19q5","t":"t19","type":"mcq","q":"What is the most common neurological complication in premature babies weighing under 1.5 kg?","o":[["Intraventricular haemorrhage"],["Subarachnoid haemorrhage from a berry aneurysm","Berry aneurysms are not present at birth; they develop over time."],["Lobar haemorrhage from amyloid angiopathy","Your notes link amyloid angiopathy to lobar bleeds, not to premature babies."],["Watershed infarct","Watershed infarcts come from global ischaemia."]],"x":"\u003cb>Intraventricular haemorrhage\u003c/b> affects about \u003cb>40%\u003c/b> of premature babies under 1.5 kg. Pressure on the baby's head during delivery can cause the bleeding."},{"id":"t19q6","t":"t19","type":"mcq","q":"What is the most common cause of clinically significant subarachnoid haemorrhage?","o":[["Ruptured berry aneurysm"],["Arteriovenous malformation","AVMs can bleed into the subarachnoid space, but berry aneurysm is the most common cause."],["Tumours","Tumours are a listed but less common cause."],["Coagulopathies","Coagulopathies are a listed but less common cause."]],"x":"\u003cb>Berry aneurysm\u003c/b> is the most common cause of clinically significant SAH. It usually affects the anterior circulation near major branch points and may be multiple."},{"id":"t19q7","t":"t19","type":"mcq","q":"A berry aneurysm is a thin-walled outpouching of an artery. What causes it?","o":[["Defective media and intimal elastic lamina"],["Amyloid deposited in the vessel wall","This is cerebral amyloid angiopathy, a cause of intraparenchymal haemorrhage."],["An atherosclerotic plaque on the intima","Your notes link plaques to thrombosis and emboli."],["Longstanding hypertension alone","Your notes give defective media and intimal elastic lamina as the cause of the outpouching."]],"x":"The wall balloons out because the \u003cb>media\u003c/b> and the \u003cb>intimal elastic lamina\u003c/b> are defective. The aneurysm is not present at birth but develops over time."},{"id":"t19q8","t":"t19","type":"tf","q":"A berry aneurysm usually ruptures at the neck of the sac.","a":false,"fix":"Rupture usually occurs at the apex of the sac.","x":"Rupture usually happens at the \u003cb>apex\u003c/b> of the sac, releasing blood into the subarachnoid space, the brain tissue, or both."},{"id":"t19q9","t":"t19","type":"tf","q":"A berry aneurysm tends to rupture at a time of acute increase in intracranial pressure, such as straining at stool.","a":true,"x":"An \u003cb>acute rise in intracranial pressure\u003c/b>, such as straining at stool, is the typical trigger for rupture."},{"id":"t19q10","t":"t19","type":"type","q":"After a subarachnoid haemorrhage, meningeal fibrosis and scarring can block CSF flow or resorption. Which condition can this lead to?","a":["hydrocephalus"],"x":"Scarring of the meninges after the bleed can obstruct CSF flow or disrupt its resorption, causing \u003cb>hydrocephalus\u003c/b>."},{"id":"t19q11","t":"t19","type":"tf","q":"Arteriovenous malformations are not present at birth but develop over time.","a":false,"fix":"AVMs are congenital: defective communications between arteries and veins without intervening capillaries.","x":"An \u003cb>AVM\u003c/b> is \u003cb>congenital\u003c/b>: arteries connect straight to veins \u003cb>without capillaries\u003c/b> in between. It is the berry aneurysm that develops over time."},{"id":"t19q12","t":"t19","type":"mcq","q":"A man suddenly develops a severe headache with neck stiffness and vomiting, then loses consciousness. Which cause fits this presentation best?","o":[["Ruptured aneurysm"],["Hypertensive haemorrhage","Your notes describe it with headache, loss of consciousness and sensorimotor disturbances; neck stiffness and vomiting point to a ruptured aneurysm."],["Lacunar stroke","Lacunar stroke is ischaemic; a sudden severe headache with neck stiffness and vomiting points to a ruptured aneurysm."],["Global ischaemia","Global ischaemia comes from severe systemic hypotension, as in shock."]],"x":"A \u003cb>ruptured aneurysm\u003c/b> presents with a \u003cb>sudden, severe headache\u003c/b>, \u003cb>neck stiffness\u003c/b>, \u003cb>vomiting\u003c/b> and loss of consciousness, often with focal neurological signs."},{"id":"t19q13","t":"t19","type":"mcq","q":"According to your notes, what causes death in a fatal haemorrhagic stroke?","o":[["Brain herniation due to the mass effect of the oedema and haematoma"],["Global ischaemia from systemic hypotension","Your notes link the fatal outcome to herniation, not to hypotension."],["Seizures from shunting of blood","Seizures are linked to AVM shunting, not named as the cause of death."],["Blood in the CSF","Blood in the CSF happens when massive bleeds leak into the ventricles, but your notes link death to herniation."]],"x":"The \u003cb>oedema\u003c/b> plus the \u003cb>haematoma\u003c/b> act as a mass. When that mass effect causes \u003cb>brain herniation\u003c/b>, the outcome is fatal."},{"id":"t20q1","t":"t20","type":"mcq","q":"Which is the best definition of synaptic plasticity?","o":[["The ability of synapses to strengthen or weaken over time in response to changes in their activity"],["The fixed strength that a synapse keeps for life","Plasticity means synapses change; they are not fixed."],["The ability of neurons to divide and replace lost cells","Your notes define plasticity as a change in synaptic strength, not cell division."],["The speed at which an action potential travels along an axon","Your notes define plasticity in terms of synaptic strength, not conduction speed."]],"x":"\u003cb>Synaptic plasticity\u003c/b> is the ability of synapses to \u003cb>strengthen or weaken\u003c/b> over time as their activity rises or falls. It can show as synaptic \u003cb>depression\u003c/b> or \u003cb>facilitation\u003c/b>, and it plays important roles in learning and memory."},{"id":"t20q2","t":"t20","type":"tf","q":"Remodelling of synaptic structures continues throughout life, but it is maximal during development.","a":true,"x":"Synapses are remodelled \u003cb>throughout a lifetime\u003c/b>, with the \u003cb>most\u003c/b> remodelling during \u003cb>development\u003c/b>."},{"id":"t20q3","t":"t20","type":"type","q":"What is the neural change responsible for the retention or storage of knowledge called?","a":["memory trace","the memory trace","trace"],"x":"The \u003cb>memory trace\u003c/b> is the neural change that holds stored knowledge."},{"id":"t20q4","t":"t20","type":"tf","q":"In general, concepts rather than literal word-for-word information are stored in memory.","a":true,"x":"As you read a page you store the \u003cb>concept\u003c/b>, not the exact words, and later you put it back into your own words. Word-by-word memorizing is possible but is not the usual way."},{"id":"t20q5","t":"t20","type":"type","q":"What is the process of transferring and fixing short-term memory traces into long-term memory stores called?","a":["consolidation","memory consolidation"],"x":"\u003cb>Consolidation\u003c/b> moves memories from short-term into long-term storage. Table 1 adds that practice, or recycling the information through short-term mode, helps it."},{"id":"t20q6","t":"t20","type":"mcq","d":1,"q":"How long do short-term and long-term memory last?","o":[["Short-term: seconds to hours; long-term: days to years"],["Short-term: days to weeks; long-term: months to years","Short-term memory lasts only seconds to hours."],["Short-term: milliseconds; long-term: hours to days","Your notes give seconds to hours, and days to years."],["Short-term: seconds to hours; long-term: a few days at most","Long-term memory is retained for days to years."]],"x":"\u003cb>Short-term\u003c/b> memory lasts \u003cb>seconds to hours\u003c/b>; \u003cb>long-term\u003c/b> memory is retained for \u003cb>days to years\u003c/b>."},{"id":"t20q7","t":"t20","type":"tf","q":"According to Table 1, short-term memory has a very large storage capacity.","a":false,"fix":"Short-term memory has a limited capacity; it is long-term memory that has a very large capacity.","x":"Table 1: short-term capacity is \u003cb>limited\u003c/b>; long-term capacity is \u003cb>very large\u003c/b>."},{"id":"t20q8","t":"t20","type":"mcq","q":"According to Table 1, what usually happens when you cannot retrieve a long-term memory?","o":[["You are usually only transiently unable to access it, because the trace is relatively stable"],["It is permanently forgotten","Permanent forgetting describes short-term memory that was not consolidated."],["It must be relearned from scratch","Table 1 says the long-term trace stays relatively stable."],["It turns back into a short-term memory","Table 1 says the long-term trace stays relatively stable."]],"x":"A long-term memory you cannot find is usually only \u003cb>transiently\u003c/b> inaccessible; the trace is \u003cb>relatively stable\u003c/b>. Short-term memories, by contrast, are \u003cb>permanently forgotten\u003c/b> unless consolidated."},{"id":"t20q9","t":"t20","type":"mcq","q":"Declarative memory forms two types of memory. Which pairing is correct?","o":[["Episodic: events such as last year's holiday; semantic: facts such as Paris being the capital of France"],["Episodic: facts such as Paris being the capital of France; semantic: events such as last year's holiday","This is reversed."],["Episodic: short-term memory; semantic: long-term memory","These are stages of storage, not the two declarative types."],["Episodic: working memory; semantic: procedural memory","Neither is a type of declarative memory."]],"x":"Declarative memory = new facts about the world. \u003cb>Episodic\u003c/b> memory remembers \u003cb>events\u003c/b> (last year's holiday); \u003cb>semantic\u003c/b> memory remembers \u003cb>facts\u003c/b> (Paris is the capital of France)."},{"id":"t20q10","t":"t20","type":"mcq","q":"Riding a bicycle, driving a car and playing the piano are examples of which kind of memory?","o":[["Procedural memory"],["Declarative memory","Declarative memory is about acquiring new facts about the world."],["Working memory","Working memory briefly holds information for a current mental task."],["Short-term memory","This is a stage of storage, not a type based on what is stored."]],"x":"\u003cb>Procedural\u003c/b> (motor) memory covers \u003cb>skills and habits\u003c/b> such as riding a bicycle, driving a car, or playing tennis or the piano."},{"id":"t20q11","t":"t20","type":"multi","q":"Which statements describe procedural learning? (select all)","o":[["It is slow, and many skills need repeated practice",1],["Its recall is unconscious",1],["It is not easily lost",1],["Many memories need only a single exposure",0,"This describes declarative learning."],["It requires conscious recall",0,"This describes declarative learning."]],"x":"\u003cb>Procedural\u003c/b> learning: slow, needs \u003cb>repeated practice\u003c/b>, \u003cb>unconscious\u003c/b> recall, \u003cb>not easily lost\u003c/b>. \u003cb>Declarative\u003c/b> learning: easy (often one exposure), conscious recall, may be forgotten."},{"id":"t20q12","t":"t20","type":"tf","q":"Declarative memory is also called implicit memory.","a":false,"fix":"Declarative memory is explicit; procedural (non-declarative) memory is implicit.","x":"Your notes label \u003cb>declarative\u003c/b> memory \u003cb>explicit\u003c/b>, and \u003cb>procedural\u003c/b> (non-declarative) memory \u003cb>implicit\u003c/b>."},{"id":"t21q1","t":"t21","type":"mcq","d":1,"q":"Which brain region regulates working memory?","o":[["Prefrontal association cortex"],["Cerebellum","Your notes give working memory to the prefrontal cortex."],["Hippocampus","Your notes give working memory to the prefrontal cortex."],["Primary motor cortex","Your notes give working memory to the prefrontal cortex."]],"x":"Working memory is regulated by the \u003cb>prefrontal association cortex\u003c/b>, which acts as a \u003cb>temporary storage site\u003c/b> for relevant data and is largely responsible for executive functions."},{"id":"t21q2","t":"t21","type":"mcq","q":"Calculating a restaurant tip in your head relies mainly on which kind of memory?","o":[["Working memory"],["Procedural memory","This task needs data held and manipulated for immediate use, which is working memory."],["Semantic memory","Your notes use this as an example of working memory, not semantic memory."],["Long-term memory only","Your notes use this as an example of working memory."]],"x":"\u003cb>Working memory\u003c/b> briefly holds and processes data for \u003cb>immediate use\u003c/b>, combining new and stored knowledge. Your notes use the restaurant tip, following a conversation and finding your way home as examples."},{"id":"t21q3","t":"t21","type":"tf","q":"Long-term memory storage requires the activation of specific genes that control the synthesis of proteins.","a":true,"x":"Lasting structural or functional changes at synapses need \u003cb>new proteins\u003c/b>, so long-term storage needs \u003cb>gene activation\u003c/b>. Examples of such changes are new synaptic connections or permanent changes in pre- or postsynaptic membranes."},{"id":"t21q4","t":"t21","type":"multi","q":"Which changes underlie short-term memory? (select all)","o":[["A temporary change in the amount of neurotransmitter released",1],["Temporarily increased responsiveness of the postsynaptic cell to the neurotransmitter",1],["Formation of new synaptic connections",0,"This is a lasting change of long-term memory."],["Permanent changes in pre- or postsynaptic membranes",0,"Permanent changes belong to long-term memory."]],"x":"Short-term memory involves \u003cb>transient\u003c/b> modifications in the function of \u003cb>preexisting synapses\u003c/b>: either more or less transmitter released, or a more responsive postsynaptic cell."},{"id":"t21q5","t":"t21","type":"tf","q":"The hippocampus is the brain's single memory centre.","a":false,"fix":"There is no single memory centre; the neurons involved in memory traces are widely distributed throughout subcortical and cortical regions.","x":"Your notes stress that there is \u003cb>no single \"memory centre\"\u003c/b>. The hippocampus is one of several regions involved."},{"id":"t21q6","t":"t21","type":"list","q":"Name four of the brain regions most extensively implicated in memory.","p":[["Hippocampus and medial temporal lobe structures",["hippocamp","medial temporal"]],["Limbic system",["limbic"]],["Cerebellum",["cerebell"]],["Prefrontal cortex",["prefrontal","pfc"]],["Other areas of the cerebral cortex",["cerebral cortex","other cortical","other areas"]]],"need":4,"x":"Memory is spread out: the \u003cb>hippocampus\u003c/b> and medial temporal lobe structures, the \u003cb>limbic system\u003c/b>, the \u003cb>cerebellum\u003c/b>, the \u003cb>prefrontal cortex\u003c/b> and other areas of the cerebral cortex."},{"id":"t21q7","t":"t21","type":"mcq","q":"Which structure, together with relevant cortical regions, plays an essential role in \"how to\" procedural memories gained through repetitive training?","o":[["Cerebellum"],["Hippocampus","Your notes give the procedural memory role to the cerebellum."],["Prefrontal cortex","Your notes give the procedural memory role to the cerebellum."],["Amygdala","Your notes give the procedural memory role to the cerebellum."]],"x":"The \u003cb>cerebellum\u003c/b> and relevant cortical regions are essential for \u003cb>procedural memories\u003c/b>: motor skills learned by repetitive training, such as a skill routine."},{"id":"t21q8","t":"t21","type":"mcq","q":"Which cortical areas are important for a given procedural memory?","o":[["The specific motor or sensory systems engaged in performing the routine"],["Only the prefrontal cortex","Your notes say it depends on the motor or sensory systems used in the routine."],["Only the hippocampus","Your notes say it depends on the motor or sensory systems used in the routine."],["The same visual area for every skill","Your notes say it depends on the motor or sensory systems used in the routine."]],"x":"Besides the cerebellum, the cortical areas involved are the \u003cb>specific motor or sensory systems\u003c/b> that are used to perform that particular routine."},{"id":"t22q1","t":"t22","type":"mcq","d":1,"q":"Which statement correctly describes habituation and sensitization?","o":[["Habituation: less response to a repeated indifferent stimulus; sensitization: more response to mild stimuli after a strong one"],["Habituation: more response to a repeated indifferent stimulus; sensitization: less response after a strong one","This is reversed."],["Both mean a bigger response to every stimulus","Habituation decreases the response."],["Both mean a smaller response to every stimulus","Sensitization increases the response."]],"x":"\u003cb>Habituation\u003c/b> = decreased responsiveness to repeated presentations of an \u003cb>indifferent\u003c/b> stimulus (neither rewarding nor punishing). \u003cb>Sensitization\u003c/b> = increased responsiveness to \u003cb>mild\u003c/b> stimuli after a \u003cb>strong or noxious\u003c/b> one."},{"id":"t22q2","t":"t22","type":"mcq","q":"Where are the channel protein changes that cause habituation and sensitization?","o":[["In the presynaptic terminals of specific afferent neurons"],["In the postsynaptic membrane of the motor neuron","Your notes place the channel changes presynaptically."],["In the hippocampus only","Your notes place the changes in presynaptic terminals of the afferent neurons in the pathway."],["In the myelin sheath of the axon","Your notes place the changes in presynaptic terminals."]],"x":"Both are due to modified \u003cb>channel proteins\u003c/b> in the \u003cb>presynaptic terminals\u003c/b> of specific afferent neurons in the pathway, which changes \u003cb>transmitter release\u003c/b>."},{"id":"t22q3","t":"t22","type":"order","q":"Put the steps of habituation in order.","o":["Action potential arrives at the presynaptic terminal","Voltage-gated Ca2+ channels open less readily","Less Ca2+ enters the terminal","Less neurotransmitter is released","Smaller postsynaptic potential","Decreased or absent behavioural response"],"x":"In habituation the \u003cb>Ca\u003csup>2+\u003c/sup> channels\u003c/b> do not open as readily, so less Ca\u003csup>2+\u003c/sup> enters, less transmitter is released, and the postsynaptic potential (EPSP in figure 1) is \u003cb>diminished\u003c/b>."},{"id":"t22q4","t":"t22","type":"type","q":"Which neurotransmitter does the facilitating interneuron release during sensitization?","a":["serotonin","5-ht","5ht","5-hydroxytryptamine"],"x":"The facilitating interneuron releases \u003cb>serotonin\u003c/b> onto the presynaptic terminal, which increases transmitter release when an action potential arrives."},{"id":"t22q5","t":"t22","type":"mcq","q":"How does serotonin increase transmitter release during sensitization?","o":[["It blocks K+ channels, prolonging the presynaptic action potential so more Ca2+ enters"],["It blocks Na+ channels, shortening the action potential","Serotonin blocks K+ channels and prolongs the action potential."],["It speeds up removal of transmitter from the cleft","Your notes describe K+ channel block, not transmitter removal."],["It closes Ca2+ channels in the postsynaptic cell","Your notes describe a presynaptic effect that increases Ca2+ entry."]],"x":"Serotonin \u003cb>blocks K\u003csup>+\u003c/sup> channels\u003c/b>. This \u003cb>prolongs the presynaptic action potential\u003c/b>, which lets in \u003cb>more Ca\u003csup>2+\u003c/sup>\u003c/b> and so releases more transmitter."},{"id":"t22q6","t":"t22","type":"tf","q":"Habituation and sensitization are two forms of declarative memory.","a":false,"fix":"Habituation and sensitization are two forms of non-declarative memory.","x":"Your notes call habituation and sensitization the two forms of \u003cb>non-declarative\u003c/b> memory. They are simple learning, not consciously recalled facts or events."},{"id":"t22q7","t":"t22","type":"type","q":"Sensitization has no direct effect on presynaptic Ca2+ channels. Through which process does it indirectly enhance Ca2+ entry?","a":["presynaptic facilitation","facilitation","pre-synaptic facilitation"],"x":"Sensitization works through \u003cb>presynaptic facilitation\u003c/b>: an interneuron acts on the presynaptic terminal to boost its transmitter release."},{"id":"t22q8","t":"t22","type":"tf","q":"During simple learning, existing synaptic pathways may be functionally interrupted (habituated) or enhanced (sensitized).","a":true,"x":"In simple learning the \u003cb>existing\u003c/b> pathways are changed in function: \u003cb>interrupted\u003c/b> in habituation, \u003cb>enhanced\u003c/b> in sensitization."},{"id":"t23q1","t":"t23","type":"mcq","d":1,"q":"The hippocampus is central in consolidating which type of newly acquired memory in particular?","o":[["Declarative memory"],["Procedural memory","Your notes link the hippocampus particularly to declarative memory."],["Working memory","Your notes link the hippocampus particularly to declarative memory."],["Habituation","Habituation is a non-declarative change in presynaptic terminals."]],"x":"The hippocampus is central in \u003cb>consolidating\u003c/b> new memories, particularly \u003cb>declarative\u003c/b> (explicit) memories of facts and events."},{"id":"t23q2","t":"t23","type":"tf","q":"The hippocampus is the medial portion of the frontal lobe.","a":false,"fix":"The hippocampus is the medial portion of the temporal lobe and is part of the limbic system.","x":"The \u003cb>hippocampus\u003c/b> is the medial portion of the \u003cb>temporal\u003c/b> lobe and belongs to the \u003cb>limbic system\u003c/b>."},{"id":"t23q3","t":"t23","type":"type","q":"Name the synaptic mechanism that is especially prevalent in the hippocampus and is shown step by step in figure 3.","a":["long-term potentiation","ltp","long term potentiation"],"x":"\u003cb>Long-term potentiation (LTP)\u003c/b> is especially prevalent in the hippocampus and is \u003cb>critical for converting short-term into long-term memories\u003c/b>."},{"id":"t23q4","t":"t23","type":"mcq","q":"In LTP, glutamate binds the NMDA receptor and opens its gate, but no ion flows yet. What still blocks the channel?","o":[["Mg2+"],["Na+","Na+ enters through the AMPA channel and helps depolarize the cell."],["Ca2+","Ca2+ is the ion that flows through NMDA once the block is removed."],["Nitric oxide","Nitric oxide is the retrograde messenger released later."]],"x":"\u003cb>Mg\u003csup>2+\u003c/sup>\u003c/b> sits in the NMDA channel. Only when the cell is depolarized enough (the AMPA EPSP plus other EPSPs) is Mg\u003csup>2+\u003c/sup> driven out, so Ca\u003csup>2+\u003c/sup> can enter."},{"id":"t23q5","t":"t23","type":"tf","q":"In LTP, Ca2+ entering through the open NMDA channel activates a Ca2+ second-messenger pathway.","a":true,"x":"Once Mg\u003csup>2+\u003c/sup> is out, \u003cb>Ca\u003csup>2+\u003c/sup>\u003c/b> flows through the \u003cb>NMDA\u003c/b> channel and switches on the \u003cb>Ca\u003csup>2+\u003c/sup> second-messenger pathway\u003c/b> (step 6 in figure 3)."},{"id":"t23q6","t":"t23","type":"tf","q":"In LTP, the second-messenger pathway promotes insertion of additional AMPA receptors into the postsynaptic membrane.","a":true,"x":"Inserting extra \u003cb>AMPA receptors\u003c/b> increases the postsynaptic membrane's \u003cb>sensitivity to glutamate\u003c/b>."},{"id":"t23q7","t":"t23","type":"type","q":"In LTP, which retrograde paracrine messenger is likely released and stimulates a long-lasting increase in glutamate release by the presynaptic neuron?","a":["nitric oxide","nitric-oxide"],"x":"The second-messenger pathway also releases a \u003cb>retrograde\u003c/b> signal, likely \u003cb>nitric oxide\u003c/b>, which travels back to the presynaptic neuron and causes a \u003cb>long-lasting increase in glutamate release\u003c/b>."},{"id":"t23q8","t":"t23","type":"mcq","q":"According to the note under figure 3, what kind of activity makes LTP develop?","o":[["Repetitive, intense firing of an input, or linking one input with another that fires at the same time"],["A single weak stimulus","LTP develops in response to frequent activity across a synapse."],["Long periods with no synaptic activity","LTP develops in response to frequent activity across a synapse."],["Blocking glutamate release","Glutamate release is the first step of LTP."]],"x":"LTP needs \u003cb>frequent activity\u003c/b>: \u003cb>repetitive, intense firing\u003c/b> of one input (like going over a fact again and again when studying), or \u003cb>one input firing together with another\u003c/b>."},{"id":"t23q9","t":"t23","type":"mcq","q":"A patient can recall old memories but cannot form new ones. Which type of amnesia is this?","o":[["Anterograde amnesia"],["Retrograde amnesia","Retrograde amnesia is a failure to recall previously stored memories."],["Habituation","Habituation is a decreased response to a repeated indifferent stimulus."],["Procedural memory loss","The problem here is forming any new memories, which is anterograde amnesia."]],"x":"Inability to form new memories = \u003cb>anterograde amnesia\u003c/b>. It suggests a defect in the memory \u003cb>storage\u003c/b> process."},{"id":"t23q10","t":"t23","type":"tf","q":"In progressive retrograde amnesia, the oldest memories are usually lost first.","a":false,"fix":"In progressive retrograde amnesia, more recent memories are lost first.","x":"Retrograde amnesia is a failure of \u003cb>recall\u003c/b>. When it is progressive, the \u003cb>more recent\u003c/b> memories are lost first."},{"id":"t23q11","t":"t23","type":"mcq","q":"Alzheimer's disease is the most common form of dementia. About what share of dementia cases does it contribute to?","o":[["About 60-70%"],["About 10-20%","Your notes give 60-70%."],["About 30-40%","Your notes give 60-70%."],["Nearly all cases (over 95%)","Your notes give 60-70%."]],"x":"\u003cb>Alzheimer's disease\u003c/b> may contribute to \u003cb>60-70%\u003c/b> of dementia cases, which makes it the most common form."},{"id":"t23q12","t":"t23","type":"multi","q":"Which features of dementia are described in your notes? (select all)","o":[["Progressive",1],["Irreversible",1],["Loss of higher mental function, particularly memory",1],["Mood and behaviour changes that can lead to disintegration of the personality",1],["Memory is spared; only motor skills are lost",0,"Memory is the function particularly lost."],["Full recovery is expected",0,"Dementia is irreversible."]],"x":"\u003cb>Dementia\u003c/b> is a \u003cb>progressive and irreversible\u003c/b> loss of higher mental function, particularly \u003cb>memory\u003c/b>. The cognitive decline comes with changes in mood and behaviour that lead to complete \u003cb>disintegration of the personality\u003c/b>."},{"id":"t24q1","t":"t24","type":"mcq","q":"In about what percentage of right-handed people are the main language centres in the left hemisphere?","o":[["About 98%"],["About 70%","Too low: almost all right-handed people have left-sided language centres."],["About 50%","Too low: language is highly lateralized, not split evenly."],["About 30%","Far too low: nearly every right-hander is left-dominant for language."]],"x":"Language is highly lateralized. In almost all right-handed people (\u003cb>~98%\u003c/b>) the main language centres are in the \u003cb>left\u003c/b> hemisphere.","d":1},{"id":"t24q2","t":"t24","type":"tf","q":"In most left-handed people, the main language centres are in the right hemisphere.","a":false,"x":"Your notes give \u003cb>~70%\u003c/b> of left-handed people as left-dominant for language, so being left-handed does not mean language is on the right.","fix":"In most left-handed people (~70%), the main language centres are still in the left hemisphere."},{"id":"t24q3","t":"t24","type":"tf","q":"Handedness is what defines the dominant hemisphere.","a":false,"x":"The dominant hemisphere is simply the one that holds the \u003cb>language areas\u003c/b>. Handedness may or may not be correlated with it.","fix":"The location of the language areas defines the dominant hemisphere; handedness may or may not correlate with it."},{"id":"t24q4","t":"t24","type":"mcq","q":"What does the right (non-dominant) hemisphere contribute more to in language?","o":[["Melody (prosody), rhythm, emotional expression and accent"],["Grammatical structure of sentences","Grammar is processed by Broca's area in the categorical hemisphere."],["Word recognition","Word recognition is a function of Wernicke's area."],["Translating written words into sounds","That is a parietal (inferior parietal lobule) function in your notes."]],"x":"The non-dominant hemisphere adds the 'music' of speech: \u003cb>prosody\u003c/b> (melody), rhythm, emotional expression and accent."},{"id":"t24q5","t":"t24","type":"type","q":"Along and near which fissure of the categorical hemisphere do the primary language areas lie?","a":["Sylvian fissure","sylvian","lateral sulcus","lateral fissure","lateral cerebral sulcus"],"x":"The primary language areas lie along and near the \u003cb>Sylvian fissure\u003c/b>, also called the lateral cerebral sulcus, of the categorical hemisphere."},{"id":"t24q6","t":"t24","type":"tf","q":"Auditory areas are concerned with spoken speech, while visual areas are concerned with written speech.","a":true,"x":"Spoken words come in through the \u003cb>auditory\u003c/b> areas and written words through the \u003cb>visual\u003c/b> areas. That is why the written-speech circuit starts in the visual cortex."},{"id":"t24q7","t":"t24","type":"mcq","q":"Which Brodmann areas make up the auditory areas?","o":[["Primary 41, 42; association 22"],["Primary 22; association 41, 42","Backwards: 41, 42 is primary and 22 is association."],["Primary 17; association 22","Area 17 is not an auditory area."],["Primary 39, 40; association 22","39 and 40 are not auditory areas."]],"x":"Primary auditory area = \u003cb>41, 42\u003c/b>. Auditory association area = \u003cb>22\u003c/b>. Both are concerned with spoken speech."},{"id":"t24q8","t":"t24","type":"mcq","q":"Which Brodmann areas make up the visual areas?","o":[["Primary 17; association 18, 19"],["Primary 18; association 17, 19","Area 17 is the primary area, not an association area."],["Primary 19; association 17, 18","The primary visual area is 17, not 19."],["Primary 17; association 22","Area 22 is not a visual area."]],"x":"Primary visual area = \u003cb>17\u003c/b>. Visual association area = \u003cb>18, 19\u003c/b>. Together, areas 17-19 are the visual cortex of the occipital lobe."},{"id":"t24q9","t":"t24","type":"multi","q":"Which of these does your handout class as NON-language areas? (select all)","o":[["Primary auditory area",1],["Auditory association area",1],["Primary visual area",1],["Visual association area",1],["Wernicke's area",0,"Wernicke's area is the first of the language areas."],["Angular gyrus",0,"The angular gyrus belongs to the inferior parietal lobule, listed with the language areas."]],"x":"Your notes split the areas into I. \u003cb>Non-language areas\u003c/b> (auditory and visual areas) and II. \u003cb>Language areas\u003c/b> (Wernicke's area, Broca's area, inferior parietal lobule)."},{"id":"t25q1","t":"t25","type":"mcq","q":"Where is Wernicke's area?","o":[["Posterior part of the superior temporal gyrus"],["Anterior part of the superior temporal gyrus","Your notes place it in the posterior part."],["Left inferior frontal gyrus","That is where Broca's area lies."],["Occipital lobe","That holds the visual cortex, areas 17-19."]],"x":"Wernicke's area is a large area in the posterior part of the auditory association area (area 22, left hemisphere), in the \u003cb>posterior superior temporal gyrus\u003c/b>.","d":1},{"id":"t25q2","t":"t25","type":"mcq","q":"Which Brodmann areas form Broca's area, and how are they arranged in the left inferior frontal gyrus?","o":[["Area 44 posterior, area 45 anterior"],["Area 45 posterior, area 44 anterior","The numbers are right but the order is reversed."],["Area 41 posterior, area 42 anterior","41 and 42 are the primary auditory area."],["Area 39 posterior, area 40 anterior","39 and 40 are the inferior parietal lobule."]],"x":"Broca's area = \u003cb>areas 44 and 45\u003c/b>. Area 44 is the \u003cb>posterior\u003c/b> part and area 45 the \u003cb>anterior\u003c/b> part of the left inferior frontal gyrus."},{"id":"t25q3","t":"t25","type":"mcq","q":"Which area is part of a network used to combine sounds into words and words into sentences for language production?","o":[["Area 44"],["Area 22","Area 22 is the auditory association area."],["Area 41","Area 41 is part of the primary auditory area."],["Area 17","Area 17 is the primary visual area."]],"x":"Area 44 (the posterior part of Broca's area) belongs to a network that \u003cb>combines sounds into words and words into sentences\u003c/b> for language production."},{"id":"t25q4","t":"t25","type":"tf","q":"Information stored in area 45 is projected, when needed, to the visual cortex to start the needed muscle movements.","a":false,"x":"Area 45 (the anterior part of Broca's area) acts as a store. At the right time it sends the information to the \u003cb>motor cortex\u003c/b> so the needed muscles move.","fix":"Information stored in area 45 is projected, when needed, to the motor cortex to start the needed muscle movements."},{"id":"t25q5","t":"t25","type":"mcq","q":"Which statement about Broca's area matches your notes?","o":[["It processes grammatical structure and is not directly involved in meaning"],["It processes meaning but not grammar","Backwards: Broca's area handles grammar, not meaning."],["It acts as short-term auditory memory for how to sound words","That is a parietal-lobe function in your notes."],["It changes the visual impression of letters into speech sounds","That is a temporal-lobe (Wernicke's area) function in your notes."]],"x":"Broca's area processes the \u003cb>grammatical structure\u003c/b> of sentences and the proper use of grammatical vocabulary and verbs. It is \u003cb>not directly involved in meaning\u003c/b>."},{"id":"t25q6","t":"t25","type":"multi","q":"Which of these are functions of Wernicke's area in your notes? (select all)","o":[["Understanding spoken and written language",1],["Word recognition",1],["Understanding thoughts",1],["Arranging words into coherent sentences",1]
